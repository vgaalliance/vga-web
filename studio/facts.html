<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VGA — Facts Package</title>
<!-- ============================================================
     IN-MATCH FILLER. Sits bottom-left, above the fight clock, in the
     same lower-left stack the dossier / message flash / odds bar use
     (overlay.html's --ll-lift). It NEVER covers the game feed.

     It drives ITSELF. The deck has no facts button and this file does
     not ask for one: it listens for the bout the deck already pushes
     ({type:'bout'} in UBA/GFL mode, {type:'tape'} from the tale of the
     tape, {type:'pickbar'} in UBAe mode), looks both fighters up, and
     rotates whatever facts it can actually build about them.

     A fact whose inputs are missing is DROPPED, never rendered with a
     dash. Half the roster has no reach, no age and no country, and a
     card reading "REACH EDGE — vs " is worse than no card: one looks
     like the graphic is broken, the other looks like a quiet moment.
     ============================================================= -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Barlow+Condensed:wght@500;700;900&family=Barlow:wght@500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  /* Same palette as standby / the playoff screens — one system, not a
     second look that happens to be purple. */
  :root{ --pur:#9b30ff; --hi:#cc66ff; --pink:#ff33cc;
    --panel:rgba(14,0,30,.92); --line:rgba(155,48,255,.28); --dim:rgba(200,160,255,.6);
    --gold:#ffce00; --amber:#ffb020; --green:#5cf2a0;
    /* The one knob. The UBAe fight clock owns the bottom-left corner and
       the UBA one is centred, so this matches overlay.html's stack: base
       190px already clears the clock's 145px high point with 45px of air.
       Raise it only if a clock ever grows past ~180px tall. */
    --ll-lift:0px; }
  html,body{width:1920px;height:1080px;background:transparent;overflow:hidden;
    font-family:'Barlow',system-ui,Arial,sans-serif;color:#fff;}

  #fact{position:fixed;left:48px;bottom:calc(190px + var(--ll-lift));
    display:flex;min-width:560px;max-width:760px;
    transform:translateX(-135%);opacity:0;
    background:linear-gradient(135deg,rgba(20,4,38,.97),rgba(6,0,14,.98));
    border-radius:10px;overflow:hidden;
    box-shadow:0 22px 55px rgba(0,0,0,.6),0 0 0 1px rgba(155,48,255,.18);}
  /* Same slide the dossier uses, so the two read as one family when they
     trade the same corner during a match. */
  #fact.in{animation:fin .55s cubic-bezier(.16,1,.3,1) forwards;}
  #fact.out{animation:fout .5s cubic-bezier(.5,0,.75,.2) forwards;}
  @keyframes fin{to{transform:translateX(0);opacity:1;}}
  @keyframes fout{from{transform:translateX(0);opacity:1;}to{transform:translateX(-135%);opacity:0;}}

  .accent{width:12px;flex:0 0 12px;background:var(--pur);box-shadow:0 0 24px var(--pur);}
  /* The accent is the category colour: it is the only part of the card a
     director sees from across the room, so it carries the meaning the
     rest of the studio already assigns these colours. */
  #fact[data-tone="gold"]  .accent{background:var(--gold); box-shadow:0 0 24px var(--gold);}
  #fact[data-tone="amber"] .accent{background:var(--amber);box-shadow:0 0 24px var(--amber);}
  #fact[data-tone="green"] .accent{background:var(--green);box-shadow:0 0 24px var(--green);}
  #fact[data-tone="pink"]  .accent{background:var(--pink); box-shadow:0 0 24px var(--pink);}

  .body{padding:15px 30px 16px 24px;flex:1;min-width:0;}
  .eyebrow{font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:.22em;
    color:var(--hi);text-shadow:0 0 12px rgba(204,102,255,.55);margin-bottom:9px;}
  #fact[data-tone="gold"]  .eyebrow{color:var(--gold); text-shadow:0 0 12px rgba(255,206,0,.5);}
  #fact[data-tone="amber"] .eyebrow{color:var(--amber);text-shadow:0 0 12px rgba(255,176,32,.5);}
  #fact[data-tone="green"] .eyebrow{color:var(--green);text-shadow:0 0 12px rgba(92,242,160,.45);}
  #fact[data-tone="pink"]  .eyebrow{color:var(--pink); text-shadow:0 0 12px rgba(255,51,204,.5);}

  .head{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:50px;
    line-height:.94;text-transform:uppercase;letter-spacing:.005em;
    text-shadow:0 0 26px rgba(155,48,255,.5);}
  .head b{color:var(--gold);font-weight:900;}
  .sub{font:500 20px 'Barlow',sans-serif;color:var(--dim);margin-top:9px;line-height:1.25;}
  .sub em{font-style:normal;color:#fff;font-weight:600;}

  /* ── the compare bar ──────────────────────────────────────────────
     For the facts that are a difference between two fighters rather
     than a claim about one. Two names, two numbers, and a rule that
     leans to whoever is ahead. Drawn only when BOTH sides have the
     number — a one-sided reach comparison is not a comparison. */
  .cmp{display:grid;grid-template-columns:1fr 74px 1fr;align-items:center;
    gap:14px;margin-top:13px;}
  .cmp .side{min-width:0;}
  .cmp .side.r{text-align:right;}
  .cmp .nm{font:600 15px 'Barlow',sans-serif;letter-spacing:.06em;text-transform:uppercase;
    color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cmp .vl{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:32px;
    line-height:1;color:#fff;margin-top:2px;}
  .cmp .side.win .vl{color:var(--gold);text-shadow:0 0 16px rgba(255,206,0,.45);}
  .cmp .side.win .nm{color:#fff;}
  .cmp .mid{font-family:'Press Start 2P',monospace;font-size:10px;letter-spacing:.14em;
    color:var(--dim);text-align:center;}
</style>
</head>
<body>

<div id="fact">
  <div class="accent"></div>
  <div class="body">
    <div class="eyebrow" id="fEyebrow">FIGHT FACT</div>
    <div class="head" id="fHead">—</div>
    <div class="sub" id="fSub"></div>
    <div class="cmp" id="fCmp" style="display:none;">
      <div class="side" id="cmpL"><div class="nm"></div><div class="vl"></div></div>
      <div class="mid" id="cmpM">VS</div>
      <div class="side r" id="cmpR"><div class="nm"></div><div class="vl"></div></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
// ============================================================
// TIMING — edit to taste.
// A fact HOLDS long enough to read, then the corner goes quiet. It is
// filler, not a permanent bug: leaving one on screen for a whole round
// makes it furniture and nobody reads furniture.
// ============================================================
const ENTER = 550
const HOLD  = 8200     // fully visible
const EXIT  = 500
const GAP   = 22000    // dark corner between facts

const sb = supabase.createClient('https://emzlivoykbhhjcugupit.supabase.co',
  'sb_publishable_pqhH974E1q9YsFnrVH1UJQ_X3V-rRLF')
const $ = id => document.getElementById(id)
const Q = new URLSearchParams(location.search)

// ── helpers ─────────────────────────────────────────────────────────
const norm = s => String(s ?? '').trim().toLowerCase()
const has  = v => v !== null && v !== undefined && String(v).trim() !== '' && String(v).trim() !== '—'
const pct  = (n,d) => d > 0 ? Math.round(n * 100 / d) : null

// Reach and height are free text ("74\"", "6'1", "185cm"). Compared as
// numbers when BOTH parse to one and the unit agrees, dropped otherwise —
// a graphic that says 6 beats 185 is worse than no graphic.
function inches(v){
  const s = String(v ?? '').trim()
  if(!s) return null
  let m = s.match(/^(\d+)\s*['’]\s*(\d+(?:\.\d+)?)?/)          // 6'1
  if(m) return (+m[1]) * 12 + (m[2] ? +m[2] : 0)
  m = s.match(/^(\d+(?:\.\d+)?)\s*(?:cm)\b/i)                   // 185cm
  if(m) return +m[1] / 2.54
  m = s.match(/^(\d+(?:\.\d+)?)/)                               // 74 / 74"
  if(m){ const n = +m[1]; return n > 40 && n < 90 ? n : null }
  return null
}
const showIn = n => {
  const f = Math.floor(n / 12), i = Math.round(n - f * 12)
  return f >= 4 && f <= 7 ? `${f}'${i}"` : `${Math.round(n)}"`
}

const DIVISION_SHORT = { heavyweight:'HEAVYWEIGHT', light_heavyweight:'LIGHT HEAVY',
  middleweight:'MIDDLEWEIGHT', lightweight:'LIGHTWEIGHT', welterweight:'WELTERWEIGHT',
  featherweight:'FEATHERWEIGHT', bantamweight:'BANTAMWEIGHT', flyweight:'FLYWEIGHT',
  cruiserweight:'CRUISERWEIGHT' }
const division = v => DIVISION_SHORT[norm(v).replace(/\s+/g,'_')] || String(v ?? '').toUpperCase()

const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC']
// Eastern, like every other date in the studio — see standby.html. A bout
// date rendered in the browser's zone reads a day early west of ET.
function monthYear(d){
  if(!d) return null
  let x = new Date(String(d))
  if(isNaN(x)) x = new Date(String(d).replace(' ','T'))
  if(isNaN(x)) return null
  const p = {}
  new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',month:'short',year:'numeric'})
    .formatToParts(x).forEach(y => { p[y.type] = y.value })
  return p.month ? `${p.month.toUpperCase()} ${p.year}` : null
}
const dateOf = m => m.event_date || m.created_at || null
const sortDesc = list => list.slice().sort((a,b) =>
  new Date(String(dateOf(b) ?? 0)) - new Date(String(dateOf(a) ?? 0)))

// ────────────────────────────────────────────────────────────────────
// THE FACTS.
//
// Each builder gets both fighters (a, b), their completed bouts, and the
// night's extras, and returns a card or null. Returning null is the
// normal case, not an error: most fighters do not have a streak worth a
// card, and none of them have every field filled in.
//
// Order here is the order they are OFFERED, and the rotator walks it in
// order rather than shuffling — the strongest fact should land first,
// while people are still looking.
// ────────────────────────────────────────────────────────────────────
const CARD = (tone, eyebrow, head, sub, cmp) => ({ tone, eyebrow, head, sub: sub || '', cmp: cmp || null })

const BUILDERS = [

  // 1 · TITLE PICTURE — the biggest thing that can be true about a bout.
  function titlePicture(a, b, ctx){
    if(ctx.titleName)
      return CARD('gold','ON THE LINE', ctx.titleName,
        ctx.champName ? `<em>${ctx.champName}</em> defends` : '')
    const ch = a.is_champion ? a : (b.is_champion ? b : null)
    if(!ch) return null
    return CARD('gold','CHAMPION', ch.display_name,
      `${division(ch.weight_class)} titleholder`)
  },

  // 2 · KO RATE — the stat a fight crowd actually wants. Needs a real
  //     sample: 1-0 with a KO is not a 100% finish rate, it is one fight.
  function koRate(a, b){
    const pick = [a, b]
      .map(f => ({ f, w: +f.headline_wins || 0, ko: +f.headline_ko_wins || 0 }))
      .filter(x => x.w >= 3 && x.ko > 0)
      .sort((x, y) => (y.ko / y.w) - (x.ko / x.w))[0]
    if(!pick) return null
    const rate = pct(pick.ko, pick.w)
    if(rate === null || rate < 40) return null
    return CARD('amber','FINISHING RATE', `${rate}% BY KO`,
      `<em>${pick.f.display_name}</em> — ${pick.ko} of ${pick.w} wins inside the distance`)
  },

  // 3 · STREAK — current run, and when it started. A streak of 1 is not a
  //     streak; 2 is barely one. Three or more earns the card.
  function streak(a, b, ctx){
    const best = [a, b].map(f => {
      const bouts = sortDesc((ctx.bouts[f.id] || []).filter(m => m.won !== null))
      if(!bouts.length) return null
      const won = bouts[0].won
      let n = 0
      for(const m of bouts){ if(m.won !== won) break; n++ }
      return { f, won, n, since: monthYear(dateOf(bouts[n - 1])), broke: bouts[n] }
    }).filter(x => x && x.n >= 3).sort((x, y) => y.n - x.n)[0]
    if(!best) return null
    const word = best.won ? 'STRAIGHT WINS' : 'STRAIGHT LOSSES'
    const tail = best.broke
      ? `last ${best.won ? 'loss' : 'win'} ${monthYear(dateOf(best.broke)) || 'earlier'}`
      : 'unbeaten in the record'
    return CARD(best.won ? 'green' : 'amber','ON A RUN', `${best.n} ${word}`,
      `<em>${best.f.display_name}</em> — ${tail}`)
  },

  // 4 · HEAD TO HEAD — they have met before. Rare, and the single most
  //     interesting thing on the list when it is true.
  function headToHead(a, b, ctx){
    const prev = (ctx.bouts[a.id] || []).filter(m =>
      norm(m.opponent_slug) === norm(b.slug) ||
      norm(m.opponent_name) === norm(b.display_name))
    if(!prev.length) return null
    const aw = prev.filter(m => m.won === true).length
    const bw = prev.filter(m => m.won === false).length
    const when = monthYear(dateOf(sortDesc(prev)[0]))
    const head = prev.length === 1
      ? (aw ? `${a.display_name} WON IT` : bw ? `${b.display_name} WON IT` : 'IT WAS A DRAW')
      : `${aw}—${bw} ${a.display_name}`
    return CARD('pink','THEY HAVE MET', head,
      prev.length === 1
        ? `their only previous meeting${when ? ` — <em>${when}</em>` : ''}`
        : `${prev.length} previous bouts${when ? `, latest <em>${when}</em>` : ''}`)
  },

  // 5 · COMMON OPPONENT — the next best thing to a head-to-head, and the
  //     line every commentator reaches for.
  function commonOpponent(a, b, ctx){
    const key = m => norm(m.opponent_slug) || norm(m.opponent_name)
    const bm = new Map()
    for(const m of (ctx.bouts[b.id] || [])) if(key(m) && m.won !== null) bm.set(key(m), m)
    for(const m of sortDesc(ctx.bouts[a.id] || [])){
      const k = key(m)
      if(!k || m.won === null || k === norm(b.slug)) continue
      const other = bm.get(k)
      if(!other || other.won === m.won) continue     // only interesting when they DIFFER
      const winner = m.won ? a : b
      const loser  = m.won ? b : a
      return CARD('pink','COMMON OPPONENT', m.opponent_name || 'SHARED FOE',
        `<em>${winner.display_name}</em> beat them · <em>${loser.display_name}</em> did not`)
    }
    return null
  },

  // 6 · RANKING — where they sit, when both are ranked. One ranked fighter
  //     against an unranked one is a fact about only one of them, so it
  //     falls through to the single-rank card below it.
  function ranking(a, b){
    const ra = +a.rank, rb = +b.rank
    if(!(ra > 0) || !(rb > 0)) return null
    return CARD('pur','THE LADDER', `#${ra} MEETS #${rb}`,
      `${division(a.weight_class)} rankings`,
      { l: { nm: a.display_name, vl: `#${ra}`, win: ra < rb },
        m: 'RANK',
        r: { nm: b.display_name, vl: `#${rb}`, win: rb < ra } })
  },
  function rankedOne(a, b){
    const r = (+a.rank > 0) ? a : ((+b.rank > 0) ? b : null)
    if(!r) return null
    return CARD('pur','THE LADDER', `RANKED #${+r.rank}`,
      `<em>${r.display_name}</em> — ${division(r.weight_class)}`)
  },

  // 7 · REACH / HEIGHT EDGE — only when both sides parse to a number in
  //     the same unit, and only when the gap is worth a graphic. A 1"
  //     reach edge is noise.
  function reachEdge(a, b){
    for(const [field, label, floor] of [['reach','REACH',2],['height','HEIGHT',2]]){
      const x = inches(a[field]), y = inches(b[field])
      if(x === null || y === null || Math.abs(x - y) < floor) continue
      const gap = Math.abs(x - y)
      const ahead = x > y ? a : b
      return CARD('pur', `${label} ADVANTAGE`,
        `${gap >= 12 ? showIn(gap) : Math.round(gap) + '"'} LONGER`,
        `<em>${ahead.display_name}</em> owns the ${label.toLowerCase()}`,
        { l: { nm: a.display_name, vl: showIn(x), win: x > y },
          m: label,
          r: { nm: b.display_name, vl: showIn(y), win: y > x } })
    }
    return null
  },

  // 8 · AGE GAP — same rule: a card only when the gap is real.
  function ageGap(a, b){
    const x = +a.age, y = +b.age
    if(!(x > 0) || !(y > 0) || Math.abs(x - y) < 5) return null
    const younger = x < y ? a : b
    return CARD('pur','AGE GAP', `${Math.abs(x - y)} YEARS`,
      `<em>${younger.display_name}</em> is the younger fighter`,
      { l: { nm: a.display_name, vl: String(x), win: x < y },
        m: 'AGE',
        r: { nm: b.display_name, vl: String(y), win: y < x } })
  },

  // 9 · BETTING — pari-mutuel, so the split IS the price. Needs a pool
  //     with something in it; an empty market says nothing.
  function betting(a, b, ctx){
    const p = ctx.pool
    if(!p || !(+p.pool > 0) || +p.bets < 3) return null
    const ta = +p.total_a || 0, tb = +p.total_b || 0
    if(ta + tb <= 0) return null
    const share = Math.round(ta * 100 / (ta + tb))
    const lean  = share >= 50 ? share : 100 - share
    if(lean < 58) return CARD('amber','THE MONEY', 'A SPLIT ROOM',
      `<em>${(+p.pool).toLocaleString()} VC</em> across ${p.bets} bets — ${share}/${100 - share}`)
    const side = share >= 50 ? (p.side_a || a.display_name) : (p.side_b || b.display_name)
    return CARD('amber','THE MONEY', `${lean}% ON ${side}`,
      `<em>${(+p.pool).toLocaleString()} VC</em> in the pool across ${p.bets} bets`)
  },

  // 10 · TEAM FORM — UBAe only, and only when the fighter is actually on a
  //      team with a record to quote.
  function teamForm(a, b, ctx){
    if(!ctx.standings.length) return null
    const byName = new Map(ctx.standings.map(t => [norm(t.name || t.team_name), t]))
    for(const f of [a, b]){
      const t = byName.get(norm(f.team))
      if(!t) continue
      const w = +t.wins, l = +t.losses
      if(!(w >= 0) || !(l >= 0) || (w + l) < 2) continue
      return CARD('green','HIS TEAM', `${t.name || t.team_name} ${w}—${l}`,
        `<em>${f.display_name}</em> fights out of them this season`)
    }
    return null
  },

  // 11 · THE RECORD — the floor. Always available, so it is LAST: it is
  //      what the corner shows when nothing sharper is true, and on a
  //      thin card that is most of the night.
  function records(a, b){
    const R = f => `${+f.headline_wins || 0}—${+f.headline_losses || 0}` +
      ((+f.headline_draws || 0) ? `—${+f.headline_draws}` : '')
    return CARD('pur','THE RECORDS', division(a.weight_class || b.weight_class),
      '', { l: { nm: a.display_name, vl: R(a), win: false },
            m: 'RECORD',
            r: { nm: b.display_name, vl: R(b), win: false } })
  },
]

// ── data ────────────────────────────────────────────────────────────
// One pass per bout. Names arrive from the deck, so the lookup is by
// name — the deck sends what it printed on the clock, which is
// display_name. Matched case-insensitively because a hand-typed bout on
// the deck is not guaranteed to match the casing in the database.
let FACTS = [], idx = 0, loop = null, gen = 0, current = ''

async function lookup(nameA, nameB){
  const key = norm(nameA) + '|' + norm(nameB)
  if(key === current) return                 // the deck re-pushes the same bout constantly
  current = key
  const mine = ++gen

  // queryRows-style guard, by hand: supabase-js does NOT throw on a failed
  // query, it resolves {data:null, error}. Treating null as "no fighters"
  // would leave the corner silently dark for the rest of the match with
  // nothing in the log — the exact failure that emptied every autocomplete
  // picker in the bot on 2026-08-25.
  const { data: cards, error } = await sb.from('fighter_cards')
    .select('id,slug,display_name,weight_class,rank,height,reach,age,country,team,'+
            'is_champion,nickname,headline_wins,headline_losses,headline_draws,headline_ko_wins')
  if(error || !cards){ console.warn('[facts] fighter lookup failed —', error); current = ''; return }

  const find = n => cards.find(c => norm(c.display_name) === norm(n)) ||
                    cards.find(c => norm(c.slug) === norm(n))
  const a = find(nameA), b = find(nameB)
  if(!a || !b){ console.warn('[facts] no match for', nameA, '/', nameB); current = ''; return }

  const [{ data: ma }, { data: mb }, { data: pools }, { data: st }] = await Promise.all([
    sb.from('fighter_matches').select('*').eq('fighter_id', a.id).eq('status','completed'),
    sb.from('fighter_matches').select('*').eq('fighter_id', b.id).eq('status','completed'),
    sb.from('bet_pools_public').select('*'),
    sb.from('team_standings').select('*'),
  ])
  if(mine !== gen) return                    // a newer bout landed while this was in flight

  const ctx = {
    bouts: { [a.id]: ma || [], [b.id]: mb || [] },
    pool: (pools || []).find(p =>
      (norm(p.side_a) === norm(a.display_name) && norm(p.side_b) === norm(b.display_name)) ||
      (norm(p.side_a) === norm(b.display_name) && norm(p.side_b) === norm(a.display_name))) || null,
    standings: st || [],
    titleName: TITLE.name, champName: TITLE.champ,
  }

  const built = []
  for(const fn of BUILDERS){
    let c = null
    // One bad builder must not take the package down mid-match. The corner
    // going quiet for a round is a missing graphic; a throw here is every
    // graphic after it missing too.
    try { c = fn(a, b, ctx) } catch(e){ console.warn('[facts] builder threw —', fn.name, e) }
    if(c && has(c.head)) built.push(c)
  }
  FACTS = built; idx = 0
  console.log(`[facts] ${built.length} facts for ${a.display_name} vs ${b.display_name}:`,
    built.map(c => c.eyebrow).join(' · '))
  if(AUTO) start()
}

// The deck stamps the title on the tale of the tape, not on the clock, so
// it is remembered separately and survives a later plain {type:'bout'}.
let TITLE = { name: null, champ: null }

// ── the rotator ─────────────────────────────────────────────────────
const el = $('fact')
function paint(c){
  el.dataset.tone = c.tone
  $('fEyebrow').textContent = c.eyebrow
  $('fHead').innerHTML = c.head
  $('fSub').innerHTML = c.sub || ''
  $('fSub').style.display = c.sub ? '' : 'none'
  const box = $('fCmp')
  if(!c.cmp){ box.style.display = 'none'; return }
  box.style.display = ''
  $('cmpM').textContent = c.cmp.m
  for(const [side, d] of [['cmpL', c.cmp.l], ['cmpR', c.cmp.r]]){
    const n = $(side)
    n.querySelector('.nm').textContent = d.nm
    n.querySelector('.vl').textContent = d.vl
    n.classList.toggle('win', !!d.win)
  }
}
function show(c){
  paint(c)
  el.classList.remove('out'); el.classList.add('in')
  setTimeout(() => { el.classList.remove('in'); el.classList.add('out') }, ENTER + HOLD)
}
function stop(){ if(loop){ clearTimeout(loop); loop = null }
  el.classList.remove('in'); el.classList.add('out') }
function start(){
  if(loop) clearTimeout(loop)
  const tick = () => {
    if(!FACTS.length){ loop = setTimeout(tick, GAP); return }
    show(FACTS[idx % FACTS.length]); idx++
    loop = setTimeout(tick, ENTER + HOLD + EXIT + GAP)
  }
  loop = setTimeout(tick, 400)
}

// ── the wire ────────────────────────────────────────────────────────
// ?auto=0 holds the package until something explicitly asks for it. The
// default is on, because the deck has no button for this file and OBS
// source visibility is the operator's real switch.
const AUTO = Q.get('auto') !== '0'

const _ch = sb.channel('vga-overlay')
_ch.on('broadcast', { event:'cmd' }, ({ payload: c }) => {
  if(!c) return
  const d = c.d || {}

  // The two names, wherever the deck happens to be sending them from.
  // 'bout' is the UBA/GFL clock, 'tape' the tale of the tape, 'pickbar'
  // the UBAe match. All three already carry the pair.
  if(c.type === 'bout'   && has(d.a) && has(d.b)) lookup(d.a, d.b)
  if(c.type === 'pickbar'&& has(d.teamA) && has(d.teamB)) lookup(d.teamA, d.teamB)
  if(c.type === 'tape'){
    if(d.left && d.right){
      // The tape carries the belt when there is one — remember it before
      // the lookup, so the title card can be built on this same pass.
      TITLE = { name: has(d.title) && /title|championship|belt/i.test(String(d.title))
                  ? String(d.title).toUpperCase() : null, champ: null }
      if(has(d.left.name) && has(d.right.name)) lookup(d.left.name, d.right.name)
    }
    if(c.on === false || c.show === false) return
  }

  // Explicit control, for whenever the deck grows a button. Nothing in
  // control.html sends these today and this file does not need it to.
  if(c.type === 'facts'){
    if(c.on === false){ stop(); return }
    if(c.on === true){ start(); return }
  }
  // One typed fact, straight to air, bypassing the database entirely.
  if(c.type === 'fact' && has(d.head)){
    if(loop){ clearTimeout(loop); loop = null }
    show(CARD(d.tone || 'pur', d.eyebrow || 'FIGHT FACT', d.head, d.sub, d.cmp || null))
    if(AUTO) start()
  }
}).subscribe()

// A preview harness, so this file can be opened and judged without a deck
// and without a live match: ?demo=1 rotates one of every card shape, and
// ?card=N pins card N on screen so a single layout can be checked against
// the real 1920x1080 frame without waiting out a 31-second rotation.
if(Q.get('demo') === '1' || Q.has('card')){
  FACTS = [
    CARD('gold','ON THE LINE','UBA HEAVYWEIGHT TITLE','<em>DANNYG</em> defends'),
    CARD('amber','FINISHING RATE','64% BY KO','<em>DANNYG</em> — 9 of 14 wins inside the distance'),
    CARD('green','ON A RUN','4 STRAIGHT WINS','<em>DRAGON 5000</em> — last loss MAR 2026'),
    CARD('pink','THEY HAVE MET','2—1 DANNYG','3 previous bouts, latest <em>JAN 2026</em>'),
    CARD('pur','THE LADDER','#2 MEETS #7','HEAVYWEIGHT rankings',
      { l:{nm:'DANNYG',vl:'#2',win:true}, m:'RANK', r:{nm:'DRAGON 5000',vl:'#7',win:false} }),
    CARD('pur','REACH ADVANTAGE','4" LONGER','<em>DRAGON 5000</em> owns the reach',
      { l:{nm:'DANNYG',vl:'74"',win:false}, m:'REACH', r:{nm:'DRAGON 5000',vl:'78"',win:true} }),
    CARD('amber','THE MONEY','71% ON DANNYG','<em>18,400 VC</em> in the pool across 63 bets'),
    CARD('pur','THE RECORDS','HEAVYWEIGHT','',
      { l:{nm:'DANNYG',vl:'14—3',win:false}, m:'RECORD', r:{nm:'DRAGON 5000',vl:'11—5—1',win:false} }),
  ]
  const pin = Q.get('card')
  if(pin !== null && pin !== ''){
    const c = FACTS[(+pin || 0) % FACTS.length]
    paint(c); el.classList.add('in')     // pinned: enters once, never leaves
  } else start()
}
})()
</script>
