<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VGA — Tale of the Tape (Vertical)</title>
<!-- ============================================================
     1080x1920 SIBLING of tale-of-the-tape.html. Vertical canvas
     (Aitum Vertical) browser source. The horizontal original is
     untouched — this is a re-layout, not a port: that file draws its
     plate on a CANVAS at 1920x1080, and a 1920-wide canvas does not
     become a 1080-wide one by scaling. Same data, same command, same
     palette, new geometry.

     It answers the deck's EXISTING {type:'tape'} command, so one press
     of "Show tale of the tape" lights both canvases.

     THE STAT COLUMN IS THE POINT. Horizontally the tape is two faces
     with numbers between them; vertically there is room to run the
     rows full width, which is the shape a phone reads best — value,
     label, value, straight down the middle.
     ============================================================= -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Barlow+Condensed:wght@500;700;900&family=Barlow:wght@500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{ --pur:#9b30ff; --hi:#cc66ff; --pink:#ff33cc; --gold:#ffce00;
    --panel:rgba(14,0,30,.86); --line:rgba(155,48,255,.28); --dim:rgba(200,160,255,.6);
    --safe-bottom:320px; }
  html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;
    font-family:'Barlow',system-ui,Arial,sans-serif;color:#fff;}

  /* the room the plate sits in */
  #back{position:fixed;inset:0;opacity:0;transition:opacity .5s ease;
    background:
      radial-gradient(ellipse 70% 30% at 50% 12%, rgba(155,48,255,.22), transparent 70%),
      radial-gradient(ellipse 70% 26% at 50% 88%, rgba(255,51,204,.14), transparent 72%),
      linear-gradient(180deg,#07000f 0%,#12042a 46%,#05000c 100%);}
  #crt{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0;transition:opacity .5s ease;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:59;opacity:0;transition:opacity .5s ease;
    background:radial-gradient(ellipse at center,transparent 56%,rgba(0,0,0,.62) 100%);}
  body.on #back,body.on #crt,body.on #vig{opacity:1;}

  #tape{position:fixed;inset:0;padding:74px 52px var(--safe-bottom);z-index:10;
    display:flex;flex-direction:column;
    opacity:0;transform:translateY(30px);
    transition:opacity .55s cubic-bezier(.16,1,.3,1), transform .55s cubic-bezier(.16,1,.3,1);}
  body.on #tape{opacity:1;transform:none;}

  /* ── head ───────────────────────────────────────────────────────── */
  .head{text-align:center;margin-bottom:26px;}
  #mark{font-family:'Press Start 2P',monospace;font-size:19px;letter-spacing:.34em;
    color:var(--hi);text-shadow:0 0 18px rgba(204,102,255,.6);}
  #title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:62px;
    line-height:.94;text-transform:uppercase;margin-top:16px;letter-spacing:.006em;
    text-shadow:0 0 30px rgba(155,48,255,.6);}
  #subtitle{font:600 25px 'Barlow',sans-serif;color:var(--dim);margin-top:11px;
    letter-spacing:.1em;text-transform:uppercase;}
  #subtitle:empty{display:none;}

  /* ── the two faces ──────────────────────────────────────────────── */
  .faces{display:grid;grid-template-columns:1fr 92px 1fr;align-items:end;gap:8px;
    margin-bottom:24px;}
  .face{min-width:0;}
  .por{position:relative;height:420px;border-radius:12px;overflow:hidden;
    background:linear-gradient(180deg,rgba(155,48,255,.16),rgba(6,0,14,.9));
    border:1px solid var(--line);}
  .por img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    height:100%;width:auto;object-fit:cover;}
  /* No photo is the normal case for most of the roster. A monogram plate,
     not an empty box and never a broken-image icon. */
  .por .mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:170px;
    color:rgba(204,102,255,.24);text-transform:uppercase;}
  .face.l .por{border-left:6px solid var(--pur);}
  .face.r .por{border-right:6px solid var(--pink);}
  .fname{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:56px;
    line-height:.92;text-transform:uppercase;margin-top:16px;text-align:center;
    text-shadow:0 0 24px rgba(155,48,255,.5);}
  .frec{font:700 27px 'Barlow',sans-serif;color:var(--gold);text-align:center;margin-top:6px;
    letter-spacing:.05em;}
  .vs{font-family:'Press Start 2P',monospace;font-size:30px;color:var(--pink);
    text-align:center;padding-bottom:150px;text-shadow:0 0 20px rgba(255,51,204,.65);}

  /* ── the stat column ────────────────────────────────────────────── */
  /* flex:0 1 auto, NOT flex:1. flex:1 hands this a fixed slice of the column
     and lets ten rows spill straight out of it — which is what ran the
     sponsor block through the ODDS row. Sized to the worst case instead:
     all ten rows present is 630px, and 74 top + 171 head + 549 faces + 630
     + 101 sponsor + 320 safe bottom = 1845 of the 1920 available. */
  #rows{flex:0 1 auto;display:flex;flex-direction:column;justify-content:flex-start;}
  .row{display:grid;grid-template-columns:1fr 210px 1fr;align-items:center;
    padding:11px 22px;border-top:1px solid var(--line);background:var(--panel);}
  /* The rows DEAL IN from opposite sides — left values from the left, right
     values from the right — so the plate assembles as a comparison rather than
     appearing as a finished table. This file had no keyframes at all: it faded
     in as one block while its horizontal twin has real motion, and side by
     side that read as the vertical being the afterthought. */
  body.on .row{animation:rowin .4s cubic-bezier(.16,1,.3,1) backwards;}
  @keyframes rowin{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  body.on .row .v.l{animation:fromL .44s cubic-bezier(.16,1,.3,1) backwards;}
  body.on .row .v.r{animation:fromR .44s cubic-bezier(.16,1,.3,1) backwards;}
  @keyframes fromL{from{opacity:0;transform:translateX(-18px);}to{opacity:1;transform:none;}}
  @keyframes fromR{from{opacity:0;transform:translateX(18px);}to{opacity:1;transform:none;}}
  /* the two faces arrive first, from their own sides */
  body.on .face.l{animation:fromL .6s cubic-bezier(.16,1,.3,1) backwards;}
  body.on .face.r{animation:fromR .6s cubic-bezier(.16,1,.3,1) backwards;}
  body.on .vs{animation:vsin .5s cubic-bezier(.2,1.6,.4,1) .42s backwards;}
  @keyframes vsin{from{opacity:0;transform:scale(.5);}to{opacity:1;transform:none;}}
  .row:first-child{border-top:2px solid var(--pur);}
  .row:last-child{border-bottom:1px solid var(--line);}
  .row .v{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:40px;
    line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .v.l{text-align:left;} .row .v.r{text-align:right;}
  /* Gold marks the side that leads the row. Set only where "leading" is a
     real idea — reach, height, rank. Nobody leads a country. */
  .row .v.win{color:var(--gold);text-shadow:0 0 18px rgba(255,206,0,.45);}
  .row .lbl{font-family:'Press Start 2P',monospace;font-size:12px;letter-spacing:.18em;
    color:var(--hi);text-align:center;line-height:1.5;}
  .row .v img{height:34px;vertical-align:-6px;border-radius:3px;
    box-shadow:0 2px 10px rgba(0,0,0,.5);}
  /* The FROM row runs smaller than the rest. "United Kingdom" and "Bosnia and
     Herzegovina" do not fit beside a flag at 40px, and a clipped country reads
     as a broken graphic — while a country set two sizes down next to its own
     flag just reads as a caption, which is what it is. */
  .row.flag .v{font-size:31px;}
  .row.flag .v.l{text-align:left;} .row.flag .v.r{text-align:right;}

  /* ── sponsor ────────────────────────────────────────────────────── */
  #spon{margin-top:22px;text-align:center;padding:15px 0 0;border-top:1px solid var(--line);}
  #spon .k{font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:.24em;
    color:var(--dim);margin-bottom:11px;}
  #sponText{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:42px;
    letter-spacing:.05em;text-transform:uppercase;
    transition:opacity .3s ease;}
  #sponText.code{color:var(--gold);text-shadow:0 0 20px rgba(255,206,0,.45);}
  #sponText.swap{opacity:0;}
  #spon.off{display:none;}
</style>
</head>
<body>

<div id="back"></div>

<div id="tape">
  <div class="head">
    <div id="mark">UBA</div>
    <div id="title">—</div>
    <div id="subtitle"></div>
  </div>

  <div class="faces">
    <div class="face l">
      <div class="por" id="porL"><div class="mono" id="monoL"></div><img id="imgL" alt=""></div>
      <div class="fname" id="nameL">—</div>
      <div class="frec" id="recL"></div>
    </div>
    <div class="vs">VS</div>
    <div class="face r">
      <div class="por" id="porR"><div class="mono" id="monoR"></div><img id="imgR" alt=""></div>
      <div class="fname" id="nameR">—</div>
      <div class="frec" id="recR"></div>
    </div>
  </div>

  <div id="rows"></div>

  <div id="spon" class="off">
    <div class="k">OUR SPONSOR</div>
    <div id="sponText"></div>
  </div>
</div>

<div id="vig"></div>
<div id="crt"></div>

<script src="flag-codes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
const sb = supabase.createClient('https://emzlivoykbhhjcugupit.supabase.co',
  'sb_publishable_pqhH974E1q9YsFnrVH1UJQ_X3V-rRLF')
const $ = id => document.getElementById(id)
const Q = new URLSearchParams(location.search)
const DASH = '—'
const esc = t => String(t ?? '').replace(/[<>&]/g, ch => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[ch]))
// DASH counts as absent. The deck fills every field it cannot answer with an
// em-dash rather than omitting it, so a row testing only for null would print
// a tape of dashes.
const has = v => v !== null && v !== undefined &&
  String(v).trim() !== '' && String(v).trim() !== DASH && String(v).trim() !== '-'

// ── numbers, for the rows where one side can lead ───────────────────
// Reach and height arrive as free text ('74"', "6'1", '185cm'). A row is only
// marked gold when BOTH sides parse and the unit agrees — a graphic that says
// 6 beats 185 is worse than one that marks nothing.
function inches(v){
  const s = String(v ?? '').trim()
  if(!s) return null
  let m = s.match(/^(\d+)\s*['’]\s*(\d+(?:\.\d+)?)?/)
  if(m) return (+m[1]) * 12 + (m[2] ? +m[2] : 0)
  m = s.match(/^(\d+(?:\.\d+)?)\s*cm\b/i)
  if(m) return +m[1] / 2.54
  m = s.match(/^(\d+(?:\.\d+)?)/)
  if(m){ const n = +m[1]; return n > 40 && n < 90 ? n : null }
  return null
}
const rankNum = v => { const m = String(v ?? '').match(/(\d+)/); return m ? +m[1] : null }

// ── the rows ────────────────────────────────────────────────────────
// key, label, and how to decide who leads. `lead` returns -1 (left), 1
// (right) or 0 (nobody). A row where NEITHER side has a value is dropped
// entirely — the horizontal tape does the same, and it is why a thin
// profile produces a shorter tape rather than a tape full of dashes.
const ROWS = [
  { k:'record',  l:'RECORD' },
  { k:'rank',    l:'RANK',    lead:(a,b)=>{ const x=rankNum(a), y=rankNum(b)
      return (x&&y) ? (x<y?-1:x>y?1:0) : 0 } },       // #1 leads #7
  { k:'age',     l:'AGE' },
  { k:'height',  l:'HEIGHT',  lead:(a,b)=>{ const x=inches(a), y=inches(b)
      return (x!==null&&y!==null) ? (x>y?-1:x<y?1:0) : 0 } },
  { k:'reach',   l:'REACH',   lead:(a,b)=>{ const x=inches(a), y=inches(b)
      return (x!==null&&y!==null) ? (x>y?-1:x<y?1:0) : 0 } },
  { k:'weight',  l:'DIVISION' },
  { k:'stance',  l:'STANCE' },
  { k:'team',    l:'TEAM' },
  { k:'country', l:'FROM', flag:true },
  { k:'odds',    l:'ODDS' },
]

function renderRows(L, R){
  const out = []
  for(const r of ROWS){
    const a = L[r.k], b = R[r.k]
    if(!has(a) && !has(b)) continue                    // neither side: drop the row
    const lead = r.lead ? r.lead(a, b) : 0
    const cell = (v, side) => {
      if(!has(v)) return `<div class="v ${side}">${DASH}</div>`
      if(r.flag){
        const url = window.VGA_flagUrl ? window.VGA_flagUrl(v, 80) : null
        return `<div class="v ${side}">${url ? `<img src="${url}" alt="">&nbsp;` : ''}${esc(String(v).toUpperCase())}</div>`
      }
      const win = (side === 'l' && lead === -1) || (side === 'r' && lead === 1)
      return `<div class="v ${side}${win ? ' win' : ''}">${esc(String(v).toUpperCase())}</div>`
    }
    out.push(`<div class="row${r.flag ? ' flag' : ''}">${cell(a,'l')}` +
             `<div class="lbl">${r.l}</div>${cell(b,'r')}</div>`)
  }
  $('rows').innerHTML = out.join('')
  // dealt top to bottom, 55ms apart, starting after the two faces have landed
  ;[...$('rows').children].forEach((r, i) => {
    const t = 520 + i * 55
    r.style.animationDelay = t + 'ms'
    r.querySelectorAll('.v').forEach(v => { v.style.animationDelay = (t + 60) + 'ms' })
  })
}

// ── the faces ───────────────────────────────────────────────────────
function face(side, f){
  const nm = has(f.name) ? String(f.name) : DASH
  $('name' + side).textContent = nm.toUpperCase()
  $('rec'  + side).textContent = has(f.record) ? f.record : ''
  const img = $('img' + side), mono = $('mono' + side)
  mono.textContent = nm.replace(/[^A-Za-z0-9]/g,'').slice(0,1) || '?'
  // photo wins if set, then the by-slug convention the horizontal tape uses,
  // then the monogram. Each fallback is silent.
  const url = f.photo || null
  if(url){
    img.style.display = ''
    img.onerror = () => { img.style.display = 'none' }
    img.src = url
  } else img.style.display = 'none'
}

// ── show / hide ─────────────────────────────────────────────────────
// Kept in localStorage so an OBS browser-source refresh — which fires on
// every scene change in some setups — comes back with the bout it had
// rather than an empty plate. The same reason the horizontal tape does it,
// under a DIFFERENT key: the two plates are not the same shape and must
// not read each other's saved state.
const KEY = 'vga.tape.vertical'
function remember(d, on){
  try{
    const prev = JSON.parse(localStorage.getItem(KEY) || 'null') || {}
    localStorage.setItem(KEY, JSON.stringify({ d: d || prev.d || null, on }))
  }catch(e){ /* private mode / storage off — the plate still works, it just forgets */ }
}
function paint(d){
  $('mark').textContent = String(d.league || 'UBA').toUpperCase()
  $('title').textContent = String(d.title || '').toUpperCase()
  $('subtitle').textContent = String(d.subtitle || '').toUpperCase()
  const L = d.left || {}, R = d.right || {}
  face('L', L); face('R', R)
  renderRows(L, R)
  sponsor(d.sponsor, d.sponsorUrl, d.sponsorCode, d.sponsorFull)
}
function show(on){ document.body.classList.toggle('on', on !== false) }

// ── sponsor rotator ─────────────────────────────────────────────────
// Three faces on a timer, same idea and the same holds as the horizontal
// tape: the label lands and gets out of the way, the promo code has to be
// read off a screen and typed, so it holds longest.
let sponTimer = null, sponGen = 0
function sponsor(name, url, code, full){
  if(sponTimer){ clearTimeout(sponTimer); sponTimer = null }
  const gen = ++sponGen
  const box = $('spon'), face = $('sponText')
  if(!has(name)){ box.classList.add('off'); return }
  box.classList.remove('off')
  const clean = String(name).trim()
  const site  = (url  || clean.toLowerCase().replace(/[^a-z0-9]/g,'') + '.com').toUpperCase()
  const promo = (code || clean.toUpperCase().replace(/[^A-Z0-9]/g,'') + 'UBA30').toUpperCase()
  const faces = [
    { t:(full || clean).toUpperCase(), code:false, ms:3000 },
    { t:'OUR SPONSOR',                 code:false, ms:1100 },
    { t:promo + ' AT ' + site,         code:true,  ms:4600 },
  ]
  let i = 0
  face.textContent = faces[0].t
  face.classList.remove('code')
  const step = () => {
    if(gen !== sponGen) return
    face.classList.add('swap')
    setTimeout(() => {
      if(gen !== sponGen) return
      i = (i + 1) % faces.length
      face.textContent = faces[i].t
      face.classList.toggle('code', faces[i].code)
      face.classList.remove('swap')
      sponTimer = setTimeout(step, faces[i].ms)
    }, 300)
  }
  sponTimer = setTimeout(step, faces[0].ms)
}

// ── the wire ────────────────────────────────────────────────────────
sb.channel('vga-overlay').on('broadcast', { event:'cmd' }, ({ payload: c }) => {
  if(!c || c.type !== 'tape') return
  if(c.on === false){ show(false); remember(null, false); return }
  // The deck sends the DATA and the SHOW as two messages: mnTape() pushes
  // {d}, then tapeToggle() pushes {show:true}. Painting on the data push and
  // revealing on the show push is what keeps "Show" from ever revealing the
  // previous matchup.
  if(c.d){ paint(c.d); remember(c.d, undefined) }
  if(c.show === true){ show(true); remember(c.d || null, true) }
}).subscribe()

// An OBS refresh mid-show must come back where it was.
try{
  const saved = JSON.parse(localStorage.getItem(KEY) || 'null')
  if(saved && saved.d){ paint(saved.d); if(saved.on) show(true) }
}catch(e){ /* nothing saved, or storage off */ }

// Preview harness.
if(Q.get('demo') === '1'){
  paint({ league:'UBA', title:'UBA HEAVYWEIGHT TITLE', subtitle:'UBA Fight Night 31',
    sponsor:'SHEATH', sponsorFull:'Sheath Underwear',
    left: { name:'smokinem', record:'11-2-1', rank:'#7', age:27, height:"6'2", reach:'76',
      weight:'Heavyweight', stance:'Orthodox', team:'Sheath Elite', country:'United States', odds:'+140',
      photo:'https://emzlivoykbhhjcugupit.supabase.co/storage/v1/object/public/fighter-photos/smokinem-031f-1787671926636.png' },
    right:{ name:'Hello World', record:'5-4', rank:'#12', age:31, height:"6'0", reach:'73',
      weight:'Heavyweight', stance:'Southpaw', team:'UKFC UNCS', country:'United Kingdom', odds:'-165',
      photo:'https://emzlivoykbhhjcugupit.supabase.co/storage/v1/object/public/fighter-photos/hello-world-0b61-1787536081064.png' } })
  show(true)
}
})()
</script>
</body>
</html>
