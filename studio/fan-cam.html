<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VGA — Fan Cam</title>
<!-- ============================================================
     FAN CAM — a whole scene, like standby and the loading bar, not a
     corner bug. A crowd clip fills the frame, a fighter is composited
     in front of it, and a name bug says who you are looking at.

     THE SHOT IS A TELEPHOTO CUTAWAY. The fighter is close to the lens,
     chest-up, and the crowd behind is out of focus. That is a decision,
     not a style: the cut-outs are in-ring renders about three times the
     size of anybody in the clips, and for a year this file stood one in
     front of a sharp wide shot — a giant in front of a crowd of small
     people. Pushed in and thrown out of focus, the same two layers read
     as one person near the camera with a crowd behind.

     A FAN CAN BE A PHOTO OR A CUT-OUT VIDEO (fans.json) — see the media
     cache. Either way:

     EVERY FIGHTER IS FRAMED THE SAME. The photo is measured when it
     loads (where the head starts, how wide it is) and scaled so every
     head lands the same size in the same place. The seat only says which
     clip, which side of frame and how tight; the deck can nudge one
     fighter on top of that, live.

     A CUT IS ONE EVENT. The photo and the clip are both made ready
     BEFORE anything on screen changes, then swapped together under a
     short flash. The name never sits over the wrong face, and never
     over an empty frame while a 1.6MB photo comes down the wire.

     A missing clip falls back to a lit room rather than black. A scene
     that renders black looks identical to a scene that crashed.
     ============================================================= -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Barlow+Condensed:wght@500;700;900&family=Barlow:wght@500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{ --pur:#9b30ff; --hi:#cc66ff; --pink:#ff33cc;
    --panel:rgba(14,0,30,.92); --line:rgba(155,48,255,.28); --dim:rgba(200,160,255,.6);
    --gold:#ffce00; }
  html,body{width:1920px;height:1080px;background:transparent;overflow:hidden;
    font-family:'Barlow',system-ui,Arial,sans-serif;color:#fff;}

  /* ── the plate ────────────────────────────────────────────────────
     Everything lives inside one element so the whole scene can be cut
     in and out as a unit. It comes up live: an OBS scene that renders
     nothing when you cut to it is indistinguishable from a dead source. */
  #cam{position:fixed;inset:0;opacity:0;overflow:hidden;background:#05000d;
    transition:opacity .5s cubic-bezier(.16,1,.3,1);}
  #cam.on{opacity:1;}

  /* ── the room: the clip, out of focus, with a slow push ───────────
     The blur is what sells the scale (see the note at the top), and it
     also hides the join when a three-second clip loops. The push never
     stops, because a locked-off frame with a still cut-out in it is a
     photograph, and this is meant to be a camera. */
  #room{position:absolute;inset:-4%;transform-origin:50% 46%;
    animation:push 16s ease-in-out infinite alternate;}
  @keyframes push{from{transform:scale(1.10);}to{transform:scale(1.19) translateX(-.8%);}}
  #room video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity .55s linear;
    filter:blur(5px) brightness(1.08) saturate(1.02);}
  #room video.up{opacity:1;}
  /* The fallback. Not a card that says "no video" — a dark room lit from
     above, which is what the clip is a picture of. */
  #floor{position:absolute;inset:0;background:
    radial-gradient(ellipse 46% 34% at 50% 74%, rgba(155,48,255,.16), transparent 70%),
    radial-gradient(ellipse 26% 52% at 50% 20%, rgba(204,102,255,.13), transparent 72%),
    linear-gradient(180deg,#0a0118 0%,#12042a 42%,#07000f 100%);}

  /* ── the fighter ──────────────────────────────────────────────────
     Sized and placed by frame() from the measured photo. Graded DOWN to
     the room: the renders are lit for a white studio and the clips are a
     night arena, and the brightest thing in a frame is where the eye
     goes to find the seam. No coloured glow — a halo is a cut-out line. */
  #who{position:absolute;left:0;top:0;width:0;height:0;
    animation:breathe 5.2s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:translateY(0) rotate(-.15deg);}
                     50%{transform:translateY(-5px) rotate(.2deg);}}
  #who > *{position:absolute;display:block;max-width:none;
    filter:brightness(.93) saturate(.9) contrast(1.04)
           drop-shadow(0 0 26px rgba(0,0,0,.5));}
  /* Nothing to composite is a legitimate state — most of the roster has
     no photo. The bug still names them and the room still plays. */
  #who.empty{display:none;}

  /* ── grade + CRT, the same treatment every other scene wears ────── */
  #grade{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(4,0,12,.22) 0%,transparent 22%,transparent 56%,rgba(4,0,12,.66) 100%),
               linear-gradient(90deg,rgba(60,10,110,.16),transparent 40%,transparent 70%,rgba(60,10,110,.10));}
  #vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.42) 100%);}
  #crt{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px);}

  /* ── the cut ──────────────────────────────────────────────────────
     Six frames of light over the swap. It is there to HIDE the swap, so
     it peaks exactly when the photo and the clip change underneath. */
  #flash{position:absolute;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at 55% 45%,rgba(235,215,255,.95),rgba(155,48,255,.75) 60%,rgba(40,0,80,.9));}
  #flash.go{animation:flash .42s ease-out;}
  @keyframes flash{0%{opacity:0;}26%{opacity:1;}100%{opacity:0;}}

  /* ── the LIVE tally, top-right ────────────────────────────────────
     Slow pulse, not a blink: a fast blink reads as an error light. */
  #tally{position:absolute;top:54px;right:60px;display:flex;align-items:center;gap:12px;
    padding:10px 20px 10px 16px;background:rgba(8,0,18,.78);
    border:1px solid rgba(155,48,255,.34);border-radius:6px;
    font-family:'Press Start 2P',monospace;font-size:12px;letter-spacing:.2em;color:#fff;}
  #tally .dot{width:11px;height:11px;border-radius:50%;background:#ff2d55;
    box-shadow:0 0 14px #ff2d55;animation:tal 2.4s ease-in-out infinite;}
  @keyframes tal{0%,100%{opacity:1;}50%{opacity:.34;}}

  /* ── the name bug, bottom-left ────────────────────────────────────
     Same geometry as the dossier in overlay.html, so a director reading
     the bottom-left corner reads it the same way in every scene. */
  #bug{position:absolute;left:70px;bottom:84px;display:flex;
    max-width:1100px;border-radius:10px;overflow:hidden;
    transform:translateX(-125%);opacity:0;
    background:linear-gradient(135deg,rgba(20,4,38,.96),rgba(6,0,14,.97));
    box-shadow:0 22px 55px rgba(0,0,0,.62),0 0 0 1px rgba(155,48,255,.2);}
  #bug.in{animation:bin .5s cubic-bezier(.16,1,.3,1) .12s forwards;}
  @keyframes bin{to{transform:translateX(0);opacity:1;}}
  #bug.in #eyebrow{animation:lineup .34s cubic-bezier(.16,1,.3,1) .36s backwards;}
  #bug.in #name   {animation:lineup .38s cubic-bezier(.16,1,.3,1) .46s backwards;}
  #bug.in #sub    {animation:lineup .34s cubic-bezier(.16,1,.3,1) .58s backwards;}
  @keyframes lineup{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  #bug .accent{width:14px;flex:0 0 14px;background:var(--pur);box-shadow:0 0 26px var(--pur);}
  #bug .bd{padding:17px 42px 19px 26px;min-width:0;}
  #eyebrow{font-family:'Press Start 2P',monospace;font-size:12px;letter-spacing:.24em;
    color:var(--hi);text-shadow:0 0 13px rgba(204,102,255,.6);margin-bottom:11px;white-space:nowrap;}
  #name{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:78px;
    line-height:.9;text-transform:uppercase;letter-spacing:.006em;
    text-shadow:0 0 34px rgba(155,48,255,.6);white-space:nowrap;}
  #sub{font:600 25px 'Barlow',sans-serif;color:var(--dim);margin-top:10px;letter-spacing:.04em;white-space:nowrap;}
  #sub b{color:var(--gold);font-weight:600;}
  #sub.gone{display:none;}

  /* ?mon=1 — the deck's monitor. Same scene, nothing extra to hide; the
     class is here so the deck can tell its preview from the air copy. */
</style>
</head>
<body>

<div id="cam">
  <div id="room">
    <div id="floor"></div>
    <video id="bgA" muted loop playsinline preload="auto"></video>
    <video id="bgB" muted loop playsinline preload="auto"></video>
  </div>

  <div id="who" class="empty"></div>

  <div id="grade"></div>
  <div id="vig"></div>
  <div id="crt"></div>
  <div id="flash"></div>

  <div id="tally"><span class="dot"></span><span id="tallyText">FAN CAM</span></div>

  <div id="bug">
    <div class="accent"></div>
    <div class="bd">
      <div id="eyebrow">IN THE BUILDING</div>
      <div id="name">—</div>
      <div id="sub"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
const sb = supabase.createClient('https://emzlivoykbhhjcugupit.supabase.co',
  'sb_publishable_pqhH974E1q9YsFnrVH1UJQ_X3V-rRLF')
const $ = id => document.getElementById(id)
const Q = new URLSearchParams(location.search)
const has = v => v !== null && v !== undefined && String(v).trim() !== ''
const norm = s => String(s ?? '').trim().toLowerCase()
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const num = (v, d) => (v === null || v === undefined || v === '' || isNaN(+v)) ? d : +v
const clamp = (v, a, b) => Math.min(b, Math.max(a, v))
const wait = ms => new Promise(r => setTimeout(r, ms))

// ============================================================
// THE KNOBS. A seat sets the first five; the deck can nudge one
// fighter on top with the last three.
//
//   ?clip=seat-1.mp4  which file in assets/fancam/ to play
//   ?x=60             horizontal centre of the fighter, % of frame
//   ?y=0              lift, px (positive = higher in frame)
//   ?scale=1.0        1.0 = the head is 270px wide
//   ?flip=1           mirror the fighter
//   ?dx= ?dy= ?ds=    one fighter's nudge: % , px , multiplier
//   ?fighter=slug     who to look up (slug or display name)
//   ?eyebrow= ?sub=   override the two text lines
// ============================================================
const KN = {
  clip : Q.get('clip') || null,
  x    : num(Q.get('x'), 60),
  y    : num(Q.get('y'), 0),
  scale: num(Q.get('scale'), 1),
  flip : Q.get('flip') === '1',
  dx   : num(Q.get('dx'), 0), dy: num(Q.get('dy'), 0), ds: num(Q.get('ds'), 1),
}
const HEAD_W = 270      // px — every head lands this wide at scale 1
const HEAD_TOP = 128    // px — and starts this far down the frame

// ── measuring a photo ───────────────────────────────────────────────
// The cut-outs all come off the photo desk at 1400x2160, but how much of
// that the person fills is the pose's business: a head down and hooded, a
// guard up beside the jaw. Read the alpha once, small, and find the head —
// the first place the silhouette is widest before it narrows to a neck.
// A reading outside what a head can be is thrown away for the average, so a
// raised glove makes a fighter slightly big rather than absurdly small.
const HEAD_FRAC = .293
function measure(img, nw, nh){
  const out = { top:.04, head:HEAD_FRAC }
  try{
    const w = 140, h = Math.round(w * nh / nw)
    const c = document.createElement('canvas'); c.width = w; c.height = h
    const g = c.getContext('2d', { willReadFrequently:true }); g.drawImage(img, 0, 0, w, h)
    const a = g.getImageData(0, 0, w, h).data
    const row = y => { let n = 0; for(let x = 0; x < w; x++) if(a[(y*w + x)*4 + 3] > 40) n++; return n }
    let top = -1; for(let y = 0; y < h; y++) if(row(y) > 2){ top = y; break }
    if(top < 0) return out
    out.top = top / h
    let mx = 0, at = 0
    for(let y = top; y < top + h * .42 && y < h; y++){
      const n = row(y)
      if(n > mx){ mx = n; at = y }
      else if(mx && n < mx * .8 && y - at > 2){ const f = mx / w
        if(f > .22 && f < .37) out.head = f
        break }
    }
  }catch(e){ /* a tainted canvas is not worth a missing fighter */ }
  return out
}

// ── the media cache ─────────────────────────────────────────────────
// The promise is kept, not the result, so two asks for one fan share one
// download. The deck sends tonight's queue ahead (prep) and every face is
// here and measured before its fan is ever cut to.
//
// A FAN CAN BE A VIDEO. assets/fancam/fans.json names, per fighter slug, a
// cut-out clip with a transparent background (WebM, VP9 with alpha — the one
// transparent format OBS's browser plays). It is measured off its first frame
// and framed exactly like a photo, so nothing downstream knows the
// difference. No entry, or a clip that fails to load, is the photo.
//
//   { "boady": { "video": "fans/boady.webm", "dx": 0, "dy": 0, "ds": 1 } }
let FANS = {}
const MEDIA = new Map()
function still(url){
  return new Promise(res => {
    const im = new Image(); im.crossOrigin = 'anonymous'; im.alt = ''
    im.onload = () => res({ el:im, w:im.naturalWidth, h:im.naturalHeight, m:measure(im, im.naturalWidth, im.naturalHeight) })
    im.onerror = () => res(null)
    im.src = url
  })
}
function moving(url){
  return new Promise(res => {
    const v = document.createElement('video')
    v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'auto'
    const done = r => { v.onloadeddata = v.onerror = null; res(r) }
    v.onloadeddata = () => done({ el:v, w:v.videoWidth, h:v.videoHeight, video:true,
                                  m:measure(v, v.videoWidth, v.videoHeight) })
    v.onerror = () => done(null)
    setTimeout(() => done(null), 8000)
    v.src = url; v.load()
  })
}
// slug may be null (a photo passed by URL); url may be null (no photo at all)
function media(slug, url){
  const fan = (slug && FANS[norm(slug)]) || null
  const key = (fan && fan.video) ? 'v:' + fan.video : url ? 'p:' + url : null
  if(!key) return Promise.resolve(null)
  if(MEDIA.has(key)) return MEDIA.get(key)
  const p = (fan && fan.video
      ? moving('assets/fancam/' + fan.video).then(r => r || (url ? still(url) : null))
      : still(url))
    .then(r => { if(!r) MEDIA.delete(key)
      else { r.base = fan || {}
        // the clip did not load and the photo is standing in: good for a
        // minute, then the clip is tried again rather than lost for the night
        if(fan && fan.video && !r.video) setTimeout(() => { if(MEDIA.get(key) === p) MEDIA.delete(key) }, 60000) }
      return r })
  MEDIA.set(key, p)
  return p
}

let CUR = null      // what is on screen now
function frame(){
  if(!CUR) return
  const { el, m, base } = CUR
  const s = clamp(HEAD_W * KN.scale * KN.ds * num(base.ds, 1) / (m.head * CUR.w), .35, 1.6)
  let w = CUR.w * s, h = CUR.h * s
  let top = HEAD_TOP - KN.y - KN.dy - num(base.dy, 0) - m.top * h
  // never show the bottom edge of the cut-out — a waist that ends in mid-air
  if(top + h < 1090) top = 1090 - h
  el.style.width = w + 'px'; el.style.height = h + 'px'
  el.style.left = (1920 * (KN.x + KN.dx + num(base.dx, 0)) / 100 - w / 2) + 'px'
  el.style.top = top + 'px'
  el.style.transform = KN.flip ? 'scaleX(-1)' : 'none'
}

// ── the clips ───────────────────────────────────────────────────────
// Every seat's clip is pulled down once at load and held as a blob, so
// changing seats mid-show is a swap in memory and not a request. Two video
// elements take turns: the next pass starts under the last half-second of
// this one and fades up over it, so a three-second loop has no jump in it.
let SEATS = []
const BLOBS = new Map(), READY = new Map()
function blob(name){
  if(BLOBS.has(name)) return BLOBS.get(name)
  const p = fetch('assets/fancam/' + name).then(r => { if(!r.ok) throw 0; return r.blob() })
    .then(b => { const u = URL.createObjectURL(b); READY.set(name, u); return u })
    .catch(() => { BLOBS.delete(name); return null })
  BLOBS.set(name, p)
  return p
}
const V = [$('bgA'), $('bgB')]
let live = 0, clipNow = null, clipGen = 0
async function setClip(name){
  const tries = name ? [name] : [...(SEATS[0] ? [SEATS[0].clip] : []), 'loop.webm', 'loop.mp4']
  const mine = ++clipGen
  for(const t of tries){
    if(t === clipNow) return true
    // In memory already = use that. Not yet = STREAM it from the file rather
    // than wait for the whole download: on a first load over a real connection
    // the whole-file wait outlasted the cut, and the fan came up over the
    // empty room. The download carries on behind it for the next time.
    blob(t)
    const src = READY.get(t) || 'assets/fancam/' + t
    let v
    const ok = await new Promise(res => {
      v = V[1 - live]
      // The timer is cleared when the load answers, and only ever touches
      // handlers that are still its own: a stale one firing mid-way through the
      // NEXT load would strip that load's handlers and stall its cut.
      let timer = null
      const onCan = () => done(true), onErr = () => done(false)
      const done = r => { clearTimeout(timer)
        if(v.oncanplay === onCan) v.oncanplay = null
        if(v.onerror === onErr) v.onerror = null
        res(r) }
      // unlabelled while it loads, so the loop hand-over cannot mistake a
      // half-loaded NEW clip for the partner of the one on air
      v.dataset.clip = ''
      v.oncanplay = onCan; v.onerror = onErr
      v.src = src; v.load()
      timer = setTimeout(() => done(v.readyState >= 2), 6000)
    })
    if(mine !== clipGen) return false
    if(!ok) continue
    v.dataset.clip = t
    clipNow = t
    return true
  }
  if(!clipNow) console.warn('[fancam] no clip in assets/fancam/ — using the fallback room')
  return false
}
// called at the moment of the cut: the readied element becomes the live one.
// The element that just went dark is then given the same clip, so the loop
// has a partner to hand over to — never before, or the shot still on air
// would go blank a beat ahead of its own cut.
function rollClip(){
  const nx = V[1 - live], old = V[live]
  if(!nx.src || nx.dataset.clip !== clipNow || old.dataset.clip === clipNow) return
  try{ nx.currentTime = 0 }catch(e){}
  nx.play().catch(() => {})
  nx.classList.add('up'); old.classList.remove('up')
  live = 1 - live
  // Not if anything has asked for a clip since: that load owns the dark
  // element now, and writing this clip over it would put the wrong crowd up
  // under the next fan.
  const asked = clipGen
  setTimeout(() => { if(asked !== clipGen || old === V[live] || nx.dataset.clip !== clipNow) return
    old.pause(); old.src = nx.src; old.dataset.clip = nx.dataset.clip; old.load() }, 700)
}
// the loop: hand over to the other element before this one runs out.
// Both elements carry the loop attribute, so if this never runs (a source the
// host has stopped painting) the clip still loops — with its jump, but moving.
;(function tick(){
  const v = V[live], o = V[1 - live]
  if(v.duration && !v.paused && v.duration - v.currentTime < .6 &&
     v.dataset.clip && o.dataset.clip === v.dataset.clip && o.paused && o.readyState >= 2){
    try{ o.currentTime = 0 }catch(e){}
    o.play().catch(() => {})
    o.classList.add('up'); v.classList.remove('up')
    setTimeout(() => { if(v !== V[live]) v.pause() }, 650)
    live = 1 - live
  }
  requestAnimationFrame(tick)
})()

// ── who is in the chair ─────────────────────────────────────────────
const DIVISION = { heavyweight:'HEAVYWEIGHT', light_heavyweight:'LIGHT HEAVYWEIGHT',
  middleweight:'MIDDLEWEIGHT', lightweight:'LIGHTWEIGHT', welterweight:'WELTERWEIGHT',
  featherweight:'FEATHERWEIGHT', bantamweight:'BANTAMWEIGHT', flyweight:'FLYWEIGHT',
  cruiserweight:'CRUISERWEIGHT' }
const division = v => DIVISION[norm(v).replace(/\s+/g,'_')] || String(v ?? '').toUpperCase()

// ONE lookup for the whole night, and the PROMISE is cached rather than the
// result -- two switches in quick succession must share one fetch. Re-read
// only if it failed, so a blip at load does not leave the scene unable to
// name anybody all night.
let _cardsP = null
function cards(){
  if(_cardsP) return _cardsP
  _cardsP = sb.from('fighter_cards')
    .select('slug,display_name,nickname,weight_class,rank,is_champion,country,team,'+
            'profile_photo_url,headline_wins,headline_losses,headline_draws')
    .then(({ data, error }) => {
      // supabase-js resolves {data:null, error} instead of throwing, so a
      // failed lookup must be told apart from a fighter who is not there.
      if(error || !data){ console.warn('[fancam] lookup failed —', error); _cardsP = null; return [] }
      return data
    })
  return _cardsP
}
const find = (data, who) => data.find(c => norm(c.slug) === norm(who)) ||
                            data.find(c => norm(c.display_name) === norm(who)) || null

// the name shrinks to fit the bug rather than being cut by it
function fitName(){
  const el = $('name'); let px = 78
  el.style.fontSize = px + 'px'
  while(el.scrollWidth > 1000 && px > 40){ px -= 3; el.style.fontSize = px + 'px' }
}

let gen = 0, holdT = null, firstUp = true, PENDING = null
async function show(who, over){
  over = over || {}
  const mine = ++gen
  clearTimeout(holdT)
  PENDING = over

  // 1. everything is made READY first, with the old shot still on air
  let f = null
  if(has(who)){ f = find(await cards(), who); if(!f) console.warn('[fancam] no fighter matched', who) }
  if(mine !== gen) return
  const url = over.photo || (f && f.profile_photo_url) || null
  // A photo that will not arrive must not hold the cut: the director pressed
  // the button now. Past the wait the cut goes without a face, and the face
  // lands when it lands.
  // Coming up from nothing there is no shot on air to protect, so the first
  // show waits longer and arrives whole.
  const slow = firstUp ? 2 : 1
  // no clip named = stay in the room that is up, not back to seat one
  const clipP = setClip(over.clip || KN.clip || clipNow)
  const [ph] = await Promise.all([
    Promise.race([media(f && f.slug, url), wait(2600 * slow).then(() => undefined)]),
    Promise.race([clipP, wait(1800 * slow)]),
  ])
  if(mine !== gen) return

  // 2. the cut. On air already = under a flash; coming up from nothing = a fade.
  const onAir = $('cam').classList.contains('on') && !firstUp
  if(onAir){
    const fl = $('flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go')
    await wait(105)
    if(mine !== gen) return
  }
  firstUp = false

  // The seat's framing lands WITH the fan it belongs to. Applied when the
  // message arrived it moved (and mirrored) the fan still on air, up to two
  // seconds before their own cut.
  if(over.seat) seatKnobs(over)
  PENDING = null
  rollClip()
  // A clip that missed the wait still has to arrive. It was only ever rolled
  // AT the cut, so one that loaded a second late was never shown at all and
  // the fan sat over the empty room until the next cut.
  clipP.then(ok => { if(ok && mine === gen) rollClip() })
  const holder = $('who')
  const put = p => { if(CUR && CUR.video && CUR !== p) CUR.el.pause()
    CUR = p; if(holder.firstElementChild !== p.el) holder.replaceChildren(p.el)
    frame(); holder.classList.remove('empty')
    if(p.video){ try{ p.el.currentTime = 0 }catch(e){} p.el.play().catch(() => {}) } }
  if(ph) put(ph)
  else { if(CUR && CUR.video) CUR.el.pause()
    CUR = null; holder.classList.add('empty'); holder.replaceChildren()
    if(ph === undefined) media(f && f.slug, url).then(p => { if(p && mine === gen) put(p) }) }

  const name = over.name || (f && f.display_name) || (has(who) ? String(who) : 'FAN CAM')
  $('name').textContent = String(name).toUpperCase()
  $('eyebrow').textContent = String(over.eyebrow || Q.get('eyebrow') || 'IN THE BUILDING').toUpperCase()

  // The sub line writes itself from whatever the fighter actually has. An
  // absent part is DROPPED, not dashed: a thin profile makes a shorter line,
  // never a line with holes in it.
  let sub = over.sub || Q.get('sub') || ''
  if(!sub && f){
    const bits = []
    if(f.is_champion) bits.push(`<b>${esc(division(f.weight_class))} CHAMPION</b>`)
    else if(+f.rank > 0) bits.push(`#${+f.rank} ${esc(division(f.weight_class))}`)
    else if(has(f.weight_class)) bits.push(esc(division(f.weight_class)))
    const w = +f.headline_wins, l = +f.headline_losses, d = +f.headline_draws
    if(w >= 0 && l >= 0 && (w + l + (d||0)) > 0) bits.push(`${w}—${l}${d ? '—' + d : ''}`)
    // a team name is typed by a person, and this line is set as HTML for the
    // gold champion tag — so everything that came from the database is escaped
    if(has(f.team)) bits.push(esc(String(f.team).toUpperCase()))
    sub = bits.join('  ·  ')
  }
  if(over.sub || Q.get('sub')) $('sub').textContent = sub; else $('sub').innerHTML = sub
  $('sub').classList.toggle('gone', !sub)

  $('cam').classList.add('on')
  $('bug').classList.remove('in'); void $('bug').offsetWidth; $('bug').classList.add('in')
  fitName()

  // hold: a cutaway that takes itself down. The clock is HERE, not on the
  // deck, so a deck tab that was closed or put to sleep cannot strand a fan
  // on air.
  const hold = num(over.hold, 0)
  if(hold > 0) holdT = setTimeout(() => { if(mine === gen){ $('cam').classList.remove('on')
    const was = CUR; if(was && was.video) setTimeout(() => { if(!$('cam').classList.contains('on')) was.el.pause() }, 700) } }, hold * 1000)
}

// A cut that names a clip is naming a SEAT, and a seat is all four numbers:
// one it leaves out is the default, never whatever the last seat had. (It was
// the last seat's — so one mirrored seat mirrored every fan after it.)
const KN0 = { x:KN.x, y:KN.y, scale:KN.scale, flip:KN.flip }
function seatKnobs(d){
  if(has(d.clip)){ KN.x = num(d.x, 60); KN.y = num(d.y, 0); KN.scale = num(d.scale, 1); KN.flip = !!d.flip }
  else { KN.x = num(d.x, KN0.x); KN.y = num(d.y, KN0.y); KN.scale = num(d.scale, KN0.scale)
         KN.flip = d.flip != null ? !!d.flip : KN0.flip }
  KN.dx = num(d.dx, 0); KN.dy = num(d.dy, 0); KN.ds = num(d.ds, 1)
}

// Load the seat list, warm every clip, then come up. A missing seats.json is
// not an error — it means the old single-clip behaviour.
const fansP = fetch('assets/fancam/fans.json', { cache:'no-store' })
  .then(r => r.ok ? r.json() : {})
  .then(j => { if(j && typeof j === 'object') Object.keys(j).forEach(k => FANS[norm(k)] = j[k]) })
  .catch(() => {})
fetch('assets/fancam/seats.json', { cache:'no-store' })
  .then(r => r.ok ? r.json() : [])
  .then(list => {
    SEATS = Array.isArray(list) ? list : []
    SEATS.forEach(s => s && s.clip && blob(s.clip))
    // adopt the first seat's framing too, unless the URL already set it
    if(SEATS.length && !KN.clip){
      const s0 = SEATS[0]
      if(Q.get('x') == null && s0.x != null) KN.x = +s0.x
      if(Q.get('y') == null && s0.y != null) KN.y = +s0.y
      if(Q.get('scale') == null && s0.scale != null) KN.scale = +s0.scale
      if(Q.get('flip') == null && s0.flip != null) KN.flip = !!s0.flip
      Object.assign(KN0, { x:KN.x, y:KN.y, scale:KN.scale, flip:KN.flip })
    }
  })
  .catch(() => {})
  // Up on load, so cutting to the scene in OBS shows something. Without
  // ?fighter= the room plays under a plain FAN CAM bug — the cutaway before
  // anyone is identified.
  // — unless the deck got here first: a cut that arrived while this was
  // loading is the newer instruction, and the load show would cancel it.
  .finally(() => fansP.then(() => { if(!gen) show(Q.get('fighter'), {}) }))

// ── the wire ────────────────────────────────────────────────────────
//   {type:'fancam', on:false}                    take it down
//   {type:'fancam', on:true, d:{fighter,…}}      cut to a fan (seat + nudge + hold ride along)
//   {type:'fancam', adjust:true, d:{dx,dy,ds}}   move the fan who is up, no re-cut
//   {type:'fancam', prep:[slug,…]}               fetch these photos now, show nothing
// Realtime does not promise order: three cuts sent inside a few milliseconds
// were seen arriving shuffled, and the last to ARRIVE won. Each deck numbers
// its own messages (src + n), so one that arrives behind a newer one from the
// same deck is dropped. Two decks are never compared — their counters are
// unrelated.
const SEEN = {}
sb.channel('vga-overlay').on('broadcast', { event:'cmd' }, ({ payload: c }) => {
  if(!c || c.type !== 'fancam') return
  const d = c.d || {}
  if(Array.isArray(c.prep)){
    cards().then(data => c.prep.forEach(w => { const f = find(data, w); if(f) media(f.slug, f.profile_photo_url) }))
    return
  }
  if(has(c.src) && c.n != null){
    if(SEEN[c.src] != null && +c.n < SEEN[c.src]) return
    SEEN[c.src] = +c.n
  }
  if(c.adjust){
    // a nudge sent while a cut is still loading belongs to the fan on the way
    // in, not the one still up
    if(PENDING && PENDING.seat){ ['dx','dy','ds'].forEach(k => { if(d[k] != null) PENDING[k] = d[k] }); return }
    KN.dx = num(d.dx, KN.dx); KN.dy = num(d.dy, KN.dy); KN.ds = num(d.ds, KN.ds)
    frame(); return
  }
  if(c.on === false){ gen++; PENDING = null; clearTimeout(holdT); $('cam').classList.remove('on')
    // the fan's own clip stops once the plate has faded; the room keeps
    // rolling so the next cut comes up moving
    const was = CUR; setTimeout(() => { if(was && was.video && !$('cam').classList.contains('on')) was.el.pause() }, 700)
    return }
  d.seat = true
  if(has(d.tally)) $('tallyText').textContent = String(d.tally).toUpperCase()
  show(d.fighter || d.slug || d.name, d)
}).subscribe()
})()
</script>
</body>
</html>
