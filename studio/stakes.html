<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VGA — What's On The Line</title>
<!-- ============================================================
     WHAT'S ON THE LINE — the stakes graphic. A whole 1920x1080
     scene, like standby and the tale of the tape.

     AT MOST THREE LINES. A fight with six stakes has none: the
     screen is answering "why does this one matter", and a list is
     not an answer. The builders below are ordered by weight and the
     first three that can be filled are what goes on air.

     DB FIRST, TYPED SECOND. Everything it can read, it reads — the
     belt, the holder, the ladder, the streaks, the pool. Anything
     editorial ("loser leaves the division") is typed from the deck
     with {type:'stakes', d:{lines:[...]}}, which REPLACES the read
     ones rather than adding to them, because a hand-written stake
     is a decision and the automatic ones should not argue with it.

     It drives itself off the bout the deck already pushes, so it
     needs no deck button to work.
     ============================================================= -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Barlow+Condensed:wght@500;700;900&family=Barlow:wght@500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{ --pur:#9b30ff; --hi:#cc66ff; --pink:#ff33cc; --gold:#ffce00;
    --panel:rgba(14,0,30,.88); --line:rgba(155,48,255,.3); --dim:rgba(200,160,255,.6);
    --green:#5cf2a0; --amber:#ffb020; }
  html,body{width:1920px;height:1080px;background:transparent;overflow:hidden;
    font-family:'Barlow',system-ui,Arial,sans-serif;color:#fff;}

  #room{position:fixed;inset:0;opacity:0;transition:opacity .55s ease;background:
    radial-gradient(ellipse 60% 40% at 50% 10%, rgba(155,48,255,.24), transparent 70%),
    radial-gradient(ellipse 60% 36% at 50% 92%, rgba(255,51,204,.15), transparent 72%),
    linear-gradient(180deg,#07000f 0%,#12042a 48%,#04000c 100%);}
  #crt{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0;transition:opacity .55s ease;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:59;opacity:0;transition:opacity .55s ease;
    background:radial-gradient(ellipse at center,transparent 56%,rgba(0,0,0,.62) 100%);}
  body.on #room,body.on #crt,body.on #vig{opacity:1;}

  #stage{position:fixed;inset:0;z-index:10;padding:76px 120px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;transform:translateY(28px);
    transition:opacity .55s cubic-bezier(.16,1,.3,1), transform .55s cubic-bezier(.16,1,.3,1);}
  body.on #stage{opacity:1;transform:none;}

  /* "PRESENTED BY" is set in the label, not typed into the value, so a
     sponsor swap is one word and can never leave the preposition behind. */
  #brand{font-family:'Press Start 2P',monospace;font-size:13px;letter-spacing:.34em;
    color:var(--dim);margin-bottom:22px;}
  #brand:empty{display:none;}
  #brand::before{content:'PRESENTED BY  ';color:rgba(200,160,255,.4);}
  #kicker{font-family:'Press Start 2P',monospace;font-size:18px;letter-spacing:.34em;
    color:var(--hi);text-shadow:0 0 18px rgba(204,102,255,.6);}
  #bout{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:96px;
    line-height:.9;text-transform:uppercase;margin-top:20px;letter-spacing:.005em;
    text-shadow:0 0 40px rgba(155,48,255,.65);text-align:center;white-space:nowrap;}
  #bout i{font-style:normal;color:var(--pink);padding:0 22px;}

  /* ── the lines ──────────────────────────────────────────────────── */
  #lines{margin-top:52px;width:100%;max-width:1380px;display:flex;flex-direction:column;gap:20px;}
  .ln{display:flex;align-items:center;gap:30px;padding:26px 40px;
    background:var(--panel);border-left:7px solid var(--pur);
    box-shadow:0 0 34px rgba(60,0,110,.45);
    opacity:0;transform:translateX(-40px);
    animation:lnin .6s cubic-bezier(.16,1,.3,1) forwards;}
  /* Staggered so they land one at a time and get read in order. Three
     arriving together is a paragraph; three arriving in sequence is a
     case being made. */
  .ln:nth-child(1){animation-delay:.35s;}
  .ln:nth-child(2){animation-delay:.62s;}
  .ln:nth-child(3){animation-delay:.89s;}
  @keyframes lnin{to{opacity:1;transform:none;}}
  .ln.gold {border-left-color:var(--gold); box-shadow:0 0 40px rgba(255,206,0,.26);}
  .ln.amber{border-left-color:var(--amber);}
  .ln.green{border-left-color:var(--green);}
  .ln.pink {border-left-color:var(--pink);}

  .ln .no{font-family:'Press Start 2P',monospace;font-size:26px;color:var(--hi);
    min-width:58px;text-align:center;opacity:.55;}
  .ln.gold  .no{color:var(--gold);}
  .ln.amber .no{color:var(--amber);}
  .ln.green .no{color:var(--green);}
  .ln.pink  .no{color:var(--pink);}
  .ln .tx{min-width:0;flex:1;}
  .ln .ey{font-family:'Press Start 2P',monospace;font-size:12px;letter-spacing:.2em;
    color:var(--dim);margin-bottom:11px;}
  .ln .hd{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:56px;
    line-height:.96;text-transform:uppercase;letter-spacing:.006em;}
  .ln.gold .hd{color:var(--gold);text-shadow:0 0 24px rgba(255,206,0,.4);}
  .ln .sb{font:500 25px 'Barlow',sans-serif;color:var(--dim);margin-top:9px;}
  .ln .sb:empty{display:none;}
  .ln .sb em{font-style:normal;color:#fff;font-weight:600;}
</style>
</head>
<body>

<div id="room"></div>

<div id="stage">
  <div id="brand"></div>
  <div id="kicker">WHAT'S ON THE LINE</div>
  <div id="bout">—</div>
  <div id="lines"></div>
</div>

<div id="vig"></div>
<div id="crt"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
const sb = supabase.createClient('https://emzlivoykbhhjcugupit.supabase.co',
  'sb_publishable_pqhH974E1q9YsFnrVH1UJQ_X3V-rRLF')
const $ = id => document.getElementById(id)
const Q = new URLSearchParams(location.search)
const esc = t => String(t ?? '').replace(/[<>&]/g, ch => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[ch]))
const norm = s => String(s ?? '').trim().toLowerCase()
const has = v => v !== null && v !== undefined && String(v).trim() !== '' && String(v).trim() !== '—'
const MAX = 3

// ============================================================
// THE PRESENTING SPONSOR. This segment is ProTubeVR's, so the strap is
// set here rather than left blank and forgotten on the night.
//
// A WORDMARK, NOT A CODE. The tale of the tape learned this the hard
// way: deriving a promo code from a partner's name reads a code that
// does not exist out to the audience for any partner who has none.
// This strap says who presents the segment and nothing else.
//
// ?brand= overrides it, and ?brand= with an empty value hides it —
// the segment run without a sponsor should carry no strap at all.
// ============================================================
const BRAND = 'ProTubeVR'
$('brand').textContent = (Q.has('brand') ? Q.get('brand') : BRAND).toUpperCase()

const DIVISION = { heavyweight:'HEAVYWEIGHT', light_heavyweight:'LIGHT HEAVYWEIGHT',
  middleweight:'MIDDLEWEIGHT', lightweight:'LIGHTWEIGHT', welterweight:'WELTERWEIGHT',
  featherweight:'FEATHERWEIGHT', bantamweight:'BANTAMWEIGHT', flyweight:'FLYWEIGHT',
  cruiserweight:'CRUISERWEIGHT' }
const division = v => DIVISION[norm(v).replace(/\s+/g,'_')] || String(v ?? '').toUpperCase()
const dateOf = m => m.event_date || m.created_at || null
const sortDesc = l => l.slice().sort((a,b) => new Date(String(dateOf(b) ?? 0)) - new Date(String(dateOf(a) ?? 0)))

const LINE = (tone, ey, hd, sb) => ({ tone, ey, hd, sb: sb || '' })

// ────────────────────────────────────────────────────────────────────
// THE STAKES, heaviest first. Each returns a line or null; the first
// three that fill are what goes on air.
//
// Every one of these states a FACT that is true before the bell. None
// of them predicts a consequence ("a win makes him #1 contender") —
// there is no contender logic in the database to read that from, and a
// graphic that invents league rules on air is a graphic that will
// eventually contradict the people talking over it.
// ────────────────────────────────────────────────────────────────────
const BUILDERS = [

  // 1 · THE BELT. The heaviest thing that can be true, and the only one
  //     that gets gold.
  function belt(a, b, ctx){
    if(!ctx.titleName) return null
    const holder = ctx.title && ctx.title.holder_name
    const sub = holder
      ? (norm(holder) === norm(a.display_name) || norm(holder) === norm(b.display_name)
          ? `<em>${esc(holder)}</em> defends` : `held by <em>${esc(holder)}</em>`)
      : 'the belt is <em>VACANT</em>'
    return LINE('gold','THE TITLE', ctx.titleName, sub)
  },

  // 2 · A CHAMPION IN A NON-TITLE BOUT. Not the belt, but the reason
  //     people are watching.
  function champInRing(a, b, ctx){
    if(ctx.titleName) return null
    const ch = a.is_champion ? a : (b.is_champion ? b : null)
    if(!ch) return null
    return LINE('gold','CHAMPION IN THE RING', `${ch.display_name} PUTS HIS NAME ON IT`,
      `${division(ch.weight_class)} titleholder, <em>no belt on the line</em>`)
  },

  // 3 · THE LADDER. Both ranked — the division is being re-ordered.
  function ladder(a, b){
    const ra = +a.rank, rb = +b.rank
    if(!(ra > 0) || !(rb > 0)) return null
    const hi = Math.min(ra, rb)
    if(hi > 8) return null                       // deep in the list is not a stake
    return LINE('pur','THE LADDER', `#${ra} MEETS #${rb}`,
      `${division(a.weight_class || b.weight_class)} — <em>the top of the division moves tonight</em>`)
  },

  // 4 · AN UNBEATEN RECORD. One of them loses something they have never
  //     lost. Needs a real record behind it — 2-0 is not a streak.
  function unbeaten(a, b){
    const u = [a, b].filter(f => (+f.headline_losses || 0) === 0 && (+f.headline_wins || 0) >= 5)
    if(!u.length) return null
    if(u.length === 2)
      return LINE('amber','BOTH UNBEATEN','SOMEBODY GETS THEIR FIRST LOSS',
        `<em>${esc(u[0].display_name)}</em> ${+u[0].headline_wins}-0 · <em>${esc(u[1].display_name)}</em> ${+u[1].headline_wins}-0`)
    const f = u[0]
    return LINE('amber','UNBEATEN', `${+f.headline_wins}-0 ON THE LINE`,
      `<em>${esc(f.display_name)}</em> has never lost in the UBA`)
  },

  // 5 · A STREAK. Three or more; two is not a run.
  function streak(a, b, ctx){
    const best = [a, b].map(f => {
      const bouts = sortDesc((ctx.bouts[f.id] || []).filter(m => m.won !== null))
      if(!bouts.length || bouts[0].won !== true) return null
      let n = 0
      for(const m of bouts){ if(m.won !== true) break; n++ }
      return { f, n }
    }).filter(x => x && x.n >= 3).sort((x, y) => y.n - x.n)[0]
    if(!best) return null
    return LINE('green','A RUN TO PROTECT', `${best.n} STRAIGHT WINS`,
      `<em>${esc(best.f.display_name)}</em> has not lost since the run began`)
  },

  // 6 · THE MONEY. Pari-mutuel, so the pool IS the interest. Needs a
  //     pool with something real in it.
  function pool(a, b, ctx){
    const p = ctx.pool
    if(!p || !(+p.pool > 0) || +p.bets < 5) return null
    return LINE('amber','THE MONEY', `${(+p.pool).toLocaleString()} VC IN THE POOL`,
      `across <em>${p.bets}</em> bets — the room has an opinion`)
  },
]

// ── render ──────────────────────────────────────────────────────────
function paint(bout, lines){
  $('bout').innerHTML = bout
  const box = $('lines')
  // Re-created rather than re-filled, so the staggered entry animation
  // replays on every push instead of only the first.
  box.innerHTML = lines.slice(0, MAX).map((l, i) =>
    `<div class="ln ${l.tone}"><div class="no">${i + 1}</div><div class="tx">
      <div class="ey">${esc(l.ey)}</div>
      <div class="hd">${esc(l.hd)}</div>
      <div class="sb">${l.sb}</div>
    </div></div>`).join('')
  fitBout()
}
// The bout line is nowrap and two long handles overrun 1680px. Shrink to
// fit rather than clip — and measure again once the face has loaded, or
// the measurement is taken against the fallback and comes back narrow.
function fitBout(){
  const el = $('bout'), room = 1680
  let px = 96
  el.style.fontSize = px + 'px'
  const w = () => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width }
  while(w() > room && px > 44){ px -= 3; el.style.fontSize = px + 'px' }
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitBout)
const show = on => document.body.classList.toggle('on', on !== false)

// ── data ────────────────────────────────────────────────────────────
let gen = 0, current = '', TITLE = { name:null }
async function load(nameA, nameB){
  const key = norm(nameA) + '|' + norm(nameB) + '|' + norm(TITLE.name)
  if(key === current) return                  // the deck re-pushes the same bout constantly
  current = key
  const mine = ++gen

  // supabase-js resolves {data:null, error} rather than throwing, so a failed
  // read must be told apart from "there is nothing". Conflating them would put
  // a stakes screen on air claiming a title fight has no stakes.
  const { data: cards, error } = await sb.from('fighter_cards')
    .select('id,slug,display_name,weight_class,rank,is_champion,'+
            'headline_wins,headline_losses,headline_draws,headline_ko_wins')
  if(error || !cards){ console.warn('[stakes] fighter lookup failed —', error); current = ''; return }
  const find = n => cards.find(c => norm(c.display_name) === norm(n)) ||
                    cards.find(c => norm(c.slug) === norm(n))
  const a = find(nameA), b = find(nameB)
  if(!a || !b){ console.warn('[stakes] no match for', nameA, '/', nameB); current = ''; return }

  const [{ data: ma }, { data: mb }, { data: pools }, { data: titles }] = await Promise.all([
    sb.from('fighter_matches').select('*').eq('fighter_id', a.id).eq('status','completed'),
    sb.from('fighter_matches').select('*').eq('fighter_id', b.id).eq('status','completed'),
    sb.from('bet_pools_public').select('*'),
    sb.from('titles_public').select('*'),
  ])
  if(mine !== gen) return

  const ctx = {
    bouts: { [a.id]: ma || [], [b.id]: mb || [] },
    pool: (pools || []).find(p =>
      (norm(p.side_a) === norm(a.display_name) && norm(p.side_b) === norm(b.display_name)) ||
      (norm(p.side_a) === norm(b.display_name) && norm(p.side_b) === norm(a.display_name))) || null,
    titleName: TITLE.name,
    // The named belt if the deck gave one, otherwise the belt for this
    // division — a title bout the deck labelled only "HEAVYWEIGHT TITLE"
    // still finds its holder.
    title: (titles || []).find(t => TITLE.name && norm(t.name) === norm(TITLE.name)) ||
           (titles || []).find(t => norm(t.weight_class) === norm(a.weight_class)) || null,
  }

  const lines = []
  for(const fn of BUILDERS){
    if(lines.length >= MAX) break
    let l = null
    // One bad builder must not take the screen down. A stakes graphic with
    // two lines is a graphic; a thrown exception is a black scene.
    try { l = fn(a, b, ctx) } catch(e){ console.warn('[stakes] builder threw —', fn.name, e) }
    if(l) lines.push(l)
  }
  if(!lines.length) lines.push(LINE('pur','TONIGHT','PRIDE AND THE RECORD',
    'no belt, no ranking — <em>just the two of them</em>'))
  paint(`${esc(a.display_name.toUpperCase())}<i>VS</i>${esc(b.display_name.toUpperCase())}`, lines)
  console.log(`[stakes] ${lines.length} for ${a.display_name} vs ${b.display_name}:`,
    lines.map(l => l.ey).join(' · '))
}

// ── the wire ────────────────────────────────────────────────────────
sb.channel('vga-overlay').on('broadcast', { event:'cmd' }, ({ payload: c }) => {
  if(!c) return
  const d = c.d || {}

  // Learn the bout from what the deck already sends.
  if(c.type === 'bout' && has(d.a) && has(d.b)){
    // 'sub' carries "5 ROUNDS · TITLE" on a title bout — the only place the
    // clock's payload says so.
    if(/title/i.test(String(d.sub || '')) && !TITLE.name) TITLE.name = null
    load(d.a, d.b)
  }
  if(c.type === 'tape' && d.left && d.right && has(d.left.name) && has(d.right.name)){
    // The tape's title is the belt when it is one, and the division when it
    // is not. Only the former is a stake.
    TITLE.name = /title|championship|belt/i.test(String(d.title || ''))
      ? String(d.title).toUpperCase() : null
    load(d.left.name, d.right.name)
  }

  if(c.type !== 'stakes') return
  if(c.on === false || c.show === false){ show(false); return }
  if(has(d.brand)) $('brand').textContent = String(d.brand).toUpperCase()
  if(has(d.kicker)) $('kicker').textContent = String(d.kicker).toUpperCase()
  // TYPED LINES REPLACE THE READ ONES. A hand-written stake is a decision;
  // the automatic ones must not argue with it in the next row down.
  if(Array.isArray(d.lines) && d.lines.length){
    paint(has(d.bout) ? esc(String(d.bout).toUpperCase()) : $('bout').innerHTML,
      d.lines.map(l => LINE(l.tone || 'pur', l.eyebrow || l.ey || '', l.head || l.hd || '', l.sub || l.sb || '')))
  }
  show(c.on !== false)
}).subscribe()

// Preview harness.
if(Q.get('demo') === '1'){
  paint('SMOKINEM<i>VS</i>HELLO WORLD', [
    LINE('gold','THE TITLE','UBA HEAVYWEIGHT TITLE','<em>Hello World</em> defends'),
    LINE('pur','THE LADDER','#7 MEETS #2','HEAVYWEIGHT — <em>the top of the division moves tonight</em>'),
    LINE('amber','THE MONEY','18,400 VC IN THE POOL','across <em>63</em> bets — the room has an opinion'),
  ])
  show(true)
}
})()
</script>
</body>
</html>
