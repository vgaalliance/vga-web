<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VGA — Every graphic</title>
<!-- ============================================================
     A REVIEW TOOL. NEVER ADD THIS TO OBS.

     Every broadcast graphic in studio/, grouped by the section of
     the control deck you drive it from, each one the REAL file in an
     iframe driven over the REAL channel. What you watch here is what
     goes on air.

     ONE THING TO KNOW WHILE READING IT. Every iframe subscribes to
     the same channel, so tiles that share a file (the six overlay
     tiles) all receive each other's commands. That is not a bug in
     this page, it is a fact about the channel and about the fact
     that those six graphics ship as ONE browser source. Play a
     section at a time rather than the whole page if you want to
     watch one in isolation.
     ============================================================= -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;900&family=Barlow:wght@500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0b0910;color:#eee;font-family:'Barlow',system-ui,sans-serif;padding:20px 24px 80px;}
  h1{font-family:'Barlow Condensed';font-weight:900;font-size:30px;letter-spacing:.04em;text-transform:uppercase;}
  .sub{color:#9a90ab;font-size:13.5px;margin-top:5px;max-width:840px;line-height:1.5;}
  .bar{position:sticky;top:0;z-index:60;background:#0b0910;padding:13px 0 15px;margin-bottom:8px;
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #241d31;}
  button{background:#1c1626;color:#eee;border:1px solid #3a2f4d;border-radius:6px;
    padding:8px 14px;font:600 12.5px 'Barlow';cursor:pointer;letter-spacing:.03em;}
  button:hover{background:#2a2138;border-color:#5a4a75;}
  button.go{background:#9b30ff;border-color:#b565ff;color:#fff;}
  button.out{background:#3a1a2a;border-color:#7a3050;}
  .note{color:#7d7390;font-size:12px;margin-left:4px;}
  h2{font-family:'Barlow Condensed';font-weight:700;font-size:16px;letter-spacing:.15em;
    text-transform:uppercase;color:#b9a6d8;margin:24px 0 4px;display:flex;align-items:center;gap:12px;}
  h2 button{padding:4px 10px;font-size:11px;}
  .grid{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin-top:10px;}
  .tile{background:#121019;border:1px solid #241d31;border-radius:8px;padding:9px;}
  .cap{font:600 12px 'Barlow';color:#cbbfe0;margin-bottom:7px;display:flex;
    justify-content:space-between;gap:10px;align-items:baseline;}
  .cap i{font-style:normal;color:#7d7390;font-size:10.5px;font-family:monospace;text-align:right;}
  .fr{position:relative;overflow:hidden;background:#07050c;border-radius:4px;}
  .fr iframe{border:0;transform-origin:0 0;position:absolute;top:0;left:0;}
  .h .fr{width:426px;height:240px;} .h iframe{width:1920px;height:1080px;transform:scale(.2219);}
  .v .fr{width:176px;height:313px;} .v iframe{width:1080px;height:1920px;transform:scale(.163);}
</style>
</head>
<body>

<h1>Every graphic</h1>
<div class="sub">All 20 studio files, grouped by the deck section you drive them from. Real files, real channel.
Tiles that share a file (the overlay six) hear each other's commands — that is how they ship, as one source. Play one section at a time to watch a single graphic.</div>

<div class="bar">
  <button class="go" onclick="playAll()">▶ Play everything</button>
  <button class="out" onclick="outAll()">■ Hide everything</button>
  <button onclick="location.reload()">↻ Reset</button>
  <span class="note" id="st">connecting…</span>
</div>

<div id="secs"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient('https://emzlivoykbhhjcugupit.supabase.co',
  'sb_publishable_pqhH974E1q9YsFnrVH1UJQ_X3V-rRLF')
const ch = sb.channel('vga-overlay')
ch.subscribe(s => { document.getElementById('st').textContent =
  s === 'SUBSCRIBED' ? '● channel live' : s.toLowerCase() })
const fire = p => ch.send({ type:'broadcast', event:'cmd', payload:p })
const wait = ms => new Promise(r => setTimeout(r, ms))

const TILES = [["Pre-show", "Countdown", "countdown.html", "h", "timer + matchup, game-menu style", [{"type": "countdown", "d": {"a": "smokinem", "b": "Hello World", "league": "UBA", "eventMain": "UBA 15", "eventSub": "ubaesports.com"}}], []], ["Pre-show", "Poster / sponsor top bar", "standby.html", "h", "sponsor strip + poster screen", [{"type": "standby", "view": "cta", "on": true, "league": "uba"}], [{"type": "standby", "on": false}]], ["Standby \u00b7 the loading screen", "Standby \u2014 fight card", "standby.html", "h", "the card, tiers, winner ticks", [{"type": "standby", "view": "card", "on": true, "league": "uba", "event": "UBA 15"}], [{"type": "standby", "on": false}]], ["Standby \u00b7 the loading screen", "Standby \u2014 rankings", "standby.html", "h", "division ladders + champions", [{"type": "standby", "view": "ubarank", "on": true, "league": "uba"}], [{"type": "standby", "on": false}]], ["Standby \u00b7 the loading screen", "Weekly schedule bar", "loading-bar.html", "h", "toggles over the info screens", [{"type": "loadbar", "d": {"week": "04", "dates": "SEP 4-5", "matches": []}}, {"type": "loadbar", "show": true}], [{"type": "loadbar", "show": false}]], ["Tale of the tape", "Tale of the tape", "tale-of-the-tape.html", "h", "centre drops, rows stagger 150ms", [{"type": "tape", "d": {"title": "UBA HEAVYWEIGHT TITLE", "subtitle": "UBA 15", "left": {"name": "smokinem", "record": "11-2-1", "rank": "#7", "age": 27, "height": "6'2", "reach": "76", "weight": "Heavyweight", "stance": "Orthodox", "country": "United States", "odds": "+140", "photo": "https://emzlivoykbhhjcugupit.supabase.co/storage/v1/object/public/fighter-photos/smokinem-031f-1787671926636.png"}, "right": {"name": "Hello World", "record": "5-4", "rank": "#12", "age": 31, "height": "6'0", "reach": "73", "weight": "Heavyweight", "stance": "Southpaw", "country": "United Kingdom", "odds": "-165", "photo": "https://emzlivoykbhhjcugupit.supabase.co/storage/v1/object/public/fighter-photos/hello-world-0b61-1787536081064.png"}, "league": "UBA", "sponsor": "SHEATH"}}, {"type": "tape", "show": true}], [{"type": "tape", "on": false}]], ["Match \u00b7 clocks", "UBA / GFL fight clock", "fight-clock.html", "h", "the bar, trunk + odds reveal", [{"type": "clock", "league": "uba", "show": true}, {"type": "bout", "league": "uba", "d": {"a": "smokinem", "b": "Hello World", "label": "MAIN EVENT", "sub": "5 ROUNDS", "colorL": "#e8312a", "colorR": "#2e6fe8"}}, {"type": "clocktimer", "league": "uba", "secs": 143}], [{"type": "clock", "league": "uba", "show": false}]], ["Match \u00b7 clocks", "UBAe fight clock", "ubae-fight-clock.html", "h", "team clock, BO5 strip", [{"type": "pickbar", "league": "ubae", "d": {"teamA": "Sheath Elite", "teamB": "UKFC UNCS", "scoreA": 1, "scoreB": 2}}], []], ["Match \u00b7 clocks", "Pick bar (UBAe)", "pick-bar.html", "h", "battleroom pick'em", [{"type": "pickbar", "league": "ubae", "d": {"split": "SUMMER SPLIT", "teamA": "Sheath Elite", "teamB": "UKFC UNCS", "scoreA": 1, "scoreB": 2}}], []], ["Match \u00b7 overlay (one file, one source)", "Fighter dossier \u2014 the segmented bar", "overlay.html", "h", "segments wipe L to R, 70ms apart", [{"type": "fighter", "league": "uba", "d": {"name": "Namsrai Batbayar", "record": "11-2-1", "ko": 7, "rank": 7, "weight": "Heavyweight", "country": "Mongolia", "next": "vs Dragon 5000 \u00b7 UBA 16"}}], [{"type": "fighter", "on": false}]], ["Match \u00b7 overlay (one file, one source)", "Keys to victory + fun fact", "overlay.html?keysdemo=1", "h", "typed in the admin card builder", "RELOAD", [{"type": "keys", "on": false}]], ["Match \u00b7 overlay (one file, one source)", "Message \u2014 social post card", "overlay.html", "h", "platform picked on the deck", [{"type": "flash", "w": "msg", "league": "uba", "d": {"text": "10-9 Lima. The headkick is there all night.", "from": "PNW.MMA", "handle": "pnw.mma", "platform": "discord", "tag": "#UBA15"}}], [{"type": "flash", "w": "msg", "on": false}]], ["Match \u00b7 overlay (one file, one source)", "Bet alert", "overlay.html", "h", "anonymous by default", [{"type": "flash", "w": "bet", "league": "uba", "d": {"amt": 2500, "pick": "smokinem", "odds": 1.85}}], []], ["Match \u00b7 overlay (one file, one source)", "Odds board", "overlay.html", "h", "pool split as dots", [{"type": "odds", "league": "uba", "on": true, "d": {"a": "smokinem", "b": "Hello World", "total_a": 11200, "total_b": 7200, "bets": 63}}], [{"type": "odds", "on": false}]], ["Match \u00b7 overlay (one file, one source)", "Venue bug", "overlay.html", "h", "auto-hides on a timer", [{"type": "bug", "league": "uba", "d": {"text": "Memorial Hall", "eyebrow": "Live From"}}], [{"type": "bug", "d": {"on": false}}]], ["Rankings", "Rankings at stake \u2014 who can jump who", "rankings-at-stake.html", "h", "ladder cascades, badges stamp", "RELOAD", [{"type": "rankstakes", "on": false}]], ["Fan cam", "Fan cam", "fan-cam.html?fighter=smokinem", "h", "clip file still missing \u2014 fallback floor", "RELOAD", [{"type": "fancam", "on": false}]], ["Vertical \u00b7 1080x1920", "Vertical \u2014 LOADING (shutters closed)", "vertical.html", "v", "between matches", "RELOAD", []], ["Vertical \u00b7 1080x1920", "Vertical \u2014 MATCH (shutters open)", "vertical.html?state=open&pane=tape", "v", "clock sliver + tape in the bottom half", "RELOAD", []], ["Vertical \u00b7 1080x1920", "Vertical \u2014 dossier in the bottom", "vertical.html?state=open&pane=who", "v", "one pane at a time", "RELOAD", []]];

const bySec = {};
TILES.forEach((t, i) => { (bySec[t[0]] = bySec[t[0]] || []).push([t, i]) });
const secs = document.getElementById('secs');
Object.entries(bySec).forEach(([name, list], si) => {
  const h = document.createElement('h2');
  h.innerHTML = `<span>${name}</span>`;
  const b = document.createElement('button');
  b.textContent = '▶ play section'; b.onclick = () => playSome(list.map(x => x[1]));
  h.appendChild(b); secs.appendChild(h);
  const g = document.createElement('div'); g.className = 'grid';
  list.forEach(([t, i]) => {
    const d = document.createElement('div');
    d.className = 'tile ' + t[3];
    d.innerHTML = `<div class="cap"><span>${t[1]}</span><i>${t[4]}</i></div>
      <div class="fr"><iframe id="f${i}" src="${t[2]}" scrolling="no"></iframe></div>`;
    g.appendChild(d);
  });
  secs.appendChild(g);
});

// A tile whose `in` is the string RELOAD is driven by its own ?demo/?state
// parameter, so replaying it means reloading the frame. Everything else is
// driven by pushing its commands onto the channel.
async function playSome(idxs){
  for(const i of idxs){
    const t = TILES[i], fr = document.getElementById('f' + i);
    if(t[5] === 'RELOAD' || !t[5].length){ fr.contentWindow.location.reload(); }
    else { for(const p of t[5]){ await fire(p); await wait(t[5].length > 1 ? 700 : 140) } }
    await wait(120);
  }
}
const playAll = () => playSome(TILES.map((_, i) => i));
async function outAll(){
  for(const t of TILES){ for(const p of t[6]){ await fire(p); await wait(70) } }
}
</script>
</body>
</html>
