<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UBA Fight Clock</title>
<!-- THE UBA FIGHT CLOCK. This is the URL that goes in the OBS scene, and it
     keeps this name on purpose: every scene already built against it, and every
     line in obs-setup.md pointing at it, still works untouched.

     The clock itself moved to fight-clock.html on 2026-08-17, shared by both
     solo leagues: same bar, same timer, same trunk reveal, same odds board, one
     implementation. This page is the UBA door into it -- it hands the clock its
     league and gets out of the way. gfl-fight-clock.html is the same door with
     the fire dress on.

     Why doors and not two copies: the clock is 2,000 lines, and every fix to
     the timer, the reveal or the pips would otherwise have to be made twice.
     The second one is the one that gets forgotten.

     The deck still overrides the league on any command it sends, which is what
     lets a GFL card promoted during a UBA night dress itself correctly. -->
<script>
  // carry any other params through, so ?debug=1 style flags keep working
  var q = new URLSearchParams(location.search)
  q.set('league', 'uba')
  location.replace('fight-clock.html?' + q.toString())
</script>
<meta http-equiv="refresh" content="0;url=fight-clock.html?league=uba">
</head>
<body style="background:transparent"></body>
</html>
