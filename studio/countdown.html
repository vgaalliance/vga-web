<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>VGA — Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Barlow+Condensed:ital,wght@0,700;0,900;1,900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<!--
  THE COUNTDOWN, AS A GAME'S TITLE SCREEN (2026-10-23)

  Three states, all driven by the one clock the deck sets:

  1. REEL   — the promos play FULL SCREEN, one after another, with a game menu
              over the left side whose cursor sits on whatever is playing. Every
              two promos it cuts to the standby board (tonight's card, then the
              Discord call to action) for a few seconds. The running order is
              assets/promos/promos.json — see the README beside it.
  2. FINAL  — at one minute out the menu selects START MATCH, the reel sinks
              behind the grid and a giant clock takes the screen. The last ten
              seconds hit: red, a flash, a shake and a low boom on every number.
  3. LIVE   — at zero, WE ARE LIVE, and it holds there until the scene changes.

  A new target from the deck that is more than a minute out puts it back in the
  reel, so a restarted clock never strands the screen in the takeover.

  URL params (all optional):
    ?league=uba|ubae|gfl  which standby board the breaks show (the deck's push
                          overrides it)
    ?t=5                  start a 5-minute clock on load (testing, or a show
                          with nobody on the deck)
    ?mute=1               promos play silent
    ?sfx=0                no countdown sounds
-->
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root { --pur:#9b30ff; --hi:#cc66ff; --pink:#ff33cc; --white:#f0e8ff; --bg:#03000a; --red:#ff2244; }
html { background:#000; overflow:hidden; }
body {
  background:#000000;
  width:1920px; height:1080px;
  overflow:hidden; position:relative;
  font-family:'Press Start 2P',monospace; color:var(--white);
}
#stage { position:absolute; inset:0; }

/* corner brackets */
.sc { position:absolute; width:52px; height:52px; border-style:solid; z-index:60; animation:cornercycle 3s linear infinite; }
.sc-tl{top:12px;left:12px;border-width:3px 0 0 3px}
.sc-tr{top:12px;right:12px;border-width:3px 3px 0 0}
.sc-bl{bottom:12px;left:12px;border-width:0 0 3px 3px}
.sc-br{bottom:12px;right:12px;border-width:0 3px 3px 0}
@keyframes cornercycle{
  0%  {border-color:#ff0080;box-shadow:0 0 12px #ff0080}
  17% {border-color:#ff8c00;box-shadow:0 0 12px #ff8c00}
  33% {border-color:#ffe000;box-shadow:0 0 12px #ffe000}
  50% {border-color:#cc66ff;box-shadow:0 0 12px #cc66ff}
  67% {border-color:#ff33cc;box-shadow:0 0 12px #ff33cc}
  83% {border-color:#9b4dff;box-shadow:0 0 12px #9b4dff}
  100%{border-color:#ff0080;box-shadow:0 0 12px #ff0080}
}
@keyframes textflow  {0%{background-position:0 0}100%{background-position:300% 0}}
@keyframes textslide {0%{background-position:0 0}100%{background-position:0 300%}}
@keyframes logopulse {
  0%,100%{filter:drop-shadow(0 0 20px rgba(255,0,255,.9)) drop-shadow(0 0 50px rgba(0,255,255,.6))}
  50%    {filter:drop-shadow(0 0 50px rgba(255,255,0,1))  drop-shadow(0 0 100px rgba(0,255,255,.9))}
}
@keyframes selblink   {0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes lflicker   {0%,95%,100%{opacity:1}96%{opacity:.85}97%{opacity:1}}
@keyframes rflicker   {0%,93%,100%{opacity:1}94%{opacity:.8}95%{opacity:1}}
@keyframes colonblink {0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes hueshift   {0%{filter:hue-rotate(0deg) saturate(2)} 100%{filter:hue-rotate(360deg) saturate(2)}}

/* ── BACKDROP: the synthwave grid. Under the reel while promos play; it is
   the whole stage for the final minute. ── */
.sw-bg {
  position:absolute; top:0; left:0; width:1920px; height:1080px; z-index:1; pointer-events:none;
  background:
    repeating-linear-gradient(90deg,  rgba(180,0,255,0.07) 0px, rgba(180,0,255,0.06) 1px, transparent 1px, transparent 40px),
    repeating-linear-gradient(180deg, rgba(0,200,255,0.05) 0px, rgba(0,200,255,0.04) 1px, transparent 1px, transparent 40px),
    transparent;
  animation: hueshift 10s linear infinite;
}
#swCanvas { position:absolute; top:0; left:0; width:1920px; height:1080px; z-index:2; pointer-events:none; }

/* ── THE REEL: two video slots and a still, cross-faded ── */
#reel { position:absolute; inset:0; z-index:5; transition:opacity 1.2s ease, filter 1.2s ease; }
.rv { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .7s ease; }
.rv.on { opacity:1; }
@keyframes pushin { from{transform:scale(1)} to{transform:scale(1.08)} }
img.rv.on { animation:pushin 12s ease-out forwards; }
/* the left side darkens so the menu reads over any frame, the top right for
   the event name, the bottom right for the clock, the bottom for the bar */
#shade { position:absolute; inset:0; z-index:6; pointer-events:none; transition:opacity .6s;
  background:
    radial-gradient(ellipse 820px 300px at 100% 0%, rgba(3,0,10,.88) 0%, rgba(3,0,10,.55) 50%, transparent 100%),
    radial-gradient(ellipse 760px 420px at 100% 100%, rgba(3,0,10,.9) 0%, rgba(3,0,10,.6) 50%, transparent 100%),
    linear-gradient(90deg, rgba(3,0,10,.9) 0%, rgba(3,0,10,.7) 22%, rgba(3,0,10,.18) 40%, transparent 52%),
    linear-gradient(0deg, rgba(3,0,10,.85) 0%, transparent 22%),
    linear-gradient(180deg, rgba(3,0,10,.7) 0%, transparent 18%); }
#crt { position:absolute; inset:0; z-index:58; pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0,rgba(0,0,0,.14) 1px,transparent 1px,transparent 4px); }

/* the cut between two promos: a beat of horizontal tear, like a cartridge swap */
#cut { position:absolute; inset:0; z-index:20; pointer-events:none; opacity:0;
  background:
    repeating-linear-gradient(0deg, rgba(204,102,255,.0) 0 22px, rgba(204,102,255,.35) 22px 26px, rgba(0,229,255,.25) 26px 29px, rgba(204,102,255,0) 29px 61px),
    rgba(10,0,24,.55);
  mix-blend-mode:screen; }
#cut.go { animation:cut .55s steps(6) forwards; }
@keyframes cut {
  0%  {opacity:1; transform:translateX(-30px)}
  33% {opacity:.9; transform:translateX(24px)}
  66% {opacity:.6; transform:translateX(-12px)}
  100%{opacity:0; transform:none}
}

/* ── THE RIGHT ZONE: everything that is not the promo -- a break's board, the
   final minute, LIVE -- lives right of the menu, tilted toward it, the mirror of
   the menu's own tilt. The menu never leaves; this side is what changes. ── */
:root { --zl:740px; --zr:40px; }
.zone { position:absolute; left:var(--zl); right:var(--zr); top:0; bottom:0;
  transform: perspective(1500px) rotateY(-8deg); transform-origin:right center; }

/* ── STANDBY BREAKS (.sbf -- never .brk, which is the BODY's break state and
   would hide the whole page): the real standby board, in kiosk mode, so the call to
   action and the card are the same design here as everywhere else. The board is
   1920x1080; it is SCALED into the right zone, never reflowed, and loaded with
   clear=1 so it floats over the dimmed promo with no box of its own. ── */
/* no box means nothing to stay inside: scaled so the board's own content
   (max 1640 wide, centred in its 1920) fills the right zone, its empty margins
   hanging past it unseen -- 1306x734 at .68, centred on the zone's middle */
#sbw { position:absolute; left:657px; top:173px; width:1306px; height:734px; z-index:15;
  transform: perspective(1500px) rotateY(-8deg); transform-origin:right center;
  opacity:0; transition:opacity .6s ease; }
body.brk #sbw { opacity:1; }
.sbf { position:absolute; left:0; top:0; width:1920px; height:1080px; border:0;
  transform:scale(.68); transform-origin:0 0;
  opacity:0; pointer-events:none; transition:opacity .6s ease; background:transparent; }
.sbf.on { opacity:1; }

/* TOP BAR */
.top-bar { position:absolute; top:36px; left:50px; right:50px; height:110px;
  display:flex; align-items:center; z-index:40; transition:opacity .6s; }
/* LEFT: VGA ESPORTS -- the org, the same on every night. */
.tb-left { display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
  padding:0 50px 0 60px; flex-shrink:0;
  transform: perspective(650px) rotateY(14deg); transform-origin: left center; }
.logo-ubae { font-family:'Barlow Condensed',sans-serif; font-size:82px; font-weight:900; letter-spacing:.12em;
  background:linear-gradient(180deg,#d8b4fe 0%,#a78bfa 15%,#818cf8 30%,#6366f1 45%,#8b5cf6 60%,#a855f7 75%,#c084fc 90%,#d8b4fe 100%);
  background-size:100% 300%; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  animation:textslide 4s linear infinite, logopulse 2.5s ease-in-out infinite; }
.logo-s1 { font-size:14px; letter-spacing:.45em; align-self:flex-end; margin-bottom:6px;
  background:linear-gradient(90deg,#d8b4fe,#a78bfa,#818cf8,#6366f1,#8b5cf6,#a855f7,#c084fc,#d8b4fe);
  background-size:300% 100%; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  animation:textflow 3s linear infinite; }
/* RIGHT: the event */
.tb-right { display:flex; flex-direction:column; align-items:flex-end; justify-content:center;
  padding:0 60px 0 50px; flex-shrink:0; gap:4px;
  transform: perspective(650px) rotateY(-14deg); transform-origin: right center; }
.tb-event-main { font-family:'Barlow Condensed',sans-serif; font-size:52px; font-weight:900; letter-spacing:.25em;
  color:#fff; text-transform:uppercase; text-shadow:0 0 24px rgba(204,102,255,.55), 2px 2px 0 #000; }
.tb-event-sub { font-size:15px; letter-spacing:.38em; color:rgba(200,160,255,.75); text-shadow:1px 1px 0 #000; }

/* BOTTOM BAR */
.bottom-bar { position:absolute; bottom:0; left:0; right:0; height:46px;
  background:rgba(3,0,10,.9); border-top:2px solid rgba(155,77,255,.3);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 60px 0 90px; z-index:40; transition:opacity .6s; }
.sponsor { font-family:'Barlow Condensed',sans-serif; font-size:32px; font-weight:900; letter-spacing:.28em;
  background:linear-gradient(180deg,#d8b4fe 0%,#a78bfa 15%,#818cf8 30%,#6366f1 45%,#8b5cf6 60%,#a855f7 75%,#c084fc 90%,#d8b4fe 100%);
  background-size:100% 300%; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  animation:textslide 5s linear infinite, logopulse 3s ease-in-out infinite; }
.sponsor-pre { font-size:8px; letter-spacing:.4em; color:rgba(204,102,255,.75); margin-right:10px; text-shadow:0 0 10px rgba(155,48,255,.5); }
.b-links { font-family:'Share Tech Mono',monospace; font-size:11px; letter-spacing:.2em; color:rgba(155,77,255,.45); display:flex; gap:48px; }

/* ── THE MENU ── */
.menu { position:absolute; left:110px; bottom:120px; width:600px; z-index:30;
  transform: perspective(900px) rotateY(9deg); transform-origin:left center;
  transition:opacity .5s ease, transform .6s cubic-bezier(.6,0,.4,1); }
.menu-head { display:flex; align-items:center; gap:16px; margin-bottom:18px; }
.mh-tag { font-size:12px; letter-spacing:.35em; color:var(--hi); text-shadow:0 0 12px rgba(204,102,255,.7), 1px 1px 0 #000; }
.mh-line { flex:1; height:2px; background:linear-gradient(90deg, rgba(204,102,255,.7), transparent); }
#menuItems { position:relative; }
#menuHi { position:absolute; left:0; right:0; z-index:0; pointer-events:none;
  background:linear-gradient(90deg, rgba(155,48,255,.42) 0%, rgba(155,48,255,.14) 60%, transparent 100%);
  border-left:4px solid var(--hi); box-shadow:inset 0 0 26px rgba(155,48,255,.2), -6px 0 22px rgba(204,102,255,.45);
  transition:top .22s steps(4), height .22s steps(4); }
.mi { position:relative; z-index:1; display:flex; align-items:center; gap:16px; padding:10px 16px 12px 18px; }
.mi-cur { font-size:14px; color:var(--hi); width:22px; opacity:0; text-shadow:0 0 12px var(--hi); }
.mi.on .mi-cur { opacity:1; animation:arrowBounce .6s ease-in-out infinite; }
@keyframes arrowBounce { 0%,100%{transform:translateX(0)} 50%{transform:translateX(5px)} }
.mi-n { font-family:'Share Tech Mono',monospace; font-size:14px; color:rgba(204,102,255,.5); width:26px; }
.mi-txt { flex:1; min-width:0; }
.mi-label { font-family:'Barlow Condensed',sans-serif; font-size:36px; font-weight:900; letter-spacing:.14em;
  line-height:1; text-transform:uppercase; color:rgba(240,224,255,.42); text-shadow:2px 2px 0 #000;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mi.on .mi-label { color:#fff; text-shadow:0 0 22px rgba(204,102,255,.8), 0 0 44px rgba(155,48,255,.45), 2px 2px 0 #000; }
.mi-sub { font-family:'Share Tech Mono',monospace; font-size:14px; letter-spacing:.2em; margin-top:5px;
  color:rgba(200,160,255,.38); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:1px 1px 0 #000; }
.mi.on .mi-sub { color:rgba(230,200,255,.85); }
.mi-bar { position:absolute; left:18px; right:16px; bottom:2px; height:3px; background:rgba(155,77,255,.18); opacity:0; }
.mi.on .mi-bar { opacity:1; }
.mi-bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--hi),var(--pink)); box-shadow:0 0 10px var(--hi); }
.mi.start .mi-label { color:rgba(240,224,255,.62); }
.mi.start .mi-sub { color:rgba(255,255,255,.55); }
.mi.start.on .mi-label { color:#fff; }
.mi.start.on .mi-sub { color:#fff; }
.mi.select .mi-label { animation:selflash .12s steps(1) 5; }
@keyframes selflash { 0%{color:#fff} 50%{color:var(--pink)} }
.press-start { margin-top:26px; margin-left:18px; font-size:13px; letter-spacing:.5em;
  color:rgba(230,190,255,.85); animation:selblink 1.1s steps(1) infinite; text-shadow:0 0 12px rgba(204,102,255,.5), 1px 1px 0 #000; }

/* ── MAIN EVENT + CLOCK, bottom right ── */
.me { position:absolute; right:84px; bottom:96px; z-index:30; text-align:right;
  transform: perspective(900px) rotateY(-9deg); transform-origin:right center;
  transition:opacity .5s ease, transform .6s cubic-bezier(.6,0,.4,1); }
.me-tag { font-size:11px; letter-spacing:.4em; color:var(--hi); text-shadow:0 0 10px rgba(204,102,255,.7), 1px 1px 0 #000; margin-bottom:12px; }
.me-names { display:flex; align-items:baseline; justify-content:flex-end; gap:18px; }
.tabbr { font-family:'Barlow Condensed',sans-serif; font-size:56px; font-weight:900; font-style:italic;
  letter-spacing:-.01em; line-height:.95; text-transform:uppercase; white-space:nowrap;
  background:linear-gradient(180deg,#ffffff 0%,#e8c8ff 30%,#b565ff 70%,#8a2be2 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
  filter:drop-shadow(0 0 18px rgba(155,48,255,.7)) drop-shadow(2px 2px 0 #000); }
.tabbr.l { animation:lflicker 5s steps(1) infinite; }
.tabbr.r { animation:rflicker 5s steps(1) infinite 2.5s; }
.me-vs { font-family:'Barlow Condensed',sans-serif; font-size:30px; font-weight:900; font-style:italic; letter-spacing:.12em;
  color:var(--hi); text-shadow:0 0 18px var(--hi), 3px 0 0 var(--pink), -3px 0 0 rgba(0,229,255,.7); }
.me-clock { display:flex; align-items:baseline; justify-content:flex-end; gap:20px; margin-top:14px; }
.me-in { font-size:13px; letter-spacing:.35em; color:rgba(230,200,255,.8); text-shadow:1px 1px 0 #000; }
#cdTimer { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-style:italic;
  font-size:96px; line-height:.9; letter-spacing:.03em; color:#f3e6ff;
  text-shadow:0 0 26px rgba(155,48,255,.85), 3px 3px 0 #000; font-variant-numeric:tabular-nums; }

/* during a standby break the board is the screen: our chrome steps aside and
   the clock shrinks to a corner, because the card fills the whole frame */
/* Two worlds: the promos are the cinematics, everything else is the menu's
   world on the synthwave grid -- a paused promo frame behind the card was
   whatever frame the cut landed on, blurred into mud behind the text. */
body.brk #reel { opacity:0; }
body.brk .me { transform: perspective(900px) rotateY(-9deg) translateY(56px) scale(.62); transform-origin:right bottom; }
body.brk .me-tag, body.brk .me-names { opacity:0; }

/* ── FINAL MINUTE ── */
#final { z-index:35; pointer-events:none; opacity:0; transition:opacity .8s ease; }
body.final #final { opacity:1; }
body.final #reel { opacity:0; }
body.final .me { opacity:0; transform: perspective(900px) rotateY(-9deg) translateX(160px); }
.fn-head { position:absolute; top:150px; left:0; right:0; text-align:center; }
.fn-tag { font-size:16px; letter-spacing:.5em; color:var(--hi); text-shadow:0 0 14px rgba(204,102,255,.8), 2px 2px 0 #000; }
.fn-names { display:flex; justify-content:center; align-items:baseline; gap:34px; margin-top:16px; }
.fn-names .tabbr { font-size:84px; }
.fn-names .me-vs { font-size:46px; }
#ring { position:absolute; left:50%; top:585px; width:660px; height:660px; margin:-330px 0 0 -330px; }
#ring circle { fill:none; }
#ringTrack { stroke:rgba(155,77,255,.18); stroke-width:10; }
#ringArc { stroke:url(#ringGrad); stroke-width:10; stroke-linecap:round; filter:drop-shadow(0 0 14px rgba(204,102,255,.9)); }
#ringTicks { stroke:rgba(204,102,255,.35); stroke-width:2; stroke-dasharray:2 32.5; }
.fn-num { position:absolute; left:0; right:0; top:585px; transform:translateY(-50%); text-align:center;
  font-family:'Barlow Condensed',sans-serif; font-weight:900; font-style:italic; font-size:440px; line-height:.8;
  letter-spacing:-.02em; font-variant-numeric:tabular-nums; padding-right:.05em;
  background:linear-gradient(180deg,#ffffff 0%,#f0dcff 35%,#c084fc 70%,#7c3aed 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 40px rgba(155,48,255,.8)) drop-shadow(6px 6px 0 #000); }
.fn-num.hit { animation:numhit .38s cubic-bezier(.2,1.4,.4,1); }
@keyframes numhit { from{transform:translateY(-50%) scale(1.3); opacity:0; filter:blur(10px)} to{transform:translateY(-50%) scale(1); opacity:1} }
.fn-foot { position:absolute; left:0; right:0; top:950px; text-align:center;
  font-size:18px; letter-spacing:.55em; color:rgba(240,224,255,.85); text-shadow:0 0 14px rgba(204,102,255,.6), 2px 2px 0 #000; }

/* the last ten: red, and every number lands */
body.red .fn-num { background:linear-gradient(180deg,#ffffff 0%,#ffd6dc 30%,#ff4d6a 65%,#b0002a 100%);
  -webkit-background-clip:text; background-clip:text;
  filter:drop-shadow(0 0 50px rgba(255,34,68,.9)) drop-shadow(-8px 0 0 rgba(0,229,255,.55)) drop-shadow(8px 0 0 rgba(255,51,204,.6)); }
body.red .fn-num.hit { animation:numslam .42s cubic-bezier(.15,1.6,.35,1); }
@keyframes numslam { from{transform:translateY(-50%) scale(2.1); opacity:0} 60%{opacity:1} to{transform:translateY(-50%) scale(1)} }
body.red #ringArc { stroke:var(--red); filter:drop-shadow(0 0 20px rgba(255,34,68,1)); }
body.red .fn-tag { color:#ff6680; }
body.red .sc { animation:none; border-color:var(--red); box-shadow:0 0 16px var(--red); }
#flash { position:absolute; inset:0; z-index:70; pointer-events:none; background:#fff; opacity:0; }
#flash.go { animation:flash .32s ease-out; }
@keyframes flash { from{opacity:.55} to{opacity:0} }
#wave { position:absolute; left:50%; top:585px; width:660px; height:660px; margin:-330px 0 0 -330px; z-index:2;
  border-radius:50%; border:8px solid rgba(255,80,110,.9); opacity:0; pointer-events:none; }
#wave.go { animation:wave .6s ease-out; }
@keyframes wave { from{transform:scale(.7); opacity:.9} to{transform:scale(2.1); opacity:0} }
#stage.shake { animation:shake .34s linear; }
@keyframes shake {
  0%{transform:translate(0,0)} 15%{transform:translate(-14px,6px)} 30%{transform:translate(12px,-8px)}
  45%{transform:translate(-9px,-4px)} 60%{transform:translate(7px,5px)} 80%{transform:translate(-3px,2px)} 100%{transform:none}
}

/* ── LIVE ── */
#live { z-index:45; pointer-events:none; opacity:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; }
body.live #live { opacity:1; }
body.live #final { opacity:0; }
body.live #reel { opacity:0; }
.lv-pre { font-size:22px; letter-spacing:.6em; color:#fff; text-shadow:0 0 16px rgba(255,34,68,.8), 2px 2px 0 #000; }
.lv-word { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-style:italic; font-size:380px; line-height:.85;
  letter-spacing:.02em; margin:14px 0 10px; color:#fff;
  text-shadow:0 0 60px rgba(255,34,68,.9), -10px 0 0 rgba(0,229,255,.6), 10px 0 0 rgba(255,51,204,.6), 8px 8px 0 #000;
  animation:livepulse 1.6s ease-in-out infinite; }
body.live .lv-word { animation:liveslam .6s cubic-bezier(.15,1.6,.35,1), livepulse 1.6s ease-in-out .6s infinite; }
@keyframes liveslam { from{transform:scale(2.4); opacity:0} to{transform:scale(1); opacity:1} }
@keyframes livepulse { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.25)} }
.lv-dot { display:inline-block; width:22px; height:22px; border-radius:50%; background:var(--red); margin-right:18px;
  box-shadow:0 0 18px var(--red); animation:selblink 1s steps(1) infinite; vertical-align:middle; }
.lv-event { font-family:'Barlow Condensed',sans-serif; font-size:72px; font-weight:900; letter-spacing:.3em;
  text-transform:uppercase; color:#fff; text-shadow:0 0 24px rgba(204,102,255,.7), 3px 3px 0 #000; }

/* ── ACHIEVEMENT POP-UPS: INSIDE the menu, above MAIN MENU, so they sit on
   the menu's own 3D plane -- a strip with its own transform tilts around its
   own middle and reads flat beside it. Full menu width, like a selected row. ── */
#toasts { position:relative; height:104px; margin-bottom:46px; pointer-events:none; transition:opacity .5s; }
body.final #toasts, body.live #toasts { opacity:0; }
.tst { position:absolute; left:0; right:0; top:0; display:flex; align-items:center; gap:18px; padding:14px 40px 14px 16px;
  background:linear-gradient(90deg, rgba(10,0,26,.92) 0%, rgba(30,6,60,.8) 55%, rgba(30,6,60,.35) 85%, transparent 100%);
  border-left:4px solid var(--tc, var(--hi)); box-shadow:-6px 0 22px var(--tg, rgba(204,102,255,.5));
  animation:tstIn .5s cubic-bezier(.2,1.3,.4,1) both; }
.tst.out { animation:tstOut .45s ease-in forwards; }
@keyframes tstIn  { from{transform:translateX(-110%); opacity:0} to{transform:none; opacity:1} }
@keyframes tstOut { to{transform:translateX(-30px); opacity:0} }
.tst-ic { width:64px; height:64px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-size:34px; background:rgba(0,0,0,.35); border:2px solid var(--tc, var(--hi));
  box-shadow:inset 0 0 14px var(--tg, rgba(204,102,255,.5)); }
.tst-lab { font-size:11px; letter-spacing:.35em; color:var(--tc, var(--hi)); text-shadow:0 0 10px var(--tg, rgba(204,102,255,.6)), 1px 1px 0 #000; }
.tst-ttl { font-family:'Barlow Condensed',sans-serif; font-size:40px; font-weight:900; letter-spacing:.06em; line-height:1;
  text-transform:uppercase; color:#fff; margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:460px;
  text-shadow:0 0 18px var(--tg, rgba(204,102,255,.6)), 2px 2px 0 #000; }
.tst-sub { font-family:'Share Tech Mono',monospace; font-size:15px; letter-spacing:.18em; color:rgba(230,210,255,.8);
  margin-top:5px; text-shadow:1px 1px 0 #000; white-space:nowrap; }
.tst.prismatic .tst-ic { animation:hueshift 2.5s linear infinite; }

/* ── LOADING TIPS: one line under PRESS START, typed out like a load screen ── */
.tip { margin-top:16px; margin-left:18px; width:600px; min-height:20px; font-family:'Share Tech Mono',monospace; white-space:nowrap;
  font-size:15px; letter-spacing:.08em; color:rgba(230,210,255,.85); text-shadow:1px 1px 0 #000; }
.tip b { font-family:'Press Start 2P',monospace; font-weight:normal; font-size:11px; color:var(--hi); margin-right:12px;
  letter-spacing:.2em; text-shadow:0 0 10px rgba(204,102,255,.6); }
.tip i { font-style:normal; display:inline-block; width:10px; height:16px; margin-left:4px; vertical-align:-2px;
  background:var(--hi); animation:selblink .8s steps(1) infinite; }
</style>
</head>
<body>
<div id="stage">

<div class="sw-bg"></div>
<canvas id="swCanvas" width="1920" height="1080"></canvas>

<div id="reel">
  <video class="rv" id="rvA" playsinline preload="auto"></video>
  <video class="rv" id="rvB" playsinline preload="auto"></video>
  <img   class="rv" id="rvS" alt="">
</div>
<div id="shade"></div>
<div id="sbw">
  <iframe class="sbf" id="brkA" title="standby" allow="autoplay"></iframe>
  <iframe class="sbf" id="brkB" title="standby" allow="autoplay"></iframe>
</div>
<div id="cut"></div>

<div class="sc sc-tl"></div><div class="sc sc-tr"></div>
<div class="sc sc-bl"></div><div class="sc sc-br"></div>

<!-- TOP -->
<div class="top-bar">
  <div class="tb-left">
    <div class="logo-ubae">VGA</div>
    <div class="logo-s1">ESPORTS</div>
  </div>
  <div style="flex:1"></div>
  <div class="tb-right">
    <div class="tb-event-main" id="tbEventMain">FIGHT NIGHT</div>
    <div class="tb-event-sub"  id="tbEventSub">discord.gg/uba</div>
  </div>
</div>

<!-- MENU: one line per thing in the reel, the cursor on whatever is playing -->
<div class="menu" id="menu">
  <div id="toasts"></div>
  <div class="menu-head"><span class="mh-tag">MAIN MENU</span><span class="mh-line"></span></div>
  <div id="menuItems"><div id="menuHi"></div></div>
  <div class="press-start">PRESS START</div>
  <div class="tip" id="tip"></div>
</div>

<!-- MAIN EVENT + CLOCK -->
<div class="me" id="mePanel">
  <div class="me-tag" id="meTag">MAIN EVENT</div>
  <div class="me-names">
    <span class="tabbr l" id="cdBigL">TBA</span><span class="me-vs">VS</span><span class="tabbr r" id="cdBigR">TBA</span>
  </div>
  <div class="me-clock"><span class="me-in">STARTS IN</span><span id="cdTimer">--:--</span></div>
</div>

<!-- FINAL MINUTE -->
<div id="final" class="zone">
  <div class="fn-head">
    <div class="fn-tag" id="fnTag">MAIN EVENT</div>
    <div class="fn-names">
      <span class="tabbr l" id="fnL">TBA</span><span class="me-vs">VS</span><span class="tabbr r" id="fnR">TBA</span>
    </div>
  </div>
  <svg id="ring" viewBox="0 0 660 660">
    <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff33cc"/><stop offset=".5" stop-color="#cc66ff"/><stop offset="1" stop-color="#6366f1"/>
    </linearGradient></defs>
    <circle id="ringTicks" cx="330" cy="330" r="312"/>
    <circle id="ringTrack" cx="330" cy="330" r="290"/>
    <circle id="ringArc"   cx="330" cy="330" r="290" transform="rotate(-90 330 330)"/>
  </svg>
  <div class="fn-num" id="fnNum">60</div>
  <div class="fn-foot" id="fnFoot">FIGHT NIGHT · STARTING</div>
  <div id="wave"></div>
</div>

<!-- LIVE -->
<div id="live" class="zone">
  <div class="lv-pre"><span class="lv-dot"></span>WE ARE</div>
  <div class="lv-word">LIVE</div>
  <div class="lv-event" id="lvEvent">FIGHT NIGHT</div>
</div>

<!-- BOTTOM -->
<div class="bottom-bar">
  <div style="display:flex;align-items:baseline;gap:8px">
    <span class="sponsor-pre">POWERED BY</span>
    <!-- Filled from sponsors.js, the same list the tale of the tape reads. -->
    <span class="sponsor" id="sponsorSite">SPONSOR</span>
  </div>
  <div class="b-links">
    <span>ubaesports.com</span><span>discord.gg/uba</span><span>ubaesports.com</span>
  </div>
</div>

<div id="crt"></div>
</div>
<div id="flash"></div>

<script>
// ── CONFIG ──
const QS = new URLSearchParams(location.search)
const CFG = {
  // No target until the deck sends one. The old default was a date in March,
  // which meant every fresh load opened on 00:00 -- here that would be LIVE.
  target: QS.get('t') ? new Date(Date.now() + parseFloat(QS.get('t')) * 60000) : null,
  eventMain: 'FIGHT NIGHT',
  league: (QS.get('league') || 'uba').toLowerCase(),
}
const MUTE = QS.get('mute') === '1', SFX = QS.get('sfx') !== '0'
const FINAL_SECS = 60, BREAK_SECS = 14, STILL_SECS = 9
const el = id => document.getElementById(id)
const pad = n => String(n).padStart(2,'0')

// ── SOUND ── synthesised, so there is no file to forget to upload. OBS lets a
// browser source make sound without a click; a normal browser tab does not,
// and there every call here quietly does nothing.
let AC = null
function ac(){
  if(!SFX) return null
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)()
    if(AC.state === 'suspended') AC.resume()
    return AC.state === 'running' ? AC : null
  }catch(e){ return null }
}
function tone(freq, to, dur, gain, type){
  const a = ac(); if(!a) return
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain()
  o.type = type || 'sine'
  o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(to, t + dur)
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur)
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05)
}
const sfxTick  = () => tone(1500, 1400, .05, .06, 'square')
const sfxBoom  = () => { tone(120, 38, .55, .7); tone(900, 300, .06, .12, 'square') }
const sfxLive  = () => { tone(150, 30, 1.6, .9); tone(70, 28, 1.8, .6, 'triangle'); tone(1200, 200, .25, .15, 'sawtooth') }
const sfxSelect= () => { tone(660, 660, .07, .08, 'square'); setTimeout(() => tone(990, 990, .1, .08, 'square'), 80) }

// ── THE REEL ─────────────────────────────────────────────────────────────
// promos.json is the running order; every second promo is followed by a
// standby break. A file that will not load is dropped for the rest of the
// session rather than retried every lap.
let promos = [], reel = [], at = -1, itemTimer = null, itemStart = 0, itemLen = 0, liveVid = null, gen = 0
const vids = [el('rvA'), el('rvB')]
const LEAGUE_BREAKS = {
  uba:  [{ view:'card',   title:"TONIGHT'S CARD", sub:'THE FULL LINEUP' }, { view:'cta', title:'JOIN UBA', sub:'DISCORD.GG/UBA' }],
  gfl:  [{ view:'card',   title:"TONIGHT'S CARD", sub:'THE FULL LINEUP' }, { view:'cta', title:'JOIN UBA', sub:'DISCORD.GG/UBA' }],
  ubae: [{ view:'teamvs', title:'THE MATCHUP',    sub:'TEAM VS TEAM' },    { view:'cta', title:'JOIN UBA', sub:'DISCORD.GG/UBA' }],
}

async function loadPromos(){
  try{
    const r = await fetch('assets/promos/promos.json', { cache:'no-store' })
    if(r.ok) promos = (await r.json()).map(p =>
      p.file  ? { kind:'video', src:'assets/promos/' + p.file, title:p.title || '', sub:p.sub || '', secs:p.secs || 0 } :
      p.image ? { kind:'still', src:'assets/' + p.image,      title:p.title || '', sub:p.sub || '', secs:p.secs || STILL_SECS } : null
    ).filter(Boolean)
  }catch(e){}
  // No promos is a still a screen: the posters the standby already shows.
  if(!promos.length){
    try{
      const r = await fetch('assets/posters.json', { cache:'no-store' })
      if(r.ok) promos = (await r.json()).map((f, i) =>
        ({ kind:'still', src:'assets/' + f, title:'THE POSTER', sub:'NO. ' + pad(i + 1), secs:STILL_SECS }))
    }catch(e){}
  }
}

function buildReel(){
  const breaks = LEAGUE_BREAKS[CFG.league] || LEAGUE_BREAKS.uba
  reel = []; let b = 0
  promos.forEach((p, i) => {
    reel.push(p)
    if(i % 2 === 1) reel.push({ kind:'break', ...breaks[b++ % breaks.length] })
  })
  if(!reel.length || reel[reel.length - 1].kind !== 'break') reel.push({ kind:'break', ...breaks[b % breaks.length] })
  // both boards are loaded up front so a break never opens on an empty frame
  el('brkA').src = 'standby.html?kiosk=1&clear=1&league=' + CFG.league + '&views=' + breaks[0].view
  el('brkB').src = 'standby.html?kiosk=1&clear=1&league=' + CFG.league + '&views=' + breaks[1].view
  drawMenu()
}

function drawMenu(){
  const box = el('menuItems')
  box.querySelectorAll('.mi').forEach(n => n.remove())
  const row = (cls, n, label, sub) => {
    const d = document.createElement('div'); d.className = 'mi ' + cls
    d.innerHTML = `<div class="mi-cur">»</div><div class="mi-n">${n}</div>
      <div class="mi-txt"><div class="mi-label"></div><div class="mi-sub"></div></div><div class="mi-bar"><i></i></div>`
    d.querySelector('.mi-label').textContent = label
    d.querySelector('.mi-sub').textContent = sub
    box.appendChild(d); return d
  }
  row('start', '▶', 'START MATCH', '').id = 'miStart'
  reel.forEach((r, i) => { r.node = row('', pad(i + 1), r.title, r.sub) })
  clockText()
}

function point(node){
  document.querySelectorAll('.mi.on').forEach(n => n.classList.remove('on'))
  if(!node) return
  node.classList.add('on')
  const hi = el('menuHi')
  hi.style.top = node.offsetTop + 'px'; hi.style.height = node.offsetHeight + 'px'
}

function cut(){ const c = el('cut'); c.classList.remove('go'); void c.offsetWidth; c.classList.add('go') }

function stopItem(){
  clearTimeout(itemTimer); itemTimer = null; gen++
  vids.forEach(v => { v.onended = v.onerror = v.onplaying = null })
}

function next(){
  if(document.body.classList.contains('final') || document.body.classList.contains('live')) return
  stopItem()
  const live = reel.filter(r => !r.dead)
  if(!live.length) return
  do { at = (at + 1) % reel.length } while(reel[at].dead)
  play(reel[at])
}

function play(item){
  point(item.node); cut()
  itemStart = performance.now()
  if(item.kind === 'break'){
    const breaks = LEAGUE_BREAKS[CFG.league] || LEAGUE_BREAKS.uba
    const frame = item.view === breaks[0].view ? el('brkA') : el('brkB')
    document.body.classList.add('brk')
    // the promo underneath freezes, dimmed: its sound would talk over the board
    if(liveVid) liveVid.pause()
    el('brkA').classList.toggle('on', frame.id === 'brkA'); el('brkB').classList.toggle('on', frame.id === 'brkB')
    itemLen = BREAK_SECS * 1000
    itemTimer = setTimeout(next, itemLen)
    return
  }
  document.body.classList.remove('brk')
  el('brkA').classList.remove('on'); el('brkB').classList.remove('on')

  if(item.kind === 'still'){
    const s = el('rvS')
    s.onerror = () => { item.dead = true; next() }
    s.src = item.src
    s.classList.remove('on'); void s.offsetWidth; s.classList.add('on')
    vids.forEach(v => { v.classList.remove('on'); setTimeout(() => v.pause(), 700) })
    liveVid = null
    itemLen = item.secs * 1000
    itemTimer = setTimeout(next, itemLen)
    return
  }

  // a video goes into whichever slot is NOT on screen, and only fades up once
  // it is actually playing -- so a cut never shows a black frame
  const v = vids[0] === liveVid ? vids[1] : vids[0], old = liveVid
  // Every callback below checks it still belongs to THIS play. A late failure
  // from the promo before would otherwise skip the one now on screen.
  const my = ++gen, mine = f => (...a) => { if(my === gen) f(...a) }
  v.src = item.src; v.muted = MUTE; v.volume = 1; v.currentTime = 0
  itemLen = 0
  // Only a file that cannot be read is dropped for good. A play that is merely
  // refused (a background tab) skips this lap and is tried again next lap.
  v.onerror = mine(() => { item.dead = true; next() })
  const skip = mine(next)
  v.onended = skip
  const go = v.play()
  if(go && go.catch) go.catch(mine(() => {
    // a browser tab refuses sound without a click; OBS does not. Muted beats nothing.
    v.muted = true; v.play().catch(skip)
  }))
  itemTimer = setTimeout(mine(() => { if(v.paused || v.readyState < 2) next() }), 10000)
  v.onplaying = mine(() => {
    clearTimeout(itemTimer); itemTimer = null
    if(item.secs) itemTimer = setTimeout(skip, item.secs * 1000)
    v.classList.add('on'); el('rvS').classList.remove('on')
    if(old && old !== v){ old.classList.remove('on'); setTimeout(() => { if(old !== liveVid) old.pause() }, 700) }
    liveVid = v; v.onplaying = null
  })
}

// the playing item's progress bar
function progress(){
  const item = reel[at], b = document.body
  // in the last minute the cursor is on START MATCH, and its bar is the minute
  if(b.classList.contains('final') || b.classList.contains('live')){
    const ms = remaining(), st = el('miStart')
    if(st && ms !== null) st.querySelector('.mi-bar i').style.width =
      Math.min(100, Math.max(0, 1 - ms / (FINAL_SECS * 1000)) * 100) + '%'
  }else if(item && item.node){
    let f = 0
    if(item.kind === 'video' && liveVid && liveVid.duration)
      f = liveVid.currentTime / (item.secs ? Math.min(item.secs, liveVid.duration) : liveVid.duration)
    else if(itemLen) f = (performance.now() - itemStart) / itemLen
    item.node.querySelector('.mi-bar i').style.width = Math.min(100, f * 100) + '%'
  }
  ring()
  requestAnimationFrame(progress)
}

// ── THE CLOCK ────────────────────────────────────────────────────────────
let lastSec = null
function remaining(){ return CFG.target ? CFG.target - Date.now() : null }
function fmt(ms){
  const tot = Math.ceil(ms / 1000)
  const h = Math.floor(tot / 3600), m = Math.floor((tot % 3600) / 60), s = tot % 60
  return (h > 0 ? h + ':' + pad(m) : pad(m)) + ':' + pad(s)
}
function clockText(){
  const ms = remaining()
  const txt = ms === null ? '--:--' : fmt(Math.max(0, ms))
  el('cdTimer').textContent = txt
  const st = el('miStart')
  if(st) st.querySelector('.mi-sub').textContent =
    ms === null ? 'WAITING FOR THE BELL' : ms <= 0 ? 'LIVE NOW' : 'IN ' + txt
}

function ring(){
  const ms = remaining(), arc = el('ringArc'), C = 2 * Math.PI * 290
  if(ms === null) return
  const f = Math.max(0, Math.min(1, ms / (FINAL_SECS * 1000)))
  arc.style.strokeDasharray = C
  arc.style.strokeDashoffset = C * (1 - f)
}

function hit(){
  const n = el('fnNum'); n.classList.remove('hit'); void n.offsetWidth; n.classList.add('hit')
}
function slam(){
  const s = el('stage'), f = el('flash'), w = el('wave')
  ;[s, f, w].forEach(x => x.classList.remove(x === s ? 'shake' : 'go'))
  void s.offsetWidth
  s.classList.add('shake'); f.classList.add('go'); w.classList.add('go')
}

// The takeover lands 650ms after START MATCH is selected. A reset from the
// deck inside that gap must cancel it, or the screen goes back to the reel and
// then flips into the final minute anyway with ten minutes on the clock.
let finalPending = false
function enterFinal(){
  const b = document.body
  if(b.classList.contains('final') || finalPending) return
  finalPending = true
  stopItem()
  // the menu SELECTS start match first -- the one beat that sells the menu
  const st = el('miStart'); point(st); st.classList.add('select'); sfxSelect()
  setTimeout(() => st.classList.remove('select'), 700)
  setTimeout(() => {
    if(!finalPending) return
    finalPending = false
    b.classList.remove('brk'); el('brkA').classList.remove('on'); el('brkB').classList.remove('on')
    b.classList.add('final')
    // the promo fades out under the grid with its sound, then stops
    const v = liveVid
    if(v){ const step = setInterval(() => { v.volume = Math.max(0, v.volume - .05)
      if(v.volume <= 0){ clearInterval(step); v.pause() } }, 120) }
  }, 650)
}
function leaveFinal(){
  const b = document.body
  if(!b.classList.contains('final') && !b.classList.contains('live') && !finalPending) return
  finalPending = false
  b.classList.remove('final', 'red', 'live')
  if(liveVid) liveVid.volume = 1
  next()
}

function tick(){
  clockText()
  const ms = remaining()
  milestone(ms)
  if(ms === null || ms > FINAL_SECS * 1000){ lastSec = null; leaveFinal(); return }
  const sec = Math.max(0, Math.ceil(ms / 1000))
  if(sec === lastSec) return
  lastSec = sec
  const b = document.body
  if(sec === 0){
    if(!b.classList.contains('live')){
      enterFinal(); b.classList.remove('red'); b.classList.add('live'); slam(); sfxLive()
      if(liveVid) liveVid.volume = 0
    }
    return
  }
  b.classList.remove('live')
  enterFinal()
  el('fnNum').textContent = sec
  b.classList.toggle('red', sec <= 10)
  hit()
  if(sec <= 10){ slam(); sfxBoom() } else sfxTick()
}
setInterval(tick, 100)

// ── ACHIEVEMENT POP-UPS ─────────────────────────────────────────────────
// One at a time, newest first. Fed by the feed poll at the bottom of the file
// (bets, big pulls, new fighters) and by the clock's own milestones. When the
// queue runs dry the screen replays something from the last few, so a quiet
// pre-show is never a dead one -- but never the same one twice in a row.
const toastQ = [], toastSeen = new Set(), toastPast = []
let toastBusy = false, toastLast = null, toastIdle = 0
const RARITY = {
  mystic:     { lab:'MYSTIC PULL',     c:'#c084fc', g:'rgba(192,132,252,.6)', ic:'🔮' },
  legendary:  { lab:'LEGENDARY PULL',  c:'#ffcc33', g:'rgba(255,204,51,.6)',  ic:'👑' },
  one_of_one: { lab:'1 OF 1 PULLED',   c:'#ff3355', g:'rgba(255,51,85,.6)',   ic:'💎' },
  prismatic:  { lab:'PRISMATIC PULL',  c:'#7df9ff', g:'rgba(125,249,255,.6)', ic:'🌈' },
}
// a raw feed row -> what the strip says. Every word typed by a member goes in
// through textContent, never markup.
function toastOf(r){
  if(r.kind === 'bet') return { ic:'🎲', lab:'NEW BET', ttl:r.pick + ' BACKED',
    sub:Number(r.amount).toLocaleString('en-US') + ' VC ON THE LINE', c:'#ff33cc', g:'rgba(255,51,204,.55)' }
  if(r.kind === 'pull'){ const k = RARITY[r.rarity] || RARITY.mystic
    return { ic:k.ic, lab:k.lab, ttl:r.name, sub:(r.set_code || '') + ' · OPENED IN DISCORD', c:k.c, g:k.g, cls:r.rarity } }
  if(r.kind === 'signup') return { ic:'🥊', lab:'NEW CHALLENGER', ttl:r.name,
    sub:'JOINED THE LEAGUE', c:'#00e5ff', g:'rgba(0,229,255,.5)' }
  return r   // already a strip (the clock's milestones)
}
function pushToast(r, front){
  if(r.key){ if(toastSeen.has(r.key)) return; toastSeen.add(r.key) }
  const t = toastOf(r); t.key = r.key || null
  front ? toastQ.unshift(t) : toastQ.push(t)
}
function showToast(t){
  const box = el('toasts'), d = document.createElement('div')
  d.className = 'tst ' + (t.cls || '')
  d.style.setProperty('--tc', t.c); d.style.setProperty('--tg', t.g)
  d.innerHTML = '<div class="tst-ic"></div><div><div class="tst-lab"></div><div class="tst-ttl"></div><div class="tst-sub"></div></div>'
  d.querySelector('.tst-ic').textContent = t.ic
  d.querySelector('.tst-lab').textContent = t.lab
  d.querySelector('.tst-ttl').textContent = t.ttl
  d.querySelector('.tst-sub').textContent = t.sub
  box.appendChild(d); toastBusy = true; toastLast = t
  if(t.key){ toastPast.unshift(t); toastPast.length = Math.min(toastPast.length, 12) }
  setTimeout(() => d.classList.add('out'), 5200)
  setTimeout(() => { d.remove(); toastBusy = false }, 5700)
}
setInterval(() => {
  const b = document.body
  if(toastBusy || b.classList.contains('final') || b.classList.contains('live')) return
  if(toastQ.length){ toastIdle = 0; showToast(toastQ.shift()); return }
  // dry: after ~40s of nothing, replay one of the recent ones
  if(++toastIdle >= 5 && toastPast.length > 1){
    toastIdle = 0
    const pick = toastPast.filter(t => t !== toastLast)
    showToast(pick[Math.floor(Math.random() * pick.length)])
  }
}, 8000)

// the clock's own milestones ride the same strip
const MILESTONES = { 600:'10 MINUTES TO THE BELL', 300:'5 MINUTES TO THE BELL', 120:'2 MINUTES · GET YOUR BETS IN' }
let milestoneAt = null
function milestone(ms){
  if(ms === null) return
  const sec = Math.ceil(ms / 1000)
  if(MILESTONES[sec] && milestoneAt !== sec){
    milestoneAt = sec
    toastQ.unshift({ ic:'⏱', lab:'COUNTDOWN', ttl:MILESTONES[sec], sub:CFG.eventMain, c:'#ffe066', g:'rgba(255,224,102,.55)' })
  }
}

// ── LOADING TIPS ─────────────────────────────────────────────────────────
// Typed out one character at a time, like a game's load screen. Every command
// here is a real one in bot/src/commands -- check before adding a line.
const TIPS = [   // one line each: 52 characters is what fits under the menu
  "Bet on tonight's fights in Discord before the bell.",
  '/rip a pack. Big pulls show up right here.',
  "/register to fight. You'll show up here too.",
  '/my-cards to see every card you own.',
  'KO, FOTN and POTN all pay a bonus.',
  '/callout any fighter on the roster.',
  'Every record lives at ubaesports.com.',
  '/fight-history for any fighter, fight by fight.',
]
let tipAt = Math.floor(Math.random() * TIPS.length)
function nextTip(){
  const box = el('tip'), text = TIPS[tipAt++ % TIPS.length]
  box.innerHTML = '<b>TIP</b><span></span><i></i>'
  const span = box.querySelector('span'); let n = 0
  const type = setInterval(() => { span.textContent = text.slice(0, ++n); if(n >= text.length) clearInterval(type) }, 28)
}
nextTip(); setInterval(nextTip, 9000)

// ── NAMES ── both corners share one size: whatever fits the longer name.
function fitPair(L, R, MAX, MIN, maxW){
  const sizeFor = e => { let fs = MAX; e.style.fontSize = fs + 'px'
    while(e.scrollWidth > maxW && fs > MIN){ fs -= 2; e.style.fontSize = fs + 'px' } return fs }
  const fs = Math.min(sizeFor(L), sizeFor(R))
  L.style.fontSize = fs + 'px'; R.style.fontSize = fs + 'px'
}
function fitAll(){
  fitPair(el('cdBigL'), el('cdBigR'), 56, 24, 330)
  fitPair(el('fnL'), el('fnR'), 84, 36, 440)
}
function setNames(a, b){
  if(a){ el('cdBigL').textContent = a; el('fnL').textContent = a }
  if(b){ el('cdBigR').textContent = b; el('fnR').textContent = b }
  fitAll()
}
function setEvent(name){
  CFG.eventMain = name
  el('tbEventMain').textContent = name
  el('lvEvent').textContent = name
  el('fnFoot').textContent = name + ' · STARTING'
}
function setLeague(lg){
  lg = (lg || 'uba').toLowerCase()
  if(!LEAGUE_BREAKS[lg]) lg = 'uba'
  const tag = lg === 'ubae' ? 'THE MATCH · BEST OF 5' : 'MAIN EVENT'
  el('meTag').textContent = tag; el('fnTag').textContent = tag
  if(lg === CFG.league) return
  CFG.league = lg
  // a different league is a different pair of standby boards; before the reel
  // exists there is nothing to rebuild, and the first build reads CFG.league
  if(reel.length){ at = -1; buildReel(); next() }
}
// Measure in the font you draw in: the condensed face loads with display=swap,
// and a fit against the fallback holds a size several steps too small.
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll)

const startLeague = CFG.league; CFG.league = null; setLeague(startLeague)
loadPromos().then(() => { buildReel(); progress(); next() })
</script>

<script>
// ── SYNTHWAVE GRID ── the backdrop under the reel, and the whole stage for
// the final minute. It speeds up for the last ten seconds.
(function(){
  const cv = document.getElementById('swCanvas'); if(!cv) return
  const cx = cv.getContext('2d')
  const W = 1920, H = 1080, vp = {x: W/2, y: H*0.42}
  let T = 0
  function draw(){
    cx.clearRect(0,0,W,H)
    const red = document.body.classList.contains('red')
    const bgFull = cx.createLinearGradient(0,0,0,H)
    bgFull.addColorStop(0,   'rgba(6,0,18,0.0)')
    bgFull.addColorStop(0.3, 'rgba(10,0,28,0.25)')
    bgFull.addColorStop(0.65,'rgba(16,0,40,0.55)')
    bgFull.addColorStop(1,   'rgba(4,0,14,0.88)')
    cx.fillStyle = bgFull; cx.fillRect(0,0,W,H)
    for(let i=-28;i<=28;i++){
      const hue = red ? 350 : (T*1.2 + i*13 + 270) % 360
      const a = 0.13 + 0.10*Math.abs(Math.sin(T*0.02 + i*0.18))
      cx.strokeStyle = `hsla(${hue},100%,65%,${a})`; cx.lineWidth = 1
      cx.beginPath(); cx.moveTo(W/2 + i*78, H); cx.lineTo(vp.x, vp.y); cx.stroke()
    }
    const rows = 18, scroll = (T*0.5) % 1
    for(let j=1; j<=rows; j++){
      const t = Math.pow((j - 1 + scroll) / rows, 1.8)
      if(t <= 0 || t > 1) continue
      const y = vp.y + (H - vp.y) * t
      const hue = red ? 345 : (T*1.5 + j*20 + 290) % 360
      cx.strokeStyle = `hsla(${hue},100%,68%,${0.08 + t*0.20})`
      cx.lineWidth = 0.5 + t*2
      cx.beginPath(); cx.moveTo(vp.x - t*W*0.92, y); cx.lineTo(vp.x + t*W*0.92, y); cx.stroke()
    }
    const hHue = red ? 350 : (T*0.3+290)%360
    const hg = cx.createRadialGradient(W/2,vp.y,0, W/2,vp.y,700)
    hg.addColorStop(0,   `hsla(${hHue},100%,72%,${red ? 0.14 : 0.07})`)
    hg.addColorStop(0.3, `hsla(${(hHue+30)%360},100%,60%,0.03)`)
    hg.addColorStop(1,   'transparent')
    cx.fillStyle = hg; cx.fillRect(0, vp.y-300, W, 600)
    T += red ? 1.6 : 0.5
    requestAnimationFrame(draw)
  }
  draw()
})()
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  const _sb = supabase.createClient('https://emzlivoykbhhjcugupit.supabase.co',
    'sb_publishable_pqhH974E1q9YsFnrVH1UJQ_X3V-rRLF')
  // the deck's league mark: UBAE, UBA, GFL -- and a contender night (MCS, CCS,
  // HPCS) is a GFL event with a tag, so it gets GFL's board
  const leagueFrom = m => { m = String(m || '').toUpperCase()
    return m === 'UBAE' ? 'ubae' : m === 'UBA' ? 'uba' : m ? 'gfl' : null }
  // ── THE FEED ── bets on the open and locked pools, and activity_public's
  // big pulls and new fighters. The first read only fills the strip's backlog
  // (oldest at the back); anything new after that jumps the queue.
  let primed = false
  async function feed(){
    const [bets, act] = await Promise.all([
      _sb.from('bet_feed_public').select('match_id,pick,amount,placed_at').order('placed_at',{ascending:false}).limit(10),
      _sb.from('activity_public').select('*').order('at',{ascending:false}).limit(12),
    ])
    const rows = []
    ;(bets.data || []).forEach(b => rows.push({ kind:'bet', at:b.placed_at, pick:b.pick, amount:b.amount,
      key:'b' + b.match_id + b.placed_at + b.pick }))
    ;(act.data || []).forEach(a => rows.push({ ...a, key:a.kind[0] + a.at + a.name }))
    rows.sort((x, y) => new Date(y.at) - new Date(x.at))
    // everything in the first read counts as seen, or the rows past the first
    // eight would come back on the next poll dressed up as new
    if(!primed){ rows.forEach((r, i) => i < 8 ? pushToast(r, false) : toastSeen.add(r.key)); primed = true }
    else rows.reverse().forEach(r => pushToast(r, true))
  }
  feed(); setInterval(feed, 20000)

  // ── SURVIVE A RELOAD ── the deck only sends on a press, so an OBS source
  // that reloads (a crash, a scene-collection switch, a refresh) used to come
  // back as --:-- and TBA until somebody pressed Start again. The last push is
  // kept in this source's own storage and replayed on load -- the clock only if
  // it is still in the future, so a reload after the show never opens on LIVE.
  const KEY = 'vga-countdown-last'
  function remember(d){
    try{
      const last = JSON.parse(localStorage.getItem(KEY) || '{}')
      localStorage.setItem(KEY, JSON.stringify({ ...last, ...d }))
    }catch(e){}
  }
  function apply(d){
    if(d.a||d.b) setNames(d.a, d.b)
    if(d.eventMain) setEvent(d.eventMain)
    if(d.eventSub) document.getElementById('tbEventSub').textContent=d.eventSub
    const lg = leagueFrom(d.league); if(lg) setLeague(lg)
  }
  try{
    const last = JSON.parse(localStorage.getItem(KEY) || 'null')
    if(last){
      apply(last)
      // ?t= on the URL is an explicit clock and wins over a remembered one
      if(last.target && !QS.get('t') && new Date(last.target) > Date.now()){ CFG.target = new Date(last.target); tick() }
    }
  }catch(e){}

  // one deck push. On window so a test (or the console) can play a push
  // exactly as the deck sends it, without broadcasting to the live channel.
  function onCountdown(d){
    remember(d)
    apply(d)
    if(d.target){ CFG.target=new Date(d.target); tick() }
  }
  window.onCountdown = onCountdown

  _sb.channel('vga-overlay').on('broadcast',{event:'cmd'},({payload:c})=>{
    if(c.type==='sponsor'){
      if(pinSponsor(c.key))
        document.getElementById('sponsorSite').textContent = sponsorSite(activeSponsor())
      return
    }
    if(c.type==='countdown') onCountdown(c.d||{})
  }).subscribe()
})()
</script>
