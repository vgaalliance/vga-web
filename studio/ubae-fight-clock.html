<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,900;1,900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1080px;overflow:hidden;background:transparent;position:relative;}

.hud-root{
  position:absolute;bottom:24px;left:48px;
  display:flex;flex-direction:column;align-items:flex-start;
  filter:drop-shadow(0 8px 32px rgba(0,0,0,.85));
}

/* ── SHOW / HIDE (broadcast lower-third move) ──
   The main bar is the anchor. The BO5 strip and the round tab are stacked
   BEHIND it, so on the way out they retract into it and only then does the
   bar itself slide off to the left. Reverse on the way in. */
.main-row{position:relative;z-index:3;}
.bo5-strip,.round-float{position:relative;z-index:1;}
.hud-root .main-row,
.hud-root .bo5-strip,
.hud-root .round-float{
  transition:transform .5s cubic-bezier(.16,1,.3,1),opacity .38s ease;
}
/* strip tucks DOWN into the bar, round tab tucks UP into it */
.hud-root.off .bo5-strip{transform:translateY(33px);opacity:0;transition-delay:0s;}
.hud-root.off .round-float{transform:translateY(-36px);opacity:0;transition-delay:0s;}
.hud-root.off .main-row{transform:translateX(-130%);opacity:0;transition-delay:.22s;}
/* coming back: bar first, then the two wings unfold out of it */
.hud-root .main-row{transition-delay:0s;}
.hud-root .bo5-strip{transition-delay:.26s;}
.hud-root .round-float{transition-delay:.32s;}

/* BO5 STRIP */
.bo5-strip{
  height:30px;
  margin-left:36px;
  margin-bottom:3px;
  background:rgba(4,0,16,.58);
  border:1px solid rgba(168,85,247,.38);
  display:flex;align-items:center;gap:18px;padding:0 16px;
  position:relative;
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%);
  backdrop-filter:blur(4px);
}
.bo5-strip::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(216,180,254,.7),transparent);}
.team-label{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:rgba(220,200,255,1);letter-spacing:.2em;min-width:90px;white-space:nowrap;text-transform:uppercase;}
.bo5-strip .team-label:last-of-type{text-align:right;}
.pips{display:flex;gap:4px;align-items:center;}
.pip{width:12px;height:8px;clip-path:polygon(0 100%,50% 0%,100% 100%);background:rgba(155,48,255,.35);}
.pip.on{background:#dd88ff;filter:drop-shadow(0 0 5px rgba(168,85,247,1));}
.bo5-mid{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.25em;color:rgba(200,160,255,.8);}

/* MAIN ROW */
.main-row{display:flex;align-items:center;gap:0;}

/* EMBLEM */
.emblem{
  width:52px;height:52px;border-radius:50%;
  flex-shrink:0;
  position:relative;z-index:10;
  margin-right:-26px;
  background:rgb(8,2,22);
  border:1.5px solid rgba(200,160,255,.7);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
#flowerCanvas{
  width:52px;height:52px;
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:2;
}

/* UBAE BLOCK */
.ubae-block{
  padding:0 14px 0 32px;
  display:flex;flex-direction:column;justify-content:center;
  height:52px;flex-shrink:0;
  background:rgba(4,0,16,.52);
  border-top:1px solid rgba(168,85,247,.45);
  border-bottom:1px solid rgba(168,85,247,.45);
  position:relative;overflow:hidden;
}
.ubae-block::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(216,180,254,.6),transparent);}
@keyframes holoA{0%{transform:translateX(-200%)}100%{transform:translateX(400%)}}
.ubae-holo{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.ubae-holo::after{content:'';position:absolute;top:0;bottom:0;width:60%;background:linear-gradient(90deg,transparent,rgba(216,180,254,.22),rgba(168,85,247,.3),transparent);animation:holoA 3.2s ease-in-out infinite;}
.ubae-text{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;letter-spacing:.1em;color:#fff;line-height:1;position:relative;z-index:2;}
@keyframes ubaGlow{0%,100%{text-shadow:0 0 10px rgba(216,180,254,.6),0 0 20px rgba(155,48,255,.3);}50%{text-shadow:0 0 18px rgba(216,180,254,.95),0 0 36px rgba(155,48,255,.55);}}
.ubae-text{animation:ubaGlow 3s ease-in-out infinite;}
.ubae-sub{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:.35em;color:rgba(216,180,254,1);position:relative;z-index:2;margin-top:3px;text-shadow:0 0 10px rgba(216,180,254,.9),0 0 20px rgba(155,48,255,.6);text-transform:uppercase;}

/* ── TRUNK / ODDS REVEAL ──────────────────────────────────────────────────
   The UBA clock's mechanism, adapted. Two slim colour slivers flank the VS
   block; a reveal EXPANDS the sliver itself into a labelled colour panel,
   holds, and collapses back.
   The difference is which way it grows. UBA is centred, so it opens both ways
   from the middle and the bar has to be widened to make room. This bar is
   anchored at left:48px and sized by its contents, so expanding a slit pushes
   everything to its right outward on its own -- no width juggling, and the
   left edge never moves, which is the whole reason the bar sits in a corner. */
.uslit{width:6px;flex-shrink:0;align-self:stretch;position:relative;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:#e8312a;z-index:7;
  border-top:1px solid rgba(255,255,255,.22);
  transition:width .5s cubic-bezier(.16,.8,.3,1);}
.uslit.rightside{background:#2e6fe8;}
.uslit::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 40%,rgba(0,0,0,.28));}
/* Sized to the LONGEST label plus breathing room, not copied from the UBA bar.
   That bar is centred and 920px wide, so 196px panels sit in proportion; this
   one is left-anchored and much shorter, and the same panels made it run on.
   Widest trunk label is COLOURS at ~92px, widest odds label is FAVOURITE at
   ~71px -- so 124 and 100 leave ~16px each side and nothing is tight. */
.uslit.expand{width:124px;}
/* odds open narrower and in neutral violet -- a trunk reveal is a statement,
   odds are information. Same reasoning as the UBA bar. */
.uslit.expand.odds{width:100px;}
.uslit.odds .uslit-eyebrow{color:rgba(216,180,254,.9);}
.uslit.odds .uslit-value{font-size:24px;}
.uslit-label{opacity:0;transform:translateY(6px);
  transition:opacity .3s ease,transform .3s cubic-bezier(.16,.8,.3,1);
  white-space:nowrap;position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1;}
.uslit.expand .uslit-label{opacity:1;transform:none;transition-delay:.26s;}
.uslit-eyebrow{font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;}
.uslit-value{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;
  letter-spacing:.08em;text-transform:uppercase;text-shadow:0 1px 5px rgba(0,0,0,.65);}

/* ── FOCUS MODE — the branding gets out of the way for a reveal ────────────
   When a colour or odds panel opens, the emblem and the UBAe block retract to
   the left and the bar becomes just the matchup plus the panels. Two reasons:
   the reveal is the thing being watched and the branding is not, and the width
   the panels add is almost exactly the width the branding gives back -- so the
   bar's right edge barely moves instead of marching across the frame.
     emblem 52 + block ~166 = 218 out, two panels at 124 = 236 in.
   overflow:hidden is already on .ubae-block, so its text clips rather than
   squashing as it closes. */
.emblem,.ubae-block{
  transition:width .52s cubic-bezier(.16,.8,.3,1),
             padding .52s cubic-bezier(.16,.8,.3,1),
             margin .52s cubic-bezier(.16,.8,.3,1),
             opacity .3s ease .12s;}
.main-row.focus .emblem{width:0;margin-right:0;opacity:0;border-width:0;
  transition:width .52s cubic-bezier(.16,.8,.3,1),margin .52s cubic-bezier(.16,.8,.3,1),opacity .2s ease;}
.main-row.focus .ubae-block{width:0;padding:0;opacity:0;border-left-width:0;
  transition:width .52s cubic-bezier(.16,.8,.3,1),padding .52s cubic-bezier(.16,.8,.3,1),opacity .2s ease;}

/* ═══ TIMER RING (revertable — set TIMER_RING false below) ═════════════════
   Drains around the bloom, same as the UBA bar. This clock does NOT own the
   numeric timer -- in UBAe the deck sends 'matchtimer' to the overlay's
   top-right clock -- so the ring listens to that message purely to draw, and
   never prints digits of its own. One source of truth, two places it shows. */
.ring-wrap{position:absolute;top:50%;left:26px;transform:translate(-50%,-50%);
  width:70px;height:70px;pointer-events:none;z-index:11;opacity:0;
  transition:opacity .45s ease;}
.ring-wrap.on{opacity:1;}
.ring-wrap svg{width:70px;height:70px;transform:rotate(-90deg);}
.ring-track{fill:none;stroke:rgba(168,85,247,.22);stroke-width:3;}
.ring-prog{fill:none;stroke:#d8b4fe;stroke-width:3;stroke-linecap:round;
  filter:drop-shadow(0 0 5px rgba(216,180,254,.9));
  /* The per-second drain stays LINEAR on purpose. An eased tick reads as a
     stutter -- it would speed up and slow down inside every single second,
     which is exactly what a clock must not do. The easing belongs on the two
     moments that are not ticks: the initial fill when a round starts, and any
     jump if the deck re-sends a different time. Those get a bezier via the
     .seek class, applied for one frame and removed. */
  transition:stroke-dashoffset 1s linear, stroke .5s ease;}
.ring-prog.seek{transition:stroke-dashoffset .85s cubic-bezier(.16,.8,.3,1), stroke .5s ease;}
.ring-wrap.low .ring-prog{stroke:#ff5470;filter:drop-shadow(0 0 7px rgba(255,84,112,.95));}
.ring-wrap.low{animation:ringPulse 1s ease-in-out infinite;}
@keyframes ringPulse{0%,100%{opacity:1}50%{opacity:.62}}
/* it retracts WITH the emblem during a reveal -- the panel is the subject for
   those few seconds, and the overlay is still showing the digits regardless */
.ring-wrap{transition:opacity .45s ease, width .52s cubic-bezier(.16,.8,.3,1);}
.main-row.focus .ring-wrap{opacity:0;}

/* MAIN BAR */
.main-bar{
  display:flex;align-items:center;height:52px;
  background:rgba(4,0,16,.45);
  border:1px solid rgba(168,85,247,.28);
  border-left:none;
  position:relative;overflow:hidden;
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%);
  backdrop-filter:blur(5px);
}
.main-bar::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;z-index:6;background:linear-gradient(90deg,rgba(216,180,254,0),rgba(216,180,254,.5),rgba(216,180,254,0));}
#holoCanvas{position:absolute;top:0;left:0;height:100%;pointer-events:none;z-index:5;opacity:0;}

.fighter{display:flex;flex-direction:column;justify-content:center;padding:0 20px;width:300px;flex-shrink:0;position:relative;z-index:4;
  font-family:'Barlow Condensed','Oswald',sans-serif;font-weight:900;font-size:34px;line-height:.98;
  color:#fff;text-transform:uppercase;text-align:center;letter-spacing:.01em;
  text-shadow:0 0 20px rgba(155,48,255,.7),2px 2px 0 rgba(0,0,0,.6);
  overflow:hidden;white-space:nowrap;}
.main-bar .fighter:first-of-type{text-align:left;}
.main-bar .fighter:last-of-type{text-align:left;}
.f-team{font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:.4em;color:rgba(200,170,255,.65);}
.f-name{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:900;font-style:italic;color:#f0e8ff;letter-spacing:.04em;text-transform:uppercase;}
@keyframes ng{0%,100%{text-shadow:0 0 10px rgba(155,48,255,.22);}50%{text-shadow:0 0 20px rgba(155,48,255,.6);}}
.f-name{animation:ng 3.2s ease-in-out infinite;}

.vs-section{display:flex;align-items:center;justify-content:center;padding:0 24px;height:100%;flex-shrink:0;z-index:4;border-left:1px solid rgba(168,85,247,.25);border-right:1px solid rgba(168,85,247,.25);background:rgba(50,8,100,.38);}
.vs-text{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;font-style:italic;color:#d8b4fe;letter-spacing:.3em;text-shadow:0 0 14px rgba(168,85,247,.9);}
@keyframes vp{0%,100%{opacity:.82}50%{opacity:1}}
.vs-text{animation:vp 1.8s ease-in-out infinite;}

/* ROUND */
.round-float{
  align-self:flex-end;
  margin-left:36px;
  margin-top:4px;
  height:32px;
  background:rgba(4,0,16,.62);
  border:1px solid rgba(168,85,247,.4);border-top:none;
  display:flex;align-items:center;gap:8px;padding:0 18px;
  position:relative;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%);
}
.round-float::before{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(168,85,247,.6),transparent);}
/* ── ROUND SWITCH — a card flipping over ──────────────────────────────────
   The number used to be replaced by assignment, which on a broadcast graphic
   is a hard cut in the one place the eye is already looking. It now rotates
   away on X, swaps while edge-on so the change is never visible, and rotates
   back -- the mechanical flip-board read, which is what a round counter is
   imitating anyway. Perspective lives on the PARENT or the rotation is
   orthographic and reads as a squash rather than a turn.
   Same exit curve as the bar's own close, so it belongs to this graphic. */
.round-float{perspective:460px;}
.rnd-num{display:inline-block;backface-visibility:hidden;
  transition:transform .26s cubic-bezier(.55,0,.25,1), opacity .18s ease;}
.rnd-num.flip-out{transform:rotateX(-92deg);opacity:0;}
.rnd-num.flip-in{transform:rotateX(92deg);opacity:0;}

.rnd-label{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.3em;color:rgba(200,170,255,.95);text-transform:uppercase;}
.rnd-num{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:#d8b4fe;}
</style>
</head>
<body>

<div class="hud-root">

  <div class="bo5-strip">
    <div class="team-label">TEAM</div>
    <div class="pips"><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
    <div class="bo5-mid">BO·5</div>
    <div class="pips"><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
    <div class="team-label">TEAM</div>
  </div>

  <div class="main-row">
    <!-- TIMER RING — remove this block and set TIMER_RING=false to revert -->
    <div class="ring-wrap" id="ringWrap">
      <svg viewBox="0 0 70 70">
        <circle class="ring-track" cx="35" cy="35" r="31"></circle>
        <circle class="ring-prog" id="ringProg" cx="35" cy="35" r="31"></circle>
      </svg>
    </div>
    <div class="emblem" id="emblemEl">
      <canvas id="flowerCanvas" width="52" height="52"></canvas>
    </div>
    <div class="ubae-block">
      <div class="ubae-holo"></div>
      <div class="ubae-text">UBAe</div>
      <div class="ubae-sub" id="ubaeSplit">SUMMER SPLIT</div>
    </div>
    <div class="main-bar">
      <canvas id="holoCanvas"></canvas>
      <div class="fighter">
        
      </div>
      <div class="uslit" id="uslitL"><span class="uslit-label" id="uslitLabelL">
        <span class="uslit-eyebrow" id="uslitEyeL">RED</span><span class="uslit-value" id="uslitValL">COLOURS</span>
      </span></div>
      <div class="vs-section"><div class="vs-text" id="vsText">VS</div></div>
      <div class="uslit rightside" id="uslitR"><span class="uslit-label" id="uslitLabelR">
        <span class="uslit-eyebrow" id="uslitEyeR">BLUE</span><span class="uslit-value" id="uslitValR">COLOURS</span>
      </span></div>
      <div class="fighter">
        
        
      </div>
    </div>
  </div>

  <div class="round-float">
    <div class="rnd-label">ROUND</div>
    <div class="rnd-num"></div>
  </div>

</div>

<script>

// Swap text at the edge-on point of a 90deg turn, so the old value is never
// seen becoming the new one. Returns early when the value has not changed --
// re-sending the same round should not perform.
function flipSwap(el, text){
  if(!el || el.textContent === String(text)) return
  el.classList.add('flip-out')
  setTimeout(()=>{
    el.textContent = String(text)
    // the incoming pose must be applied WITHOUT a transition, or it animates
    // from one rotated state to the other and the flip reads as a wobble
    el.style.transition = 'none'
    el.classList.remove('flip-out'); el.classList.add('flip-in')
    requestAnimationFrame(()=>{
      el.style.transition = ''
      el.classList.remove('flip-in')
    })
  }, 260)
}

// ═══ TIMER RING ════════════════════════════════════════════════════════════
// false = never renders, and nothing else reads it.
const TIMER_RING = true
const RING_R = 31, RING_C = 2 * Math.PI * RING_R
let ringHandle = null
function ringSet(frac, low){
  if(!TIMER_RING) return
  const w=document.getElementById('ringWrap'), c=document.getElementById('ringProg')
  if(!w||!c) return
  if(frac==null){ w.classList.remove('on','low'); return }
  c.style.strokeDasharray = RING_C
  c.style.strokeDashoffset = RING_C * (1 - Math.max(0, Math.min(1, frac)))
  w.classList.add('on'); w.classList.toggle('low', low)
}
// Counts down locally off the same seconds the overlay clock got, so the two
// can never disagree by more than the message latency.
function ringTimer(secs){
  clearInterval(ringHandle)
  if(secs==null){ ringSet(null); return }
  let left=secs; const total=Math.max(1,secs)
  const c=document.getElementById('ringProg')
  // suppress the first frame or the arc sweeps up from empty instead of
  // starting full
  if(c){ c.classList.add('seek'); setTimeout(()=>c.classList.remove('seek'), 900) }
  ringSet(left/total, left<=10)
  ringHandle=setInterval(()=>{
    left=Math.max(0,left-1); ringSet(left/total, left<=10)
    if(left<=0) clearInterval(ringHandle)
  },1000)
}

// ── TRUNK / ODDS REVEAL ─────────────────────────────────────────────────────
// Ported from the UBA clock deliberately rather than shared: the two bars have
// different geometry and different resting sizes, and a shared module would
// have to know about both. The BEHAVIOUR is what matters and it is identical --
// same curve, same hold, same retract-before-re-extend rule.
const uQ = id => document.getElementById(id)
const U_CUR = { l:'#e8312a', r:'#2e6fe8' }
let uOpenMode = null, uTimer = null
const U_HOLD_TRUNKS = 7500
const U_HOLD_ODDS   = 9000
const U_ODDS_FILL   = 'linear-gradient(180deg,#6d28d9,#4c1d95)'

// Nearest named colour, so the eyebrow reads "CRIMSON" not "#e8312a".
function uColorName(hex){
  const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex||'')
  if(!m) return 'CORNER'
  const r=parseInt(m[1],16), g=parseInt(m[2],16), b=parseInt(m[3],16)
  const names=[['RED',232,49,42],['CRIMSON',180,30,50],['BLUE',46,111,232],['NAVY',20,40,120],
    ['GOLD',230,180,40],['GREEN',40,180,90],['PURPLE',140,60,220],['ORANGE',240,130,40],
    ['PINK',235,90,170],['WHITE',245,245,245],['BLACK',20,20,20],['SILVER',170,170,180]]
  let best=names[0], bd=Infinity
  for(const n of names){ const d=(r-n[1])**2+(g-n[2])**2+(b-n[3])**2; if(d<bd){bd=d;best=n} }
  return best[0]
}

function uSetCorners(l,r){
  if(l) U_CUR.l=l; if(r) U_CUR.r=r
  const L=uQ('uslitL'), R=uQ('uslitR')
  if(L && !L.classList.contains('odds')) L.style.background=U_CUR.l
  if(R && !R.classList.contains('odds')) R.style.background=U_CUR.r
}
function uWrite(side, eyebrow, value){
  const e=uQ(side==='left'?'uslitEyeL':'uslitEyeR')
  const v=uQ(side==='left'?'uslitValL':'uslitValR')
  if(e) e.textContent=eyebrow; if(v) v.textContent=value
}

function uOpen(L,R,hold,m){
  const odds = m==='odds'
  const sL=uQ('uslitL'), sR=uQ('uslitR'); if(!sL||!sR) return
  sL.classList.toggle('odds',odds); sR.classList.toggle('odds',odds)
  // fills FIRST -- uSetCorners rewrites nothing here, but keeping the order
  // identical to the UBA bar means one fix lands in both when it is needed
  if(odds){ sL.style.background=U_ODDS_FILL; sR.style.background=U_ODDS_FILL }
  else uSetCorners(U_CUR.l, U_CUR.r)
  if(L) uWrite('left', L.eyebrow, L.value)
  if(R) uWrite('right', R.eyebrow, R.value)
  sL.classList.add('expand'); sR.classList.add('expand')
  // branding steps aside so the panel is the subject
  const row=document.querySelector('.main-row'); if(row) row.classList.add('focus')
  uOpenMode=m
  clearTimeout(uTimer)
  uTimer=setTimeout(()=>uCollapse(odds), hold||U_HOLD_TRUNKS)
}

function uCollapse(restore){
  const sL=uQ('uslitL'), sR=uQ('uslitR'); if(!sL||!sR) return
  sL.classList.remove('expand'); sR.classList.remove('expand')
  const row=document.querySelector('.main-row'); if(row) row.classList.remove('focus')
  uOpenMode=null
  setTimeout(()=>{
    sL.classList.remove('odds'); sR.classList.remove('odds')
    if(restore) uSetCorners(U_CUR.l, U_CUR.r)
  }, 520)
}

// Changing subject while open retracts first and re-extends. One panel, one
// idea at a time -- swapping the fill and the words in place is a hard cut.
function uReveal(L,R,hold,mode){
  const m = mode==='odds' ? 'odds' : 'trunks'
  clearTimeout(uTimer)
  if(uOpenMode && uOpenMode!==m){
    uCollapse(uOpenMode==='odds')
    uTimer=setTimeout(()=>uOpen(L,R,hold,m), 640)
    return
  }
  uOpen(L,R,hold,m)
}

function uOddsWord(v){

}

}

const cv=document.getElementById('flowerCanvas');
const ctx=cv.getContext('2d');
const W=52,H=52,CX=W/2,CY=H/2;
let T=0,spinAccum=0;

// bezier spin cycle — smooth continuous intensity, no jumps
let cycleT=0,cycleLen=0,inBurst=false;
let spinIntensity=0, siTarget=0, siVel=0; // spring physics for smoothing
function newCycle(){
  cycleLen=inBurst?280+Math.random()*140:620+Math.random()*500;
  cycleT=0;
}
newCycle();
function bezierEase(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function easeInCubic(t){return t*t*t;}
function easeOutQuint(t){return 1-Math.pow(1-t,5);}

// Spring lerp — critically damped, never overshoots
function springLerp(current, target, vel, stiffness, damping){
  const force = (target-current)*stiffness - vel*damping;
  vel += force;
  current += vel;
  return {val:current, vel};
}

// particles spawn at petal tips
const sparks=Array.from({length:28},()=>({x:CX,y:CY,vx:0,vy:0,life:0,max:0,hue:270,r:.5,on:false}));
function emitSpark(si){
  const s=sparks.find(s=>!s.on||s.life>s.max);if(!s)return;
  const pIdx=Math.floor(Math.random()*5);
  const pAngle=(pIdx/5)*Math.PI*2+spinAccum;
  const r=13;
  s.x=CX+Math.cos(pAngle)*r*.88;s.y=CY+Math.sin(pAngle)*r*.88;
  const tangent=pAngle+Math.PI/2;
  const vel=si*.9+.05;
  s.vx=Math.cos(tangent)*vel+(Math.random()-.5)*.08;
  s.vy=Math.sin(tangent)*vel-(si*.1)+(Math.random()-.3)*.08;
  s.life=0;s.max=si>.5?18+Math.random()*16:80+Math.random()*100;
  s.hue=265+Math.random()*85;s.r=si>.5?.7+Math.random()*1.1:.3+Math.random()*.5;s.on=true;
}

function tick(){
  ctx.clearRect(0,0,W,H);
  T++;cycleT++;
  const p=Math.min(1,cycleT/cycleLen);
  // advance cycle — set TARGET only, spring does the actual smoothing
  if(inBurst){
    const p1=.22, p2=.48, p3=.72, p4=1.0;
    if(p<p1){
      // ease-in: very slow start, builds momentum
      siTarget = easeInCubic(p/p1);
    } else if(p<p2){
      // peak hold with gentle pulse
      const holdT=(p-p1)/(p2-p1);
      siTarget = 1.0 - Math.sin(holdT*Math.PI)*.03;
    } else if(p<p3){
      // first stage release — quint easeout, fast initial drop
      const t=(p-p2)/(p3-p2);
      siTarget = easeOutQuint(1-t)*.6; // only drops to .6 here
    } else {
      // very long tail — last .6 drains with a quint so it barely moves at first
      const t=(p-p3)/(p4-p3);
      siTarget = Math.pow(1-t,2.5)*.45;
    }
    // only end burst when intensity has naturally decayed to near-zero
    if(p>=1 && spinIntensity<.025){inBurst=false;siTarget=0;siVel=0;newCycle();}
  } else {
    siTarget=0;
    if(p>=1){inBurst=true;newCycle();}
  }

  // SPRING — smooth follow, no sudden jumps, stiffness=0.028 damping=0.72
  // softer spring when coming down than going up
  const stiff = spinIntensity < siTarget ? 0.016 : 0.004;
  const damp  = spinIntensity < siTarget ? 0.68  : 0.60;
  const spring=springLerp(spinIntensity,siTarget,siVel,stiff,damp);
  spinIntensity=Math.max(0,Math.min(1,spring.val));
  siVel=spring.vel;
  const spd=.003+spinIntensity*.18;
  spinAccum+=spd;
  const si=spinIntensity;
  const emitProb=inBurst?si*.65:.025;
  if(Math.random()<emitProb)emitSpark(si);

  const hue=(T*.4+270)%360;
  const r=13;
  // bud/bloom sizes
  const budEW=r*.48,budEH=r*.95;
  const bloEW=r*.32,bloEH=r*1.2;
  const ew=budEW+(bloEW-budEW)*si;
  const eh=budEH+(bloEH-budEH)*si;

  // base brightness
  const basePulse=.85+si*.12;

  // ambient bloom
  {
    const b1=ctx.createRadialGradient(CX,CY,0,CX,CY,CX);
    b1.addColorStop(0,`hsla(${hue},100%,65%,${Math.pow(si,1.5)*.14})`);
    b1.addColorStop(.5,`hsla(${(hue+60)%360},100%,55%,${Math.pow(si,1.5)*.07})`);
    b1.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(CX,CY,CX,0,Math.PI*2);ctx.fillStyle=b1;ctx.fill();
  }

  // ghost trails when spinning
  if(si>.01){
    for(let g=1;g<=3;g++){
      const gs=spinAccum-g*.08;
      for(let p2=0;p2<5;p2++){
        const a=(p2/5)*Math.PI*2+gs;
        const px=CX+Math.cos(a)*r*.88,py=CY+Math.sin(a)*r*.88;
        ctx.save();ctx.translate(px,py);ctx.rotate(a+Math.PI);
        ctx.beginPath();ctx.ellipse(0,0,ew*.85,eh*.85,0,0,Math.PI*2);
        ctx.fillStyle=`hsla(${(hue+p2*22)%360},100%,82%,${(1-g/4)*Math.pow(si,1.5)*.14})`;ctx.fill();
        ctx.restore();
      }
    }
  }

  // PETALS
  for(let p2=0;p2<5;p2++){
    const a=(p2/5)*Math.PI*2+spinAccum;
    const px=CX+Math.cos(a)*r*.88,py=CY+Math.sin(a)*r*.88;
    // hue — always purple base, only expands to +/-30deg at peak bloom
    const rawPh=(hue+p2*22)%360;
    const purplePh=270+(rawPh%50)-5; // locked: 265-315
    const ph=purplePh + (rawPh-purplePh)*Math.pow(si,3); // only opens at si>0.7
    const depth=.75+.35*((CY-py)/r);
    // eclipse: one petal at a time glows brightly like a crescent halo
    const eclipsePetal=Math.floor(T/180)%5;
    const isEclipse=p2===eclipsePetal;
    const eclipseFade=Math.max(0,Math.sin((T%180)/180*Math.PI));
    const basePetalGlow=.2+Math.max(0,Math.sin(T*.035+p2*1.4+p2*p2*.6))*.25;
    const idleVal=isEclipse?basePetalGlow+eclipseFade*.8:basePetalGlow;
    // smooth blend: si=0 → idleVal, si=1 → 1.0, no hard threshold
    const idleGlow=idleVal + (1-idleVal)*Math.pow(si,0.6);
    const bp=basePulse*Math.min(1.15,Math.max(.65,depth))*idleGlow;
    const tiltA=a+Math.PI;

    // outer glow
    const glowR=ew*(1.8+si*2.0);
    const g2=ctx.createRadialGradient(px,py,0,px,py,glowR);
    g2.addColorStop(0,`hsla(${ph},100%,78%,${(.65+si*.3)*idleGlow})`);
    g2.addColorStop(.5,`hsla(${(ph+20)%360},100%,65%,${(.45+si*.18)*idleGlow})`);
    g2.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(px,py,glowR,0,Math.PI*2);ctx.fillStyle=g2;ctx.fill();

    // chromatic aberration when spinning
    {
      const ca=1.2*si;
      ctx.globalAlpha=Math.pow(si,3)*.32;
      ctx.save();ctx.translate(px,py);ctx.rotate(tiltA);
      ctx.beginPath();ctx.ellipse(-ca,0,ew,eh,0,0,Math.PI*2);ctx.fillStyle=`hsl(0,100%,72%)`;ctx.fill();
      ctx.beginPath();ctx.ellipse(0,-ca*.5,ew,eh,0,0,Math.PI*2);ctx.fillStyle=`hsl(130,100%,72%)`;ctx.fill();
      ctx.beginPath();ctx.ellipse(ca,0,ew,eh,0,0,Math.PI*2);ctx.fillStyle=`hsl(240,100%,78%)`;ctx.fill();
      ctx.restore();ctx.globalAlpha=1;
    }

    // petal — ALWAYS teardrop, just closes/opens with si
    // tip sharpness: tighter when unbloomed, wider when bloomed
    const tipW = ew*(0.6+si*0.4);  // wider tip as it blooms
    const baseW = ew*(0.9+si*0.1);
    ctx.save();ctx.translate(px,py);ctx.rotate(tiltA);
    ctx.beginPath();
    ctx.moveTo(0,-eh);  // sharp pointed tip
    ctx.bezierCurveTo( tipW,-eh*.55, baseW, eh*.1, 0, eh*.55);
    ctx.bezierCurveTo(-baseW, eh*.1, -tipW,-eh*.55, 0,-eh);
    ctx.closePath();

    // fill gradient — fully continuous, no hard branch
    // lightness: 22% (dark bud) → 80% (bright bloom), smooth all the way
    const lBase  = 22  + si*58;   // 22→80
    const lMid   = 16  + si*66;   // 16→82
    const sat    = 88  + si*12;   // 88→100 saturation
    const hShift1= 20  * si;       // hue shift only opens with si
    const hShift2= 35  * si;
    const pg=ctx.createLinearGradient(-ew,0,ew,0);
    pg.addColorStop(0,  `hsla(${ph},${sat}%,${lBase}%,${bp})`);
    pg.addColorStop(.5, `hsla(${(ph+hShift1)%360},${sat}%,${lMid}%,${bp})`);
    pg.addColorStop(1,  `hsla(${(ph+hShift2)%360},${sat}%,${lBase}%,${bp})`);
    ctx.fillStyle=pg;ctx.fill();

    // neon edge — bright, visible
    const strokeHue=290+(((ph+40)%360)-290)*Math.pow(si,2); // smooth hue shift
    ctx.strokeStyle=`hsla(${strokeHue},100%,92%,${(.18+si*.6)*idleGlow+.12})`;
    ctx.lineWidth=1.2+si*.4;ctx.stroke();

    // inner crease
    ctx.beginPath();ctx.arc(0,eh*.1,ew*.4,0,Math.PI*2);
    ctx.strokeStyle=`hsla(${ph},100%,70%,${.04+si*.22})`;ctx.lineWidth=.4;ctx.stroke();
    // specular
    ctx.beginPath();ctx.ellipse(-ew*.22,-eh*.28,ew*.2*(.3+si*.7),eh*.17*(.3+si*.7),-.3,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${(.08+si*.35)*depth})`;ctx.fill();

    // speckle dots — deterministic hash, never flickers
    ctx.globalAlpha=bp*.5;
    for(let di=0;di<12;di++){
      // pseudo-random but stable positions per petal
      const ang=di*2.399+p2*0.618; // golden angle spread
      const rad=(((di*7+p2*3)%8)/8)*.75;
      const sdx=Math.cos(ang)*rad*ew,sdy=Math.sin(ang)*rad*eh;
      const sd=1-rad;
      ctx.fillStyle=`hsla(${(ph+60+di*8)%360},100%,92%,${sd*.45})`;
      ctx.fillRect(sdx-.5,sdy-.5,1,1);
    }
    ctx.globalAlpha=1;
    ctx.restore();
  }

  // CENTRE
  const ch=(hue+160)%360;
  const centreR=r*.18+si*r*.12;
  {
    const cOuter=ctx.createRadialGradient(CX,CY,0,CX,CY,centreR*3.5*si+2);
    cOuter.addColorStop(0,`hsla(${ch},80%,100%,${basePulse*Math.pow(si,1.5)*.5})`);
    cOuter.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(CX,CY,centreR*3.5*si+2,0,Math.PI*2);ctx.fillStyle=cOuter;ctx.fill();
  }
  const cg=ctx.createRadialGradient(CX,CY,0,CX,CY,centreR+.5);
  cg.addColorStop(0,`hsla(${ch},60%,100%,${.55+si*.4})`);
  cg.addColorStop(.5,`hsla(${ch},100%,85%,${.32+si*.45})`);
  cg.addColorStop(1,'transparent');
  ctx.beginPath();ctx.arc(CX,CY,centreR+.5,0,Math.PI*2);ctx.fillStyle=cg;ctx.fill();
  ctx.beginPath();ctx.arc(CX,CY,centreR*.4,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,.75)`;ctx.fill();

  // CRT SYNTHWAVE TRAIL — rainbow echo rings expanding outward when blooming
  {
    for(let ring=1;ring<=3;ring++){
      const ringR=r*(1.2+ring*.5)*si;
      const ringHue=(hue+ring*30+T*2)%360;
      const ringA=Math.pow(si,2.5)*(1-ring/4)*.14;
      ctx.beginPath();ctx.arc(CX,CY,ringR,0,Math.PI*2);
      ctx.strokeStyle=`hsla(${ringHue},100%,75%,${ringA})`;
      ctx.lineWidth=.8;ctx.stroke();
    }
    // scanline sweep on bloom — horizontal band
    const scanY=CY+Math.sin(T*.08)*CY*.6;
    const sg=ctx.createLinearGradient(0,scanY-1,0,scanY+1);
    sg.addColorStop(0,'transparent');
    sg.addColorStop(.5,`hsla(${hue},100%,90%,${Math.pow(si,2)*.2})`)
    sg.addColorStop(1,'transparent');
    ctx.fillStyle=sg;ctx.fillRect(0,scanY-1,W,2);
  }

  // starburst
  {
    const flare=Math.pow(si,2)*.16,rayRot=T*.008;
    [[1,0],[0,1],[-1,0],[0,-1],[.7,.7],[-.7,.7],[.7,-.7],[-.7,-.7]].forEach(([dx,dy],i)=>{
      const rdx=dx*Math.cos(rayRot)-dy*Math.sin(rayRot);
      const rdy=dx*Math.sin(rayRot)+dy*Math.cos(rayRot);
      const len=r*(i<4?1.1:.65)*si;
      const fg=ctx.createLinearGradient(CX,CY,CX+rdx*len,CY+rdy*len);
      fg.addColorStop(0,`hsla(${(ch+i*10)%360},90%,100%,${flare})`);
      fg.addColorStop(1,'transparent');
      ctx.strokeStyle=fg;ctx.lineWidth=i<4?.8:.5;
      ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(CX+rdx*len,CY+rdy*len);ctx.stroke();
    });
  }

  // ORBITALS
  [[8,7,.04,0],[5,11,.022,55]].forEach(([n,orBase,sp2,ho])=>{
    const or=orBase*.6+(orBase*.4)*si;
    for(let i=0;i<n;i++){
      const a=(i/n)*Math.PI*2+T*sp2;
      const px=CX+Math.cos(a)*or,py=CY+Math.sin(a)*or;
      const ph=(hue+ho+i*20)%360;
      const dotA=Math.pow(si,.7)*.65;
      if(si>.01){
        for(let t=1;t<=3;t++){
          ctx.beginPath();ctx.arc(CX+Math.cos(a-t*.04*sp2*60)*or,CY+Math.sin(a-t*.04*sp2*60)*or,.35,0,Math.PI*2);
          ctx.fillStyle=`hsla(${ph},100%,85%,${(1-t/4)*Math.pow(si,2)*.18})`;ctx.fill();
        }
      }
      const dg=ctx.createRadialGradient(px,py,0,px,py,1.2+si*.8);
      dg.addColorStop(0,`hsla(${ph},${40+si*60}%,${70+si*25}%,${dotA})`);
      dg.addColorStop(1,'transparent');
      ctx.beginPath();ctx.arc(px,py,1.2+si*.8,0,Math.PI*2);ctx.fillStyle=dg;ctx.fill();
      ctx.beginPath();ctx.arc(px,py,.45,0,Math.PI*2);ctx.fillStyle=`hsla(${ph},100%,95%,${dotA*.85})`;ctx.fill();
    }
  });

  // SPARKS
  sparks.forEach(s=>{
    if(!s.on)return;
    s.life++;if(s.life>s.max){s.on=false;return;}
    s.vy-=.005;s.x+=s.vx;s.y+=s.vy;s.vx*=.95;s.vy*=.97;
    const fa=1-s.life/s.max;
    const tv=Math.sqrt(s.vx*s.vx+s.vy*s.vy);
    if(tv>.025){
      const tg=ctx.createLinearGradient(s.x,s.y,s.x-s.vx*4,s.y-s.vy*4);
      tg.addColorStop(0,`hsla(${s.hue},100%,85%,${fa*.42})`);
      tg.addColorStop(1,'transparent');
      ctx.strokeStyle=tg;ctx.lineWidth=s.r*.75;
      ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*4,s.y-s.vy*4);ctx.stroke();
    }
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`hsla(${s.hue},100%,92%,${fa*.8})`;ctx.fill();
  });

  // emblem ring sync
  const emblem=document.getElementById('emblemEl');
  if(emblem){
    const gs=si>.08
      ?`0 0 ${10+si*20}px rgba(216,180,254,${.45+si*.5}),0 0 ${20+si*32}px rgba(155,48,255,${.2+si*.42})`
      :`0 0 ${7+3*Math.sin(T*.055)}px rgba(168,85,247,.35),0 0 14px rgba(155,48,255,.15)`;
    emblem.style.boxShadow=gs;
    emblem.style.borderColor=`rgba(${180+Math.round(si*40)},${130+Math.round(si*30)},255,${.55+si*.35})`;
  }

  // HOLO BAR — iridescent holographic sticker effect
  const holoCV=document.getElementById('holoCanvas');
  if(holoCV && holoCV.parentElement){
    if(!holoCV._init){const barEl=holoCV.parentElement;holoCV.width=barEl.offsetWidth||800;holoCV.height=barEl.offsetHeight||52;holoCV._init=true;}
    const barW=holoCV.width,barH=holoCV.height;
    const hx=holoCV.getContext('2d');

    if(!window.holoState) window.holoState={pos:-1.2,sweeping:false,lastSi:0,fadeOut:0};
    const hs=window.holoState;

    if(!hs.sweeping && si>0.55 && hs.lastSi<=0.55){hs.sweeping=true;hs.pos=-1.2;}
    hs.lastSi=si;

    if(hs.sweeping || hs.pos>-1.2){
      hx.clearRect(0,0,barW,barH);

      const prog=Math.max(0,Math.min(1,(hs.pos+1.2)/2.6));
      const easedSpeed=(0.004+Math.sin(prog*Math.PI)*0.013);
      if(hs.sweeping) hs.pos+=easedSpeed;

      // band centre in px
      const cx=hs.pos*barW;
      const bandW=barW*1.3;
      const masterA=Math.min(1,si*1.8)*Math.sin(Math.max(0,prog)*Math.PI);

      if(masterA>.01){
        // draw iridescent band — 1px columns, tight frequencies, staggered time
        for(let x=0;x<barW;x++){
          const t=(x-(cx-bandW*.5))/bandW;
          const edge=Math.sin(t*Math.PI);

          // tight frequencies, staggered time
          const f1=Math.sin(x*.028+T*.032)*0.5+0.5;
          const f2=Math.sin(x*.019-T*.024+1.2)*0.5+0.5;
          const f3=Math.sin(x*.034+T*.018+2.4)*0.5+0.5;
          const f4=Math.sin(x*.014-T*.028+3.6)*0.5+0.5;

          // purple base, a little more LSD color bleed
          const blendHue=(265+(f1*45+f2*30+f3*20-40))%360;
          const sat=65+f2*20;
          const light=30+f1*30;
          const alpha=edge*masterA*(0.10+f3*.11);

          // blocky feel — snap column width to 1, 2 or 3px based on f4
          const colW=f4>.72?3:f4>.44?2:1;
          hx.fillStyle=`hsla(${blendHue},${sat}%,${light}%,${alpha})`;
          hx.fillRect(x,0,colW,barH);

          // micro-glints
          if(f1*f2*f3>.65){
            hx.fillStyle=`hsla(${blendHue+15},85%,85%,${edge*masterA*.2})`;
            hx.fillRect(x,0,colW,barH);
          }
        }

        // soft envelope glow over the whole band
        const envG=hx.createLinearGradient(cx-bandW*.5,0,cx+bandW*.5,0);
        envG.addColorStop(0,'transparent');
        envG.addColorStop(.3,`rgba(180,130,255,${masterA*.05})`);
        envG.addColorStop(.5,`rgba(190,140,255,${masterA*.08})`);
        envG.addColorStop(.7,`rgba(180,130,255,${masterA*.05})`);
        envG.addColorStop(1,'transparent');
        hx.fillStyle=envG;
        hx.fillRect(0,0,barW,barH);
      }

      holoCV.style.opacity='1';
      if(hs.pos>1.5 && !hs.fadeOut){
        hs.sweeping=false;
        hs.fadeOut=1.0; // start fade
      }
    }

    // fade out — blocky decay, canvas alpha drops gradually
    if(hs.fadeOut>0){
      hs.fadeOut=Math.max(0,hs.fadeOut-0.008);
      holoCV.style.opacity=String(hs.fadeOut);
      if(hs.fadeOut<=0){
        hx.clearRect(0,0,barW,barH);
        holoCV.style.opacity='0';
        hs.pos=-1.2;
        hs.fadeOut=0;
      }
    }
  }

  // VS glitch ~8s
  const vsEl=document.getElementById('vsText');
  const gp=T%480;
  if(gp<5)vsEl.style.textShadow=`${gp%2?2:-2}px 0 rgba(255,51,204,.9),${gp%2?-2:2}px 0 rgba(0,200,255,.8),0 0 14px rgba(168,85,247,.9)`;
  else vsEl.style.textShadow='';

  requestAnimationFrame(tick);
}
tick();
</script>

    if(c.type==='clock'){
      if(c.league && c.league!=='ubae') return   // the UBA clock answers this too
      const hud=document.querySelector('.hud-root')
      if(hud) hud.classList.toggle('off', c.show===false)
      return
    }
    // Trunk colours and odds, same contract as the UBA clock so one deck press
    // drives whichever bar is on screen.
    if(c.type==='corner'){
      const d=c.d||{}
      if(c.reveal) uCorners(d.l,d.r); else uSetCorners(d.l,d.r)
      return
    }
    if(c.type==='clockodds'){ const d=c.d||{}; uOddsReveal(d.l,d.r); return }
    // the overlay owns the digits; this only drives the ring
    if(c.type==='matchtimer'){ ringTimer(c.on===false?null:c.secs); return }
    // The deck has always sent {type:'round'} alongside the pickbar push, but
    // this clock never listened -- its round number simply never moved.
    if(c.type==='round'){ flipSwap(document.querySelector('.rnd-num'), c.n); return }
    if(c.type!=='pickbar') return
    const d=c.d||{}
    // Split name was baked into the markup and said SPRING through the whole
    // Summer split. Overridable so the next one is a payload change, not an edit.
    if(d.split){ const el=document.getElementById('ubaeSplit'); if(el) el.textContent=String(d.split).toUpperCase() }
    paintScore(d)
    const f=document.querySelectorAll('.fighter')
    if(!f.length) return
    const nL = (d.pickL!=null && d.left)  ? d.left[d.pickL]  : d.teamA
    const nR = (d.pickR!=null && d.right) ? d.right[d.pickR] : d.teamB
    if(f[0] && nL!=null) f[0].textContent=nL
    if(f[1] && nR!=null) f[1].textContent=nR
  }).subscribe()
})()
</script>
</body>
</html>
