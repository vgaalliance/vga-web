<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>UBA — Venue Bug</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
    font-family: 'Inter', 'Helvetica Neue', sans-serif;
  }

  /* ============================================================
     EDIT HERE — venue name, hold duration, position
     ============================================================= */

  .venue-bug {
    position: absolute;
    left: 60px;
    bottom: 70px;
    display: flex;
    align-items: center;
    gap: 0;
    opacity: 0;
    transform: translateY(16px);
  }

  /* Left accent bar — solid color block, sports-broadcast staple */
  .bug-accent {
    width: 5px;
    height: 52px;
    background: linear-gradient(180deg, #8b5cf6, #6d28d9);
    flex-shrink: 0;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
  }

  .bug-body {
    background: rgba(15, 11, 26, 0.92);
    backdrop-filter: blur(4px);
    border-top: 1px solid rgba(139,92,246,0.4);
    border-bottom: 1px solid rgba(139,92,246,0.4);
    padding: 10px 26px 10px 18px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 280px;
  }

  .bug-eyebrow {
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 3px;
    color: #3ee8d8;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .bug-venue {
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #f3f1fa;
    text-transform: uppercase;
    line-height: 1.1;
  }

  /* Thin progress/duration line under the body — subtle broadcast detail */
  .bug-progress-track {
    position: absolute;
    left: 5px;
    right: 0;
    bottom: -2px;
    height: 2px;
    background: rgba(139,92,246,0.15);
  }
  .bug-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #3ee8d8, #8b5cf6);
  }

</style>
</head>
<body>

  <div class="venue-bug" id="venueBug">
    <div class="bug-accent"></div>
    <div class="bug-body" style="position:relative;">
      <div class="bug-eyebrow">Live From</div>
      <div class="bug-venue" id="venueName">Memorial Hall</div>
      <div class="bug-progress-track">
        <div class="bug-progress-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

<script>
  // ============================================================
  // TIMING — edit these to taste
  // ============================================================
  const HOLD_DURATION = 4500;   // how long it stays fully visible, ms
  const ENTER_DURATION = 550;   // slide/fade in duration, ms
  const EXIT_DURATION = 450;    // slide/fade out duration, ms

  const bug = document.getElementById('venueBug');
  const progressFill = document.getElementById('progressFill');

  // ---------- ENTER ----------
  bug.style.transition = `opacity ${ENTER_DURATION}ms cubic-bezier(.16,.8,.3,1), transform ${ENTER_DURATION}ms cubic-bezier(.16,.8,.3,1)`;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      bug.style.opacity = '1';
      bug.style.transform = 'translateY(0)';

      // progress bar fills across the hold duration, giving a subtle
      // sense of "this is timed" — common in broadcast lower-thirds
      progressFill.style.transition = `width ${HOLD_DURATION}ms linear`;
      requestAnimationFrame(() => {
        progressFill.style.width = '100%';
      });
    });
  });

  // ---------- EXIT ----------
  setTimeout(() => {
    bug.style.transition = `opacity ${EXIT_DURATION}ms cubic-bezier(.4,0,.6,1), transform ${EXIT_DURATION}ms cubic-bezier(.4,0,.6,1)`;
    bug.style.opacity = '0';
    bug.style.transform = 'translateY(-10px)';
  }, ENTER_DURATION + HOLD_DURATION);
</script>

<!-- ── VGA STUDIO WIRE — deck listener (added 2026-07-24, visuals untouched) ── -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  const _sb = supabase.createClient('https://emzlivoykbhhjcugupit.supabase.co',
    'sb_publishable_pqhH974E1q9YsFnrVH1UJQ_X3V-rRLF')
  function replay(d){
    const eb=document.querySelector('.bug-eyebrow')
    if(d.eyebrow&&eb) eb.textContent=d.eyebrow
    if(d.text) document.getElementById('venueName').textContent=d.text
    // reset then re-run the same enter → hold → exit cycle the file already defines
    bug.style.transition='none'; bug.style.opacity='0'; bug.style.transform='translateY(10px)'
    progressFill.style.transition='none'; progressFill.style.width='0'
    requestAnimationFrame(()=>{requestAnimationFrame(()=>{
      bug.style.transition=`opacity ${ENTER_DURATION}ms cubic-bezier(.16,.8,.3,1), transform ${ENTER_DURATION}ms cubic-bezier(.16,.8,.3,1)`
      bug.style.opacity='1'; bug.style.transform='translateY(0)'
      progressFill.style.transition=`width ${HOLD_DURATION}ms linear`
      requestAnimationFrame(()=>{ progressFill.style.width='100%' })
      setTimeout(()=>{
        bug.style.transition=`opacity ${EXIT_DURATION}ms cubic-bezier(.4,0,.6,1), transform ${EXIT_DURATION}ms cubic-bezier(.4,0,.6,1)`
        bug.style.opacity='0'; bug.style.transform='translateY(-10px)'
      }, ENTER_DURATION+HOLD_DURATION)
    })})
  }
  _sb.channel('vga-overlay').on('broadcast',{event:'cmd'},({payload:c})=>{
    if(c.type==='bug') replay(c.d||{})
  }).subscribe()
})()
</script>
</body>
</html>
