<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VGA — Vertical</title>
<!-- ============================================================
     THE VERTICAL CANVAS — THE COMPLEMENT, NOT A SECOND SHOW.

     Add THIS as a 1080x1920 browser source in the vertical canvas
     (Aitum Vertical), ON TOP of two sources you already have:
       · your background source
       · the DESKTOP PROGRAMME FEED, scaled to 1080 wide, parked in
         the slot at y 169. 1920x1080 at 1080 wide is 1080x607.5
         against a 608px slot — it lands within half a pixel.

     WHY THIS PAGE DRAWS SO LITTLE. There is ONE deck and ONE channel,
     so a press lights both canvases. When this page drew its own
     standby screens, pressing "Team vs team" rendered it twice on the
     same frame — once in the desktop feed up top and once down here.
     So the rule is now: IF THE DESKTOP DRAWS IT, THIS PAGE DOESN'T.
     Nothing below answers a VIEW. It answers the show STATE that the
     press put the show into, which no other source is drawing.

     FOUR REGIONS, top to bottom:
       CTA         y    0- 169  the 1920x300 CTA graphic's slot
       feed slot   y  169- 777  1080x608, transparent — the desktop
                                programme feed shows THROUGH it
       score rail  y  777- 927  fixed furniture, never moves
       mode stage  y  927-1920  one block at a time

     THE SCORE RAIL IS THE POINT OF THE WHOLE PAGE. A phone viewer
     arrives mid-show with none of the context the desktop audience
     built up, so the rail answers the three things the broadcast
     never repeats: who is playing, what the score is, which bout.
     "Always on" only holds if it is always in the SAME PLACE, so the
     rail never moves and the stage changes underneath it.

     THREE STAGE MODES, chosen by state and never by a button:
       TEAMS   both sides' three starters, spent ones dimmed, the
               picked one lit. The default, and what STANDBY returns to.
       ROOM    the pick clock is running: coaches have 2:00.
       MATCH   a bout is live: the two fighters, big, and the clock —
               bigger than the desktop clock arriving at 56%, which is
               the only reason to draw a second one.

     THE RUNDOWN is the one thing here with no desktop counterpart:
     full frame, one fighter at a time, the two just picked.
     ============================================================= -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Barlow+Condensed:wght@500;700;900&family=Barlow:wght@500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --pur:#9b30ff; --hi:#cc66ff; --pink:#ff33cc; --gold:#ffce00; --green:#5cf2a0;
    --panel:rgba(14,0,30,.92); --line:rgba(155,48,255,.3); --dim:rgba(200,160,255,.6);
    --accent:var(--pur); --glow:rgba(155,48,255,.55);
    /* THE ONE PLACE THE COMPOSITION LIVES. Change these and every region
       follows; nothing below hardcodes a y position. --cta is 169 because the
       CTA block is a 1920x300 desktop graphic and 1080/1920 of 300 is 169. */
    --cta:169px; --feed:608px; --rail:150px;
  }
  body.gfl{ --accent:#e8312a; --glow:rgba(232,49,42,.55); --hi:#ff6a5e; --pink:#ff3b2f; }
  html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;
    font-family:'Barlow Condensed',sans-serif;color:#fff;}

  /* ── CTA SLIVER ───────────────────────────────────────────────────── */
  #cta{position:absolute;top:0;left:0;right:0;height:var(--cta);z-index:40;
    display:flex;align-items:center;justify-content:center;gap:22px;
    background:linear-gradient(180deg,rgba(12,0,26,.97),rgba(8,0,18,.92));
    border-bottom:2px solid var(--accent);box-shadow:0 4px 26px rgba(0,0,0,.5);}
  #cta .k{font-family:'Press Start 2P',monospace;font-size:13px;letter-spacing:.24em;
    color:var(--hi);text-shadow:0 0 12px var(--glow);}
  #cta .v{font-weight:900;font-size:40px;letter-spacing:.05em;text-transform:uppercase;
    text-shadow:0 0 22px var(--glow);}
  #cta .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 14px var(--accent);animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* ── VIDEO SLOT ───────────────────────────────────────────────────── */
  /* Transparent, always. The desktop programme feed sits behind it. */
  #slot{position:absolute;top:var(--cta);left:0;right:0;height:var(--feed);z-index:20;}
  #slot .edge{position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 0 2px rgba(155,48,255,.35), inset 0 0 40px rgba(155,48,255,.14);}
  /* kept for the rundown's scan bar, which is the only thing that still uses it */
  @keyframes scan{0%{top:0}100%{top:100%}}

  /* ── THE SCORE RAIL — fixed furniture, never moves ─────────────────
     "Always on" only holds if it is always in the SAME place. It sits at
     the top of the bottom half and the mode block changes underneath it,
     so a viewer who looks for the score twice finds it twice. */
  #rail{position:absolute;top:calc(var(--cta) + var(--feed));left:0;right:0;height:var(--rail);
    z-index:26;display:grid;grid-template-columns:1fr 300px 1fr;align-items:center;
    background:linear-gradient(180deg,rgba(13,0,28,.97),rgba(8,0,18,.98));
    border-top:1px solid var(--line);border-bottom:2px solid var(--accent);}
  #rail .tm{display:flex;flex-direction:column;justify-content:center;padding:0 34px;overflow:hidden;}
  #rail .tm.l{align-items:flex-start;} #rail .tm.r{align-items:flex-end;}
  #rail .tm .n{font-weight:900;font-size:44px;line-height:1;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
    text-shadow:0 0 20px var(--glow);}
  #rail .tm .p{display:flex;gap:6px;margin-top:9px;}
  #rail .tm.r .p{flex-direction:row-reverse;}
  #rail .tm .p i{width:34px;height:9px;background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.2);transition:background .3s ease,box-shadow .3s ease;}
  #rail .tm .p i.on{background:var(--hi);border-color:var(--hi);box-shadow:0 0 12px var(--glow);}
  #rail .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(180deg,rgba(155,48,255,.2),rgba(255,51,204,.1));
    border-left:1px solid var(--line);border-right:1px solid var(--line);align-self:stretch;}
  #rail .mid .sc{font-weight:900;font-size:58px;line-height:1;color:var(--gold);
    font-variant-numeric:tabular-nums;letter-spacing:.04em;text-shadow:0 0 22px rgba(255,206,0,.45);}
  #rail .mid .bt{font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:.18em;
    color:#fff;margin-top:9px;}

  /* ── THE MODE STAGE — one block at a time, under the rail ──────────
     Three blocks, and which one is up is decided by the SHOW STATE the
     deck already broadcasts, never by a button of its own. That is what
     keeps the vertical canvas from answering the same press the desktop
     scene is already answering, and it is why nothing can render twice. */
  #stage{position:absolute;top:calc(var(--cta) + var(--feed) + var(--rail));bottom:0;left:0;right:0;
    z-index:25;overflow:hidden;}
  .bmode{position:absolute;inset:0;padding:44px 40px 38px;display:none;flex-direction:column;}
  .bmode.on{display:flex;}
  .bmode.in{animation:modein .46s cubic-bezier(.16,1,.3,1);}
  .bmode.out{display:flex;animation:modeout .2s ease forwards;pointer-events:none;}
  @keyframes modein{from{opacity:0;transform:translateY(34px);}to{opacity:1;transform:none;}}
  @keyframes modeout{to{opacity:0;transform:translateY(-18px);}}
  /* the wipe — one bright edge crossing the stage on every change. It is the
     only motion that is not the content itself, so it is the thing that reads
     as a cut rather than a redraw. */
  #wipe{position:absolute;inset:0;z-index:9;pointer-events:none;overflow:hidden;}
  #wipe i{position:absolute;top:0;bottom:0;width:46%;left:-50%;
    background:linear-gradient(90deg,transparent,rgba(155,48,255,.5),rgba(204,102,255,.85),transparent);
    box-shadow:0 0 60px rgba(155,48,255,.6);}
  #wipe.go i{animation:wipe .52s cubic-bezier(.5,0,.2,1);}
  @keyframes wipe{from{left:-50%}to{left:110%}}
  @media (prefers-reduced-motion:reduce){
    .bmode.in,.bmode.out,#wipe.go i{animation:none;}
    .bmode.out{display:none;}
  }
  .bhead{font-family:'Press Start 2P',monospace;font-size:13px;letter-spacing:.26em;
    color:var(--hi);text-align:center;text-shadow:0 0 12px var(--glow);}

  /* ① TEAMS — three across against three across.
     Not a column each: the desktop bar reads FFF vs FFF and this has to be
     the same shape or the two screens are teaching different things. The
     RING is the entire state readout, borrowed from the battleroom -- plain
     ring available, GOLD picked, and a spent fighter dims out of it. */
  #mTeams{flex-direction:column;align-items:stretch;padding:16px 22px 26px;}
  .sixup{display:flex;align-items:flex-start;width:100%;}
  /* ── the minimal tape ──
     Only up once BOTH corners have picked, because a tape is a COMPARISON --
     one fighter beside an empty column is not a shorter tape, it is a broken
     one. A row neither man can fill is dropped rather than printed as two
     dashes: half this roster has no reach and no stance on file. */
  .minitape{margin-top:34px;display:none;flex-direction:column;}
  .minitape.on{display:flex;animation:modein .4s cubic-bezier(.16,1,.3,1);}
  /* The two values READ INWARD, toward the label between them. Splayed to the
     outer edges of a 1036px row they were 300px apart with the thing they are
     being compared on marooned in the middle -- a tape is a comparison and the
     eye has to be able to make it without travelling. */
  .mtrow{display:grid;grid-template-columns:1fr auto 1fr;gap:30px;align-items:center;
    padding:15px 34px;border-top:1px solid var(--line);background:var(--panel);}
  .mtrow:last-child{border-bottom:1px solid var(--line);}
  .mtrow .v{font-weight:700;font-size:44px;line-height:1;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;text-align:right;}
  .mtrow .v.r{text-align:left;}
  .mtrow .v.win{color:var(--gold);text-shadow:0 0 16px rgba(255,206,0,.45);}
  .mtrow .lb{font-family:'Press Start 2P',monospace;font-size:16px;letter-spacing:.18em;
    color:var(--hi);text-align:center;text-shadow:0 0 12px var(--glow);
    min-width:200px;}
  .tside{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .tside .tnm{font-weight:900;font-size:56px;line-height:1;text-transform:uppercase;
    text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
    text-shadow:0 0 24px var(--glow);}
  .tstack{display:flex;gap:11px;width:100%;justify-content:center;}
  .f{flex:1;min-width:0;max-width:158px;display:flex;flex-direction:column;align-items:center;
    gap:7px;transition:opacity .3s ease;}
  /* the cue keeps its row whether it shows or not, so nothing jumps when it steps */
  /* The cursor sits ON THE HEAD, character-select style. That only works
     because the tile is now the cut-out's OWN aspect (300x463): a 158x392
     box let `contain` letterbox the fighter to the bottom, so the marker was
     floating 140px of empty air above him. */
  .f .mk{height:34px;display:flex;align-items:flex-end;justify-content:center;gap:7px;
    margin-bottom:2px;opacity:0;transform:translateY(6px);
    transition:opacity .18s ease,transform .18s cubic-bezier(.16,1,.3,1);}
  .f.cue .mk{opacity:1;transform:none;}
  .f .mk .a{font-family:'Press Start 2P',monospace;font-size:17px;color:var(--hi);
    text-shadow:0 0 14px var(--hi);animation:cueblink .7s steps(1) infinite;}
  .f .mk .p{font-family:'Press Start 2P',monospace;font-size:13px;letter-spacing:.14em;color:var(--hi);}
  @keyframes cueblink{0%,49%{opacity:1}50%,100%{opacity:.15}}
  /* THE STROKE FOLLOWS THE FIGHTER, NOT A RECTANGLE. An inset ring on a
     block draws a BOX around the photo; four hard drop-shadows on the
     cut-out itself trace its own silhouette, which is what an outlined
     avatar means. Nothing here has a background, so there is no box left. */
  /* NEUTRAL until something has happened to you. Purple was the league's
     colour doing a job it cannot do: if "available" is already coloured, the
     gold that means PICKED is just a second colour rather than the moment the
     screen was built for. So available is white, picked is gold, spent is a
     white that has gone out. */
  .f{--ring:rgba(176,166,196,.42);}
  .f.picked{--ring:var(--gold);}
  .f.used{--ring:rgba(176,166,196,.2);}
  /* 4px cardinal, 3px diagonal. Three flat was about one device pixel on a
     phone and read as nothing; six read as a sticker. The diagonals are
     needed at any weight -- without them every sloped edge (a shoulder, a
     raised glove) breaks open at the corners. */
  .f .av,.f .sil{width:100%;aspect-ratio:300/463;
    filter:drop-shadow(4px 0 0 var(--ring)) drop-shadow(-4px 0 0 var(--ring))
           drop-shadow(0 4px 0 var(--ring)) drop-shadow(0 -4px 0 var(--ring))
           drop-shadow(3px 3px 0 var(--ring)) drop-shadow(-3px 3px 0 var(--ring))
           drop-shadow(3px -3px 0 var(--ring)) drop-shadow(-3px -3px 0 var(--ring));
    transition:filter .3s ease;}
  .f .av{object-fit:contain;object-position:bottom center;}
  /* The GLOW pulses on a wrapper, not on the image: the stroke itself is
     eight stacked drop-shadows and CSS cannot interpolate a chain like that,
     but a parent's filter composes over the child's result. So the outline
     stays hard and only the halo around it breathes. The name is outside the
     wrapper, which is why it does not breathe with it. */
  .f .por{display:block;width:100%;animation:glowIdle 3.6s ease-in-out infinite;}
  .f.picked .por{animation:glowPick 2s ease-in-out infinite;}
  .f.used .por{animation:none;}
  /* Available is a grey that has to sit next to gold for five bouts without
     competing with it. Pure white read as a highlight -- six highlights and
     the picked one stops being the loud thing on screen. */
  @keyframes glowIdle{
    0%,100%{filter:drop-shadow(0 0 4px rgba(176,166,196,.1));}
    50%    {filter:drop-shadow(0 0 11px rgba(176,166,196,.24));}}
  @keyframes glowPick{
    0%,100%{filter:drop-shadow(0 0 9px rgba(255,206,0,.45));}
    50%    {filter:drop-shadow(0 0 28px rgba(255,206,0,.9));}}
  @media (prefers-reduced-motion:reduce){ .f .por{animation:none;} }
  /* No photo yet -> the same blank the battleroom uses, masked and filled
     dark so it reads as the silhouette character rather than a gap. It
     faces the centre, so each side gets its own hand. */
  /* Drawn as an IMAGE and blackened, not as a mask over a fill. The blank is
     700x1080 -- the same 0.648 the photo thumbs are -- so it sizes through the
     exact path a real photo does, and the stroke traces it identically. A
     masked block took its own sizing route and came out a narrow bar. */
  .f .sil{filter:brightness(.12) saturate(0)
          drop-shadow(4px 0 0 var(--ring)) drop-shadow(-4px 0 0 var(--ring))
          drop-shadow(0 4px 0 var(--ring)) drop-shadow(0 -4px 0 var(--ring))
          drop-shadow(3px 3px 0 var(--ring)) drop-shadow(-3px 3px 0 var(--ring))
          drop-shadow(3px -3px 0 var(--ring)) drop-shadow(-3px -3px 0 var(--ring));}
  .f .nm{font-weight:700;font-size:26px;line-height:1;text-transform:uppercase;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .f.picked .nm{color:var(--gold);text-shadow:0 0 16px rgba(255,206,0,.4);}
  .f.used{opacity:.46;}
  /* the VS sits level with the FACES, not with the whole column, so it
     lands between the two rows rather than under the team names */
  /* offset to the middle of the FACES: team name 56 + gap 4 + cue row 30,
     then half a portrait. Centring it on the column instead dropped it below
     the fighters, which reads as a caption rather than a versus. */
  .tvs{display:flex;align-items:flex-start;justify-content:center;width:86px;flex:none;
    padding-top:calc(56px + 4px + 36px + 108px);}
  .tvs span{font-family:'Press Start 2P',monospace;font-size:26px;color:var(--pink);
    text-shadow:0 0 20px rgba(255,51,204,.6);}
  @media (prefers-reduced-motion:reduce){ .f .mk .a{animation:none;} }

  /* ② BATTLEROOM — the room is the news, not the roster */
  #mRoom{align-items:center;justify-content:center;gap:26px;text-align:center;}
  #mRoom .big{font-weight:900;font-size:104px;line-height:.9;text-transform:uppercase;
    text-shadow:0 0 34px var(--glow);}
  #mRoom .sub{font:600 30px 'Barlow';letter-spacing:.16em;color:var(--dim);text-transform:uppercase;}
  #roomClk{font-weight:900;font-size:150px;line-height:.9;color:var(--gold);
    font-variant-numeric:tabular-nums;text-shadow:0 0 40px rgba(255,206,0,.45);}
  #roomClk.low{color:#ff4d4d;text-shadow:0 0 40px rgba(255,77,77,.55);animation:pulse 1s ease-in-out infinite;}
  #mRoom .who{display:flex;align-items:center;gap:26px;font-weight:900;font-size:46px;
    text-transform:uppercase;}
  #mRoom .who em{font-style:normal;font-family:'Press Start 2P',monospace;font-size:18px;color:var(--pink);}

  /* ③ MATCH — the vertical fight clock. Bigger than the desktop clock
     arriving in the slot at 56%, which is the reason it exists at all. */
  #mMatch{align-items:center;justify-content:center;gap:4px;}
  .mrow{display:flex;align-items:center;gap:22px;width:100%;}
  .mrow .cor{width:16px;align-self:stretch;min-height:88px;}
  /* name and team are ONE stack. Left as two flex children with the name on
     flex:1, the team was pushed to the far end of the row -- so each fighter's
     side was labelled with his own team sitting over the OTHER man's name. */
  .mrow .stk{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
  .mrow .who{font-weight:900;font-size:76px;line-height:.94;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 26px var(--glow);}
  .mrow .tag{font:600 22px 'Barlow';letter-spacing:.18em;color:var(--dim);text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mrow.b{flex-direction:row-reverse;}
  .mrow.b .stk{align-items:flex-end;}
  .mrow.b .who,.mrow.b .tag{text-align:right;}
  #mMatch .vsx{font-family:'Press Start 2P',monospace;font-size:20px;color:var(--pink);
    margin:8px 0;text-shadow:0 0 16px rgba(255,51,204,.6);}
  #mClk{font-weight:900;font-size:138px;line-height:.9;color:var(--gold);margin-top:16px;
    font-variant-numeric:tabular-nums;text-shadow:0 0 36px rgba(255,206,0,.45);}
  #mClk.low{color:#ff4d4d;text-shadow:0 0 36px rgba(255,77,77,.6);animation:pulse 1s ease-in-out infinite;}
  #mRd{font-family:'Press Start 2P',monospace;font-size:14px;letter-spacing:.2em;color:#fff;
    margin-top:14px;text-shadow:0 0 12px var(--glow);}

  /* ── THE RUNDOWN — one fighter at a time, the whole frame ───────────────
     Not a bottom-third pane: the rundown deliberately COVERS the desktop
     feed, because it is the one segment this canvas owns outright and a
     portrait needs the height. It is the only thing here that hides the
     show above it, so it is only ever up while somebody is holding it. */
  #rundown{position:absolute;top:var(--cta);bottom:0;left:0;right:0;z-index:26;
    display:none;flex-direction:column;overflow:hidden;
    background:linear-gradient(180deg,#0b0018,#16062e 42%,#0b0018);}
  body.rundown #rundown{display:flex;}
  body.rundown #load{opacity:0;pointer-events:none;}
  #rdPhoto{position:relative;flex:1;min-height:0;overflow:hidden;}
  #rdImg{position:absolute;inset:0;background-size:cover;background-position:center 12%;}
  #rdMono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:300px;line-height:1;color:rgba(216,180,254,.09);}
  #rdPhoto .glowplate{position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 32%,rgba(155,48,255,.28),transparent 62%);}
  #rdPhoto .fade{position:absolute;left:0;right:0;bottom:0;height:300px;
    background:linear-gradient(180deg,transparent,#0b0018 88%);}
  #rdPhoto .scanline{position:absolute;left:0;right:0;height:3px;
    background:linear-gradient(90deg,transparent,var(--hi),transparent);
    animation:scan 4.2s linear infinite;opacity:.55;}
  #rdBadge{position:absolute;top:26px;left:0;z-index:3;background:var(--accent);
    font-family:'Press Start 2P',monospace;font-size:12px;letter-spacing:.2em;
    padding:11px 22px;box-shadow:0 6px 22px rgba(0,0,0,.55);}
  #rdBelt{position:absolute;top:26px;right:0;z-index:3;background:var(--gold);color:#1a0f00;
    font-family:'Press Start 2P',monospace;font-size:12px;letter-spacing:.2em;
    padding:11px 22px;display:none;}
  #rdBelt.on{display:block;}
  #rdInfo{flex:none;padding:0 46px 30px;margin-top:-130px;position:relative;z-index:4;}
  #rdName{font-weight:900;font-size:104px;line-height:.88;text-transform:uppercase;
    text-shadow:0 0 36px var(--glow);}
  #rdNick{font:500 34px 'Barlow';font-style:italic;color:var(--gold);margin-top:10px;}
  #rdStats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:34px;}
  #rdStats .s{background:var(--panel);border-top:3px solid var(--accent);padding:16px 18px;}
  #rdStats .s .l{font-family:'Press Start 2P',monospace;font-size:10px;letter-spacing:.18em;
    color:var(--dim);margin-bottom:10px;}
  #rdStats .s .v{font-weight:900;font-size:46px;line-height:.9;white-space:nowrap;}
  #rdStats .s .v.gold{color:var(--gold);}
  #rdDots{display:flex;gap:7px;justify-content:center;padding:0 46px 30px;flex-wrap:wrap;}
  #rdDots .d{width:26px;height:5px;background:rgba(255,255,255,.16);}
  #rdDots .d.on{background:var(--hi);box-shadow:0 0 10px var(--glow);}
  /* every card arrives the same way, so the sequence has a beat */
  #rundown.step #rdPhoto,#rundown.step #rdInfo{animation:rdin .55s cubic-bezier(.16,1,.3,1);}
  @keyframes rdin{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:none;}}

  #crt{position:absolute;inset:0;pointer-events:none;z-index:60;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);}
  #vig{position:absolute;inset:0;pointer-events:none;z-index:59;
    background:radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.5) 100%);}
</style>
</head>
<body>

<div id="cta">
  <span class="dot"></span>
  <span class="k">JOIN THE LEAGUE</span>
  <span class="v" id="ctaUrl">DISCORD.GG/UBA</span>
</div>

<!-- The feed slot is TRANSPARENT and always open. Behind this page OBS

<script>
(function(){
const sb = supabase.createClient('https://emzlivoykbhhjcugupit.supabase.co',
  'sb_publishable_pqhH974E1q9YsFnrVH1UJQ_X3V-rRLF')
const $ = id => document.getElementById(id)
const Q = new URLSearchParams(location.search)
const esc = t => String(t ?? '').replace(/[<>&]/g, ch => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[ch]))
const has = v => v !== null && v !== undefined && String(v).trim() !== '' && String(v).trim() !== '—'

// ── league skin ────────────────────────────────────────────────────────
function setLeague(lg){

/* ═══════════════════════════════════════════════════════════════════════
   THE MODE STAGE

   Three blocks, and which one is up is decided by the show state the deck
   ALREADY broadcasts — never by a button of its own. That is the whole
   reason nothing on this canvas can render twice: the desktop scene in the
   feed slot answers the operator's press, and this half answers the state
   that press put the show into.
   ═══════════════════════════════════════════════════════════════════════ */
let MODE = null, outT = null
function mode(id){
  if(MODE === id) return

  const w = $('wipe'); w.classList.remove('go'); void w.offsetWidth; w.classList.add('go')
}

// ── the rail ───────────────────────────────────────────────────────────
// A UBAe match is first to three. The pips run OUTWARD from the centre on
// both sides so the two scores are mirror images and neither team's row
// reads as the longer one.
function pips(el, n){
  el.innerHTML = Array.from({length:3}, (_,i) =>
    `<i class="${i < n ? 'on' : ''}"></i>`).join('')
}
function drawRail(){
  $('rtA').textContent = String(MN.teamA || 'TEAM A').toUpperCase()
  $('rtB').textContent = String(MN.teamB || 'TEAM B').toUpperCase()

  $('rsc').textContent = `${MN.scoreA} — ${MN.scoreB}`

}

// ── ① the two teams, three starters a side ─────────────────────────────
// The avatars come from ubae_fighter_records, which is also where the
// horizontal rosters screen gets them, so a fighter photographed once shows
// up on both canvases without a second upload.
const PHOTO = {}
function starterCards(box, names, used, pick, tag, side){
  const list = (names || []).slice(0, 3)
  const rows = list.length ? list : [null, null, null]
  box.innerHTML = rows.map((n, i) => {
    // A lineup that has not been revealed yet still gets three faces. Three

    const label = has(n) ? n : 'TBA'

    const inner = url ? `<img class="av" src="${url}" alt="">`
                      : `<img class="av sil" src="assets/avatar-blank-${side}.png" alt="">`
    const av = `<span class="por">${inner}</span>`
    const cls = ((used || []).includes(i) ? ' used' : '') + (pick === i ? ' picked' : '')
    return `<div class="f${cls}">
      <span class="mk"><span class="a">▼</span><span class="p">${tag}</span></span>

  }).join('')
}
function drawTeams(){
  $('tnA').textContent = String(MN.teamA || 'TEAM A').toUpperCase()
  $('tnB').textContent = String(MN.teamB || 'TEAM B').toUpperCase()
  starterCards($('t3A'), MN.left,  MN.usedL, MN.pickA, 'P1', 'left')
  starterCards($('t3B'), MN.right, MN.usedR, MN.pickB, 'P2', 'right')
  cueDraw()
  drawMiniTape()
}

// P1 IS THE LEFT SIDE AND P2 IS THE RIGHT SIDE — it names which corner, not
// which slot in a lineup. Numbering the three positions instead put a P3 on
// screen that matches nothing anybody says out loud.
//
// It never parks. A character-select cursor is always travelling — that
// motion is the only thing moving on this block, and it is what walks a
// viewer's eye across six faces they have never seen before. Who is actually
// PICKED is said by the gold stroke, which does not need the cursor's help.
let cueI = 0, cueT = null
function cueDraw(){
  ;[$('t3A'), $('t3B')].forEach(box => {
    ;[...box.children].forEach((c, i) => c.classList.toggle('cue', i === cueI))
  })
}
function cueStart(){
  clearInterval(cueT)
  cueT = setInterval(() => { cueI = (cueI + 1) % 3; cueDraw() }, 1600)
}
cueStart()

// ── ② the battleroom ───────────────────────────────────────────────────
let roomT = null
function roomClock(secs){
  clearInterval(roomT)
  const el = $('roomClk')
  if(secs == null){ el.textContent = ''; el.classList.remove('low'); return }
  let left = secs
  const draw = () => { el.textContent = mmss(left); el.classList.toggle('low', left <= 15) }
  draw()
  roomT = setInterval(() => { left = Math.max(0, left-1); draw(); if(left <= 0) clearInterval(roomT) }, 1000)
}
function drawRoom(){
  $('rmA').textContent = String(MN.teamA || 'TEAM A').toUpperCase()
  $('rmB').textContent = String(MN.teamB || 'TEAM B').toUpperCase()
}

// ── ③ the match ────────────────────────────────────────────────────────
let clkT = null
function matchClock(secs){
  clearInterval(clkT)
  const el = $('mClk')
  if(secs == null){ el.textContent = ''; el.classList.remove('low'); return }
  let left = secs
  const draw = () => { el.textContent = mmss(left); el.classList.toggle('low', left <= 10) }
  draw()
  clkT = setInterval(() => { left = Math.max(0, left-1); draw(); if(left <= 0) clearInterval(clkT) }, 1000)
}
// Names shrink to fit rather than being clipped, measured after the face
// loads: measured against the fallback they come back about 18% narrow.
function fitMatch(){
  for(const id of ['mnA','mnB']){
    const el = $(id); if(!el) continue
    const room = el.parentElement.clientWidth
    let px = 76; el.style.fontSize = px + 'px'
    const w = () => { const r = document.createRange(); r.selectNodeContents(el)
      return r.getBoundingClientRect().width }
    while(w() > room && px > 34){ px -= 2; el.style.fontSize = px + 'px' }
  }
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitMatch(); drawTeams() })

function drawMatch(){
  const nameA = pickName(MN.left,  MN.pickA) || MN.teamA || '—'
  const nameB = pickName(MN.right, MN.pickB) || MN.teamB || '—'
  if(!MN.manualA) $('mnA').textContent = String(nameA).toUpperCase()
  if(!MN.manualB) $('mnB').textContent = String(nameB).toUpperCase()
  $('mtA').textContent = String(MN.teamA || '').toUpperCase()
  $('mtB').textContent = String(MN.teamB || '').toUpperCase()
  fitMatch()
}

/* ═══════════════════════════════════════════════════════════════════════
   THE RUNDOWN — the one thing on this canvas with no desktop counterpart,
   which is why it is still here after everything else moved up into the
   feed slot. Full frame, shutters gone, one fighter at a time.
   ═══════════════════════════════════════════════════════════════════════ */
const RD = { list: [], i: 0, t: null }
const RD_MS = 7000
const wcShort = w => String(w || '').replace(/_/g,' ').toUpperCase()
const wcFit = w => { const t = wcShort(w); if(t.length <= 12) return t
  return t.replace(/\s*HEAVYWEIGHT$/, ' HEAVY').replace(/WEIGHT$/, '').trim() }
const inches = v => {
  const s = String(v ?? '').trim(); if(!s) return null
  let m = s.match(/^(\d+)\s*['’]\s*(\d+(?:\.\d+)?)?/); if(m) return (+m[1])*12 + (m[2] ? +m[2] : 0)
  m = s.match(/^(\d+(?:\.\d+)?)\s*cm\b/i); if(m) return +m[1]/2.54
  m = s.match(/^(\d+(?:\.\d+)?)/); if(m){ const n = +m[1]; return n > 40 && n < 90 ? n : null }
  return null
}
const ftin = v => { const n = inches(v); return n ? `${Math.floor(n/12)}'${Math.round(n%12)}"` : String(v) }
const inchOf = v => { const n = inches(v); return n ? `${Math.round(n)}"` : String(v) }

function setRundown(on){
  document.body.classList.toggle('rundown', !!on)
  if(!on){ clearTimeout(RD.t); RD.t = null }
}
async function buildRundown(names){
  if(!CARDS) await loadCards()
  if(!CARDS) return []
  return names.filter(has).map(n => {
    const f = cardOf(n) || {}
    return { name:n, nickname:f.nickname, photo:f.profile_photo_url, champ:!!f.is_champion,
      rank:f.rank, ko:f.headline_ko_wins, team:f.team, wc:f.weight_class,
      height:f.height, reach:f.reach, stance:f.stance, record:recOf(f) }
  })
}
function rdDraw(){
  const f = RD.list[RD.i]; if(!f) return
  const el = $('rundown')
  el.classList.remove('step'); void el.offsetWidth; el.classList.add('step')
  const img = $('rdImg')
  if(has(f.photo)){ img.style.backgroundImage = `url('${f.photo}')`; $('rdMono').textContent = '' }
  // No photo is not an error — the monogram is the same fallback the profile
  // card uses, so a thin roster renders as a designed plate, not a black box.
  else { img.style.backgroundImage = 'none'; $('rdMono').textContent = String(f.name || '?').slice(0,1).toUpperCase() }
  $('rdBadge').textContent = has(f.team) ? String(f.team).toUpperCase() : 'IN THE RING'
  $('rdBelt').classList.toggle('on', !!f.champ)
  $('rdName').textContent = String(f.name).toUpperCase()
  $('rdNick').textContent = has(f.nickname) ? `"${f.nickname}"` : ''
  const cells = []
  const cell = (l, v, gold) => cells.push(`<div class="s"><div class="l">${l}</div><div class="v${gold?' gold':''}">${esc(v)}</div></div>`)
  if(has(f.record)) cell('RECORD', f.record)
  if(+f.ko > 0)     cell('KO WINS', String(+f.ko))
  if(+f.rank > 0)   cell('RANKED', '#' + (+f.rank), true)
  if(has(f.wc))     cell('DIVISION', wcFit(f.wc))
  if(has(f.height)) cell('HEIGHT', ftin(f.height))
  if(has(f.reach))  cell('REACH', inchOf(f.reach))
  if(has(f.stance)) cell('STANCE', String(f.stance).toUpperCase())
  $('rdStats').innerHTML = cells.slice(0, 6).join('')
  $('rdDots').innerHTML = RD.list.map((_, i) => `<span class="d${i===RD.i?' on':''}"></span>`).join('')
}
function rdSchedule(){ clearTimeout(RD.t); RD.t = setTimeout(rdNext, RD_MS) }
function rdNext(){
  if(!RD.list.length) return
  RD.i = (RD.i + 1) % RD.list.length
  rdDraw(); rdSchedule()
}
async function startRundown(){
  // UBAe's rundown is a BOUT intro, not a pre-show segment: the two fighters
  // the coaches just picked, not fourteen names off a card. Falls back to the
  // six revealed starters when nobody has been picked yet.
  const picked = [pickName(MN.left, MN.pickA), pickName(MN.right, MN.pickB)].filter(has)
  const names = picked.length === 2 ? picked : [...(MN.left||[]), ...(MN.right||[])]
  const list = await buildRundown(names)
  if(!list.length){ console.log('[vertical] rundown has nobody to show — holding'); return }
  RD.list = list; RD.i = 0
  setRundown(true); rdDraw(); rdSchedule()
}

/* ═══════════════════════════════════════════════════════════════════════
   THE WIRE
   ═══════════════════════════════════════════════════════════════════════ */
const MN = { teamA:null, teamB:null, left:[], right:[], usedL:[], usedR:[],
             pickA:null, pickB:null, scoreA:0, scoreB:0, round:1,
             manualA:false, manualB:false }
const pickName = (arr, i) => (i == null || i < 0) ? null : (arr || [])[i] || null

/* ── the minimal tape, under the six faces ────────────────────────────
   Five rows at most. It is the answer to "who are these two" for somebody
   who arrived thirty seconds ago, not a full tape -- the full one is a
   desktop graphic and arrives through the slot when it is pressed. */
let CARDS = null
const rankNum = v => { const m = String(v ?? '').match(/(\d+)/); return m ? +m[1] : null }
const cardOf = n => (CARDS || []).find(c => norm(c.display_name) === norm(n)) || null
const recOf = f => (f && f.headline_wins != null)
  ? `${f.headline_wins||0}-${f.headline_losses||0}${f.headline_draws?'-'+f.headline_draws:''}` : null
const MT = [
  { l:'RECORD', get:f => recOf(f) },
  { l:'RANK',   get:f => (+f.rank > 0) ? '#'+(+f.rank) : null,
    lead:(a,b)=>{const x=rankNum(a),y=rankNum(b);return (x&&y)?(x<y?-1:x>y?1:0):0} },
  { l:'HEIGHT', get:f => has(f.height) ? ftin(f.height) : null,
    lead:(a,b)=>{const x=inches(a),y=inches(b);return (x!==null&&y!==null)?(x>y?-1:x<y?1:0):0} },
  { l:'REACH',  get:f => has(f.reach) ? inchOf(f.reach) : null,
    lead:(a,b)=>{const x=inches(a),y=inches(b);return (x!==null&&y!==null)?(x>y?-1:x<y?1:0):0} },
  { l:'STANCE', get:f => has(f.stance) ? String(f.stance).toUpperCase() : null },
]
function drawMiniTape(){
  const box = $('mtape')
  const nA = pickName(MN.left, MN.pickA), nB = pickName(MN.right, MN.pickB)
  if(!has(nA) || !has(nB) || !CARDS){ box.classList.remove('on'); box.innerHTML = ''; return }
  const A = cardOf(nA), B = cardOf(nB)
  if(!A && !B){ box.classList.remove('on'); box.innerHTML = ''; return }
  const out = []
  for(const r of MT){
    const a = A ? r.get(A) : null, b = B ? r.get(B) : null
    if(!has(a) && !has(b)) continue
    const lead = r.lead ? r.lead(a, b) : 0
    const cell = (v, side) => `<span class="v ${side}${(side==='l'&&lead===-1)||(side==='r'&&lead===1)?' win':''}">`
      + (has(v) ? esc(v) : '—') + '</span>'
    out.push(`<div class="mtrow">${cell(a,'l')}<span class="lb">${r.l}</span>${cell(b,'r')}</div>`)
  }
  box.innerHTML = out.join('')
  box.classList.toggle('on', out.length > 0)
}
async function loadCards(){
  const { data, error } = await sb.from('fighter_cards')
    .select('display_name,nickname,weight_class,rank,is_champion,team,'
          + 'profile_photo_url,headline_wins,headline_losses,headline_draws,headline_ko_wins,'
          + 'height,reach,stance')
  // supabase-js resolves {data:null,error} rather than throwing, so a failed
  // read must leave CARDS null and the tape OFF -- an empty tape under two
  // faces reads as "we have nothing on these men", which is a claim.
  if(error){ console.warn('[vertical] fighter_cards read failed —', error); return }
  CARDS = data || []
  drawMiniTape()
}

// One read at boot for the starter photos. supabase-js resolves
// {data:null,error} rather than throwing, so a failed read must leave the
// map EMPTY and fall through to monograms — never be mistaken for a roster
// where nobody has a photo.
async function loadPhotos(){
  const { data, error } = await sb.from('ubae_fighter_records')
    .select('stage_name,photo_thumb_url')
  if(error){ console.warn('[vertical] photo read failed —', error); return }
  ;(data || []).forEach(r => { if(r.photo_thumb_url) PHOTO[norm(r.stage_name)] = r.photo_thumb_url })
  drawTeams()
}

sb.channel('vga-overlay').on('broadcast', { event:'cmd' }, ({ payload: c }) => {
  if(!c) return
  if(has(c.league)) setLeague(c.league)

  // THE BATTLEROOM PUSH carries everything this half needs: both teams, both
  // lineups, who is picked, who is spent, the score and the round. Every field
  // is guarded because mnReset sends a PARTIAL payload — reading a missing
  // team as blank would wipe the rail on the press that resets the score.
  if(c.type === 'pickbar' && c.d){
    const d = c.d
    setLeague('ubae')
    if(has(d.teamA)) MN.teamA = d.teamA
    if(has(d.teamB)) MN.teamB = d.teamB
    if(Array.isArray(d.left))    MN.left  = d.left
    if(Array.isArray(d.right))   MN.right = d.right
    if(Array.isArray(d.usedL))   MN.usedL = d.usedL
    if(Array.isArray(d.usedR))   MN.usedR = d.usedR
    if('pickL' in d){ MN.pickA = d.pickL; MN.manualA = false }
    if('pickR' in d){ MN.pickB = d.pickR; MN.manualB = false }
    if(d.scoreA != null) MN.scoreA = +d.scoreA
    if(d.scoreB != null) MN.scoreB = +d.scoreB
    if(d.round != null)  MN.round = +d.round
    drawRail(); drawTeams(); drawRoom(); drawMatch()
    $('mRd').textContent = 'ROUND ' + MN.round
    // The pick CLOCK is the one field that means "we are in the room right
    // now" — the deck only ever sends it on the press that starts the 2:00.
    if(d.timer != null){ roomClock(+d.timer); mode('mRoom'); return }
    if(MODE !== 'mMatch') mode('mTeams')
    return
  }

  // A MATCH STARTING is what moves this half to the clock. Both the UBA-style
  // {bout} and the {clock} toggle say it, so either press lands the same way.
  if(c.type === 'clock'){
    if(c.show === false){ mode('mTeams'); return }
    setRundown(false); mode('mMatch'); drawMatch()
    return
  }
  if(c.type === 'bout' && c.d){
    // A typed name is a REPLACEMENT fighter and must outrank the pick until
    // the next push — otherwise the graphic goes back to naming the man who
    // pulled out the moment the deck refreshes.
    if(has(c.d.a)){ $('mnA').textContent = String(c.d.a).toUpperCase(); MN.manualA = true }
    if(has(c.d.b)){ $('mnB').textContent = String(c.d.b).toUpperCase(); MN.manualB = true }
    if(has(c.d.colorL)) $('mcA').style.background = c.d.colorL
    if(has(c.d.colorR)) $('mcB').style.background = c.d.colorR
    setRundown(false); mode('mMatch'); fitMatch()
    return
  }
  if(c.type === 'corner' && c.d){
    if(has(c.d.l)) $('mcA').style.background = c.d.l
    if(has(c.d.r)) $('mcB').style.background = c.d.r
    return
  }
  if(c.type === 'round'){ MN.round = +c.n; $('mRd').textContent = 'ROUND ' + c.n; return }
  // Two names for one thing: UBA drives 'clocktimer', UBAe drives
  // 'matchtimer'. This canvas has one clock, so it answers both.
  if(c.type === 'clocktimer' || c.type === 'matchtimer'){
    matchClock(c.on === false ? null : c.secs); return
  }

  // STANDBY means the show is between things. The desktop scene in the feed
  // slot is already drawing whichever screen was pressed, so this half does
  // not answer the VIEW at all — it just goes back to the two teams. That is
  // the rule that keeps one press from rendering the same thing twice.
  if(c.type === 'standby'){
    setRundown(false)
    if(c.on !== false && c.view !== 'off') mode('mTeams')
    return
  }

  // THE RUNDOWN — vertical only, its own command. {type:'rundown'} belongs to
  // the horizontal card list and sharing it would flip that graphic on with a
  // payload shaped for this one.
  if(c.type === 'vrundown'){
    if(c.on === false){ setRundown(false); return }
    if(c.step === 'next'){ rdNext(); return }
    startRundown()
    return
  }
}).subscribe(s => { if(s === 'SUBSCRIBED') console.log('[vertical] live') })

// first paint
drawRail(); drawTeams(); drawRoom(); mode('mTeams')
loadPhotos(); loadCards()

/* ── checking it without a deck ──────────────────────────────────────
   ?mode=teams|room|match  ·  ?demo=1 fills it with a real-looking match  */
if(Q.get('demo') === '1'){
  MN.teamA='UKFC UNCS'; MN.teamB='Ring Reapers'
  MN.left=['Gold-E-Lockz','Bing Ling','baz']; MN.right=['slove','dragon5000','Yow']
  MN.usedL=[0]; MN.usedR=[1]; MN.pickA=1; MN.pickB=2
  MN.scoreA=2; MN.scoreB=1; MN.round=4
  setLeague('ubae'); drawRail(); drawTeams(); drawRoom(); drawMatch()
  $('mRd').textContent='ROUND 4'; matchClock(96); roomClock(83)
}
const m = Q.get('mode')
if(m === 'room')  mode('mRoom')
if(m === 'match') mode('mMatch')
if(Q.get('rundown') === '1') startRundown()
})()
</script>
