<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VGA — Vertical</title>
<!-- ============================================================
     THE VERTICAL CANVAS — ONE COMPOSED FRAME.

     Add THIS as the only 1080x1920 browser source in the vertical
     canvas (Aitum Vertical), with the game capture BEHIND it.

     FOUR FIXED REGIONS, top to bottom:
       CTA sliver      y    0- 88   always up, never moves
       video slot      y   88- 696  1080x608, transparent — the game
                                    shows THROUGH it
       clock sliver    y  696- 812  one symmetrical row
       bottom info     y  812-1920  58% of the frame

     THREE STATES.
       LOADING  between matches: the video slot is covered and the
                whole frame below the CTA is one of six standby
                screens (card · standings · rosters · schedule ·
                team-vs-team · rankings · CTA).
       RUNDOWN  the shutters stay closed and the whole frame becomes
                one fighter at a time — photo, record, rank — walking
                the card in bout order. The UBA 15 rundown without a
                voiceover, so the beat is the graphic's own.
       MATCH    the shutters OPEN — arcade-machine style, splitting
                apart from the centre — revealing the game, the clock
                and whatever the bottom is carrying.

     BOTH LEAGUES. UBA/GFL drive it with {clock, bout, clocktimer};
     UBAe drives it with {clock, pickbar, matchtimer}, and the clock
     sliver grows a team line and a first-to-three score for it. There
     is no league gate on the clock: one vertical canvas is showing one
     show, so whichever clock is running is this canvas's clock.

     THE VIDEO SLOT IS TRANSPARENT ON PURPOSE. This page never draws
     the game; OBS composites the capture behind it. The slot only
     carries its frame and, in LOADING, its shutters.

     THE CLOCK IS ONE ROW, NOT A STACK. A fight clock is read left to
     right across a centre — name, corner, time, corner, name — and
     stacking it made a 400px tower out of something that is 116px of
     information. Symmetrical about the centre line so neither fighter
     reads as the home side.
     ============================================================= -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Barlow+Condensed:wght@500;700;900&family=Barlow:wght@500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --pur:#9b30ff; --hi:#cc66ff; --pink:#ff33cc; --gold:#ffce00; --green:#5cf2a0;
    --panel:rgba(14,0,30,.92); --line:rgba(155,48,255,.3); --dim:rgba(200,160,255,.6);
    --accent:var(--pur); --glow:rgba(155,48,255,.55);
    /* THE ONE PLACE THE COMPOSITION LIVES. Change these and every region
       follows; nothing below hardcodes a y position. */
    --cta:88px; --feed:608px; --clock:116px;
  }
  body.gfl{ --accent:#e8312a; --glow:rgba(232,49,42,.55); --hi:#ff6a5e; --pink:#ff3b2f; }
  html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;
    font-family:'Barlow Condensed',sans-serif;color:#fff;}

  /* ── CTA SLIVER ───────────────────────────────────────────────────── */
  #cta{position:absolute;top:0;left:0;right:0;height:var(--cta);z-index:40;
    display:flex;align-items:center;justify-content:center;gap:22px;
    background:linear-gradient(180deg,rgba(12,0,26,.97),rgba(8,0,18,.92));
    border-bottom:2px solid var(--accent);box-shadow:0 4px 26px rgba(0,0,0,.5);}
  #cta .k{font-family:'Press Start 2P',monospace;font-size:13px;letter-spacing:.24em;
    color:var(--hi);text-shadow:0 0 12px var(--glow);}
  #cta .v{font-weight:900;font-size:40px;letter-spacing:.05em;text-transform:uppercase;
    text-shadow:0 0 22px var(--glow);}
  #cta .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 14px var(--accent);animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* ── VIDEO SLOT ───────────────────────────────────────────────────── */
  /* Transparent. Only the frame and the shutters are drawn here. */
  #slot{position:absolute;top:var(--cta);left:0;right:0;height:var(--feed);z-index:20;}
  #slot .edge{position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 0 2px rgba(155,48,255,.35), inset 0 0 40px rgba(155,48,255,.14);}
  /* the arcade shutters — two halves that part from the centre line */
  .shut{position:absolute;left:0;right:0;height:50%;overflow:hidden;
    background:linear-gradient(180deg,#0b0018,#16062e);
    transition:transform .78s cubic-bezier(.7,0,.2,1);}
  #shutT{top:0;   border-bottom:2px solid var(--accent);}
  #shutB{bottom:0;border-top:2px solid var(--accent);}
  body.open #shutT{transform:translateY(-100%);}
  body.open #shutB{transform:translateY(100%);}
  /* what is printed across the closed shutters */
  #shutTxt{position:absolute;top:0;left:0;right:0;height:100%;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;pointer-events:none;transition:opacity .3s ease;}
  body.open #shutTxt{opacity:0;}
  #shutTxt .k{font-family:'Press Start 2P',monospace;font-size:14px;letter-spacing:.3em;color:var(--hi);}
  #shutTxt .v{font-weight:900;font-size:66px;line-height:.92;text-transform:uppercase;text-align:center;
    text-shadow:0 0 30px var(--glow);padding:0 60px;}
  #shutTxt .s{font:600 24px 'Barlow';color:var(--dim);letter-spacing:.14em;text-transform:uppercase;}
  /* the scan bar that travels the shutters while waiting */
  #scan{position:absolute;left:0;right:0;height:3px;z-index:3;
    background:linear-gradient(90deg,transparent,var(--hi),transparent);
    animation:scan 3.4s linear infinite;opacity:.7;}
  @keyframes scan{0%{top:0}100%{top:100%}}
  body.open #scan{display:none;}

  /* ── CLOCK SLIVER — one row, symmetrical ──────────────────────────── */
  #clock{position:absolute;top:calc(var(--cta) + var(--feed));left:0;right:0;
    height:var(--clock);z-index:30;display:grid;
    /* name | corner | CENTRE | corner | name — the centre column is fixed so
       the timer sits on the frame's true midline whatever the names do */
    grid-template-columns:1fr 14px 290px 14px 1fr;align-items:stretch;
    background:linear-gradient(180deg,rgba(13,0,28,.96),rgba(8,0,18,.97));
    border-top:1px solid var(--line);border-bottom:2px solid var(--accent);
    opacity:0;transform:translateY(-14px);
    transition:opacity .45s cubic-bezier(.16,1,.3,1), transform .45s cubic-bezier(.16,1,.3,1);}
  body.open.clockon #clock{opacity:1;transform:none;}
  #clock .nm{display:flex;align-items:center;font-weight:900;font-size:52px;
    text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;overflow:hidden;
    text-shadow:0 0 22px var(--glow);padding:0 26px;}
  #clock .nm.l{justify-content:flex-end;} #clock .nm.r{justify-content:flex-start;}
  #clock .cor{align-self:stretch;}                       /* the corner colour */
  #clock .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(180deg,rgba(155,48,255,.2),rgba(255,51,204,.12));
    border-left:1px solid var(--line);border-right:1px solid var(--line);}
  body.gfl #clock .mid{background:linear-gradient(180deg,rgba(232,49,42,.22),rgba(255,120,40,.12));}
  #tm{font-weight:900;font-size:54px;line-height:1;letter-spacing:.02em;color:var(--gold);
    font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(255,206,0,.5);}
  #tm.low{color:#ff4d4d;text-shadow:0 0 22px rgba(255,77,77,.6);animation:pulse 1s ease-in-out infinite;}
  #rd{font-family:'Press Start 2P',monospace;font-size:12px;letter-spacing:.16em;
    color:#fff;margin-top:8px;text-shadow:0 0 12px var(--glow);}
  /* the bout label rides UNDER the sliver so the row itself stays one line */
  #boutTag{position:absolute;top:calc(var(--cta) + var(--feed) + var(--clock));left:0;right:0;
    z-index:29;display:flex;justify-content:center;pointer-events:none;
    opacity:0;transition:opacity .4s ease .2s;}
  body.open.clockon #boutTag{opacity:1;}
  #boutTag span{background:var(--accent);color:#fff;font-family:'Press Start 2P',monospace;
    font-size:11px;letter-spacing:.2em;padding:7px 20px;box-shadow:0 6px 20px rgba(0,0,0,.5);}

  /* ── BOTTOM INFO ──────────────────────────────────────────────────── */
  #bot{position:absolute;top:calc(var(--cta) + var(--feed) + var(--clock));bottom:0;left:0;right:0;
    z-index:25;padding:56px 46px 40px;overflow:hidden;}
  /* When the clock is down the bottom starts right under the slot instead —
     one rule, so a scene with no clock does not leave a 116px hole. */
  body:not(.clockon) #bot{top:calc(var(--cta) + var(--feed));}
  .pane{position:absolute;inset:0;padding:inherit;display:none;flex-direction:column;}
  .pane.on{display:flex;animation:panein .5s cubic-bezier(.16,1,.3,1);}
  @keyframes panein{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}

  .ph{font-family:'Press Start 2P',monospace;font-size:13px;letter-spacing:.26em;
    color:var(--hi);text-align:center;text-shadow:0 0 12px var(--glow);margin-bottom:6px;}
  .pt{font-weight:900;font-size:50px;line-height:.94;text-transform:uppercase;text-align:center;
    text-shadow:0 0 26px var(--glow);margin-bottom:22px;}

  /* tale of the tape, compact — the stat column is what earns the space */
  .trow{display:grid;grid-template-columns:1fr 190px 1fr;align-items:center;
    padding:13px 20px;border-top:1px solid var(--line);background:var(--panel);}
  .trow:last-child{border-bottom:1px solid var(--line);}
  .trow .v{font-weight:700;font-size:38px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .trow .v.r{text-align:right;}
  .trow .v.win{color:var(--gold);text-shadow:0 0 16px rgba(255,206,0,.45);}
  .trow .lb{font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:.16em;
    color:var(--hi);text-align:center;}
  .tnames{display:grid;grid-template-columns:1fr 190px 1fr;align-items:end;margin-bottom:16px;}
  .tnames .n{font-weight:900;font-size:44px;text-transform:uppercase;line-height:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tnames .n.r{text-align:right;}
  .tnames .vs{font-family:'Press Start 2P',monospace;font-size:22px;color:var(--pink);
    text-align:center;text-shadow:0 0 16px rgba(255,51,204,.6);}
  body.on .trow{animation:dealin .4s cubic-bezier(.16,1,.3,1) backwards;}
  @keyframes dealin{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

  /* the dossier pane */
  #paneWho .big{font-weight:900;font-size:82px;line-height:.92;text-transform:uppercase;
    text-shadow:0 0 32px var(--glow);}
  #paneWho .nick{font:500 30px 'Barlow';color:var(--gold);font-style:italic;margin-top:8px;}
  #paneWho .chips{display:flex;gap:40px;margin-top:26px;flex-wrap:wrap;}
  #paneWho .chip .l{font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:.18em;
    color:var(--dim);margin-bottom:9px;}
  #paneWho .chip .v{font-weight:700;font-size:46px;line-height:.9;}
  #paneWho .chip .v.gold{color:var(--gold);}

  /* the loading pane fills everything under the CTA when closed */
  /* The loading screen is TWO parts that make one picture: the shutters carry
     the event name across the slot, and this carries the card underneath them.
     It used to start at the CTA and cover the slot, so it drew straight over
     the shutter title — two loading screens fighting for the same 608px. */
  #load{position:absolute;top:calc(var(--cta) + var(--feed));bottom:0;left:0;right:0;z-index:22;
    padding:0 46px 46px;display:flex;flex-direction:column;
    transition:opacity .4s ease;}
  body.open #load{opacity:0;pointer-events:none;}
  #load .body{flex:1;min-height:0;padding-top:30px;
    display:flex;flex-direction:column;justify-content:center;}
  #load .body > *{flex:none;}
  .lrow{display:grid;grid-template-columns:56px 1fr 130px;align-items:center;gap:14px;
    padding:13px 18px;margin-bottom:9px;background:var(--panel);border-left:4px solid var(--pur);}
  .lrow .r{font-family:'Press Start 2P',monospace;font-size:13px;color:var(--hi);}
  .lrow .n{font-weight:700;font-size:33px;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lrow .x{font-weight:700;font-size:28px;text-align:right;color:var(--dim);}

  /* ── UBAe: the clock sliver grows a team line and a score ──────────────
     A UBAe bout is two TEAMS' representatives, and the score of the match
     is the thing the fighters' own names cannot tell you. Both are gated to
     .ubae so a UBA night's sliver is exactly what it was. */
  #clock .nm{flex-direction:column;justify-content:center;gap:2px;}
  #clock .nm.l{align-items:flex-end;} #clock .nm.r{align-items:flex-start;}
  #clock .who{font-weight:900;font-size:52px;line-height:1;white-space:nowrap;
    text-shadow:0 0 22px var(--glow);}
  #clock .team{font:600 19px 'Barlow';letter-spacing:.2em;color:var(--dim);
    text-transform:uppercase;white-space:nowrap;display:none;}
  body.ubae #clock .team{display:block;}
  #pips{display:none;gap:5px;align-items:center;margin-bottom:5px;}
  body.ubae #pips{display:flex;}
  #pips .p{width:15px;height:9px;background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.22);}
  #pips .p.on{background:var(--hi);border-color:var(--hi);box-shadow:0 0 9px var(--glow);}
  #pips .sep{width:12px;height:1px;background:var(--dim);margin:0 3px;}

  /* ── the standby SCREENS ───────────────────────────────────────────────
     Six screens, not fifteen. The horizontal standby carries a playoff
     bracket and a card-collection wall; at 1080 wide with 1112px of height
     those become unreadable rather than smaller, so a press for one of them
     HOLDS whatever is already on air instead of blanking this canvas. */
  .conf-h{font-family:'Press Start 2P',monospace;font-size:13px;letter-spacing:.24em;
    color:var(--hi);margin:18px 0 10px;text-shadow:0 0 12px var(--glow);}
  .conf-h:first-child{margin-top:0;}
  .srow{display:grid;grid-template-columns:56px 1fr 150px 92px;align-items:center;gap:12px;
    padding:12px 18px;margin-bottom:8px;background:var(--panel);border-left:4px solid var(--pur);}
  .srow.lead{border-left-color:var(--gold);}
  .srow .rk{font-family:'Press Start 2P',monospace;font-size:14px;color:var(--hi);}
  .srow .nm{font-weight:700;font-size:34px;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .srow .rec{font-weight:700;font-size:30px;text-align:right;}
  .srow .df{font-weight:700;font-size:26px;text-align:right;color:var(--dim);}

  .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .tcol{background:var(--panel);border-top:3px solid var(--accent);padding:12px 16px;}
  .tcol .th{font-weight:900;font-size:28px;line-height:1;text-transform:uppercase;margin-bottom:8px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tcol .plr{font:600 22px/1.15 'Barlow';color:#e6d8ff;padding:2px 0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tcol .ct{font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:.2em;
    color:var(--dim);margin-top:9px;}

  .rrow{display:grid;grid-template-columns:64px 1fr 200px;align-items:center;gap:12px;
    padding:10px 18px;margin-bottom:7px;background:var(--panel);border-left:4px solid var(--pur);}
  .rrow.one{border-left-color:var(--gold);}
  .rrow .n{font-family:'Press Start 2P',monospace;font-size:14px;color:var(--hi);}
  .rrow .nm{font-weight:700;font-size:32px;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rrow .wc{font:600 20px 'Barlow';letter-spacing:.12em;text-align:right;color:var(--dim);
    text-transform:uppercase;}

  /* team vs team is the one screen that is a PICTURE, not a list — it is on
     air while two teams walk out, and a list would be read instead of them */
  .tvs{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;}
  .tvs .t{font-weight:900;font-size:96px;line-height:.9;text-transform:uppercase;text-align:center;
    text-shadow:0 0 34px var(--glow);padding:0 20px;}
  .tvs .v{font-family:'Press Start 2P',monospace;font-size:34px;color:var(--pink);
    text-shadow:0 0 20px rgba(255,51,204,.6);}
  .tvs .when{font:600 26px 'Barlow';letter-spacing:.2em;color:var(--dim);text-transform:uppercase;}

  .ctaBig{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
  .ctaBig .l{font-family:'Press Start 2P',monospace;font-size:14px;letter-spacing:.26em;color:var(--hi);}
  .ctaBig .u{font-weight:900;font-size:74px;letter-spacing:.03em;text-transform:uppercase;
    text-shadow:0 0 30px var(--glow);}
  .ctaBig .s{font:600 27px 'Barlow';color:var(--dim);letter-spacing:.16em;text-transform:uppercase;}

  .empty{font:600 28px 'Barlow';color:var(--dim);letter-spacing:.14em;text-transform:uppercase;
    text-align:center;padding-top:60px;}

  /* ── THE RUNDOWN — one fighter at a time, the whole frame ───────────────
     Not a bottom-third pane: the rundown runs with the shutters CLOSED, so
     there is no game behind it and the photo is allowed the 820px that makes
     it a portrait rather than a thumbnail. It is a third closed state
     alongside the loading card, which is why it draws over #load rather than
     living inside it — the two can never be on at once. */
  #rundown{position:absolute;top:var(--cta);bottom:0;left:0;right:0;z-index:26;
    display:none;flex-direction:column;overflow:hidden;
    background:linear-gradient(180deg,#0b0018,#16062e 42%,#0b0018);}
  body.rundown #rundown{display:flex;}
  body.rundown #load{opacity:0;pointer-events:none;}
  #rdPhoto{position:relative;flex:1;min-height:0;overflow:hidden;}
  #rdImg{position:absolute;inset:0;background-size:cover;background-position:center 12%;}
  #rdMono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:300px;line-height:1;color:rgba(216,180,254,.09);}
  #rdPhoto .glowplate{position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 32%,rgba(155,48,255,.28),transparent 62%);}
  #rdPhoto .fade{position:absolute;left:0;right:0;bottom:0;height:300px;
    background:linear-gradient(180deg,transparent,#0b0018 88%);}
  #rdPhoto .scanline{position:absolute;left:0;right:0;height:3px;
    background:linear-gradient(90deg,transparent,var(--hi),transparent);
    animation:scan 4.2s linear infinite;opacity:.55;}
  #rdBadge{position:absolute;top:26px;left:0;z-index:3;background:var(--accent);
    font-family:'Press Start 2P',monospace;font-size:12px;letter-spacing:.2em;
    padding:11px 22px;box-shadow:0 6px 22px rgba(0,0,0,.55);}
  #rdBelt{position:absolute;top:26px;right:0;z-index:3;background:var(--gold);color:#1a0f00;
    font-family:'Press Start 2P',monospace;font-size:12px;letter-spacing:.2em;
    padding:11px 22px;display:none;}
  #rdBelt.on{display:block;}
  #rdInfo{flex:none;padding:0 46px 30px;margin-top:-130px;position:relative;z-index:4;}
  #rdName{font-weight:900;font-size:104px;line-height:.88;text-transform:uppercase;
    text-shadow:0 0 36px var(--glow);}
  #rdNick{font:500 34px 'Barlow';font-style:italic;color:var(--gold);margin-top:10px;}
  #rdStats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:34px;}
  #rdStats .s{background:var(--panel);border-top:3px solid var(--accent);padding:16px 18px;}
  #rdStats .s .l{font-family:'Press Start 2P',monospace;font-size:10px;letter-spacing:.18em;
    color:var(--dim);margin-bottom:10px;}
  #rdStats .s .v{font-weight:900;font-size:46px;line-height:.9;white-space:nowrap;}
  #rdStats .s .v.gold{color:var(--gold);}
  #rdDots{display:flex;gap:7px;justify-content:center;padding:0 46px 30px;flex-wrap:wrap;}
  #rdDots .d{width:26px;height:5px;background:rgba(255,255,255,.16);}
  #rdDots .d.on{background:var(--hi);box-shadow:0 0 10px var(--glow);}
  /* every card arrives the same way, so the sequence has a beat */
  #rundown.step #rdPhoto,#rundown.step #rdInfo{animation:rdin .55s cubic-bezier(.16,1,.3,1);}
  @keyframes rdin{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:none;}}

  #crt{position:absolute;inset:0;pointer-events:none;z-index:60;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);}
  #vig{position:absolute;inset:0;pointer-events:none;z-index:59;
    background:radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.5) 100%);}
</style>
</head>
<body>

<div id="cta">
  <span class="dot"></span>
  <span class="k">JOIN THE LEAGUE</span>
  <span class="v" id="ctaUrl">DISCORD.GG/UBA</span>
</div>

<div id="slot">
  <div class="shut" id="shutT"></div>
  <div class="shut" id="shutB"></div>
  <div id="scan"></div>
  <div id="shutTxt">
    <div class="k" id="loadKick">STANDING BY</div>
    <div class="v" id="loadTitle">UBA</div>
    <div class="s" id="loadSub"></div>
  </div>
  <div class="edge"></div>
</div>

<div id="clock">
  <div class="nm l"><span class="who" id="cnL">—</span><span class="team" id="ctL"></span></div>
  <div class="cor" id="corL" style="background:#3a3a44"></div>
  <div class="mid"><div id="pips"></div><div id="tm">0:00</div><div id="rd">ROUND 1</div></div>
  <div class="cor" id="corR" style="background:#3a3a44"></div>
  <div class="nm r"><span class="who" id="cnR">—</span><span class="team" id="ctR"></span></div>
</div>
<div id="boutTag"><span id="boutTagTxt">MAIN EVENT</span></div>

<div id="bot">
  <div class="pane" id="paneTape">
    <div class="ph" id="tapeKick">TALE OF THE TAPE</div>

<script>
(function(){
const sb = supabase.createClient('https://emzlivoykbhhjcugupit.supabase.co',
  'sb_publishable_pqhH974E1q9YsFnrVH1UJQ_X3V-rRLF')
const $ = id => document.getElementById(id)
const Q = new URLSearchParams(location.search)
const esc = t => String(t ?? '').replace(/[<>&]/g, ch => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[ch]))
const has = v => v !== null && v !== undefined && String(v).trim() !== '' && String(v).trim() !== '—'
const norm = s => String(s ?? '').trim().toLowerCase()
const FUTURE = () => new Date(Date.now() - 6*3600e3).toISOString()

// ── the states ─────────────────────────────────────────────────────────
// open = the shutters are apart and the game is showing through the slot.
// Everything else keys off this one class, so there is exactly one place
// that decides whether the frame is a loading screen or a match.
function setOpen(on){ document.body.classList.toggle('open', !!on) }
function setClock(on){ document.body.classList.toggle('clockon', !!on) }
function pane(which){
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('on'))
  if(which) $(which).classList.add('on')
}
// The rundown is the THIRD closed state. It is mutually exclusive with the
// loading card by construction — one class, one screen — because both want
// the whole frame and neither can be half on air.
function setRundown(on){

  if(!on){ clearTimeout(RD.t); RD.t = null }
}

// ── league skin ────────────────────────────────────────────────────────
let SPLIT = 'Summer Split'
function setLeague(lg){
  const k = norm(lg) === 'gfl' ? 'gfl' : norm(lg) === 'ubae' ? 'ubae' : 'uba'

}

// ── clock ──────────────────────────────────────────────────────────────
let tHandle = null
function timer(secs){
  clearInterval(tHandle)
  const el = $('tm')
  if(secs == null){ el.textContent = ''; el.classList.remove('low'); return }
  let left = secs
  const draw = () => { el.textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`
    el.classList.toggle('low', left <= 10) }
  draw()
  tHandle = setInterval(() => { left = Math.max(0, left-1); draw(); if(left <= 0) clearInterval(tHandle) }, 1000)
}
// Names shrink to fit their half rather than being clipped. Measured after
// the face loads: measured against the fallback they come back narrow.
// The name is now a span inside its half, so the ROOM is the half's width and
// the thing that shrinks is the span — measuring the span against itself
// would have found it always fits.
function fitNames(){
  for(const id of ['cnL','cnR']){
    const el = $(id); if(!el) return
    const room = el.parentElement.clientWidth - 52
    let px = 52; el.style.fontSize = px + 'px'
    const w = () => { const r = document.createRange(); r.selectNodeContents(el)
      return r.getBoundingClientRect().width }
    while(w() > room && px > 22){ px -= 2; el.style.fontSize = px + 'px' }
  }
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitNames)

// A UBAe match is first to three, so the score is three pips a side. Drawn
// only when a score arrives — a UBA night never has one and the row stays
// exactly the height it was.
function drawPips(a, b){
  const sa = Math.max(0, Math.min(3, +a || 0)), sbv = Math.max(0, Math.min(3, +b || 0))
  const side = n => Array.from({length:3}, (_,i) => `<span class="p${i < n ? ' on' : ''}"></span>`).join('')
  $('pips').innerHTML = side(sa) + '<span class="sep"></span>' + side(sbv)
}

// ── tale of the tape, in the bottom half ───────────────────────────────
const inches = v => {
  const s = String(v ?? '').trim(); if(!s) return null
  let m = s.match(/^(\d+)\s*['’]\s*(\d+(?:\.\d+)?)?/); if(m) return (+m[1])*12 + (m[2] ? +m[2] : 0)
  m = s.match(/^(\d+(?:\.\d+)?)\s*cm\b/i); if(m) return +m[1]/2.54
  m = s.match(/^(\d+(?:\.\d+)?)/); if(m){ const n = +m[1]; return n > 40 && n < 90 ? n : null }
  return null
}
const rankNum = v => { const m = String(v ?? '').match(/(\d+)/); return m ? +m[1] : null }
const ftin = v => { const n = inches(v); return n ? `${Math.floor(n/12)}'${Math.round(n%12)}"` : String(v) }
const inchOf = v => { const n = inches(v); return n ? `${Math.round(n)}"` : String(v) }
const TROWS = [
  { k:'record', l:'RECORD' },
  { k:'rank',   l:'RANK',   lead:(a,b)=>{const x=rankNum(a),y=rankNum(b);return (x&&y)?(x<y?-1:x>y?1:0):0} },
  { k:'height', l:'HEIGHT', lead:(a,b)=>{const x=inches(a),y=inches(b);return (x!==null&&y!==null)?(x>y?-1:x<y?1:0):0} },
  { k:'reach',  l:'REACH',  lead:(a,b)=>{const x=inches(a),y=inches(b);return (x!==null&&y!==null)?(x>y?-1:x<y?1:0):0} },
  { k:'age',    l:'AGE' },
  { k:'stance', l:'STANCE' },
  { k:'weight', l:'DIVISION' },
]
function drawTape(d){
  const L = d.left || {}, R = d.right || {}
  $('tnL').textContent = String(L.name || '—').toUpperCase()
  $('tnR').textContent = String(R.name || '—').toUpperCase()
  if(has(d.title)) $('tapeKick').textContent = String(d.title).toUpperCase()
  const out = []
  for(const r of TROWS){
    const a = L[r.k], b = R[r.k]
    // A row neither side can fill is DROPPED — half the roster has no reach
    // and no age, and this pane has 1108px, not a whole frame, to spend.
    if(!has(a) && !has(b)) continue
    const lead = r.lead ? r.lead(a, b) : 0
    const cell = (v, side) => `<span class="v ${side}${(side==='l'&&lead===-1)||(side==='r'&&lead===1)?' win':''}">`
      + (has(v) ? esc(String(v).toUpperCase()) : '—') + `</span>`
    out.push(`<div class="trow">${cell(a,'l')}<span class="lb">${r.l}</span>${cell(b,'r')}</div>`)
  }
  $('tapeRows').innerHTML = out.join('')
  ;[...$('tapeRows').children].forEach((n,i) => { n.style.animationDelay = (60 + i*55) + 'ms' })
  document.body.classList.add('on')
}

// ── dossier, in the bottom half ────────────────────────────────────────
function drawWho(d){
  $('whoName').textContent = String(d.name || '—').toUpperCase()
  $('whoNick').textContent = has(d.nickname) ? `"${d.nickname}"` : ''
  const chips = []
  const chip = (l, v, gold) => `<div class="chip"><div class="l">${l}</div><div class="v${gold?' gold':''}">${esc(v)}</div></div>`
  if(has(d.record)) chips.push(chip('RECORD', d.record))

// ── the data behind every standby screen ───────────────────────────────
// Read ONCE at boot, the way the horizontal standby does, so a deck press
// swaps innerHTML instead of waiting on a round trip mid-show. A failed read
// leaves that slice EMPTY and its screen says so — supabase-js resolves
// {data:null,error} rather than throwing, so treating a failure as "no teams"
// would put an empty league table on air over a working database.
const DATA = { st:[], rec:[], mt:[], ev:[], rk:[] }
async function loadTeamData(){
  const keys = ['st','rec','mt','ev','rk']
  const res = await Promise.all([
    sb.from('team_standings').select('*'),
    sb.from('ubae_fighter_records').select('stage_name,current_team,photo_thumb_url'),
    sb.from('team_matches_public').select('*').eq('status','scheduled').order('match_date').limit(8),
    sb.from('events_public').select('id,name,event_date').eq('status','scheduled')
      .gte('event_date', FUTURE()).order('event_date').limit(4),
    sb.from('rankings_public').select('rank,fighter_name,weight_class,level').eq('scope','weight_class').order('rank'),
  ])
  res.forEach((r, i) => {
    if(r.error){ console.warn('[vertical] ' + keys[i] + ' read failed —', r.error); return }
    DATA[keys[i]] = r.data || []
  })
}

const fdate = d => new Date(d).toLocaleDateString('en-US', { month:'short', day:'numeric' }).toUpperCase()
const ftime = d => new Date(d).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' }).toUpperCase()
const wcShort = w => String(w || '').replace(/_/g,' ').toUpperCase()
// LIGHT HEAVYWEIGHT is 17 characters and a stat cell is 282px. Truncating it
// printed "LIGHT HEAVYW", which reads as a rendering bug rather than a
// division — so the long ones lose the word every division shares.
const wcFit = w => { const t = wcShort(w); if(t.length <= 12) return t
  return t.replace(/\s*HEAVYWEIGHT$/, ' HEAVY').replace(/WEIGHT$/, '').trim() }
function head(kick, title, sub){

  $('loadTitle').textContent = String(title || '').toUpperCase()

const EMPTY = t => `<div class="empty">${esc(t)}</div>`

// ── the six standby screens ────────────────────────────────────────────
// The horizontal standby carries fifteen. A playoff bracket, a rosters-VS
// wall and a card-collection grid do not become smaller at 1080 wide — they
// become unreadable — so this canvas carries the six that survive the width,
// and a press for any of the others HOLDS what is on screen rather than
// blacking out the vertical output mid-show.
const SCREEN = {}

// A NAMED event is taken as given — no status filter. The deck names the card
// it has loaded, and the moment a show goes live that card's status stops
// being 'scheduled'; filtering on it made the graphic go blank at exactly the
// point somebody would press it.
function eventQuery(name){
  const q = sb.from('events_public').select('id,name,event_date')
  return name ? q.eq('name', name)
              : q.eq('status','scheduled').gte('event_date', FUTURE()).order('event_date')
}

SCREEN.card = async (c) => {

  if(error){ console.warn('[vertical] event read failed —', error); return false }

}

  $('loadBody').innerHTML = '<div class="tgrid">' + teams.slice(0, 8).map(t =>
    `<div class="tcol"><div class="th">${esc(t)}</div>
      ${byTeam[t].slice(0,5).map(n => `<div class="plr">${esc(n)}</div>`).join('')}
      <div class="ct">CONF ${esc(confOf[t] || '—')}</div></div>`).join('') + '</div>'
  return true
}

SCREEN.schedule = () => {
  if(!DATA.mt.length) return false
  head('UBAe · ' + SPLIT, 'SCHEDULE', '')
  $('loadBody').innerHTML = DATA.mt.slice(0, 8).map(m =>
    `<div class="lrow"><span class="r">W${m.week}</span>
      <span class="n">${esc(m.team_a_name)} <span style="color:var(--dim)">v</span> ${esc(m.team_b_name)}</span>

SCREEN.teamvs = () => {

  // The deck's pickbar names tonight's two teams before the fixture list does,

  const a = MN.teamA || (m && m.team_a_name), b = MN.teamB || (m && m.team_b_name)
  if(!a || !b) return false
  head('TONIGHT', 'UBAe', SPLIT)
  const when = m ? `WEEK ${m.week} · ${fdate(m.match_date)} · ${ftime(m.match_date)}` : SPLIT
  $('loadBody').innerHTML = `<div class="tvs"><div class="t">${esc(a)}</div>

function rankScreen(level, label){

  if(!rows.length) return false
  head('RANKINGS', label, '')
  // Grouped by division and cut to the top three of each: a vertical frame
  // holds about fourteen rows, and a flat top-fourteen shows one division's

  const byW = {}
  rows.forEach(r => { (byW[r.weight_class] = byW[r.weight_class] || []).push(r) })
  $('loadBody').innerHTML = Object.keys(byW).map(w =>
    `<div class="conf-h">${esc(wcShort(w))}</div>` +
    byW[w].sort((a,b) => a.rank - b.rank).slice(0,3).map(r =>
      `<div class="rrow${r.rank===1?' one':''}"><span class="n">${r.rank}</span>
        <span class="nm">${esc(r.fighter_name)}</span>
        <span class="wc">${esc(wcFit(w))}</span></div>`).join('')).join('')
  return true
}
SCREEN.ubarank = () => rankScreen('pro', 'UBA RANKINGS')
SCREEN.gflrank = () => rankScreen('amateur', 'GFL RANKINGS')

// ── which screen, and the auto-cycle ───────────────────────────────────
const ROTA = {
  ubae: ['teamvs','standings','rosters','schedule','cta'],
  uba:  ['card','ubarank','nextev','cta'],
  gfl:  ['card','gflrank','nextev','cta'],
}
let cycle = null
function stopCycle(){ clearInterval(cycle); cycle = null }

async function showView(view, c){
  const fn = SCREEN[view]
  // An unknown view is a screen this canvas deliberately does not carry
  // (bracket, rosters VS, the card wall). HOLD what is on air — blanking the
  // vertical output because the operator pressed a horizontal-only screen is
  // the worst possible reading of "not supported".
  if(!fn){ console.log('[vertical] no vertical screen for', view, '— holding'); return }
  const ok = await fn(c)
  // A screen with nothing in it is the same problem one step later: it renders
  // an empty panel. Hold instead, and say why in the log.
  if(!ok) console.log('[vertical]', view, 'has no data — holding')
}

async function autoCycle(league){
  const list = ROTA[league] || ROTA.ubae
  let i = 0
  const step = () => showView(list[i++ % list.length], null)
  await step()
  stopCycle()
  cycle = setInterval(step, 15000)
}

// ── THE RUNDOWN ────────────────────────────────────────────────────────
// One fighter at a time, in card order, with the photo the profile already
// has. This is the UBA 15 rundown without the voiceover — so the timing is
// the graphic's own, not a voice's, and it advances on a fixed beat that the
// deck can override with a Next press when the desk is talking over it.
const RD = { list: [], i: 0, t: null }
const RD_MS = 7000

async function buildRundown(eventName){
  const { data: evs, error } = await eventQuery(eventName).limit(1)
  if(error){ console.warn('[vertical] rundown event read failed —', error); return [] }
  const ev = evs && evs[0]; if(!ev) return []
  const [{ data: bs }, cardsRes] = await Promise.all([
    sb.from('event_matches').select('*').eq('event_id', ev.id).order('bout_number'),
    sb.from('fighter_cards').select('display_name,nickname,weight_class,rank,is_champion,country,team,'
      + 'profile_photo_url,headline_wins,headline_losses,headline_draws,headline_ko_wins,height,reach,stance'),
  ])
  if(cardsRes.error) console.warn('[vertical] fighter_cards read failed —', cardsRes.error)
  const cards = cardsRes.data || []
  const find = n => cards.find(c => norm(c.display_name) === norm(n)) || null
  const out = []
  for(const b of (bs || [])){
    if(!b.fighter_a_name || !b.fighter_b_name) continue
    for(const n of [b.fighter_a_name, b.fighter_b_name]){
      const f = find(n) || {}
      out.push({
        name: n, bout: b.bout_number, wc: wcShort(b.weight_class), title: !!b.is_title_fight,
        nickname: f.nickname, photo: f.profile_photo_url, champ: !!f.is_champion,
        rank: f.rank, ko: f.headline_ko_wins, team: f.team, country: f.country,
        height: f.height, reach: f.reach, stance: f.stance,
        record: (f.headline_wins != null)
          ? `${f.headline_wins||0}-${f.headline_losses||0}${f.headline_draws?'-'+f.headline_draws:''}` : null,
      })
    }
  }
  head('THE CARD', ev.name, `${out.length} FIGHTERS`)
  return out
}

function rdDraw(){
  const f = RD.list[RD.i]; if(!f) return
  const el = $('rundown')
  el.classList.remove('step'); void el.offsetWidth; el.classList.add('step')
  const img = $('rdImg')
  if(has(f.photo)){ img.style.backgroundImage = `url('${f.photo}')`; $('rdMono').textContent = '' }
  // No photo is not an error — 245 of 467 fighters have one. The monogram is
  // the same fallback the profile card uses, so a thin roster renders as a
  // designed plate rather than a black rectangle.
  else { img.style.backgroundImage = 'none'; $('rdMono').textContent = String(f.name || '?').slice(0,1).toUpperCase() }
  $('rdBadge').textContent = f.title ? 'TITLE BOUT' : ('BOUT ' + (f.bout ?? '—'))
  $('rdBelt').classList.toggle('on', !!f.champ)
  $('rdName').textContent = String(f.name).toUpperCase()
  $('rdNick').textContent = has(f.nickname) ? `"${f.nickname}"` : ''
  // Three across, and a stat with nothing behind it is DROPPED rather than
  // printed as a dash — half these fighters have no reach and no stance, and a
  // row of dashes reads as a broken graphic, not as a thin profile.
  const cells = []
  const cell = (l, v, gold) => cells.push(`<div class="s"><div class="l">${l}</div><div class="v${gold?' gold':''}">${esc(v)}</div></div>`)
  if(has(f.record)) cell('RECORD', f.record)
  if(+f.ko > 0)     cell('KO WINS', String(+f.ko))
  if(+f.rank > 0)   cell('RANKED', '#' + (+f.rank), true)
  if(has(f.wc))     cell('DIVISION', wcFit(f.wc))
  // Both are stored as bare inches. 70 is a number, 5'10" is a height — and
  // the same 70 under REACH means something completely different, so the
  // units go on rather than being left for the viewer to guess.
  if(has(f.height)) cell('HEIGHT', ftin(f.height))
  if(has(f.reach))  cell('REACH', inchOf(f.reach))
  if(has(f.stance)) cell('STANCE', String(f.stance).toUpperCase())
  if(has(f.team))   cell('TEAM', String(f.team).toUpperCase().slice(0,12))
  $('rdStats').innerHTML = cells.slice(0, 6).join('')
  $('rdDots').innerHTML = RD.list.map((_, i) => `<span class="d${i===RD.i?' on':''}"></span>`).join('')
}

function rdSchedule(){
  clearTimeout(RD.t)
  RD.t = setTimeout(() => { rdNext() }, RD_MS)
}
function rdNext(){
  if(!RD.list.length) return
  RD.i = (RD.i + 1) % RD.list.length
  rdDraw(); rdSchedule()
}
async function startRundown(eventName){
  const list = await buildRundown(eventName)
  if(!list.length){ console.log('[vertical] rundown has no fighters — holding'); return }
  RD.list = list; RD.i = 0
  stopCycle(); setOpen(false); setClock(false); pane(null); setRundown(true)
  rdDraw(); rdSchedule()
}

// ── the wire ───────────────────────────────────────────────────────────
// Tonight's teams, as the deck knows them. The pickbar is the only command
// that carries them, and 'teamvs' reads them back.
const MN = { teamA:null, teamB:null, left:[], right:[] }
const pickName = (arr, i) => (i == null || i < 0) ? null : (arr || [])[i] || null

sb.channel('vga-overlay').on('broadcast', { event:'cmd' }, ({ payload: c }) => {
  if(!c) return
  if(has(c.league)) setLeague(c.league)
  if(has(c.split)) SPLIT = c.split

  // STANDBY closes the shutters and puts a screen back. This is the
  // between-matches state, and it is also what the deck already presses.
  if(c.type === 'standby'){
    if(c.on === false || c.view === 'off'){ setOpen(true); stopCycle(); setRundown(false); return }
    setOpen(false); setClock(false); pane(null); setRundown(false)
    const league = norm(c.league) || document.body.dataset.league || 'ubae'
    if(c.view === 'auto'){ autoCycle(league); return }
    stopCycle(); showView(c.view || 'card', c)
    return
  }

  // THE RUNDOWN — its own command, deliberately not {type:'rundown'}: that one
  // belongs to the horizontal card list, and sharing it would flip a second
  // graphic on with a payload shaped for this one.
  if(c.type === 'vrundown'){
    if(c.on === false){ setRundown(false); return }
    if(c.step === 'next'){ rdNext(); return }
    startRundown(c.event || null)
    return
  }

  // THE CLOCK. Showing it is what OPENS the machine: the shutters part, the
  // game appears, the sliver drops in. That is the arcade moment and it is
  // driven by the press the operator already makes.
  //
  // NO LEAGUE GATE. There is one vertical canvas and it is showing one show,
  // so whichever league's clock is running IS this canvas's clock. The gate
  // that used to be here listed uba and gfl, which meant a UBAe match night
  // streamed a frozen loading screen vertically for its whole duration and
  // nothing errored.
  if(c.type === 'clock'){
    if(c.show === false){ setClock(false); return }
    stopCycle(); setRundown(false); setOpen(true); setClock(true)
    return
  }
  if(c.type === 'bout' && c.d){
    const d = c.d
    if(has(d.a)) $('cnL').textContent = String(d.a).toUpperCase()
    if(has(d.b)) $('cnR').textContent = String(d.b).toUpperCase()
    if(has(d.label)) $('boutTagTxt').textContent = String(d.label).toUpperCase()
    if(has(d.colorL)) $('corL').style.background = d.colorL
    if(has(d.colorR)) $('corR').style.background = d.colorR
    stopCycle(); setRundown(false); setOpen(true); setClock(true); fitNames()
    return
  }

  // THE BATTLEROOM PUSH is UBAe's version of {type:'bout'} — the deck sends
  // the two teams, the two picked fighters and the running score on one
  // command. Every field is guarded because mnReset sends a PARTIAL payload
  // (score and picks only), and reading a missing team as blank would wipe
  // the names off the sliver on the press that resets the score.
  if(c.type === 'pickbar' && c.d){
    const d = c.d
    setLeague('ubae')
    if(has(d.teamA)){ MN.teamA = d.teamA; $('ctL').textContent = String(d.teamA).toUpperCase() }
    if(has(d.teamB)){ MN.teamB = d.teamB; $('ctR').textContent = String(d.teamB).toUpperCase() }
    if(Array.isArray(d.left))  MN.left  = d.left
    if(Array.isArray(d.right)) MN.right = d.right
    // Before a pick is made the TEAM's name stands in for the fighter's. A
    // blank half reads as a graphic that failed, and the pick clock runs for
    // two minutes with nothing else on that side of the row.
    if('pickL' in d) $('cnL').textContent = String(pickName(MN.left,  d.pickL) || MN.teamA || '—').toUpperCase()
    if('pickR' in d) $('cnR').textContent = String(pickName(MN.right, d.pickR) || MN.teamB || '—').toUpperCase()
    if(d.scoreA != null || d.scoreB != null) drawPips(d.scoreA, d.scoreB)
    if(d.round != null) $('rd').textContent = 'ROUND ' + d.round
    if(has(d.split)) SPLIT = d.split
    fitNames()
    return
  }

  if(c.type === 'corner' && c.d){
    if(has(c.d.l)) $('corL').style.background = c.d.l
    if(has(c.d.r)) $('corR').style.background = c.d.r
    return
  }
  if(c.type === 'round'){ $('rd').textContent = 'ROUND ' + c.n; return }
  // Two names for one thing: UBA drives the fight clock's own centre timer
  // ('clocktimer'), UBAe drives the overlay badge ('matchtimer'). This canvas
  // has ONE timer, so it answers both — listening for only the UBA one left
  // 0:00 on screen for every UBAe bout.
  if(c.type === 'clocktimer' || c.type === 'matchtimer'){ timer(c.on === false ? null : c.secs); return }

  // THE TAPE lives in the bottom half during a match. Pressed with the
  // machine closed it is still the full screen it was — the shutters simply
  // have not opened, so the bottom pane is all there is to see.
  if(c.type === 'tape'){
    if(c.on === false){ pane(null); return }
    if(c.d) drawTape(c.d)
    if(c.show === true){ setRundown(false); pane('paneTape') }
    return
  }
  // THE DOSSIER takes the same bottom half. One pane at a time, so they can
  // never draw over each other — the thing four separate sources could not do.
  if(c.type === 'fighter'){
    if(c.on === false || !c.d){ pane(null); return }
    setRundown(false); drawWho(c.d); pane('paneWho')
    clearTimeout(whoTimer); whoTimer = setTimeout(() => pane(null), 14000)
    return
  }
}).subscribe(s => { if(s === 'SUBSCRIBED') console.log('[vertical] live') })
let whoTimer = null

// first paint: closed, showing whatever is next
loadTeamData().then(() => {
  // The team data decides which screen can even be drawn, so the first paint
  // waits for it. A UBAe night opens on tonight's two teams; a solo night on
  // the card, which is what this frame has always opened on.
  const boot = Q.get('view') || (norm(Q.get('league')) === 'ubae' ? 'teamvs' : 'card')
  showView(boot, null)
})

// ?state=open|closed · ?pane=tape|who · ?view=<screen> · ?rundown=1
// for checking it without a deck
if(Q.get('state') === 'open'){ setOpen(true); setClock(true) }
if(Q.get('pane') === 'tape'){
  drawTape({ title:'UBA HEAVYWEIGHT TITLE',
    left:{name:'smokinem',record:'11-2-1',rank:'#7',age:27,height:"6'2",reach:'76',weight:'Heavyweight',stance:'Orthodox'},
    right:{name:'Hello World',record:'5-4',rank:'#12',age:31,height:"6'0",reach:'73',weight:'Heavyweight',stance:'Southpaw'} })
  pane('paneTape'); $('cnL').textContent='SMOKINEM'; $('cnR').textContent='HELLO WORLD'
  $('corL').style.background='#e8312a'; $('corR').style.background='#2e6fe8'; timer(143); fitNames()
}
if(Q.get('pane') === 'who'){
  drawWho({name:'smokinem',nickname:'The Quiet Part',record:'11-2-1',ko:7,rank:7,weight:'Heavyweight'})
  pane('paneWho')
}
if(Q.get('rundown') === '1') startRundown(Q.get('event') || null)
})()
</script>
