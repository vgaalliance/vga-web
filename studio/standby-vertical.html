<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VGA — Standby (Vertical)</title>
<!-- ============================================================
     1080x1920 SIBLING of standby.html. Vertical canvas browser
     source. The horizontal original is untouched.

     A SUBSET, ON PURPOSE. standby.html carries fifteen screens,
     several of which exist to fill a 1920x1080 frame with two
     side-by-side conference columns or a six-team bracket. Those do
     not become vertical screens by being squeezed — a bracket at
     1080 wide is unreadable, and an unreadable bracket on air is
     worse than no bracket. So this carries the six that a phone can
     actually read:

       card       tonight's fight card          (the important one)
       rank       the division ladders          (uba / gfl)
       standings  UBAe conferences, stacked
       nextev     what is on next
       champs     who holds what
       cta        where to follow

     A view it does NOT have HOLDS whatever is on screen rather than
     going blank. The deck stamps every standby press with a view
     name, so pressing "Playoff bracket" while this source is live
     must not black out the vertical canvas — it just keeps showing
     the last thing that made sense, and says so in the console.

     It answers the deck's EXISTING {type:'standby'} command.
     ============================================================= -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Barlow+Condensed:wght@500;700;900&family=Barlow:wght@500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{ --pur:#9b30ff; --hi:#cc66ff; --pink:#ff33cc; --gold:#ffce00;
    --panel:rgba(14,0,30,.86); --line:rgba(155,48,255,.28); --dim:rgba(200,160,255,.58);
    --green:#5cf2a0; --safe-bottom:300px; }
  html,body{width:1080px;height:1920px;background:#04000c;overflow:hidden;
    font-family:'Barlow Condensed',sans-serif;color:#fff;}

  #room{position:fixed;inset:0;background:
    radial-gradient(ellipse 78% 24% at 50% 8%, rgba(155,48,255,.24), transparent 70%),
    radial-gradient(ellipse 78% 24% at 50% 78%, rgba(255,51,204,.14), transparent 72%),
    linear-gradient(180deg,#07000f 0%,#12042a 48%,#04000c 100%);}
  #crt{position:fixed;inset:0;pointer-events:none;z-index:60;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:59;
    background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.6) 100%);}

  #stage{position:fixed;inset:0;padding:80px 52px var(--safe-bottom);z-index:10;
    display:flex;flex-direction:column;}
  .view{display:none;flex:1;min-height:0;flex-direction:column;
    animation:vin .5s cubic-bezier(.16,1,.3,1);}
  .view.on{display:flex;}
  @keyframes vin{from{opacity:0;transform:translateY(26px);}to{opacity:1;transform:none;}}

  .eyebrow{font-family:'Press Start 2P',monospace;font-size:15px;letter-spacing:.32em;
    color:var(--hi);text-shadow:0 0 15px rgba(204,102,255,.6);text-align:center;}
  .title{font-weight:900;font-size:70px;line-height:.92;text-transform:uppercase;
    text-align:center;margin-top:16px;text-shadow:0 0 32px rgba(155,48,255,.65);}
  .title.sm{font-size:52px;}
  .sub{font:600 24px 'Barlow',sans-serif;color:var(--dim);text-align:center;margin-top:10px;
    letter-spacing:.12em;text-transform:uppercase;}
  .sub:empty{display:none;}
  .body{flex:1;min-height:0;margin-top:30px;overflow:hidden;}

  /* ── card ───────────────────────────────────────────────────────── */
  .cseg{font-family:'Press Start 2P',monospace;font-size:12px;letter-spacing:.2em;
    color:var(--pink);margin:18px 0 10px;text-shadow:0 0 12px rgba(255,51,204,.5);}
  .cseg:first-child{margin-top:0;}
  .cbout{position:relative;background:var(--panel);border-left:5px solid var(--pur);
    padding:13px 20px;margin-bottom:9px;box-shadow:0 0 18px rgba(60,0,110,.4);}
  .cbout.tf{border-left-color:var(--gold);box-shadow:0 0 24px rgba(255,206,0,.24);}
  .cbout.done{opacity:.94;}
  .cbout.ko{border-left-color:#ff7a2f;box-shadow:0 0 26px rgba(255,122,47,.3);}
  /* Barlow, not Press Start 2P: that face has no star glyph, so the ★ fell
     back and rendered as a full stop — "· LHW VACANT BELT ·". */
  .cbadge{font:700 15px 'Barlow',sans-serif;letter-spacing:.18em;
    color:var(--gold);margin-bottom:8px;text-align:left;}
  .cnames{display:grid;grid-template-columns:1fr 132px 1fr;align-items:center;gap:8px;}
  .cnames .f{font-weight:700;font-size:36px;text-transform:uppercase;line-height:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cnames .fb{text-align:right;}
  .cnames .f.win{color:var(--green);text-shadow:0 0 16px rgba(92,242,160,.4);}
  .cnames .f.lose{opacity:.42;}
  .cnames .vs{font-family:'Press Start 2P',monospace;font-size:13px;color:var(--dim);
    text-align:center;line-height:1.4;}
  .cnames .vs.fin{color:var(--gold);}
  .cnames .vs.ko{color:#ff7a2f;}
  .cwc{font:600 15px 'Barlow',sans-serif;letter-spacing:.16em;color:var(--dim);
    margin-top:7px;text-transform:uppercase;}
  .cprog{display:flex;justify-content:space-between;align-items:center;margin-top:16px;
    padding-top:13px;border-top:1px solid var(--line);
    font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:.16em;color:var(--dim);}
  .cprog b{color:var(--gold);}
  /* A long card stops growing and starts tightening — same idea as the
     horizontal card's .tight, sized for the taller frame. */
  .body.tight .cbout{padding:9px 18px;margin-bottom:6px;}
  .body.tight .cnames .f{font-size:29px;}
  .body.tight .cwc{display:none;}

  /* ── two-column boards (rankings, standings, champions) ─────────── */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  .col{min-width:0;}
  .ch{font-family:'Press Start 2P',monospace;font-size:12px;letter-spacing:.16em;
    color:var(--pink);margin-bottom:11px;text-shadow:0 0 12px rgba(255,51,204,.5);}
  .plr{display:flex;align-items:baseline;gap:11px;padding:8px 14px;margin-bottom:6px;
    background:var(--panel);border-left:3px solid var(--pur);
    font-weight:700;font-size:27px;text-transform:uppercase;line-height:1.05;}
  .plr .rk{font-family:'Press Start 2P',monospace;font-size:12px;color:var(--hi);
    font-weight:400;min-width:26px;}
  .plr .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .plr.champ{border-left-color:var(--gold);box-shadow:0 0 20px rgba(255,206,0,.2);}
  .plr.champ .rk{color:var(--gold);font-size:9px;letter-spacing:.1em;min-width:74px;}
  .plr.vacant{color:var(--dim);opacity:.6;}

  /* standings rows carry a record */
  .srow{display:grid;grid-template-columns:44px 1fr 116px;align-items:center;gap:10px;
    padding:11px 16px;margin-bottom:7px;background:var(--panel);border-left:4px solid var(--pur);}
  .srow .rk{font-family:'Press Start 2P',monospace;font-size:13px;color:var(--hi);}
  .srow .nm{font-weight:700;font-size:29px;text-transform:uppercase;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .srow .rec{font-weight:700;font-size:26px;text-align:right;}
  .srow.lead{border-left-color:var(--gold);} .srow.lead .rk{color:var(--gold);}

  /* ── next event ─────────────────────────────────────────────────── */
  #nextBody,#champBody{display:flex;flex-direction:column;justify-content:center;}
  #champBody{display:grid;}
  .ev{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--pink);
    padding:26px 30px;margin-bottom:20px;box-shadow:0 0 30px rgba(60,0,110,.45);}
  .ev .n{font-weight:900;font-size:50px;text-transform:uppercase;line-height:.95;}
  .ev .d{font-family:'Press Start 2P',monospace;font-size:14px;letter-spacing:.16em;
    color:var(--gold);margin-top:14px;}

  /* ── cta ────────────────────────────────────────────────────────── */
  #ctaBody{display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:30px;}
  .link{font-weight:900;font-size:58px;text-transform:uppercase;letter-spacing:.02em;
    color:#fff;text-shadow:0 0 30px rgba(155,48,255,.7);}
  .link small{display:block;font-family:'Press Start 2P',monospace;font-size:12px;
    letter-spacing:.22em;color:var(--hi);margin-bottom:12px;text-shadow:none;}

  #status{position:fixed;left:14px;bottom:10px;z-index:70;
    font-family:'Press Start 2P',monospace;font-size:9px;color:rgba(200,160,255,.3);}
</style>
</head>
<body>

<div id="room"></div>

<div id="stage">
  <div class="view" id="v-card">
    <div class="eyebrow" id="cardEyebrow">TONIGHT</div>
    <div class="title" id="cardTitle">—</div>
    <div class="sub" id="cardDate"></div>
    <div class="body" id="cardBody"></div>
  </div>

  <div class="view" id="v-rank">
    <div class="eyebrow">RANKINGS</div>
    <div class="title sm" id="rankTitle">THE LADDER</div>
    <div class="body"><div class="cols" id="rankBody"></div></div>
  </div>

  <div class="view" id="v-standings">
    <div class="eyebrow">UBAe</div>
    <div class="title sm splitlbl">STANDINGS</div>
    <div class="body"><div class="cols" id="standBody"></div></div>
  </div>

  <div class="view" id="v-nextev">
    <div class="eyebrow">COMING UP</div>
    <div class="title sm">NEXT EVENTS</div>
    <div class="body" id="nextBody"></div>
  </div>

  <div class="view" id="v-champs">
    <div class="eyebrow">TITLEHOLDERS</div>
    <div class="title sm">CHAMPIONS</div>
    <div class="body"><div class="cols" id="champBody"></div></div>
  </div>

  <div class="view" id="v-cta">
    <div class="eyebrow">JOIN THE LEAGUE</div>
    <div class="title" id="ctaTitle">FIGHT WITH US</div>
    <div class="body" id="ctaBody">
      <div class="link"><small>DISCORD</small>DISCORD.GG/UBA</div>
      <div class="link"><small>THE SITE</small>UBAESPORTS.COM</div>
      <div class="link" id="ctaCount"></div>
    </div>
  </div>
</div>

<div id="vig"></div>
<div id="crt"></div>
<div id="status">standby-v: connecting</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
const sb = supabase.createClient('https://emzlivoykbhhjcugupit.supabase.co',
  'sb_publishable_pqhH974E1q9YsFnrVH1UJQ_X3V-rRLF')
const $ = id => document.getElementById(id)
const Q = new URLSearchParams(location.search)
const esc = t => String(t ?? '').replace(/[<>&]/g, ch => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[ch]))
const has = v => v !== null && v !== undefined && String(v).trim() !== ''

// Every date on this screen is EASTERN — the league is scheduled in it and the
// label says so. Formatting in the BROWSER's zone is correct only on an Eastern
// machine: a 7PM ET event renders "4PM ET" on a Pacific one and the wrong DAY
// west of it. Same approach as standby.html, for the same reason.
const ET_TZ = 'America/New_York'
// PostgREST returns "2026-08-22 23:00:00+00" — a space where ISO wants a T and
// an offset with no minutes. Chrome's Date forgives both, Intl does not always,
// and a throw in here would take the whole screen down mid-show.
const asDate = d => {
  if(d instanceof Date) return d
  const s = String(d)
  let x = new Date(s)
  if(isNaN(x)) x = new Date(s.replace(' ','T').replace(/([+-]\d{2})$/,'$1:00'))
  return x
}
function fdate(d){
  const x = asDate(d)
  if(isNaN(x)) return ''
  const p = {}
  new Intl.DateTimeFormat('en-US',{ timeZone:ET_TZ, weekday:'short', month:'short',
    day:'numeric', hour:'numeric', minute:'2-digit', hour12:true })
    .formatToParts(x).forEach(y => { p[y.type] = y.value })
  if(!p.weekday) return ''
  const t = p.hour + (p.minute !== '00' ? ':' + p.minute : '') + p.dayPeriod.toUpperCase()
  return `${p.weekday} ${p.month} ${p.day} · ${t} ET`.toUpperCase()
}
const FUTURE = () => new Date(Date.now() - 6*3600e3).toISOString()

// ── views ───────────────────────────────────────────────────────────
// The six this frame can carry. Anything else HOLDS — see the note at the
// top of the file.
const VIEWS = ['card','rank','standings','nextev','champs','cta']
// The deck's names for the same things. It has more screens than this file
// does, so several of its presses land on one view here.
const ALIAS = { ubarank:'rank', gflrank:'rank', p4p:'rank',
  next3:'nextev', nextev:'nextev', cards:'card', card:'card',
  standings:'standings', teamvs:'standings', rosters:'standings',
  vsrosters:'standings', champs:'champs', fotm:'champs', cta:'cta' }
// The auto-cycle rotations, per league — same principle as standby.html:
// a UBA fight night must not parade team standings, and GFL has no
// champions or P4P board yet, so listing those would put an empty screen
// on air every fifteen seconds.
const CYCLE = {
  uba:  ['card','rank','champs','nextev','cta'],
  gfl:  ['card','rank','nextev','cta'],
  ubae: ['standings','nextev','cta'],
}
let cycTimer = null, cycIdx = 0, LEAGUE = 'uba'

function show(view){
  if(view === 'off'){ stopCycle(); document.querySelectorAll('.view').forEach(v => v.classList.remove('on')); return }
  if(!VIEWS.includes(view)){
    // Hold, do not blank. The deck has screens this frame cannot carry.
    console.log(`[standby-v] no vertical screen for "${view}" — holding`)
    return
  }
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'))
  $('v-' + view).classList.add('on')
}
function stopCycle(){ if(cycTimer){ clearInterval(cycTimer); cycTimer = null } }
function startCycle(){
  stopCycle()
  const list = CYCLE[LEAGUE] || CYCLE.uba
  cycIdx = 0; show(list[0])
  cycTimer = setInterval(() => { cycIdx = (cycIdx + 1) % list.length; show(list[cycIdx]) }, 15000)
}

// ── card ────────────────────────────────────────────────────────────
const SEGS = [['main_card','MAIN CARD'],['undercard','UNDERCARD'],['prelim','PRELIMS']]
const METHOD = m => {
  const s = String(m || '').toUpperCase()
  return /KO/.test(s) && !/TKO/.test(s) ? 'KO' : /TKO/.test(s) ? 'TKO'
    : /SUB/.test(s) ? 'SUB' : /DEC/.test(s) ? 'DEC' : /DQ/.test(s) ? 'DQ' : s.slice(0,4)
}
const winOf = b => /^(a|fighter_a)$/i.test(b.winner_corner || b.winner || '') ? 'a'
                 : /^(b|fighter_b)$/i.test(b.winner_corner || b.winner || '') ? 'b' : null

function renderCard(ev, bouts, filter){
  $('cardTitle').textContent = String(ev.name || 'THE CARD').toUpperCase()
  // No date -> blank, never "WED DEC 31". The runner pushes rows without one
  // and a naive formatter happily renders the epoch.
  $('cardDate').textContent = ev.event_date ? fdate(ev.event_date) : ''
  const box = $('cardBody')
  let open = (bouts || []).filter(b => b.fighter_a_name && b.fighter_b_name)
  if(filter && filter !== 'all') open = open.filter(b => (b.card_segment || 'main_card') === filter)
  if(!open.length){
    box.innerHTML = '<div class="cbout"><div class="cnames"><span class="f"></span>' +
      '<span class="vs">CARD SOON</span><span class="f fb"></span></div></div>'
    return
  }
  const row = b => {
    const w = winOf(b), cls = n => w ? (w === n ? ' win' : ' lose') : ''
    // A stoppage is the only method that earns its own treatment. A decision
    // or a DQ is not a finish, and giving those the same ember would say the
    // night was more dramatic than it was.
    const m = (w && b.method) ? METHOD(b.method) : ''
    const ko = /^(KO|TKO|SUB)/.test(m)
    return `<div class="cbout${b.is_title_fight ? ' tf' : ''}${w ? ' done' : ''}${ko ? ' ko' : ''}">
      ${b.is_title_fight ? `<div class="cbadge">★ ${esc(b.title_name || 'TITLE FIGHT').toUpperCase()} ★</div>` : ''}
      <div class="cnames">
        <span class="f${cls('a')}">${esc(b.fighter_a_name)}</span>
        <span class="vs${m ? ' fin' : ''}${ko ? ' ko' : ''}">${m || 'VS'}</span>
        <span class="f fb${cls('b')}">${esc(b.fighter_b_name)}</span>
      </div>
      ${b.weight_class ? `<div class="cwc">${esc(String(b.weight_class).replace(/_/g,' ').toUpperCase())}</div>` : ''}
    </div>`
  }
  // Group only when the card actually HAS tiers. A UBAe card is one flat list
  // and a lone "MAIN CARD" header over it would be noise.
  const tiers = [...new Set(open.map(b => b.card_segment || 'main_card'))]
  let html = tiers.length > 1
    ? SEGS.map(([k, l]) => {
        const g = open.filter(b => (b.card_segment || 'main_card') === k)
        return g.length ? `<div class="cseg">${l}</div>${g.map(row).join('')}` : ''
      }).join('')
    : open.map(row).join('')
  const done = open.filter(winOf).length
  if(done) html += `<div class="cprog"><span>DISCORD.GG/UBA</span><span><b>${done}</b> / ${open.length} COMPLETE</span></div>`
  box.classList.toggle('tight', open.length > 12)
  box.innerHTML = html
}

async function loadCard(eventName, pushed){
  // The deck sends its own rows when the operator is scoring live, because
  // those wins are clicks that have not reached the database yet —
  // re-fetching here would quietly undo them on screen.
  if(pushed && pushed.bouts && pushed.bouts.length){
    renderCard({ name: pushed.event || eventName || 'THE CARD', event_date: pushed.date || null },
               pushed.bouts, pushed.filter)
    return
  }
  let q = sb.from('events_public').select('id,name,event_date').eq('status','scheduled')
  q = eventName ? q.eq('name', eventName) : q.gte('event_date', FUTURE()).order('event_date')
  const { data: evs, error } = await q.limit(1)
  if(error){ console.warn('[standby-v] event lookup failed —', error); return }
  const ev0 = evs && evs[0]; if(!ev0) return
  const { data: em } = await sb.from('event_matches').select('*').eq('event_id', ev0.id).order('bout_number')
  renderCard(ev0, em || [], pushed && pushed.filter)
}

// ── boards ──────────────────────────────────────────────────────────
const DIVS = [['heavyweight','HEAVYWEIGHT'],['light_heavyweight','LIGHT HEAVY'],
              ['middleweight','MIDDLEWEIGHT'],['lightweight','LIGHTWEIGHT']]
const champIn = (champs, wc) => (champs || []).find(c =>
  String(c.weight_class || '').toLowerCase() === wc)

function renderRanks(rk, champs){
  // A ranking without its champion is a list of contenders with the point of
  // the division missing. The holder is pinned above rank 1 and is NOT given a
  // number — they are not ranked, they are who the ranking is chasing.
  $('rankBody').innerHTML = DIVS.map(([w, lbl]) => {
    const c = champIn(champs, w)
    const rows = (rk || []).filter(r => r.weight_class === w).sort((a,b) => a.rank - b.rank)
      .filter(r => !c || r.fighter_name !== c.display_name)      // never list them twice
      .slice(0, 8)
    return `<div class="col"><div class="ch">${lbl}</div>
      ${c ? `<div class="plr champ"><span class="rk">CHAMPION</span><span class="nm">${esc(c.display_name)}</span></div>` : ''}
      ${rows.map(r => `<div class="plr"><span class="rk">${r.rank}</span><span class="nm">${esc(r.fighter_name)}</span></div>`).join('')
        || (c ? '' : '<div class="plr vacant"><span class="nm">—</span></div>')}</div>`
  }).join('')
}

function renderStandings(st){
  const byC = {}
  ;(st || []).forEach(t => { (byC[t.conference] = byC[t.conference] || []).push(t) })
  const confs = Object.keys(byC).sort()
  if(!confs.length){ $('standBody').innerHTML = '<div class="col"><div class="plr vacant"><span class="nm">NO STANDINGS YET</span></div></div>'; return }
  $('standBody').innerHTML = confs.map(c => {
    const rows = byC[c].slice().sort((a,b) => (b.wins - a.wins) || (b.bout_diff - a.bout_diff))
    return `<div class="col"><div class="ch">CONFERENCE ${esc(c)}</div>
      ${rows.slice(0,8).map((t,i) => `<div class="srow${i === 0 ? ' lead' : ''}">
        <span class="rk">${i+1}</span>
        <span class="nm">${esc(t.name || t.team_name || '')}</span>
        <span class="rec">${+t.wins || 0}—${+t.losses || 0}</span></div>`).join('')}</div>`
  }).join('')
}

function renderChamps(champs){
  const list = (champs || [])
  if(!list.length){ $('champBody').innerHTML = '<div class="col"><div class="plr vacant"><span class="nm">NO CHAMPIONS CROWNED</span></div></div>'; return }
  // Two columns of division/holder pairs, split down the middle so both
  // columns fill rather than one running long.
  const half = Math.ceil(list.length / 2)
  const cell = c => `<div class="plr champ">
    <span class="rk">${esc(String(c.weight_class || '').replace(/_/g,' ').toUpperCase().slice(0,12))}</span>
    <span class="nm">${esc(c.display_name)}</span></div>`
  $('champBody').innerHTML =
    `<div class="col">${list.slice(0, half).map(cell).join('')}</div>` +
    `<div class="col">${list.slice(half).map(cell).join('')}</div>`
}

function renderNext(evs, exclude){
  const list = (evs || []).filter(e => !exclude || e.name !== exclude).slice(0, 3)
  if(!list.length){ $('nextBody').innerHTML = '<div class="ev"><div class="n">MORE SOON</div></div>'; return }
  $('nextBody').innerHTML = list.map(e =>
    `<div class="ev"><div class="n">${esc(e.name)}</div>
     <div class="d">${fdate(e.event_date)}</div></div>`).join('')
}

// ── data ────────────────────────────────────────────────────────────
async function loadAll(){
  // Every read is checked. supabase-js resolves {data:null, error} rather than
  // throwing, so `data ?? []` on a failed query renders a confident EMPTY
  // board — the exact shape of the bug that emptied every autocomplete picker
  // in the bot on 2026-08-25. An empty ranking on air says "nobody is ranked".
  const [rkR, chR, evR, stR, cntR] = await Promise.all([
    sb.from('rankings_public').select('rank,fighter_name,weight_class,level').eq('scope','weight_class').order('rank'),
    sb.from('fighter_cards').select('display_name,weight_class,is_champion').eq('is_champion', true),
    sb.from('events_public').select('id,name,event_date').eq('status','scheduled').gte('event_date', FUTURE()).order('event_date').limit(4),
    sb.from('team_standings').select('*'),
    sb.from('fighter_cards').select('id', { count:'exact', head:true }),
  ])
  for(const [label, r] of [['rankings',rkR],['champions',chR],['events',evR],['standings',stR]])
    if(r.error) console.warn(`[standby-v] ${label} failed —`, r.error)

  CH = chR.data || []
  renderRanks(rkR.data || [], CH)
  renderChamps(CH)
  renderNext(evR.data || [])
  renderStandings(stR.data || [])
  if(cntR.count) $('ctaCount').innerHTML = `<small>FIGHTERS SIGNED</small>${cntR.count}`
  loadCard(null, null)
}
let CH = []

// ── the wire ────────────────────────────────────────────────────────
sb.channel('vga-overlay').on('broadcast', { event:'cmd' }, async ({ payload: c }) => {
  if(!c) return
  // The split name is displayed and was baked in on the horizontal screen for
  // a while — correct today, silently wrong the day the split rolls over.
  if(has(c.split)) document.querySelectorAll('.splitlbl').forEach(el => { el.textContent = 'UBAe · ' + c.split })
  if(c.type !== 'standby') return

  if(has(c.league)) LEAGUE = String(c.league).toLowerCase()
  if(c.on === false){ show('off'); return }

  const view = ALIAS[c.view] || c.view
  if(c.view === 'auto'){ startCycle(); return }
  stopCycle()

  if(view === 'card'){ await loadCard(c.event, c.d); show('card'); return }
  if(view === 'nextev'){
    // 'next event' must skip the one being run, or on a fight night it
    // resolves to tonight and shows the same card twice.
    const { data } = await sb.from('events_public').select('id,name,event_date')
      .eq('status','scheduled').gte('event_date', FUTURE()).order('event_date').limit(4)
    renderNext(data || [], c.exclude); show('nextev'); return
  }
  show(view)
}).subscribe(s => { $('status').textContent = 'standby-v: ' + (s === 'SUBSCRIBED' ? '● live' : s.toLowerCase()) })

loadAll()

// Preview harness — ?view=card|rank|standings|nextev|champs|cta, ?cycle=1.
if(Q.get('view')) setTimeout(() => show(Q.get('view')), 700)
else if(Q.get('cycle') === '1') setTimeout(startCycle, 700)
})()
</script>
