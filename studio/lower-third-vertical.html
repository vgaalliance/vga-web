<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VGA — Lower Third (Vertical)</title>
<!-- ============================================================
     1080x1920 SIBLING of the fighter dossier in overlay.html.
     Add as a 1080x1920 browser source in the VERTICAL canvas
     (Aitum Vertical). The horizontal original is untouched.

     It answers the deck's EXISTING {type:'fighter'} command, so no
     deck work is needed: one press lights the horizontal dossier and
     this at the same time, which is the whole point of the vertical
     canvas.

     IT SITS IN THE FREE BAND. The vertical canvas is composed in
     three parts: a CTA block along the top, the 16:9 gameplay scaled
     to 1080 wide (1080x608) under it, and a large empty area below
     that. This plate lives at the BOTTOM of that empty area, under
     the fight clock — which is the other thing down there. ?bottom=
     <px> moves it without editing the file.

     STRIPPED, deliberately. The horizontal dossier carries up to five
     chips plus a belt badge on one line. At 1080 wide that line either
     wraps into a paragraph or shrinks to unreadable, so this keeps the
     three a phone viewer can actually take in — record, rank, division
     — and drops the rest. A vertical graphic that says less is not a
     lesser graphic; it is the one that gets read.

     NO SOUND. overlay.html synthesizes a whoosh on this command. Both
     canvases receive it, so a whoosh here would play the cue twice on
     any machine running both sources.
     ============================================================= -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Barlow+Condensed:wght@500;700;900&family=Barlow:wght@500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{ --pur:#9b30ff; --hi:#cc66ff; --pink:#ff33cc; --gold:#ffce00;
    --dim:rgba(200,160,255,.62); --line:rgba(155,48,255,.28);
    /* THE COMPOSITION. 250 CTA band + a 608-tall feed = 858, below which
       the frame is free. The fight clock takes the top ~380px of that
       band, so this plate starts under it.

       THE SAFE ZONE still applies at the very bottom: TikTok/Reels/Shorts
       park their own UI over the last ~300px and the right ~150px. A plate
       that looks perfect in OBS and sits under the caption and the share
       button on a phone is not a plate that shipped. */
    --safe-bottom:250px; --safe-side:56px; }
  html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;
    font-family:'Barlow',system-ui,Arial,sans-serif;color:#fff;}

  /* BOTTOM-ANCHORED, not offset from the feed. The fight clock also lives in
     this band and ends at y=1317; anchoring from the bottom means a shorter
     plate simply sits lower instead of drifting up into the clock, and the
     only case that has to clear is the TALLEST one. That is 288px (next
     line + nickname + chips), so its top is 1920 - 250 - 288 = 1382 — 65px
     clear of the clock, with the platform's caption zone still free beneath
     it. An offset measured from the feed would have had to be re-guessed
     every time the plate's contents changed. */
  #lt{position:fixed;left:var(--safe-side);right:var(--safe-side);
    bottom:var(--safe-bottom);
    display:flex;border-radius:14px;overflow:hidden;
    transform:translateY(150%);opacity:0;
    background:linear-gradient(135deg,rgba(20,4,38,.97),rgba(6,0,14,.98));
    box-shadow:0 26px 70px rgba(0,0,0,.66),0 0 0 1px rgba(155,48,255,.2);}
  /* Rises from below, not in from the side. The horizontal one slides in
     from the left because it has 1920px of room to travel; in a 1080-wide
     frame that same move is most of the screen width and reads as the
     graphic being shoved on. */
  #lt.in{animation:lin .6s cubic-bezier(.16,1,.3,1) forwards;}
  #lt.out{animation:lout .5s cubic-bezier(.5,0,.75,.2) forwards;}
  @keyframes lin{to{transform:translateY(0);opacity:1;}}
  /* Contents land after the plate does, in reading order. The plate sliding up
     with its text already set reads as a picture of a lower third; the text
     arriving after it reads as one being written. */
  #lt.in #next {animation:lineup .34s cubic-bezier(.16,1,.3,1) .34s backwards;}
  #lt.in #name {animation:lineup .40s cubic-bezier(.16,1,.3,1) .42s backwards;}
  #lt.in #nick {animation:lineup .34s cubic-bezier(.16,1,.3,1) .54s backwards;}
  #lt.in .chip {animation:lineup .34s cubic-bezier(.16,1,.3,1) backwards;}
  #lt.in .chip:nth-child(1){animation-delay:.62s;}
  #lt.in .chip:nth-child(2){animation-delay:.70s;}
  #lt.in .chip:nth-child(3){animation-delay:.78s;}
  #lt.in .belt {animation:pop .4s cubic-bezier(.2,1.6,.4,1) .84s backwards;}
  @keyframes lineup{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  @keyframes pop{from{opacity:0;transform:scale(.6);}to{opacity:1;transform:none;}}
  /* the accent bar draws to full height first — it is the thing that says a
     graphic is arriving before any word is readable */
  #lt.in .accent{animation:draw .34s cubic-bezier(.16,1,.3,1) backwards;}
  @keyframes draw{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  @keyframes lout{from{transform:translateY(0);opacity:1;}to{transform:translateY(150%);opacity:0;}}

  .accent{width:18px;flex:0 0 18px;background:var(--pur);box-shadow:0 0 30px var(--pur);
    transform-origin:50% 100%;}
  #lt.champ .accent{background:linear-gradient(180deg,#ffe27a,#c9a11e);box-shadow:0 0 30px rgba(255,206,0,.6);}
  .bd{padding:26px 34px 28px 30px;flex:1;min-width:0;}

  #next{font-family:'Press Start 2P',monospace;font-size:13px;letter-spacing:.18em;
    color:var(--gold);text-shadow:0 0 12px rgba(255,206,0,.45);margin-bottom:14px;
    display:none;line-height:1.6;}
  #next.on{display:block;}
  #next b{color:#fff;font-weight:400;}

  /* The name is the graphic. Everything else is a caption on it. */
  #name{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:86px;
    line-height:.88;text-transform:uppercase;letter-spacing:.004em;white-space:nowrap;
    text-shadow:0 0 38px rgba(155,48,255,.6);}
  #nick{font:500 30px 'Barlow',sans-serif;color:var(--gold);font-style:italic;
    margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #nick:empty{display:none;}

  #chips{display:flex;gap:34px;margin-top:22px;align-items:flex-end;flex-wrap:wrap;}
  .chip{display:flex;flex-direction:column;}
  .chip .l{font-family:'Press Start 2P',monospace;font-size:10px;letter-spacing:.18em;
    color:var(--dim);margin-bottom:8px;}
  .chip .v{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:46px;
    line-height:.9;color:#fff;}
  .chip .v.rk{color:var(--gold);text-shadow:0 0 16px rgba(255,206,0,.4);}
  .chip .v.sm{font-size:32px;padding-bottom:4px;}
  .belt{background:linear-gradient(90deg,#c9a11e,#ffe27a);color:#3a2900;
    font-family:'Press Start 2P',monospace;font-size:12px;letter-spacing:.14em;
    padding:11px 16px;border-radius:6px;align-self:center;}
</style>
</head>
<body>

<div id="lt">
  <div class="accent"></div>
  <div class="bd">
    <div id="next"></div>
    <div id="name">—</div>
    <div id="nick"></div>
    <div id="chips"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
const sb = supabase.createClient('https://emzlivoykbhhjcugupit.supabase.co',
  'sb_publishable_pqhH974E1q9YsFnrVH1UJQ_X3V-rRLF')
const $ = id => document.getElementById(id)
const Q = new URLSearchParams(location.search)
const esc = t => String(t ?? '').replace(/[<>&]/g, ch => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[ch]))
const has = v => v !== null && v !== undefined && String(v).trim() !== ''
// ?bottom=<px> lifts or drops the plate without editing the file — for a
// scene with no clock up, or a platform whose caption sits higher.
if(Q.get('bottom')) document.documentElement.style.setProperty('--safe-bottom', (+Q.get('bottom')) + 'px')

const AUTOHIDE = 12000     // the same dwell as the horizontal dossier, so the
                           // two canvases clear together rather than one
                           // sitting on screen after the other has gone
let timer = null

// A clipped name reads as a bug; a slightly smaller one reads as typesetting.
// Measured with a Range because the name is nowrap — scrollWidth tracks the
// text here and cannot constrain it. Same approach as overlay.html's fitName.
function fit(){
  const el = $('name'), room = el.parentElement.clientWidth
  let px = 86
  el.style.fontSize = px + 'px'
  const width = () => {
    const r = document.createRange(); r.selectNodeContents(el)
    return r.getBoundingClientRect().width
  }
  while(width() > room && px > 42){ px -= 3; el.style.fontSize = px + 'px' }
}

function show(d){
  const lt = $('lt')
  const nx = $('next')
  if(has(d.next)){ nx.innerHTML = 'NEXT · <b>' + esc(d.next) + '</b>'; nx.classList.add('on') }
  else nx.classList.remove('on')

  $('name').textContent = String(d.name ?? '—').toUpperCase()
  $('nick').textContent = has(d.nickname) ? `"${d.nickname}"` : ''

  // Three chips, then the belt. Anything absent is DROPPED — the studio's
  // rule everywhere: a thin profile makes a shorter plate, never one with
  // holes punched in it.
  const chips = []
  chips.push(`<div class="chip"><span class="l">RECORD</span><span class="v">${esc(d.record || '0-0-0')}</span></div>`)
  if(+d.rank > 0) chips.push(`<div class="chip"><span class="l">RANK</span><span class="v rk">#${+d.rank}</span></div>`)
  if(has(d.weight)) chips.push(`<div class="chip"><span class="l">DIVISION</span><span class="v sm">${esc(String(d.weight).toUpperCase())}</span></div>`)
  if(d.champion) chips.push(`<span class="belt">CHAMPION</span>`)
  $('chips').innerHTML = chips.join('')
  lt.classList.toggle('champ', !!d.champion)

  lt.classList.remove('out'); void lt.offsetWidth; lt.classList.add('in')
  // Fonts land after first paint, and a name measured against the fallback
  // comes back narrow — the same trap fix/fit-after-fonts-load closed on the
  // tale of the tape. Measure once now and again once the face is ready.
  fit()
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit)

  clearTimeout(timer)
  timer = setTimeout(hide, AUTOHIDE)
}
function hide(){
  clearTimeout(timer)
  const lt = $('lt')
  if(lt.classList.contains('in')){ lt.classList.remove('in'); lt.classList.add('out') }
}

sb.channel('vga-overlay').on('broadcast', { event:'cmd' }, ({ payload: c }) => {
  if(!c || c.type !== 'fighter') return
  // The deck's Hide sends {on:false} with NO payload. Reading .next off an
  // absent d is what made the horizontal button throw instead of hide.
  if(c.on === false || !c.d){ hide(); return }
  show(c.d)
}).subscribe()

// Preview harness — open the file and judge it without a deck.
if(Q.get('demo') === '1') show({
  name:'smokinem', nickname:'The Quiet Part', record:'11-2-1', ko:7, rank:7,
  weight:'Heavyweight', country:'United States', champion:false,
  next:'vs Dragon 5000 · UBA Fight Night 31' })
if(Q.get('demo') === '2') show({
  name:'Dragon 5000', record:'14-3', ko:9, rank:1,
  weight:'Heavyweight', champion:true })
})()
</script>
</body>
</html>
