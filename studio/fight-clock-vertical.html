<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VGA — Fight Clock (Vertical)</title>
<!-- ============================================================
     1080x1920 SIBLING of fight-clock.html (the UBA/GFL solo-card
     clock). Vertical canvas browser source. The horizontal original
     is untouched.

     A RE-LAYOUT, NOT A PORT. That file is a 1920-wide bar with the
     two names at opposite ends of it and the corner colours revealed
     through slits in the middle. None of that geometry survives being
     1080 wide: the names would collide and the slits would have
     nowhere to open. So the bar becomes a STACK — fighter, clock,
     fighter — which is the shape a phone reads, and the slit reveal
     becomes a chip that opens under each name.

     It answers the deck's EXISTING commands, unchanged and with the
     same league gate as the horizontal clock:
       {type:'clock', show}            up / down
       {type:'bout', d:{a,b,label,sub,colorL,colorR}}
       {type:'corner', reveal, d:{l,r}}
       {type:'clockodds', d:{l,r}}
       {type:'round', n}
       {type:'clocktimer', on, secs}

     IT SITS UNDER THE FEED. The vertical canvas is composed in three
     bands: a CTA block along the top, the 16:9 gameplay scaled to
     1080 wide (so 1080x608) below it, and a large empty area under
     that. This clock lives in the empty area — anywhere higher and it
     is either on top of the CTA or on top of the fight.

     ONE KNOB SETS ALL OF IT: --feed-bottom, the y where the gameplay
     ends and the free space begins. Change it in :root, or pass
     ?feed=<px> to try a value without editing the file. Everything
     below positions off it, so if the composition is re-cut the clock
     follows with a single number.
     ============================================================= -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Barlow+Condensed:wght@500;700;900&family=Barlow:wght@500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{ --pur:#9b30ff; --hi:#cc66ff; --pink:#ff33cc; --gold:#ffce00;
    --panel:rgba(11,0,24,.93); --line:rgba(155,48,255,.3); --dim:rgba(200,160,255,.6);
    --accent:var(--pur); --glow:rgba(155,48,255,.55);
    /* THE COMPOSITION. --cta-band is the block along the top, the feed is
       1080x608 under it, and everything from --feed-bottom down is free.
       250 + 608 = 858. See the note at the top of the file. */
    --cta-band:250px; --feed-bottom:858px; }
  /* GFL is the same clock in a different suit — one skin, no second file,
     so a GFL bout promoted mid-night is dressed right the moment the deck
     touches it. Same reason the horizontal clock does it this way. */
  body.gfl{ --accent:#e8312a; --glow:rgba(232,49,42,.55); --hi:#ff6a5e; --pink:#ff3b2f; }
  html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;
    font-family:'Barlow',system-ui,Arial,sans-serif;color:#fff;}

  /* Anchored to the TOP of the free band, not to the bottom of the frame:
     the clock should sit directly under the action, and the space beneath it
     is where the lower-third comes up. */
  #hud{position:fixed;top:calc(var(--feed-bottom) + 36px);left:44px;right:44px;
    transition:opacity .5s cubic-bezier(.16,1,.3,1), transform .5s cubic-bezier(.16,1,.3,1);}
  /* Drops away downward — it lives below the feed, so lifting it upward would
     take it back across the gameplay on its way out. */
  #hud.off{opacity:0;transform:translateY(40px);pointer-events:none;}
  /* The clock BUILDS: brand, then the bout strip, then the two fighters with
     the round band between them. It had transitions but no sequence, so the
     whole HUD arrived as one slab — fine on a cut, wrong on a reveal, and this
     is a graphic that gets revealed before every bout. */
  #hud:not(.off) .brand{animation:up .42s cubic-bezier(.16,1,.3,1) backwards;}
  #hud:not(.off) .strip{animation:up .42s cubic-bezier(.16,1,.3,1) .10s backwards;}
  #hud:not(.off) .side:nth-of-type(1){animation:fromL .5s cubic-bezier(.16,1,.3,1) .22s backwards;}
  #hud:not(.off) .band{animation:widen .46s cubic-bezier(.16,1,.3,1) .40s backwards;}
  #hud:not(.off) .side:nth-of-type(3){animation:fromR .5s cubic-bezier(.16,1,.3,1) .30s backwards;}
  @keyframes up{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  @keyframes fromL{from{opacity:0;transform:translateX(-26px);}to{opacity:1;transform:none;}}
  @keyframes fromR{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:none;}}
  /* the round band opens from its centre, the way the horizontal bar's slits do */
  @keyframes widen{from{opacity:0;clip-path:inset(0 50% 0 50%);}
                     to{opacity:1;clip-path:inset(0 0 0 0);}}
  /* the corner swatches grow after their fighter has landed — they are the
     answer to "who is who", so they should arrive second */
  #hud:not(.off) .swatch{animation:grow .4s cubic-bezier(.2,1.6,.4,1) .52s backwards;}
  @keyframes grow{from{opacity:0;transform:scaleY(.2);}to{opacity:1;transform:none;}}

  /* ?guides=1 draws the CTA band and the feed rectangle so the composition
     can be judged in a browser. Never visible without the flag. */
  #guides{position:fixed;inset:0;pointer-events:none;z-index:99;display:none;}
  body.guides #guides{display:block;}
  #guides .cta{position:absolute;top:0;left:0;right:0;height:var(--cta-band);
    background:rgba(255,51,204,.1);border-bottom:2px dashed rgba(255,51,204,.5);}
  #guides .feed{position:absolute;top:var(--cta-band);left:0;right:0;
    height:calc(var(--feed-bottom) - var(--cta-band));
    background:rgba(120,200,255,.08);border-bottom:2px dashed rgba(120,200,255,.55);}
  #guides .lbl{position:absolute;left:16px;font:600 20px 'Barlow',sans-serif;
    letter-spacing:.2em;color:rgba(255,255,255,.5);text-transform:uppercase;}

  /* ── brand strip ────────────────────────────────────────────────── */
  .brand{display:flex;align-items:center;gap:16px;margin-bottom:14px;}
  .brand .mk{font-family:'Press Start 2P',monospace;font-size:26px;letter-spacing:.1em;
    color:#fff;text-shadow:0 0 20px var(--glow);}
  .brand .sb{font:600 20px 'Barlow',sans-serif;letter-spacing:.2em;text-transform:uppercase;
    color:var(--hi);padding-top:5px;}
  .brand .org{margin-left:auto;font:500 17px 'Barlow',sans-serif;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim);padding-top:6px;}

  /* ── bout / format ──────────────────────────────────────────────── */
  .strip{display:flex;align-items:center;gap:14px;padding:11px 22px;margin-bottom:14px;
    background:var(--panel);border-left:5px solid var(--accent);
    box-shadow:0 0 26px rgba(0,0,0,.5);}
  .strip .b{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:34px;
    text-transform:uppercase;line-height:1;letter-spacing:.01em;}
  .strip .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 12px var(--accent);}
  .strip .f{font-family:'Press Start 2P',monospace;font-size:12px;letter-spacing:.16em;
    color:var(--dim);margin-left:auto;text-align:right;line-height:1.5;}

  /* ── the stack ──────────────────────────────────────────────────── */
  .stack{background:var(--panel);border:1px solid var(--line);
    box-shadow:0 26px 70px rgba(0,0,0,.6),0 0 42px rgba(155,48,255,.16);}
  .side{position:relative;display:flex;align-items:center;gap:20px;padding:20px 26px;}
  /* the corner colour, as a block you can actually see — it is the one
     thing on this graphic that is not type */
  .swatch{width:16px;flex:0 0 16px;height:66px;border-radius:3px;background:#3a3a44;
    transition:background .35s ease, box-shadow .35s ease;}
  .side .nm{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:62px;
    line-height:.92;text-transform:uppercase;letter-spacing:.006em;flex:1;min-width:0;
    white-space:nowrap;text-shadow:0 0 26px var(--glow);}
  .side .od{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:40px;
    color:var(--gold);line-height:1;min-width:120px;text-align:right;opacity:0;
    transition:opacity .4s ease;}
  .side .od.on{opacity:1;}

  /* The reveal chip — what the slits do on the horizontal bar.
     It OVERLAYS the name row rather than expanding the stack. Expanding
     added 140px to a graphic that has to share a 1062px band with the
     lower-third and the platform's own UI, and it made the whole clock
     jump every time a colour or a price was called. Overlaying costs
     nothing and the clock stays a fixed 392px tall.
     Auto-closing is not a nicety: a reveal that can strand is a reveal
     that eventually does. */
  .rev{position:absolute;top:0;bottom:0;right:0;display:flex;align-items:center;
    gap:16px;padding:0 26px 0 40px;
    background:linear-gradient(90deg,transparent,rgba(8,0,18,.94) 22%,rgba(8,0,18,.97));
    opacity:0;transform:translateX(26px);pointer-events:none;
    transition:opacity .4s cubic-bezier(.16,1,.3,1), transform .4s cubic-bezier(.16,1,.3,1);}
  .rev.open{opacity:1;transform:none;}
  .rev .ey{font-family:'Press Start 2P',monospace;font-size:12px;letter-spacing:.18em;
    color:var(--hi);white-space:nowrap;}
  .rev .vl{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:36px;
    text-transform:uppercase;letter-spacing:.03em;color:#fff;white-space:nowrap;}

  /* ── the clock band ─────────────────────────────────────────────── */
  .band{display:flex;align-items:center;justify-content:center;gap:30px;
    padding:15px 26px;background:linear-gradient(90deg,rgba(155,48,255,.16),rgba(255,51,204,.13));
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  body.gfl .band{background:linear-gradient(90deg,rgba(232,49,42,.17),rgba(255,120,40,.12));}
  #round{font-family:'Press Start 2P',monospace;font-size:20px;letter-spacing:.16em;
    color:#fff;text-shadow:0 0 16px var(--glow);
    transition:transform .26s ease, opacity .26s ease;transform-origin:50% 50%;}
  /* the round flip — same motion as the horizontal clock's flipSwap, so a
     round change reads identically on both canvases */
  #round.flip-out{transform:rotateX(90deg);opacity:0;}
  #round.flip-in{transform:rotateX(-90deg);opacity:0;}
  #timer{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:64px;
    line-height:1;letter-spacing:.02em;color:var(--gold);min-width:180px;text-align:center;
    text-shadow:0 0 26px rgba(255,206,0,.5);font-variant-numeric:tabular-nums;}
  #timer:empty{display:none;}
  #timer.low{color:#ff4d4d;text-shadow:0 0 26px rgba(255,77,77,.6);animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
</style>
</head>
<body>

<div id="guides">
  <div class="cta"><span class="lbl" style="top:12px;">CTA block</span></div>
  <div class="feed"><span class="lbl" style="top:12px;">1080 x 608 feed</span></div>
  <span class="lbl" style="top:calc(var(--feed-bottom) + 6px);">free — the clock lives here</span>
</div>

<div id="hud" class="off">
  <div class="brand">
    <span class="mk" id="brandName">UBA</span>
    <span class="sb" id="brandSub">Fight Night</span>
    <span class="org" id="orgText">Unified Boxing Association</span>
  </div>

  <div class="strip">
    <span class="dot"></span>
    <span class="b" id="boutLabel">MAIN EVENT</span>
    <span class="f" id="formatLabel">5 ROUNDS</span>
  </div>

  <div class="stack">
    <div class="side"><div class="swatch" id="swL"></div>
      <div class="nm" id="nameL">—</div><div class="od" id="oddsL"></div>
      <div class="rev" id="revL">
        <span class="ey" id="revEyL"></span><span class="vl" id="revVlL"></span></div></div>

    <div class="band">
      <span id="round">ROUND 1</span>
      <span id="timer"></span>
    </div>

    <div class="side"><div class="swatch" id="swR"></div>
      <div class="nm" id="nameR">—</div><div class="od" id="oddsR"></div>
      <div class="rev" id="revR">
        <span class="ey" id="revEyR"></span><span class="vl" id="revVlR"></span></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
const sb = supabase.createClient('https://emzlivoykbhhjcugupit.supabase.co',
  'sb_publishable_pqhH974E1q9YsFnrVH1UJQ_X3V-rRLF')
const $ = id => document.getElementById(id)
const Q = new URLSearchParams(location.search)
const has = v => v !== null && v !== undefined && String(v).trim() !== ''

// ── the skin ────────────────────────────────────────────────────────
const LEAGUE_COPY = {
  uba: { name:'UBA', sub:'Fight Night',  org:'Unified Boxing Association' },
  gfl: { name:'GFL', sub:'Glory League', org:'Glory Fighting League' },
}
function setLeague(lg){
  const key = String(lg || '').toLowerCase() === 'gfl' ? 'gfl' : 'uba'
  if(document.body.dataset.league === key) return
  document.body.dataset.league = key
  document.body.classList.toggle('gfl', key === 'gfl')
  const c = LEAGUE_COPY[key]
  $('brandName').textContent = c.name
  $('brandSub').textContent  = c.sub
  $('orgText').textContent   = c.org
}
// ?league=gfl dresses the clock with no deck attached — how you check the
// skin in a browser, and how OBS can be locked to one league if that is
// ever wanted. The deck still overrides it on the next command.
if(Q.get('league')) setLeague(Q.get('league'))

// ?feed=<px> moves the whole clock in one go — see the note at the top.
if(Q.get('feed')) document.documentElement.style.setProperty('--feed-bottom', (+Q.get('feed')) + 'px')
if(Q.get('guides') === '1') document.body.classList.add('guides')

// ── names ───────────────────────────────────────────────────────────
// Long names shrink instead of wrapping. Measured, not estimated: a name
// measured against the fallback face comes back narrow and then overruns
// once Barlow Condensed lands — the trap fix/fit-after-fonts-load closed
// on the tale of the tape.
const NAT = {}
function natWidth(el){
  const c = NAT[el.id]
  if(c && c.key === el.textContent) return c.w
  const prev = el.style.fontSize
  el.style.fontSize = '62px'
  const r = document.createRange(); r.selectNodeContents(el)
  const w = r.getBoundingClientRect().width
  el.style.fontSize = prev
  NAT[el.id] = { key: el.textContent, w }
  return w
}
function fitNames(){
  ;['nameL','nameR'].forEach(id => {
    const el = $(id); if(!el) return
    const row = el.parentElement
    const od  = row.querySelector('.od')
    const cs  = getComputedStyle(row)
    const avail = row.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)
      - 16 /* swatch */ - 20 /* gap */ - (od ? od.offsetWidth + 20 : 0) - 4
    const nat = Math.max(natWidth(el), 1)
    el.style.fontSize = Math.max(26, Math.min(62, Math.floor(62 * avail / nat))) + 'px'
  })
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitNames)

// ── corner colours ──────────────────────────────────────────────────
// CHROMA, not HSL saturation — saturation's denominator collapses near
// white and black, which is how a near-white corner got announced as
// PURPLE TRUNKS on the horizontal bar.
function colorName(hex){
  const n = parseInt(String(hex).slice(1), 16)
  const r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx + mn) / 2
  if((mx - mn) < .10) return l > .72 ? 'WHITE' : l < .26 ? 'BLACK' : 'GREY'
  let h = 0
  if(mx === r) h = ((g - b) / (mx - mn)) % 6
  else if(mx === g) h = (b - r) / (mx - mn) + 2
  else h = (r - g) / (mx - mn) + 4
  h = (h * 60 + 360) % 360
  return h<15?'RED':h<40?'ORANGE':h<65?'GOLD':h<150?'GREEN':h<200?'CYAN'
        :h<255?'BLUE':h<290?'PURPLE':h<345?'PINK':'RED'
}
const CUR = { l:null, r:null }
function setCorners(l, r){
  if(has(l)){ CUR.l = l; $('swL').style.background = l; $('swL').style.boxShadow = `0 0 22px ${l}` }
  if(has(r)){ CUR.r = r; $('swR').style.background = r; $('swR').style.boxShadow = `0 0 22px ${r}` }
}

// ── the reveal ──────────────────────────────────────────────────────
// One mechanism, two vocabularies — trunks and odds — exactly like the
// horizontal bar. Auto-closes, and a second reveal cancels the first
// rather than racing it.
const HOLD_TRUNKS = 7500, HOLD_ODDS = 9000
let revTimer = null
function reveal(L, R, hold){
  clearTimeout(revTimer)
  $('revEyL').textContent = L.eyebrow; $('revVlL').textContent = L.value
  $('revEyR').textContent = R.eyebrow; $('revVlR').textContent = R.value
  $('revL').classList.add('open'); $('revR').classList.add('open')
  revTimer = setTimeout(() => {
    $('revL').classList.remove('open'); $('revR').classList.remove('open')
  }, hold || HOLD_TRUNKS)
}
function corners(l, r){
  setCorners(l, r)
  reveal({ eyebrow: colorName(l || '#e8312a'), value:'TRUNKS' },
         { eyebrow: colorName(r || '#2e6fe8'), value:'TRUNKS' }, HOLD_TRUNKS)
}
// American odds carry their own meaning: negative = favourite, positive =
// underdog. The eyebrow says which, so the number reads to someone who has
// never seen a betting line.
const oddsWord = v => (!has(v) || v === '—') ? 'EVEN'
  : (String(v).trim().startsWith('-') ? 'FAVOURITE' : 'UNDERDOG')
function oddsReveal(l, r){
  // The number also parks beside the name and stays there — on a phone the
  // reveal is gone in nine seconds and the price is the thing people came
  // back to check.
  for(const [id, v] of [['oddsL', l], ['oddsR', r]]){
    $(id).textContent = has(v) ? v : ''
    $(id).classList.toggle('on', has(v))
  }
  fitNames()
  reveal({ eyebrow: oddsWord(l), value: has(l) ? l : '—' },
         { eyebrow: oddsWord(r), value: has(r) ? r : '—' }, HOLD_ODDS)
}

// ── round + timer ───────────────────────────────────────────────────
function flipSwap(el, text){
  if(!el || el.textContent === String(text)) return
  el.classList.add('flip-out')
  setTimeout(() => {
    el.textContent = String(text)
    // the incoming pose must be applied WITHOUT a transition, or it animates
    // from one rotated state to the other and the flip reads as a wobble
    el.style.transition = 'none'
    el.classList.remove('flip-out'); el.classList.add('flip-in')
    requestAnimationFrame(() => {
      el.style.transition = ''
      el.classList.remove('flip-in')
    })
  }, 260)
}
let tHandle = null
function timer(secs){
  clearInterval(tHandle)
  const el = $('timer')
  if(secs == null){ el.textContent = ''; el.classList.remove('low'); return }
  let left = secs
  const draw = () => {
    el.textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`
    el.classList.toggle('low', left <= 10)
  }
  draw()
  tHandle = setInterval(() => {
    left = Math.max(0, left - 1); draw()
    if(left <= 0) clearInterval(tHandle)
  }, 1000)
}

// ── the wire ────────────────────────────────────────────────────────
sb.channel('vga-overlay').on('broadcast', { event:'cmd' }, ({ payload: c }) => {
  if(!c) return
  // LEAGUE GATE on EVERY command, not just 'clock' — the same rule and the
  // same reason as the horizontal clock. The deck stamps league on all of
  // them, so gating only show/hide let one press of Colours or Odds animate
  // both leagues' clocks at once. An UNTAGGED command still passes, so an
  // older cached deck keeps working.
  if(c.league && c.league !== 'uba' && c.league !== 'gfl') return
  if(c.league) setLeague(c.league)

  if(c.type === 'clock'){ $('hud').classList.toggle('off', c.show === false); return }

  if(c.type === 'bout'){
    const d = c.d || {}
    if(d.a != null) $('nameL').textContent = String(d.a).toUpperCase()
    if(d.b != null) $('nameR').textContent = String(d.b).toUpperCase()
    if(has(d.label)) $('boutLabel').textContent = String(d.label).toUpperCase()
    if(has(d.sub))   $('formatLabel').textContent = String(d.sub).toUpperCase()
    setCorners(d.colorL, d.colorR)     // set, don't perform
    fitNames()
    return
  }
  // Set by default, perform only when asked. Picking a swatch on the deck
  // should not replay the animation on every colour tried — that is what
  // the explicit reveal button ({reveal:true}) is for.
  if(c.type === 'corner'){
    const d = c.d || {}
    if(c.reveal) corners(d.l, d.r); else setCorners(d.l, d.r)
    return
  }
  if(c.type === 'clockodds'){ const d = c.d || {}; oddsReveal(d.l, d.r); return }
  if(c.type === 'round'){ flipSwap($('round'), 'ROUND ' + c.n); return }
  // 'clocktimer' is THIS clock's timer, deliberately a different command from
  // the overlay's 'matchtimer' — one deck press must not run both clocks.
  if(c.type === 'clocktimer'){ timer(c.on === false ? null : c.secs); return }
}).subscribe()

// Preview harness.
if(Q.get('demo') === '1'){
  $('hud').classList.remove('off')
  $('nameL').textContent = 'SMOKINEM'; $('nameR').textContent = 'HELLO WORLD'
  $('boutLabel').textContent = 'MAIN EVENT'; $('formatLabel').textContent = '5 ROUNDS · TITLE'
  setCorners('#e8312a', '#2e6fe8')
  fitNames()
  flipSwap($('round'), 'ROUND 3')
  timer(122)
  setTimeout(() => oddsReveal('+140', '-165'), 900)
}
})()
</script>
</body>
</html>
