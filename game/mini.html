<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VGA Fighter</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet" />
    <style>
      /* Transparent on purpose — embedded as a playable cutout on the profile
         hero. Tapping the fighter punches a crate in place; nothing opens. */
      html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
      #root { display: flex; align-items: flex-end; justify-content: flex-end; }
      @keyframes mdFloat { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-24px); opacity: 0; } }
      @keyframes mdShard { 0% { transform: translate(0,0); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
      @keyframes mdPulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
      @keyframes mdBubIn { 0% { transform: scale(0.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
      @keyframes mdBob { 0% { filter: brightness(1); } 100% { filter: brightness(1.35); } }
      @keyframes mdPop { 0% { transform: scale(0.86); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
    <script type="module" crossorigin src="./assets/mini-CYBWLe2H.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/FighterAvatar-DsNT4z0e.js">
    <link rel="modulepreload" crossorigin href="./assets/icons-BhZRd8Uc.js">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
