<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VGA replay control</title>
<!--
  VGA replay control  (analyst page)

  Setup: fill SUPABASE_URL and SUPABASE_ANON_KEY below. Leave them blank to work
  offline with clips opened from your own disk (good for testing).

  Supabase pieces this page expects:
    table  replay_clips  (id, created_at, name, url, match_no int, round_no int)
    table  replay_state  (id=1, match_no int, round_no int)   <- the watcher reads this to tag uploads
    realtime channel "replay"  <- broadcast messages the overlay page obeys:
       {type:"load", url}  {type:"play"}  {type:"pause"}  {type:"seek", t}  {type:"rate", r}
       {type:"live", stroke}   {type:"stroke", tool, color, pts:[[x,y],...]}   (x,y are 0..1 of the video frame)
       {type:"undo"}  {type:"clear"}
-->
<style>
  :root{
    --bg:#15181d; --panel:#1c2026; --line:#2b313a; --ink:#e9e6df; --dim:#8b919c;
    --hot:#ffd23f; --live:#d64545;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif;overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;min-height:40px}
  button:hover{border-color:var(--dim)}
  button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  button:focus-visible{outline:2px solid var(--hot);outline-offset:2px}

  #app{display:grid;grid-template-columns:290px 1fr;height:100%}

  /* left: clips */
  #clips{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  #clips header{padding:14px 16px;border-bottom:1px solid var(--line)}
  #clips header h1{font-size:15px;font-weight:600}
  #clips header p{color:var(--dim);font-size:13px;margin-top:2px}
  #current{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #current .now{grid-column:1/3;font-size:22px;font-weight:600;letter-spacing:-.01em}
  #current .now small{color:var(--dim);font-size:13px;font-weight:400;margin-left:8px}
  #list{overflow:auto;flex:1;padding:8px 0}
  .match{padding:10px 16px 4px;font-weight:600}
  .round{padding:6px 16px 2px 24px;color:var(--dim);font-size:13px}
  .clip{display:block;width:100%;text-align:left;border:0;border-radius:0;padding:9px 16px 9px 36px;min-height:38px}
  .clip:hover{background:#242932}
  .clip.on{background:#2c3340;box-shadow:inset 3px 0 0 var(--hot)}
  .clip small{color:var(--dim);margin-left:8px}
  #empty{padding:24px 16px;color:var(--dim);font-size:14px}
  /* Matches before the one the show is on fade back but stay clickable. The clip
     on screen never fades, whatever match it came from. */
  .match.now{color:var(--hot)}
  .match.now small{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px}
  .wait{padding:4px 16px 10px 24px;color:var(--dim);font-size:13px;font-style:italic}
  .past{opacity:.38;transition:opacity .15s}
  .clip.past:hover{opacity:.85}
  .clip.past.on{opacity:1}
  #open{margin:8px 16px 16px;width:calc(100% - 32px);color:var(--dim)}

  /* right: stage */
  #stage{display:grid;grid-template-rows:1fr auto auto;min-height:0}
  #frame{position:relative;background:#000;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #box{position:relative;background:#000}
  #box video{position:absolute;inset:0;width:100%;height:100%;background:#000}
  #box canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
  #nothing{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);pointer-events:none}

  .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .group{display:flex;gap:6px;align-items:center}
  .gap{width:1px;height:28px;background:var(--line);margin:0 6px}
  .swatch{width:34px;height:34px;min-height:0;padding:0;border-radius:50%;border:2px solid transparent}
  .swatch.on{border-color:var(--ink);transform:scale(1.1)}
  .swatch[data-c="#ffffff"]{background:#fff}
  .swatch[data-c="#ffd23f"]{background:#ffd23f}
  .swatch[data-c="#3fd7ff"]{background:#3fd7ff}
  .swatch[data-c="#ff4fa3"]{background:#ff4fa3}
  #clear{color:var(--live);border-color:var(--live)}
  #clear:hover{background:var(--live);color:#fff}
  #width{width:110px;accent-color:var(--ink)}

  #play{width:56px;font-size:18px}
  #scrub{flex:1;min-width:160px;accent-color:var(--hot)}
  #time{color:var(--dim);font-variant-numeric:tabular-nums;min-width:110px;text-align:right}
  .push{margin-left:auto}
  #status{color:var(--dim);font-size:13px}
  #status.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#4fc36b;margin-right:6px}

  @media (max-width:820px){
    #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    #clips{max-height:36vh;border-right:0;border-bottom:1px solid var(--line)}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="clips">
    <header>
      <h1>Replay control</h1>
      <p>Clips land here as they're captured</p>
    </header>
    <div id="current">
      <div class="now">Match <span id="mNo">1</span><small>round <span id="rNo">1</span></small></div>
      <button id="nextMatch">Next match</button>
      <button id="nextRound">Next round</button>
    </div>
    <div id="list"><div id="empty">No clips yet. Hit replay on the broadcast PC and they'll show up here.</div></div>
    <button id="open">Open a clip from this computer</button>
    <input id="file" type="file" accept="video/*" hidden>
  </aside>

  <main id="stage">
    <div id="frame">
      <div id="box">
        <video id="video" playsinline preload="auto"></video>
        <canvas id="ink"></canvas>
        <div id="nothing">Pick a clip on the left</div>
      </div>
    </div>

    <div class="bar" id="tools">
      <div class="group" data-tools>
        <button data-tool="pen" class="on">Pen</button>
        <button data-tool="arrow">Arrow</button>
        <button data-tool="circle">Circle</button>
        <button data-tool="line">Line</button>
      </div>
      <div class="gap"></div>
      <div class="group" data-colors>
        <button class="swatch on" data-c="#ffd23f" aria-label="yellow"></button>
        <button class="swatch" data-c="#ffffff" aria-label="white"></button>
        <button class="swatch" data-c="#3fd7ff" aria-label="cyan"></button>
        <button class="swatch" data-c="#ff4fa3" aria-label="pink"></button>
      </div>
      <input id="width" type="range" min="2" max="14" value="5" aria-label="line width">
      <div class="group push">
        <button id="undo">Undo</button>
        <button id="clear">Clear</button>
      </div>
    </div>

    <div class="bar" id="transport">
      <button id="play" aria-label="play or pause">▶</button>
      <button id="back" title="back 1 second">−1s</button>
      <button id="fwd" title="forward 1 second">+1s</button>
      <div class="gap"></div>
      <div class="group" data-rates>
        <button data-rate="0.25">¼</button>
        <button data-rate="0.5">½</button>
        <button data-rate="1" class="on">1×</button>
      </div>
      <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="scrub">
      <span id="time">0:00.0 / 0:00.0</span>
      <span id="status" class="push">Offline, local clips only</span>
    </div>
  </main>
</div>

<script>
// ---------- config ----------
const SUPABASE_URL = "https://emzlivoykbhhjcugupit.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_pqhH974E1q9YsFnrVH1UJQ_X3V-rRLF";

// ---------- state ----------
const $ = s => document.querySelector(s);
const video = $("#video"), ink = $("#ink"), ctx = ink.getContext("2d");
const state = { match:1, round:1, clips:[], current:null, tool:"pen", color:"#ffd23f", width:5, strokes:[], drawing:null };
let sb = null, channel = null, lastLive = 0;

// ---------- messaging ----------
function send(msg){ if (channel) channel.send({ type:"broadcast", event:"replay", payload: msg }); }

// ---------- clip list ----------
function fmtTime(iso){ const d = new Date(iso); return d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit", second:"2-digit"}); }

function renderList(){
  const list = $("#list");
  if (!state.clips.length){ list.innerHTML = '<div id="empty">No clips yet. Hit replay on the broadcast PC and they\'ll show up here.</div>'; return; }
  const byMatch = {};
  for (const c of state.clips){ (byMatch[c.match_no] ??= {})[c.round_no] ??= []; byMatch[c.match_no][c.round_no].push(c); }
  byMatch[state.match] ??= {};   // the match the show is on always gets a header, clips or not
  let html = "";
  for (const m of Object.keys(byMatch).map(Number).sort((a,b)=>b-a)){
    const past = m !== state.match ? " past" : "";
    html += m === state.match
      ? `<div class="match now">Match ${m}<small>on now</small></div>`
      : `<div class="match${past}">Match ${m}</div>`;
    if (!Object.keys(byMatch[m]).length){ html += `<div class="wait">Waiting for the first replay…</div>`; continue; }
    for (const r of Object.keys(byMatch[m]).map(Number).sort((a,b)=>b-a)){
      html += `<div class="round${past}">Round ${r}</div>`;
      for (const c of byMatch[m][r].slice().sort((a,b)=>b.created_at.localeCompare(a.created_at)))
        html += `<button class="clip${past}${state.current===c.id?" on":""}" data-id="${c.id}">${c.name}<small>${fmtTime(c.created_at)}</small></button>`;
    }
  }
  list.innerHTML = html;
}

$("#list").addEventListener("click", e => { const b = e.target.closest(".clip"); if (b) loadClip(b.dataset.id); });

function loadClip(id){
  const c = state.clips.find(x => String(x.id) === String(id)); if (!c) return;
  state.current = c.id; renderList();
  video.src = c.url; video.playbackRate = currentRate(); video.load();
  $("#nothing").style.display = "none";
  clearAll(false);
  send({ type:"load", url:c.url });
}

$("#open").onclick = () => $("#file").click();
$("#file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const clip = { id:"local-"+Date.now(), created_at:new Date().toISOString(), name:f.name.replace(/\.[^.]+$/,""), url:URL.createObjectURL(f), match_no:state.match, round_no:state.round };
  state.clips.push(clip); renderList(); loadClip(clip.id);
  e.target.value = "";
};

// ---------- match / round ----------
function showCurrent(){ $("#mNo").textContent = state.match; $("#rNo").textContent = state.round; renderList(); }
async function saveCurrent(){
  showCurrent();
  if (sb) await sb.from("replay_state").upsert({ id:1, match_no:state.match, round_no:state.round });
}
$("#nextMatch").onclick = () => { state.match++; state.round = 1; saveCurrent(); };
$("#nextRound").onclick = () => { state.round++; saveCurrent(); };

// ---------- transport ----------
function currentRate(){ return +document.querySelector("[data-rate].on").dataset.rate; }
function fmt(t){ if (!isFinite(t)) t = 0; const m = Math.floor(t/60), s = (t%60).toFixed(1).padStart(4,"0"); return `${m}:${s}`; }

$("#play").onclick = () => { if (!video.src) return; video.paused ? video.play() : video.pause(); };
video.onplay  = () => { $("#play").textContent = "❚❚"; send({ type:"play" }); };
video.onpause = () => { $("#play").textContent = "▶";  send({ type:"pause" }); };
$("#back").onclick = () => seek(video.currentTime - 1);
$("#fwd").onclick  = () => seek(video.currentTime + 1);
function seek(t){ if (!video.src) return; video.currentTime = Math.max(0, Math.min(video.duration||0, t)); send({ type:"seek", t:video.currentTime }); }

let scrubbing = false;
$("#scrub").oninput = e => { scrubbing = true; if (video.duration) video.currentTime = e.target.value/1000*video.duration; };
$("#scrub").onchange = e => { scrubbing = false; send({ type:"seek", t:video.currentTime }); };
video.ontimeupdate = () => {
  if (!scrubbing && video.duration) $("#scrub").value = video.currentTime/video.duration*1000;
  $("#time").textContent = `${fmt(video.currentTime)} / ${fmt(video.duration)}`;
};
video.onloadedmetadata = video.ontimeupdate;

document.querySelector("[data-rates]").addEventListener("click", e => {
  const b = e.target.closest("[data-rate]"); if (!b) return;
  document.querySelectorAll("[data-rate]").forEach(x => x.classList.toggle("on", x===b));
  video.playbackRate = +b.dataset.rate; send({ type:"rate", r:+b.dataset.rate });
});

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space"){ e.preventDefault(); $("#play").click(); }
  if (e.code === "ArrowLeft") seek(video.currentTime - (e.shiftKey?1:1/30));
  if (e.code === "ArrowRight") seek(video.currentTime + (e.shiftKey?1:1/30));
  if ((e.metaKey||e.ctrlKey) && e.key === "z"){ e.preventDefault(); undo(); }
  if (e.key === "Escape") clearAll(true);
});

// ---------- drawing ----------
document.querySelector("[data-tools]").addEventListener("click", e => {
  const b = e.target.closest("[data-tool]"); if (!b) return;
  state.tool = b.dataset.tool; document.querySelectorAll("[data-tool]").forEach(x => x.classList.toggle("on", x===b));
});
document.querySelector("[data-colors]").addEventListener("click", e => {
  const b = e.target.closest(".swatch"); if (!b) return;
  state.color = b.dataset.c; document.querySelectorAll(".swatch").forEach(x => x.classList.toggle("on", x===b));
});
$("#width").oninput = e => state.width = +e.target.value;
$("#undo").onclick = undo;
$("#clear").onclick = () => clearAll(true);

function undo(){ state.strokes.pop(); redraw(); send({ type:"undo" }); }
function clearAll(tell){ state.strokes = []; redraw(); if (tell) send({ type:"clear" }); }

function fit(){ const r = ink.getBoundingClientRect(); ink.width = r.width*devicePixelRatio; ink.height = r.height*devicePixelRatio; redraw(); }
function sizeBox(){ const f = $("#frame").getBoundingClientRect(), box = $("#box"); let w = f.width, h = w*9/16; if (h > f.height){ h = f.height; w = h*16/9; } box.style.width = w+"px"; box.style.height = h+"px"; }
new ResizeObserver(sizeBox).observe($("#frame")); new ResizeObserver(fit).observe(ink); sizeBox();

function norm(e){ const r = ink.getBoundingClientRect(); return [(e.clientX-r.left)/r.width, (e.clientY-r.top)/r.height]; }

ink.onpointerdown = e => {
  if (!video.src) return;
  ink.setPointerCapture(e.pointerId);
  state.drawing = { tool:state.tool, color:state.color, width:state.width, pts:[norm(e)] };
};
ink.onpointermove = e => {
  if (!state.drawing) return;
  const p = norm(e);
  if (state.drawing.tool === "pen") state.drawing.pts.push(p); else state.drawing.pts[1] = p;
  redraw();
  // stream the in-progress stroke so the overlay draws along with the analyst
  const now = performance.now();
  if (now - lastLive > 50){ lastLive = now; send({ type:"live", stroke: state.drawing }); }
};
ink.onpointerup = ink.onpointercancel = e => {
  if (!state.drawing) return;
  const s = state.drawing; state.drawing = null;
  if (s.pts.length > 1){ state.strokes.push(s); send({ type:"stroke", ...s }); }
  redraw();
};

function redraw(){
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,ink.width,ink.height);
  for (const s of state.strokes) draw(s);
  if (state.drawing) draw(state.drawing);
}

// Same routine the overlay uses, so what the analyst sees is what goes on air.
function draw(s){
  const W = ink.width, H = ink.height, k = W/1920;   // widths scale with the frame
  ctx.lineCap = ctx.lineJoin = "round"; ctx.strokeStyle = s.color; ctx.lineWidth = s.width*k*1.6;
  ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 4*k;
  const P = s.pts.map(([x,y]) => [x*W, y*H]);
  ctx.beginPath();
  if (s.tool === "pen"){ ctx.moveTo(...P[0]); for (const p of P.slice(1)) ctx.lineTo(...p); ctx.stroke(); return; }
  if (P.length < 2) return;
  const [a,b] = P;
  if (s.tool === "line" || s.tool === "arrow"){
    ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
    if (s.tool === "arrow"){
      const ang = Math.atan2(b[1]-a[1], b[0]-a[0]), L = 18*k + s.width*k*2;
      ctx.beginPath(); ctx.moveTo(...b);
      ctx.lineTo(b[0]-L*Math.cos(ang-0.5), b[1]-L*Math.sin(ang-0.5));
      ctx.moveTo(...b);
      ctx.lineTo(b[0]-L*Math.cos(ang+0.5), b[1]-L*Math.sin(ang+0.5));
      ctx.stroke();
    }
  }
  if (s.tool === "circle"){
    const rx = Math.abs(b[0]-a[0])/2, ry = Math.abs(b[1]-a[1])/2;
    ctx.ellipse((a[0]+b[0])/2, (a[1]+b[1])/2, rx, ry, 0, 0, Math.PI*2); ctx.stroke();
  }
}

// ---------- supabase ----------
async function connect(){
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return;
  await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const { data:st } = await sb.from("replay_state").select("*").eq("id",1).maybeSingle();
  if (st){ state.match = st.match_no; state.round = st.round_no; showCurrent(); }

  const { data:clips } = await sb.from("replay_clips").select("*").order("created_at",{ascending:false}).limit(200);
  state.clips = clips || []; renderList();

  channel = sb.channel("replay")
    .on("postgres_changes", { event:"INSERT", schema:"public", table:"replay_clips" }, p => { state.clips.push(p.new); renderList(); })
    .on("postgres_changes", { event:"DELETE", schema:"public", table:"replay_clips" }, p => { state.clips = state.clips.filter(c => c.id !== p.old.id); renderList(); })
    .subscribe(s => { const el = $("#status"); if (s === "SUBSCRIBED"){ el.textContent = "Connected to overlay"; el.classList.add("live"); } else { el.textContent = "Connecting…"; el.classList.remove("live"); } });
}
connect().catch(err => { $("#status").textContent = "Couldn't reach Supabase, check the keys"; console.error(err); });
showCurrent(); renderList();
</script>
</body>
</html>
