<!-- VGA spar lobby — CLICKABLE PROTOTYPE. Fake state only: nothing here writes to Supabase. -->
<title>Spar Lobby Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Dark-only on purpose: the PWA is dark-only (Twilight ground). No rounded controls anywhere:
   the only curve on the page is the phone itself. */
:root{
  --page:#0B0716; --tw:#1A1533; --deep:#120E26; --pane:#211A40; --ink:#EDEAF6; --soft:#ADA4D6; --mute:#8B82AE; --dim:#585174;
  --line:rgba(255,255,255,.1); --edge:rgba(255,255,255,.22);
  --vio:#A78BFA; --vio2:#C3A6FF; --gold:#F5C842; --go:#5FD98A; --red:#E8505B;
  --disp:'Bebas Neue',Impact,sans-serif; --cond:'Barlow Condensed',Impact,sans-serif;
  --body:'Barlow',system-ui,sans-serif; --mono:'Space Mono',ui-monospace,Menlo,monospace;
}
html,body{background:var(--page);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:20px;padding-block:26px 60px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1900px;margin:0 auto}
h1{font-family:var(--disp);font-weight:400;font-size:clamp(38px,6vw,62px);letter-spacing:.05em;line-height:.95;margin:0}
h1 span{color:var(--vio2)}
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 48px;margin-top:12px;max-width:1150px}
.intro p{margin:0;color:var(--soft);max-width:62ch}
.facts{font-family:var(--mono);font-size:11px;color:var(--mute);display:grid;gap:5px;margin:0;padding:0;list-style:none}
.facts b{color:var(--ink)}
@media (max-width:780px){.intro{grid-template-columns:1fr}}
.it{margin-top:48px;border-top:1px solid var(--line);padding-top:20px}
.ih{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.ih .no{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--vio);letter-spacing:.14em}
.ih h2{font-family:var(--disp);font-weight:400;font-size:33px;letter-spacing:.05em;margin:0;line-height:1}
.ih p{margin:0;color:var(--soft);flex-basis:100%;max-width:84ch}
.tr{display:flex;flex-wrap:wrap;gap:4px 26px;margin-top:7px;font-size:13.5px;color:var(--mute)}
.tr b{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-right:6px}
.rail{display:flex;gap:18px;overflow-x:auto;padding:16px 2px 12px;scrollbar-color:#3A3160 transparent}
.shot{flex:0 0 auto;display:flex;flex-direction:column;gap:8px}
.cap{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--soft)}
.cap i{font-style:normal;color:var(--dim);letter-spacing:.03em;text-transform:none;display:block;margin-top:2px}

/* ── phone (shared) ── */
.ph{width:272px;height:566px;border-radius:30px;position:relative;overflow:hidden;background:var(--tw);
  border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 40px rgba(0,0,0,.5);font-size:12px;line-height:1.35}
.ph *{border-radius:0}
.scr{position:absolute;inset:0 0 50px 0;overflow:hidden}
.tb{position:absolute;left:0;right:0;bottom:0;height:50px;display:flex;justify-content:space-around;align-items:center;background:#130F2A;border-top:1px solid var(--line);z-index:9}
.tb span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:8px;color:#6F6790;font-weight:600}
.tb span::before{content:'';width:12px;height:12px;border:1.6px solid currentColor}
.tb span.on{color:var(--vio2)}
.tb span.you::before{width:22px;height:22px;background:linear-gradient(160deg,#8B5CF6,#6D28D9);border:0;margin-top:-10px;transform:rotate(45deg) scale(.8)}
.hd{display:flex;justify-content:space-between;align-items:center;padding:20px 14px 0;position:relative;z-index:5;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.hd b{color:var(--gold);font-weight:700;letter-spacing:.04em}
.hd .g{color:var(--go)} .hd .v{color:var(--vio2)}
.hero{position:relative;overflow:hidden}
.hero .glow{position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 74%,rgba(123,47,255,.55),transparent 70%)}
.hero .floor{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(180deg,transparent,var(--tw))}
.hero img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:100%;filter:drop-shadow(0 12px 26px rgba(0,0,0,.55))}
.hero .id{position:absolute;left:14px;right:14px;bottom:6px;z-index:3}
.nick{font-family:var(--cond);font-weight:600;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--vio2)}
.nmL{font-family:var(--disp);font-size:33px;letter-spacing:.03em;line-height:.9}
.meta{font-family:var(--mono);font-size:9px;color:var(--soft);margin-top:3px}
.fo{position:relative;overflow:hidden}
.fo img{position:absolute;bottom:0;height:100%;filter:drop-shadow(0 10px 20px rgba(0,0,0,.6))}
.fo img.l{left:-8%;transform:scaleX(-1)} .fo img.r{right:-8%}
.fo .glowL{position:absolute;inset:0;background:radial-gradient(50% 60% at 22% 80%,rgba(123,47,255,.45),transparent 70%),radial-gradient(50% 60% at 78% 80%,rgba(245,200,66,.18),transparent 70%)}
.fo .floor{position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(180deg,transparent,var(--tw))}
.names{display:flex;justify-content:space-between;padding:4px 14px 0;font-family:var(--disp);font-size:22px;line-height:1;letter-spacing:.03em}
.names span:last-child{text-align:right}
.names small{display:block;font-family:var(--mono);font-size:8.5px;color:var(--soft);letter-spacing:.02em}
.av{width:30px;height:30px;flex:0 0 auto;overflow:hidden;position:relative;background:linear-gradient(160deg,#2A1650,#120E22);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:14px;color:rgba(214,200,255,.8)}
.av img{position:absolute;left:50%;top:-4%;height:330%;transform:translateX(-50%)}
.row{display:flex;align-items:center;gap:9px;padding:6px 14px;border-bottom:1px solid var(--line);min-height:44px}
.row .tx{flex:1;min-width:0}
.row .nm{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ln{font-family:var(--mono);font-size:8.3px;color:var(--soft);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.off{opacity:.38}
.lbl{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);padding:10px 14px 4px}
.wl{display:inline-flex;gap:2px;vertical-align:middle}
.wl i{width:13px;height:13px;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--mono);font-size:7.5px;font-weight:700;background:rgba(255,255,255,.1);color:var(--soft)}
.wl i.w{background:var(--go);color:#08210F} .wl i.l{background:var(--red);color:#2A0206}
.count{font-family:var(--disp);line-height:.85;color:var(--go)}
.code{font-family:var(--mono);font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.note{font-family:var(--mono);font-size:8.5px;color:var(--mute);letter-spacing:.03em}

/* ── tale of the tape (dark, all kinds) ── */
.tape{margin:0 14px}
.tr2{display:grid;grid-template-columns:44px 1fr 62px 1fr 44px;align-items:center;gap:4px;padding:4px 0;border-bottom:1px solid var(--line)}
.tr2:last-child{border-bottom:0}
.tr2 b{font-family:var(--mono);font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tr2 b.r{text-align:right}
.tr2 s{text-decoration:none;text-align:center;font-family:var(--mono);font-size:7px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.tr2 .bar{height:6px;background:rgba(255,255,255,.07);position:relative}
.tr2 .bar i{position:absolute;top:0;bottom:0;background:var(--soft)}
.tr2 .bar.a i{right:0} .tr2 .bar.b i{left:0}
.tr2 .bar i.lead{background:var(--go)}
.tr2 b.lead{color:var(--go)}
.tr2.txt{grid-template-columns:1fr 62px 1fr}


/* shared slab parts: the plate leans, the words inside stand straight */
.sl{transform:skewX(var(--sk,-14deg));background:var(--go);color:#082416;text-align:center;padding:12px 0}
.sl > span{display:block;transform:skewX(calc(var(--sk,-14deg) * -1));font-family:var(--disp);font-size:24px;letter-spacing:.07em;line-height:1}
.sl.v{background:var(--vio);color:#1A0F38}
.sl.g{background:var(--gold);color:#2A1F00}
.sl.o{background:transparent;box-shadow:inset 0 0 0 1.5px var(--edge);color:var(--ink);padding:9px 0}
.sl.o > span{font-size:17px}
.sl.d{background:var(--pane);color:var(--ink)}
.segs{display:flex;gap:4px}
.segs .sl{flex:1;padding:7px 0;background:rgba(255,255,255,.07);color:var(--soft)}
.segs .sl > span{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.segs .sl.on{background:var(--vio2);color:#1A0F38}
.deck{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:12px 20px 14px;display:flex;flex-direction:column;gap:9px;background:linear-gradient(180deg,rgba(19,15,42,0),#130F2A 20%)}
.sp{transform:skewX(var(--sk,-14deg));background:var(--vio);padding:6px 12px}
.sp > span{display:block;transform:skewX(calc(var(--sk,-14deg) * -1));font-family:var(--disp);font-size:14px;letter-spacing:.08em;color:#1A0F38}
.row.asked .sp{background:var(--gold)}
.tr2 .bar{transform:skewX(-20deg);height:8px}
.codebox{margin:8px 22px;transform:skewX(-10deg);background:rgba(95,217,138,.1);box-shadow:inset 0 0 0 1.5px var(--go);padding:14px 0;text-align:center}
.codebox > div{transform:skewX(10deg)}
.strip{margin:10px 16px 0;transform:skewX(-10deg);background:var(--pane);box-shadow:inset 3px 0 0 var(--vio)}
.strip > div{transform:skewX(10deg);display:flex;align-items:center;gap:8px;padding:9px 12px}

/* ═══ S1 · BROADCAST — lower-thirds; plates bleed off the edge of the screen ═══ */
.s1 .deck{padding:12px 0 14px}
.s1 .bl{margin-left:-18px;margin-right:36px;text-align:left;padding-left:34px}
.s1 .bl.r{margin-left:36px;margin-right:-18px;padding-left:0;padding-right:34px;text-align:right}
.s1 .lt{position:absolute;left:0;right:0;bottom:8px;z-index:3}
.s1 .lt .a{display:inline-block;margin-left:-14px;transform:skewX(-14deg);background:var(--gold);padding:3px 14px 3px 24px}
.s1 .lt .a span{display:block;transform:skewX(14deg);font-family:var(--cond);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#2A1F00}
.s1 .lt .b{margin-left:-14px;margin-right:40px;transform:skewX(-14deg);background:#0F0B22;box-shadow:inset 0 -3px 0 var(--vio);padding:6px 14px 7px 26px}
.s1 .lt .b > div{transform:skewX(14deg)}
.s1 .lt .b b{display:block;font-family:var(--disp);font-size:31px;line-height:.9;letter-spacing:.03em}
.s1 .lt .b s{text-decoration:none;font-family:var(--mono);font-size:8.5px;color:var(--soft)}
.s1 .row .sp{margin-right:-26px;padding-right:30px}

/* ═══ S2 · STEEP — twice the lean, fewer and bigger plates, a band behind the fighter ═══ */
.s2{--sk:-26deg}
.s2 .band{position:absolute;left:-30%;right:-30%;top:34%;height:82px;transform:skewY(-12deg);background:linear-gradient(90deg,rgba(167,139,250,0),rgba(167,139,250,.5) 30%,rgba(167,139,250,.5) 70%,rgba(167,139,250,0));z-index:0}
.s2 .hero img{z-index:1}
.s2 .sl > span{font-size:30px}
.s2 .sl{padding:14px 0}
.s2 .sl.o{padding:10px 0}.s2 .sl.o > span{font-size:19px}
.s2 .segs .sl{padding:8px 0}
.s2 .segs .sl > span{font-size:12px}
.s2 .deck{padding:12px 26px 14px}

.s2 .act1{height:56px;display:flex;background:var(--go);transform:skewX(-20deg);margin:0 20px}
.s2 .act1 .go{flex:1;white-space:nowrap;font-family:var(--disp);font-size:25px;letter-spacing:.07em;color:#082416;display:flex;align-items:center;justify-content:center;transform:skewX(20deg)}
.s2 .act1.v{background:var(--vio)}
.s2 .act1.v .go{color:#190F33}
.s2 .act1 .cap{width:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#12331F}
.s2 .act1.v .cap{background:#2B1C63}
.s2 .act1 .cap > *{transform:skewX(20deg)}
.s2 .act1 .cap b{font-family:var(--cond);font-weight:700;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:#DFFFE9}
.s2 .act1.v .cap b{color:#E6DCFF}
.s2 .act1 .cap s{text-decoration:none;font-size:10.5px;line-height:1;color:#7FCF9C}
.s2 .act1.v .cap s{color:#B9A6F5}
.s2 .act1 .cap.arrow{font-family:var(--body);font-size:18px;color:#BFF3D2}
.s2 .act1.v .cap.arrow{color:#CFC0FF}
.s2 .act1.o{background:transparent;box-shadow:inset 0 0 0 1.5px var(--edge)}
.s2 .act1.o .go{color:var(--ink);font-size:21px}
.s2 .act1.warn.o .go{color:#FFC9CE}
.s2 .deckrow{display:flex;gap:6px;align-items:stretch;margin:0 20px}
.s2 .deckrow .act1{margin:0;flex:1}
.s2 .deck{background:linear-gradient(180deg,rgba(19,15,42,0),#130F2A 14%)}
.s2 .fo.mid img.l{left:-3%}
.s2 .fo.mid img.r{right:-3%}
.s2 .codefield.wait{border-style:solid;border-color:rgba(255,255,255,.14)}
.s2 .codefield.wait .code{color:#6A6390;font-size:12px;letter-spacing:.16em;white-space:nowrap}
.s2 .fo.tight img.l{left:-3%}
.s2 .fo.tight img.r{right:-3%}
.s2 .act1.sm{height:46px}
.s2 .act1.sm .go{font-size:20px}
.s2 .act1.sm .cap b{font-size:10.5px}
.s2 .codebox2{margin:10px 18px 0;background:#101A16;border:1px solid rgba(95,217,138,.45);padding:14px 0;text-align:center}
.s2 .codebox2 .code{font-size:30px;color:var(--go)}
.s2 .codefield{margin:10px 18px 0;background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.28);padding:15px 0;text-align:center}
.s2 .codefield .code{font-size:26px;color:#6F6790}
.s2 .roomchip{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--go);display:flex;align-items:center;gap:5px}
.s2 .roomchip i{font-style:normal;font-size:7.5px;letter-spacing:.16em;color:#4E7F62}
.s2 .hintline{font-family:var(--mono);font-size:8px;letter-spacing:.05em;color:var(--dim);text-align:center;margin-top:8px}
.s2 .hintline u{text-decoration:none;color:var(--soft)}
/* SPAR on a fighter: a plain box, no slant */
.s2 .rowsp{background:var(--vio);color:#1A0F38;font-family:var(--disp);font-size:14px;letter-spacing:.08em;line-height:1;padding:7px 14px}
.s2 .row.asked .rowsp{background:var(--gold);color:#2A1F00}
.s2 .row.off .rowsp{background:rgba(255,255,255,.1);color:var(--mute)}

/* ═══ S3 · STAGGER — a staircase menu; every board row is its own plate ═══ */
.s3 .stair{display:flex;flex-direction:column;gap:5px}
.s3 .stair > *:nth-child(2){margin-left:14px}
.s3 .stair > *:nth-child(3){margin-left:28px}
.s3 .stair > *:nth-child(4){margin-left:42px}
.s3 .stair .sl{text-align:left;padding-left:16px}
.s3 .plate{margin:4px 14px 0 18px;transform:skewX(-14deg);background:var(--pane);display:flex;align-items:stretch}
.s3 .plate > .in{transform:skewX(14deg);flex:1;display:flex;align-items:center;gap:9px;padding:5px 8px 5px 10px;min-width:0}
.s3 .plate .end{width:54px;background:var(--vio);display:flex;align-items:center;justify-content:center}
.s3 .plate .end span{transform:skewX(14deg);font-family:var(--disp);font-size:15px;letter-spacing:.08em;color:#1A0F38}
.s3 .plate.asked .end{background:var(--gold)}
.s3 .plate.off{opacity:.38}.s3 .plate.off .end{background:rgba(255,255,255,.1)}.s3 .plate.off .end span{color:var(--mute)}
.s3 .plate .nm{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s3 .plate .ln{font-family:var(--mono);font-size:8px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s3 .plate .av{width:26px;height:26px}

/* ═══ S4 · VERSUS — the screen itself is cut on the diagonal ═══ */
.s4 .vsbg{position:absolute;left:0;right:0;top:0;height:215px;z-index:0;-webkit-mask-image:linear-gradient(180deg,#000 78%,transparent);mask-image:linear-gradient(180deg,#000 78%,transparent)}
.s4 .vsbg i{position:absolute;inset:0}
.s4 .vsbg .l{background:linear-gradient(160deg,#3B2380,#1A1533 70%);clip-path:polygon(0 0,62% 0,38% 100%,0 100%)}
.s4 .vsbg .r{background:linear-gradient(200deg,#5A4410,#1A1533 70%);clip-path:polygon(62% 0,100% 0,100% 100%,38% 100%)}
.s4 .vsbg .seam{background:var(--ink);clip-path:polygon(61.4% 0,62.6% 0,38.6% 100%,37.4% 100%);opacity:.8}
.s4 .fo{z-index:1}
.s4 .fo .glowL{display:none}
.s4 .pair{display:flex;gap:4px}
.s4 .pair .sl{flex:1}
.s4 .pair .sl:first-child{flex:2}
.s4 .joined{display:flex;gap:2px}
.s4 .joined .sl{flex:1}

/* ═══ S5 · QUIET — only the main action leans; everything else stands straight ═══ */
.s5 .deck{padding:12px 18px 14px}
.s5 .lk{display:flex;align-items:center;gap:8px;font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.s5 .lk::before{content:'';width:10px;height:14px;background:var(--vio2);transform:skewX(-14deg)}
.s5 .lks{display:flex;justify-content:space-between}
.s5 .qm{display:flex;gap:16px;font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.s5 .qm b{color:var(--ink);position:relative}
.s5 .qm b::after{content:'';position:absolute;left:-2px;right:-2px;bottom:-4px;height:3px;background:var(--vio2);transform:skewX(-30deg)}
.s5 .sp{padding:5px 11px}
.s5 .sp > span{font-size:13px}
.legend{margin-top:36px;color:var(--mute);font-size:13px;max-width:84ch}
.legend b{color:var(--soft)}

/* ── prototype shell: the phone fills the screen ── */
html,body{width:100%;overflow-x:hidden}
body{padding:0;margin:0;background:#07040F;min-height:100vh}

.devbar{width:100%;max-width:520px;margin:0 auto;display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;box-sizing:border-box}
.devbar b{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);width:100%}
.devbar button{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);
  background:rgba(255,255,255,.07);border:1px solid var(--line);padding:6px 9px;cursor:pointer}
.devbar button:hover{background:rgba(167,139,250,.2);color:#fff}
.stage{width:100%;max-width:400px;margin:0 auto;overflow:hidden}
.ph,.ph *{box-sizing:border-box}
.ph{width:100%;height:auto;min-height:620px;border-radius:0;border-left:0;border-right:0;box-shadow:none}
@media (min-width:520px){.ph{border-radius:28px;border:1px solid rgba(255,255,255,.14);margin:0 10px 18px}}
.ph .scr{overflow-y:auto;overflow-x:hidden}
[data-go]{cursor:pointer}
[data-go]:active{filter:brightness(1.15)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:#231C45;border:1px solid var(--edge);
  padding:8px 14px;font-family:var(--mono);font-size:10px;color:var(--ink);z-index:50;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
</style>

<div class="devbar">
  <b>Prototype · tap through it · nothing is saved</b>
  <button data-jump="lobby">Start</button>
  <button data-jump="empty">Nobody hosting</button>
  <button data-jump="openone">Open a lobby</button>
  <button data-jump="hosting">Hosting</button>
  <button data-jump="stale">Back after a while</button>
  <button data-jump="browse">Browse</button>

const ME  = { n:'Roatan', nick:'Stone hands', line:'#6 MW · 9-7 · UK/IE', img:IMG.roatan };
const OPP = { n:'Bing Ling', nick:'King', line:'#4 MW · 8-6 · NA', img:IMG.bingling };
const KAM = { n:'Killer Kam', nick:'The Machine', line:'MW · 10-1 · NA', img:IMG.kam, champ:true };
const BOARD = [
  OPP,
  { n:'Adonnis', line:'#2 MW · 7-3 · NA East' },
  { n:'Tynado',  line:'#3 MW · 7-2 · NA Central' },
  KAM,
  { n:'Nekota',  line:'#1 LHW · 15-7 · NA East' },
  { n:'Ronin',   line:'#1 LW · 3-0 · NA' },
];
const MODES = ['Open','3 rounds','5 rounds'];
/* [label, a, b, lead, aBar, bBar] — bars 0..1, null = no bar (never guessed) */
const TAPE = [
  ['Record', '9-7', '8-6', 'b', .5625, .5714],
  ['MW rank', '#6', '#4', 'b', .63, .75],
  ['Height', "5'8\"", "5'9\"", 'b', .8, .85],
  ['Reach', '—', '75"', null, null, .9],
  ['Stance', 'Orth', 'Switch', null],
  ['Recent', 'wl:L,L,W,W', 'wl:L,L,W,W,NC', null],
  ['Met', '1-0', '0-1', 'a'],
];

const tabbar = () => `<nav class="tb">${['Home','News','You','Fighters','Betting'].map(t=>`<span class="${t==='You'?'you on':''}">${t}</span>`).join('')}</nav>`;
const ph = (k, inner) => `<div class="ph ${k}"><div class="scr">${inner}</div>${tabbar()}</div>`;
const shot = (cap, fn, html) => `<div class="shot"><div class="cap">${cap}<i>${fn}</i></div>${html}</div>`;
const wl = s => `<span class="wl">${s.split(',').map(r=>`<i class="${r==='W'?'w':r==='L'?'l':''}">${r==='NC'?'N':r}</i>`).join('')}</span>`;
const val = v => v.startsWith('wl:') ? wl(v.slice(3)) : v;
const hero = (f, h, tag='') => `<div class="hero" style="height:${h}px"><div class="glow"></div><img src="${f.img}" alt="${f.n}"><div class="floor"></div>${tag}<div class="id"><div class="nick">${f.nick}</div><div class="nmL">${f.n.toUpperCase()}</div><div class="meta">${f.line}</div></div></div>`;
const faceoff = (h) => `<div class="fo" style="height:${h}px"><div class="glowL"></div><img class="l" src="${ME.img}" alt="${ME.n}"><img class="r" src="${OPP.img}" alt="${OPP.n}"><div class="floor"></div></div>`;
const names = () => `<div class="names"><span>${ME.n.toUpperCase()}<small>${ME.line}</small></span><span style="color:var(--gold)">${OPP.n.toUpperCase()}<small>${OPP.line}</small></span></div>`;
const av = f => `<span class="av">${f.img?`<img src="${f.img}" alt="">`:f.n.slice(0,2).toUpperCase()}</span>`;

/* Tape renderers */
const spineTape = () => `<div class="tape">${TAPE.map(([k,a,b,lead,ab,bb]) => ab===undefined
  ? `<div class="tr2 txt"><b>${val(a)}</b><s>${k}</s><b class="r">${val(b)}</b></div>`
  : `<div class="tr2"><b class="${lead==='a'?'lead':''}">${a}</b><span class="bar a">${ab!=null?`<i class="${lead==='a'?'lead':''}" style="width:${ab*100}%"></i>`:''}</span><s>${k}</s><span class="bar b">${bb!=null?`<i class="${lead==='b'?'lead':''}" style="width:${bb*100}%"></i>`:''}</span><b class="r ${lead==='b'?'lead':''}">${b}</b></div>`).join('')}</div>`;
const numTape = rows => `<div class="tape3">${TAPE.filter(r=>rows.includes(r[0])).map(([k,a,b,lead]) => `<div><b class="${lead==='a'?'lead':''}">${val(a)}</b><s>${k}</s><b class="${lead==='b'?'lead':''}">${val(b)}</b></div>`).join('')}</div>`;
const dotTape = rows => `<div class="tape dots">${TAPE.filter(r=>rows.includes(r[0])).map(([k,a,b,lead]) => `<div><b class="${lead==='a'?'lead':''}">${val(a)}</b><s>${k}</s><b class="${lead==='b'?'lead':''}">${val(b)}</b></div>`).join('')}</div>`;

/* ═══ the six screens, built from a kit ═══ */
function flow(k) {
  const rows = (state) => BOARD.slice(0,5).map((f,i) => {
    const st = state==='wait' ? (i===0 ? 'asked' : 'off') : '';
    return `<div class="row ${st}">${av(f)}<div class="tx"><div class="nm">${f.n}${f.champ?' <span style="color:var(--gold);font-family:var(--mono);font-size:8px;letter-spacing:.1em">CHAMP</span>':''}</div><div class="ln">${f.line}</div></div>${k.spar(st)}</div>`;
  }).join('');
  return [
    shot('The lobby', 'You tab · at rest', ph(k.cls,
      `<div class="hd"><span>Your fighter</span><b>174,399 VC</b></div>` + k.s1())),
    shot('Nobody hosting', 'the state that has to sell hosting', ph(k.cls,
      `<div class="hd"><span>Your fighter</span><b>174,399 VC</b></div>` + k.s1b())),
    shot('Opening one', 'the code, typed once', ph(k.cls,
      `<div class="hd"><span class="bk">‹ You</span><span>Open a lobby</span></div>` + k.s2())),
    shot("You're hosting", 'a state, not an action', ph(k.cls,
      `<div class="hd"><span class="g">Lobby open · 22:14 · +30</span><span class="roomchip"><i>ROOM</i> 441-72-208</span></div>` + k.s3() +
      `<div class="lbl">Join one instead</div>` + rows(''))),
    shot('Back after a while', 'the stale-code guard', ph(k.cls,
      `<div class="hd"><span class="g">Lobby open · 9:40</span><span class="roomchip"><i>ROOM</i> 441-72-208</span></div>` + k.s3b())),
    shot("Someone else's lobby", 'Find me one, or a Spar tap', ph(k.cls,
      `<div class="hd"><span class="bk">‹ All 6 lobbies</span><span>2 of 6</span></div>` + k.s4())),
    shot('Waiting on him', 'spar_ask · 5 min · one request out', ph(k.cls,
      `<div class="hd"><span class="g">Lobby open · 21:02</span><span class="roomchip"><i>ROOM</i> 441-72-208</span></div>` + k.s4b() +
      `<div class="lbl">One request out at a time</div>` + rows('wait'))),
    shot('Someone wants in', 'spar_answer · Accept hands over the code', ph(k.cls,
      `<div class="hd"><span class="v">Wants into your lobby · 4:12</span><span>5 min</span></div>` + k.s5())),
    shot("You're in", 'the code, revealed on Accept', ph(k.cls,
      `<div class="hd"><span class="g">Spar on</span><span>3 rounds</span></div>` + k.s6())),
    shot('Your lobby, after', 'while it stays open', ph(k.cls,
      `<div class="hd"><span class="g">Lobby open · 18:40</span><span>3 rounds</span></div>` + k.s7())),
  ];
}

const sl = (t, c='') => `<div class="sl ${c}"><span>${t}</span></div>`;
const TYPE = ['Open','3 RDS','5 RDS'];
const bar = (parts, tone='') => `<div class="act1 ${tone}">${parts.map(p => p.cap
  ? `<span class="cap ${p.arrow?'arrow':''}" style="width:${p.w||56}px">${p.arrow ? p.label : `<b>${p.label}</b>${p.sub?`<s>${p.sub}</s>`:''}`}</span>`
  : `<span class="go">${p.label}</span>`).join('')}</div>`;
const action = (label, type, tone='') => bar([{label}, {cap:true, label:TYPE[type], sub:'⇄'}], tone);
const segs = on => `<div class="segs">${MODES.map((m,i)=>sl(m,i===on?'on':'')).join('')}</div>`;
const spTag = st => `<span class="sp"><span>${st==='asked'?'ASKED':'SPAR'}</span></span>`;
const champTag = (css='') => `<div style="position:absolute;top:44px;left:14px;z-index:3;transform:skewX(-14deg);background:var(--gold);padding:3px 10px;${css}"><span style="display:block;transform:skewX(14deg);font-family:var(--disp);font-size:13px;letter-spacing:.1em;color:#2A1F00">CHAMPION</span></div>`;
const waitStrip = () => `<div class="strip"><div>${av(OPP)}<div style="flex:1"><div style="font-weight:700;font-size:12.5px">Asked Bing Ling</div><div class="note">5 min to answer</div></div><span class="code" style="font-size:18px;color:var(--vio2)">4:12</span></div></div>`;
const bigCount = (sub) => `<span class="count" style="font-size:74px">6</span><div style="flex:1"><div style="font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)">${sub}</div>`;
const codeNote = `<div class="note" style="text-align:center">Bing Ling sent it. Room dropped? Send a new one.</div>`;

/* ═══ S1 · BROADCAST ═══ */
const lowerThird = (f, h, tag='') => `<div class="hero" style="height:${h}px"><div class="glow"></div><img src="${f.img}" alt="${f.n}"><div class="floor"></div>${tag}
  <div class="lt"><div class="a"><span>${f.nick}</span></div><div class="b"><div><b>${f.n.toUpperCase()}</b><s>${f.line}</s></div></div></div></div>`;
const S1 = {
  cls:'s1', spar: spTag, hero: lowerThird,
  lobbyDeck: () => `<div class="deck">${sl("I'm looking",'bl')}<div style="padding:0 20px">${segs(0)}</div><div class="note" style="text-align:center">6 looking now · 4 middleweight</div></div>`,
  looking: () => `<div style="padding:8px 20px 0;display:flex;align-items:center;gap:14px">${bigCount('looking · 4 middleweight')}<div style="margin-top:7px">${segs(1)}</div></div></div>
    <div style="padding-top:12px">${sl('Find me one','v bl')}</div>`,
  opponent: () => faceoff(136) + `<div style="display:flex;justify-content:space-between;margin-top:-6px;position:relative;z-index:2">
      <div class="sl d bl" style="margin-right:0;padding:4px 10px 4px 26px"><span style="font-size:17px;text-align:left">${ME.n.toUpperCase()}</span></div>
      <div class="sl g bl r" style="margin-left:0;padding:4px 26px 4px 10px"><span style="font-size:17px;text-align:right">${OPP.n.toUpperCase()}</span></div></div>
    <div style="padding-top:8px">${spineTape()}</div>` +
    `<div class="deck" style="padding-inline:0">${sl('Ask him to spar','bl')}${sl('Next fighter','o bl r')}</div>`,
  waiting: () => waitStrip() + `<div style="padding-top:10px">${sl('Cancel request','o bl')}</div>`,
  incoming: () => lowerThird(KAM, 262, champTag()) +
    `<div class="deck" style="padding-inline:0">${sl('Accept','bl')}${sl('Not now','o bl r')}<div class="note" style="text-align:center;padding:0 16px">wants an Open spar · Not now = 10 min before he can ask again</div></div>`,
  room: () => faceoff(146) + names() + `<div class="codebox"><div><div class="code" style="font-size:34px;color:var(--go)">4417 2208</div></div></div>${codeNote}` +
    `<div class="deck" style="padding-inline:0">${sl('Copy code','v bl')}${sl('Send a new code','o bl r')}</div>`,
};

/* ═══ S2 · STEEP ═══ */
const steepHero = (f, h, tag='') => hero(f, h, tag).replace('<div class="glow"></div>', '<div class="glow"></div><div class="band"></div>');
const S2 = {
  cls:'s2', spar: st => `<span class="rowsp">${st==='asked'?'ASKED':'SPAR'}</span>`, hero: steepHero,

  // 1 · at rest: one button, and it says what it does
  s1: () => steepHero(ME, 236) +
    `<div class="deck" style="padding-inline:0">${action('Open lobby', 0)}
      <div style="margin-top:6px">${bar([{label:'Find a spar'},{cap:true,label:'6',sub:'open',w:56}],'v')}</div>
      <div class="hintline">host one, or join one · <u>6 lobbies open, 4 middleweight</u></div></div>`,

  // 1b · nobody is hosting: the one state that has to sell hosting
  s1b: () => steepHero(ME, 214) +
    `<div style="margin:10px 20px 0;border:1px dashed rgba(255,255,255,.2);padding:14px 12px;text-align:center">
      <div class="count" style="font-size:44px;color:var(--soft)">0</div>
      <div style="font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin-top:4px">lobbies open right now</div></div>` +
    `<div class="deck" style="padding-inline:0">${action('Open lobby', 0)}
      <div class="hintline">open one and people come to you · <u>or turn on Ping me and go do something else</u></div></div>`,

  // 3b · the stale-code guard, on the way back in
  s3b: () => `<div style="display:flex;gap:12px;align-items:center;padding:8px 20px 0">
      <span class="count" style="font-size:58px">6</span>
      <div style="flex:1"><div style="font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft)">lobbies open<br>4 middleweight</div></div></div>
    <div class="lbl">Join one instead</div>` +
    `<div class="scrim" style="inset:0"></div>
     <div class="deck" style="padding-inline:0;background:#130F2A">
      <div style="margin:0 20px 10px"><div style="font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase">Still in this room?</div>
        <div class="note" style="margin-top:3px">you've been away 12 min · a dead code sends people nowhere</div>
        <div class="code" style="font-size:22px;color:var(--go);margin-top:7px">441-72-208</div></div>
      ${bar([{label:'Still open'},{cap:true,label:'New',sub:'code',w:60}])}
      <div class="hintline">or <u>close the lobby</u> if you're done</div></div>`,

  // 2 · the code is typed once, here, before anyone can ask
  s2: () => steepHero(ME, 150, '') +
    `<div class="codefield"><div class="code">441-72-208</div></div>
     <div class="hintline">make the room in the game, then type its code · <u>nobody sees it until you accept them</u></div>` +
    `<div class="deck" style="padding-inline:0">${bar([{label:'Open lobby'},{cap:true,label:'3 RDS',sub:'⇄'}])}</div>`,

  // 3 · hosting: your card is live, your code sits with it, and you can still join someone else
  s3: () => `<div style="display:flex;gap:12px;align-items:center;padding:8px 20px 0">
      <span class="count" style="font-size:58px">6</span>
      <div style="flex:1"><div style="font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft)">lobbies open<br>4 middleweight</div></div></div>` +
    `<div class="deck" style="padding-inline:0">${bar([{label:'Change code'},{cap:true,label:'Close',sub:'lobby',w:62}],'o sm')}
      <div class="hintline">waiting on someone to ask · <u>your code stays hidden until you accept</u></div></div>`,

  // 4 · their lobby: same faceoff and tape, you are asking to join
  s4: () => faceoff(136).replace('class="fo"','class="fo mid"') + names() + `<div style="padding-top:8px">${spineTape()}</div>` +
    `<div class="deck" style="padding-inline:0">${bar([{cap:true,arrow:true,label:'‹',w:40},{label:'Ask to join'},{cap:true,arrow:true,label:'›',w:40}])}
      <div class="hintline">you'd be joining <u>his</u> room · <u>your own lobby closes when he accepts</u></div></div>`,

  // 4b · waiting on an answer: one request out at a time
  s4b: () => waitStrip() +
    `<div class="deck" style="padding-inline:0">${bar([{label:'Cancel request'},{cap:true,label:'Take off',w:62}],'v sm')}
      <div class="hintline">cancel ends the request · <u>take off closes your own lobby too</u></div></div>`,

  // 5 · someone asking to join yours
  s5: () => steepHero(KAM, 236, champTag()) +
    `<div class="hintline" style="margin-top:6px">accepting hands him your room code · <u>Not now = he can't ask again for 10 min</u></div>` +
    `<div class="deck" style="padding-inline:0">${bar([{label:'Accept'},{cap:true,label:'Not',sub:'now',w:62}])}</div>`,

  // 6 · joiner: the code was there all along, you just earned it
  s6: () => faceoff(150).replace('class="fo"','class="fo tight"') + names() +
    `<div class="codebox2"><div class="code">441-72-208</div></div>
     <div class="hintline">Bing Ling's room, because you asked into his · <u>put it into the game to join him</u></div>` +
    `<div class="deck" style="padding-inline:0">${bar([{label:'Copy code'},{cap:true,label:'Call',sub:'it off',w:62}],'v sm')}</div>`,

  // 7 · host afterwards: the lobby is still yours, and still open
  s7: () => faceoff(150).replace('class="fo"','class="fo tight"') + names() +
    `<div class="codebox2"><div class="code">441-72-208</div></div>
     <div class="hintline">Killer Kam has your code · <u>your lobby stays open for the next one</u></div>` +
    `<div class="deck" style="padding-inline:0">${bar([{label:'Change code'},{cap:true,label:'Close',sub:'lobby',w:62}],'o sm')}</div>`,
};



/* ═══ prototype router — every state is fake, nothing is written ═══ */
const K = S2;
const HD = {
  lobby:   `<div class="hd"><span>Your fighter</span><b>174,399 VC</b></div>`,
  empty:   `<div class="hd"><span>Your fighter</span><b>174,399 VC</b></div>`,
  openone: `<div class="hd"><span class="bk" data-go="lobby">‹ You</span><span>Open a lobby</span></div>`,
  hosting: `<div class="hd"><span class="g">Lobby open · 22:14 · +30</span><span class="roomchip"><i>ROOM</i> 441-72-208</span></div>`,
  stale:   `<div class="hd"><span class="g">Lobby open · 9:40</span><span class="roomchip"><i>ROOM</i> 441-72-208</span></div>`,
  browse:  `<div class="hd"><span class="bk" data-go="lobby">‹ You</span><span>6 lobbies open</span></div>`,
  fighter: `<div class="hd"><span class="bk" data-go="browse">‹ All 6 lobbies</span><span>2 of 6</span></div>`,
  waiting: `<div class="hd"><span class="v">Waiting on an answer</span><span>one request out</span></div>`,
  asked:   `<div class="hd"><span class="v">Wants into your lobby · 4:12</span><span>5 min</span></div>`,
  joined:  `<div class="hd"><span class="g">Spar on</span><span>3 rounds</span></div>`,
  hosted:  `<div class="hd"><span class="g">Lobby open · 18:40</span><span>3 rounds</span></div>`,
};
const rowsHTML = state => BOARD.slice(0,5).map((f,i) => {
  const st = state==='wait' ? (i===0 ? 'asked' : 'off') : '';
  return `<div class="row ${st}" ${st?'':'data-go="fighter"'}>${av(f)}<div class="tx"><div class="nm">${f.n}${f.champ?' <span style="color:var(--gold);font-family:var(--mono);font-size:8px;letter-spacing:.1em">CHAMP</span>':''}</div><div class="ln">${f.line}</div></div>${K.spar(st)}</div>`;
}).join('');

/* body + where each plate on it goes (in order the plates appear) */
const SCREENS = {
  lobby:   { body: () => K.s1(),  taps:['openone','browse'] },
  empty:   { body: () => K.s1b(), taps:['openone'] },
  openone: { body: () => K.s2(),  taps:['hosting'] },
  hosting: { body: () => K.s3() + `<div class="lbl">Join one instead</div>` + rowsHTML(''), taps:['openone|lobby'] },
  stale:   { body: () => K.s3b(), taps:['hosting|openone'] },
  browse:  { body: () => `<div style="display:flex;gap:12px;align-items:center;padding:8px 20px 0"><span class="count" style="font-size:58px">6</span>
              <div style="flex:1"><div style="font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft)">lobbies open<br>4 middleweight</div></div></div>
              <div class="deck" style="padding-inline:0">${action('Find a spar', 1, 'v')}<div class="hintline">or press SPAR on anyone below · <u>the code is theirs, not yours</u></div></div>
              <div class="lbl">Open lobbies</div>` + rowsHTML(''), taps:['fighter'] },
  fighter: { body: () => K.s4(), taps:['fighter|waiting|fighter'] },
  waiting: { body: () => K.s4b() + `<div class="lbl">One request out at a time</div>` + rowsHTML('wait'), taps:['browse|lobby'] },
  asked:   { body: () => K.s5(), taps:['hosted|hosting'] },
  joined:  { body: () => K.s6(), taps:['joined|lobby'] },
  hosted:  { body: () => K.s7(), taps:['openone|lobby'] },
};
/* a tap on a plate: pieces map left to right, "a|b" = first piece, cap piece */
function wire(el, targets) {
  el.querySelectorAll('.act1').forEach((plate, i) => {
    const spec = (targets[i] || '').split('|');
    const go = plate.querySelector('.go'), cap = plate.querySelector('.cap');
    if (go && spec[0]) go.dataset.go = spec[0];
    if (cap) cap.dataset.go = spec[1] || 'type';
    plate.querySelectorAll('.cap.arrow').forEach(a => a.dataset.go = 'fighter');
  });
}
let TYPE_I = 1;
function show(id) {
  const scr = document.getElementById('scr');
  const S = SCREENS[id];
  scr.innerHTML = HD[id] + S.body();
  wire(scr, S.taps);
  scr.scrollTop = 0;
  document.querySelectorAll('.devbar button').forEach(b => b.style.borderColor = b.dataset.jump===id ? 'var(--vio)' : '');
  if (id === 'waiting') setTimeout(() => { if (document.body.dataset.at === 'waiting') { toast('Bing Ling accepted'); show('joined'); } }, 3200);
  if (id === 'hosting') setTimeout(() => { if (document.body.dataset.at === 'hosting') { toast('Killer Kam wants in'); show('asked'); } }, 4200);
  document.body.dataset.at = id;
}
let tt;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1800);
}
document.addEventListener('click', e => {
  const jump = e.target.closest('.devbar button');
  if (jump) return show(jump.dataset.jump);
  const hit = e.target.closest('[data-go]');
  if (!hit) return;
  const go = hit.dataset.go;
  if (go === 'type') { TYPE_I = (TYPE_I + 1) % 3; toast(TYPE[TYPE_I] + ' spar'); return show(document.body.dataset.at); }
  if (SCREENS[go] || HD[go]) show(go);
});
show('lobby');

</script>
