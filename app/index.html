<style>
/* ═══════════════════════════════════════════════════════════════════════
   VGA Esports app shell — Twilight ground, the Fan hero, five-slot bar with
   You raised in the centre. Design locked with founder 2026-08-30.

   NAMING: VGA Esports is the ORGANISATION and is what the header says. UBA
   (Unified Boxing Association) and UBAe are LEAGUES inside it, alongside GFL.
   So "Fight in the UBA" is correct on the register card — that is a league —
   while the shell, the manifest and the unfurls are all VGA.
   ═══════════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* The ground lives on html, not body, for two reasons. Safari paints the
   strip past the body — the home-indicator area and any rubber-band
   overscroll — from html, and an unpainted html shows there as a WHITE BAR.
   And because the tab panels are the things that scroll, html never moves,
   so the gradient stays put without background-attachment:fixed, which is
   unreliable on iOS. Body stays transparent so this shows through. */
html{height:100%;background:#0C0916}
body{height:100%;overflow:hidden;background:#0C0916;
  color:#EDEAF6;font-family:'Barlow',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
}
/* The gradient is a REAL ELEMENT, not a background on html or body.
   Relying on background propagation is what put a white strip under the tab
   bar on a standalone iPhone: the propagated canvas background is sized to
   the layout viewport, which excludes the home-indicator safe area, and iOS
   paints whatever is left over white. An element pinned with 100dvh has no
   such gap. Both html and body also carry the solid ground as a floor, so
   even if this element fails to paint, nothing is ever white. */
#ground{position:fixed;left:0;right:0;top:0;height:100dvh;min-height:100%;z-index:0;
  pointer-events:none;
  background:linear-gradient(180deg,#3B3568 0%,#2A2450 26%,#191434 55%,#0C0916 100%)}
.panel{z-index:1}
a{color:inherit;text-decoration:none}
button{font:inherit;background:none;border:none;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #C3A6FF;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* panels */
.panel{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;display:none}
.panel::-webkit-scrollbar{display:none}
.panel.live{display:block}
/* Just clears the bar. This used to be much larger, which put a field of
   nothing under the last row when you scrolled to the end. */
.pad{padding-bottom:58px}
.wrapmax{max-width:520px;margin:0 auto}

/* shared furniture */
.top{padding:calc(18px + env(safe-area-inset-top)) 18px 11px;display:flex;justify-content:space-between;align-items:center}
.brand{font-family:'Bebas Neue',sans-serif;font-size:23px;letter-spacing:.11em}
.brand span{color:#C3A6FF}
.ttl{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.08em}
.szn{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:#CFC8F0;border:1px solid rgba(255,255,255,.22);border-radius:3px;padding:4px 9px}
.vcchip{display:flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;font-size:11px;
  font-weight:700;color:#F5C842;border:1px solid rgba(245,200,66,.3);border-radius:20px;padding:5px 12px}
.lab{display:flex;align-items:center;gap:9px;margin:20px 18px 11px}
.lab b{font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:#ADA4D6;white-space:nowrap}
.lab b::before{content:'// ';color:#A78BFA}
.lab i{flex:1;height:1px;background:rgba(255,255,255,.1);display:block}
.lab s,.lab a{text-decoration:none;font-family:'Space Mono',monospace;font-size:8.5px;
  letter-spacing:.11em;text-transform:uppercase;color:#7E7699;white-space:nowrap}
.lab a{color:#C3A6FF}
.foot{text-align:center;padding:22px 18px 10px;font-family:'Space Mono',monospace;font-size:8px;
  letter-spacing:.15em;text-transform:uppercase;color:#5E5878}
.empty{margin:0 18px;padding:22px 16px;text-align:center;border:1px dashed rgba(255,255,255,.16);
  border-radius:13px;font-size:14px;color:#8F86AF;line-height:1.5}

/* ── the live bar ── */
.livebar{display:none;align-items:center;gap:10px;margin:0 0 2px;padding:11px 18px;
  background:linear-gradient(90deg,#C22B22,#E8362B);color:#fff}
.livebar.on{display:flex}
.livebar .dot{width:8px;height:8px;border-radius:50%;background:#fff;flex-shrink:0;
  animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
.livebar .txt{flex:1;min-width:0}
.livebar .k{font-family:'Space Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;opacity:.9}
.livebar .n{font-size:15px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.livebar .go{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;border:1px solid rgba(255,255,255,.5);border-radius:7px;padding:7px 11px;flex-shrink:0}

/* ── the fan ─────────────────────────────────────────────────────────
   The card is the WHITE PANEL. The poster is a separate printed thing
   standing up out of it, anchored so its bottom edge sits on the panel's top
   edge and the rest spills above the card — the same idea as the poster fan
   on the standby screen, where the front one sits in normal flow and sets
   the size while the ones behind lean out from underneath it.

   So .fc must NOT clip: the poster deliberately overflows it. Only the panel
   carries the radius, and the foil is the seam between the two. */
/* --lift is the room the posters stand up into. The front card is in normal
   flow so the padding puts it below that room automatically — but the two
   leaning cards are ABSOLUTE, and padding does not move an absolutely
   positioned child. Their top has to carry --lift itself or their posters
   anchor to the very top of the box and shoot straight through the header. */
.fanw{position:relative;margin:4px 0 0;display:flow-root;--lift:150px;padding-top:var(--lift)}
.fc{position:absolute;top:0;left:50%;width:216px;margin-left:-108px;
  border-radius:0 0 14px 14px;background:linear-gradient(168deg,#F8F6FC 0%,#E5E0F2 100%);
  color:#16131F;cursor:pointer;
  transition:transform .34s cubic-bezier(.34,1.3,.5,1),opacity .34s}
.fc .poster{position:absolute;left:-2px;right:-2px;bottom:100%;display:block;width:calc(100% + 4px);
  height:auto;border-radius:6px 6px 0 0;
  filter:drop-shadow(0 10px 22px rgba(6,4,20,.6))}
/* No rendered poster: BUILD one. The fighters' photos are transparent
   cut-outs, so a faceoff can be composed live from the main event's two
   corners — which is a real poster for that night rather than a placeholder
   standing in for one. Only if the card is published; an unannounced card
   has no bout to draw, and the name block below is the last resort. */
.fc .noposter{position:absolute;left:-2px;right:-2px;bottom:100%;height:140px;border-radius:6px 6px 0 0;
  background:radial-gradient(92% 122% at 22% 4%,rgba(123,47,255,.6),transparent 60%),
    radial-gradient(80% 110% at 88% 18%,rgba(236,72,153,.4),transparent 56%),
    linear-gradient(160deg,#2A1650,#120E22);
  box-shadow:0 10px 22px rgba(6,4,20,.6);overflow:hidden;
  display:flex;align-items:flex-end;justify-content:center}
.fc .noposter::after{content:'';position:absolute;inset:0;z-index:3;
  background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.16) 2px 4px)}
.fc .noposter b{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.06em;
  color:rgba(200,185,240,.3);position:relative;z-index:2;align-self:center}
/* the built faceoff */
.fc .fo{position:absolute;inset:0;z-index:1}
.fc .fo img{position:absolute;bottom:0;height:112%;width:auto;max-width:none;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.55))}
.fc .fo img.l{left:-14%}
.fc .fo img.r{right:-14%;transform:scaleX(-1)}
/* the stand-in when a corner has no cut-out */
.fc .fo .sil{position:absolute;bottom:0;height:104%;width:auto;fill:rgba(200,185,240,.26)}
.fc .fo .sil.l{left:2%}
.fc .fo .sil.r{right:2%}
.fc .fo .vs{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:2;
  font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.06em;color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.8)}
.fc .fo .nmr{position:absolute;bottom:5px;z-index:2;font-family:'Barlow',sans-serif;font-weight:700;
  font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:#F4F1FB;
  text-shadow:0 1px 6px rgba(0,0,0,.9);max-width:44%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .fo .nmr.l{left:7px}
.fc .fo .nmr.r{right:7px;text-align:right}
.fc .past{position:absolute;right:6px;top:-132px;z-index:4;font-family:'Space Mono',monospace;
  font-size:7px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#EDEAF6;
  background:rgba(10,8,20,.78);padding:3px 7px;border-radius:3px}
.fc .foil{height:4px;background:linear-gradient(90deg,#F5C842,#EC4899,#7B2FFF,#22D3EE,#F5C842)}
.fc .in{padding:11px 13px 13px}
.fc .rar{font-family:'Space Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;padding:3px 7px;border-radius:3px;display:inline-block;
  color:#7A5A00;background:linear-gradient(90deg,#FBEFC2,#F3DE94);border:1px solid #E2C871}
.fc .nm{font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:.98;letter-spacing:.02em;margin-top:8px}
.fc .mt{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.08em;color:#5C5670;margin-top:6px}
.fc[data-pos="0"]{position:relative;top:0;left:auto;margin:0 auto;z-index:3;transform:none;opacity:1;
  box-shadow:0 16px 34px rgba(6,4,20,.6)}
.fc[data-pos="1"]{top:calc(var(--lift) + 10px);z-index:2;transform:rotate(6.5deg) translateX(50px) scale(.9);opacity:.66}
.fc[data-pos="2"]{top:calc(var(--lift) + 16px);z-index:1;transform:rotate(-7deg) translateX(-52px) scale(.86);opacity:.46}
.dotsn{display:flex;gap:6px;justify-content:center;margin:20px 0 16px;min-height:6px}
.dotsn i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.22);display:block;transition:background .2s}
.dotsn i.on{background:#A78BFA;box-shadow:0 0 8px rgba(167,139,250,.9)}

.cds{display:flex;gap:7px;margin:0 18px}
.cds div{flex:1;text-align:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);
  border-radius:10px;padding:9px 0}
.cds b{display:block;font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.cds s{display:block;text-decoration:none;font-family:'Space Mono',monospace;font-size:7.5px;
  letter-spacing:.11em;text-transform:uppercase;color:#B7AEDC;margin-top:3px}

.join{margin:20px 18px 4px;border-radius:15px;padding:16px 17px;
  background:linear-gradient(150deg,rgba(167,139,250,.2),rgba(167,139,250,.06));
  border:1px solid rgba(167,139,250,.32)}
.join .h{font-family:'Bebas Neue',sans-serif;font-size:23px;letter-spacing:.03em}
.join .s{font-size:13.5px;color:#BEB6DC;margin-top:3px;line-height:1.45}
.join .b{display:inline-block;margin-top:12px;font-family:'Space Mono',monospace;font-size:9.5px;
  font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#1A1430;background:#C3A6FF;
  padding:9px 15px;border-radius:8px}

.res{margin:0 18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);
  border-radius:13px;padding:12px 14px}
.res .ev{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:#A79FC4}
.rr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.rr:last-child{border-bottom:none;padding-bottom:0}
.rr .w{flex:1;font-size:15.5px;font-weight:600}
.rr .l{flex:1;font-size:15.5px;color:#8F86AF}
.rr .via{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:#F5C842}

.ch{display:flex;align-items:center;gap:12px;margin:0 18px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.ch .belt{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(150deg,#F5C842,#C8901A);color:#3A2A00}
.ch .belt svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ch .mid{flex:1;min-width:0}
.ch .dv{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#9A92C0}
.ch .n{font-size:16.5px;font-weight:600;margin-top:1px}
.ch .n em{font-style:normal;font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.1em;
  color:#F5C842;margin-left:7px;vertical-align:1px}
.ch .since{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.08em;color:#7E7699;flex-shrink:0}
.ch.vac .belt{background:rgba(255,255,255,.09);color:#8F86AF}
.ch.vac .n{color:#8F86AF;font-weight:400}

/* news */
.nw{display:flex;gap:12px;margin:0 18px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.nw .th{width:54px;height:54px;border-radius:10px;flex-shrink:0;background:linear-gradient(150deg,#3E2F6B,#1B1533)}
.nw .k{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:#C3A6FF}
.nw .h{font-size:15px;font-weight:600;line-height:1.3;margin-top:3px}
.nw .d{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.09em;color:#7E7699;margin-top:5px}
.lead{margin:0 17px 4px;border-radius:15px;overflow:hidden;border:1px solid rgba(255,255,255,.14);
  box-shadow:0 14px 34px rgba(6,4,20,.5)}
.gfx{position:relative;height:196px;background:linear-gradient(158deg,#241844,#120E22);overflow:hidden}
.gfx img{width:100%;height:100%;object-fit:cover;display:block}
.gfx .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:#A78BFA;z-index:2}
.gfx .k{position:absolute;left:15px;top:13px;font-family:'Space Mono',monospace;font-size:8px;
  letter-spacing:.2em;text-transform:uppercase;color:#C3A6FF;z-index:2}
.gfx .h{position:absolute;left:15px;right:15px;bottom:15px;font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:29px;line-height:1.02;text-transform:uppercase;color:#F4F1FB;z-index:2}
.lead .under{background:rgba(255,255,255,.09);padding:12px 15px;display:flex;align-items:baseline;gap:10px}
.lead .ld{flex:1;font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.09em;text-transform:uppercase;color:#8F86AF}
.lead .rd{font-family:'Space Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:#C3A6FF}
.wrow{margin:0 18px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.09)}
.wrow .k{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#C3A6FF}
.wrow .h{font-size:16.5px;font-weight:600;line-height:1.28;margin-top:4px}
.wrow .b{font-size:13.5px;color:#9A92C0;line-height:1.42;margin-top:5px}
.wrow .d{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:#7E7699;margin-top:7px}

/* fighters */
.srch{margin:0 18px 12px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 14px}
.srch svg{width:17px;height:17px;stroke:#B7AEDC;fill:none;stroke-width:1.9;flex-shrink:0}
.srch input{flex:1;background:none;border:none;color:#EDEAF6;font-size:15px;font-family:inherit;outline:none;min-width:0}
.srch input::placeholder{color:#B7AEDC}
.stick{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:7px;padding:10px 14px;
  background:rgba(22,17,44,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.1);overflow-x:auto;scrollbar-width:none}
.stick::-webkit-scrollbar{display:none}
.stick button{flex-shrink:0;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.11em;
  text-transform:uppercase;color:#B7AEDC;border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:6px 12px}
.stick button.on{background:#A78BFA;color:#1A1430;border-color:#A78BFA;font-weight:700}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 17px}
.fcard{border-radius:13px;overflow:hidden;background:linear-gradient(168deg,#F8F6FC,#E5E0F2);
  color:#16131F;box-shadow:0 6px 18px rgba(6,4,20,.5);display:block}
.fcard .foil{height:5px;background:linear-gradient(90deg,#F5C842,#EC4899,#7B2FFF,#22D3EE,#F5C842)}
.fcard.champ .foil{background:linear-gradient(90deg,#F5C842,#FFE9A8,#E0A81E,#FFE9A8,#F5C842)}
.fcard .art{height:98px;position:relative;overflow:hidden;background:
  radial-gradient(90% 120% at 26% 10%,rgba(123,47,255,.5),transparent 62%),linear-gradient(160deg,#2A1650,#120E22)}
.fcard .art::after{content:'';position:absolute;inset:0;z-index:2;
  background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.16) 2px 4px)}
.fcard .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;z-index:1}
.fcard .init{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:.06em;color:rgba(200,185,240,.34);z-index:1}
.fcard .bt{position:absolute;right:8px;top:8px;z-index:3;font-family:'Space Mono',monospace;font-size:7px;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#3A2A00;
  background:linear-gradient(90deg,#F5C842,#DDA91C);padding:3px 7px;border-radius:3px}
.fcard .in{padding:10px 11px 11px}
.fcard .n{font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:.02em;line-height:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .w{font-family:'Space Mono',monospace;font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;color:#6B6580;margin-top:5px}
.fcard .r{font-family:'Space Mono',monospace;font-size:10.5px;font-weight:700;color:#4C1D95;margin-top:4px;font-variant-numeric:tabular-nums}
.fcard .r em{font-style:normal;color:#8A7FA8;font-weight:400}
.more{margin:18px 17px 0;display:block;width:calc(100% - 34px);text-align:center;
  font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:#C3A6FF;border:1px solid rgba(167,139,250,.35);border-radius:12px;padding:13px 0}

/* gate (You + Cards signed out) */
.gate{padding:30px 22px 0;text-align:center}
.gate .ring{width:88px;height:88px;border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(160deg,#8B5CF6,#6D28D9);
  box-shadow:0 10px 34px rgba(109,40,217,.5);color:#fff}
.gate .ring svg{width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.gate h2{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.03em;font-weight:400}
.gate p{font-size:14.5px;line-height:1.55;color:#B3AAD2;margin-top:9px;max-width:30ch;margin-left:auto;margin-right:auto}

/* ── the fighter sheet ──────────────────────────────────────────────────
   An in-app screen, not a link out. Tapping a card used to navigate to
   f/<slug>.html, which redirects to the old profile page — outside the
   app's scope, so iOS wrapped it in browser chrome with a URL bar and a
   Done button. The cards keep their href so long-press-to-share and the
   Discord unfurl still work; the tap is intercepted and lands here. */
.sheet{position:fixed;inset:0;z-index:30;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
  background:#151030;display:none;transform:translateY(14px);
  transition:transform .22s ease}
/* NOTE: opacity is deliberately not animated here. It used to fade in from 0
   on a class added inside requestAnimationFrame — and rAF does not fire while
   the page is backgrounded, so the sheet could open fully transparent with
   its class correctly applied and no way to tell. Only transform animates
   now, so a sheet that never gets a frame is simply visible and unslid. */
.sheet::-webkit-scrollbar{display:none}
.sheet.live{display:block}
.sheet.shown{transform:none}
.sheet .hero{position:relative;height:340px;overflow:hidden;
  background:radial-gradient(90% 120% at 26% 10%,rgba(123,47,255,.5),transparent 62%),

.sheet .hero .init{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:96px;color:rgba(200,185,240,.28)}
.sheet .hero::after{content:'';position:absolute;inset:0;

/* the bar */
/* THE BAR. Five passes, so here is the whole history in one place.

   78px + the FULL safe-area inset  -> read as a bar floating over a dead band
   62px + 60% of the inset          -> still empty-looking
   58px + none                      -> reported as "something below the bar"
   52px + the full inset again      -> reported as WORSE, thicker empty space

   That last result is the useful one: adding the inset back made the empty
   space GROW, which means bottom:0 already reaches the physical screen edge
   on the device. There is no uncovered strip to cover — the inset was pure
   added height. So: no inset reserve, the shortest sane bar, icons centred.

   If a band still appears below this, the cause is NOT the safe area and the
   ?diag readout is the only way to find it. Do not add padding back on a
   hunch — that is what made it worse. */
.bar{position:fixed;left:0;right:0;bottom:0;height:50px;
  display:flex;align-items:center;
  background:rgba(10,8,20,.92);border-top:1px solid rgba(255,255,255,.1);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);z-index:20}
/* The bar's own padding-bottom IS the safe area, so its background already
   covers the home-indicator strip. An earlier version added a big box-shadow
   as an extra floor under it — that painted a solid block well below the bar
   and read as the bar floating with a gap beneath it. #ground plus the dark
   html/body are what keep anything from showing white; the bar needs nothing. */
.bar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:50px;color:#8B83AC}
.bar button.on{color:#EDEAF6}
.bar em{font-style:normal;font-family:'Space Mono',monospace;font-size:8px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase}
.bar .midbtn{justify-content:flex-start}
.bar .midbtn .disc{width:48px;height:48px;border-radius:50%;margin-top:-20px;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(160deg,#8B5CF6,#6D28D9);border:3px solid #16112A;
  box-shadow:0 6px 20px rgba(109,40,217,.55);color:#fff;transition:transform .15s;overflow:hidden}
.bar .midbtn.on .disc{transform:scale(1.06)}
.bar .midbtn .disc img{width:100%;height:100%;object-fit:cover}
.bar .midbtn em{margin-top:3px;color:#C3A6FF}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic.big{width:26px;height:26px;stroke-width:1.9}
.skel{background:rgba(255,255,255,.07);border-radius:10px;height:14px;margin:8px 18px}

<script>
/* ═══════════════════════════════════════════════════════════════════════
   Config. The publishable key is public by design — it is the same one
   every other page in this repo embeds, and it can only read the safe
   views. Never put a service key here.
   ═══════════════════════════════════════════════════════════════════════ */
var SB  = 'https://emzlivoykbhhjcugupit.supabase.co';
var KEY = 'sb_publishable_pqhH974E1q9YsFnrVH1UJQ_X3V-rRLF';
var H   = { headers: { apikey: KEY, Authorization: 'Bearer ' + KEY } };

/* an event counts as live from its start time for this long */
var LIVE_WINDOW_MS = 4 * 60 * 60 * 1000;

function esc(s){ return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* Every read goes through here. supabase-js resolves rather than throws on a
   failed query, and the raw REST equivalent is a non-2xx with a JSON body —
   either way an unchecked call silently renders "nothing". */
async function q(path){
  q.lastStatus = 0;
  try{
    var r = await fetch(SB + '/rest/v1/' + path, H);
    q.lastStatus = r.status;
    if(!r.ok){ console.warn('[uba] query failed', path, r.status); return null; }
    var j = await r.json();
    return Array.isArray(j) ? j : null;
  }catch(e){ console.warn('[uba] query error', path, e); return null; }
}

/* The my_* views filter on the Discord ID inside the caller's JWT, so these
   reads must send the SESSION token, not the publishable key. Sending the
   anon key returns 401 — deliberately, since anon has no grant on them. */
async function qMe(path){
  if(!session) return null;
  qMe.lastStatus = 0;
  try{
    var r = await fetch(SB + '/rest/v1/' + path, {
      headers: { apikey: KEY, Authorization: 'Bearer ' + session.access_token }
    });
    qMe.lastStatus = r.status;
    if(r.status === 401){ saveSession(null); me = null; return null; }
    if(!r.ok){ console.warn('[uba] me query failed', path, r.status); return null; }
    var j = await r.json();
    return Array.isArray(j) ? j : null;
  }catch(e){ console.warn('[uba] me query error', path, e); return null; }
}

var WC = { lightweight:'Lightweight', middleweight:'Middleweight',
  light_heavyweight:'Light heavy', heavyweight:'Heavyweight' };
function wc(k){ return WC[k] || (k ? String(k).replace(/_/g,' ') : ''); }
function initials(n){
  var parts = String(n||'?').trim().split(/\s+/);
  return ((parts[0]||'?')[0] + (parts[1] ? parts[1][0] : (parts[0]||'?')[1] || '')).toUpperCase();
}
function recordOf(f){
  var r = (f.headline_wins||0) + '-' + (f.headline_losses||0);
  if(f.headline_draws) r += '-' + f.headline_draws;
  return r;
}
function dstr(iso, opts){
  if(!iso) return '';
  return new Date(iso).toLocaleDateString('en-US',
    Object.assign({ timeZone:'America/New_York', month:'short', day:'numeric' }, opts||{}));
}

/* ── tabs, with per-tab scroll memory ── */
var panels = {}, tabBtns = {}, currentTab = 'home', scrollMem = {};
document.querySelectorAll('.panel').forEach(function(p){ panels[p.id.replace('p-','')] = p; });
document.querySelectorAll('.bar button').forEach(function(b){
  var n = b.getAttribute('data-tab');
  tabBtns[n] = b;
  b.addEventListener('click', function(){ goTab(n); });
});
function goTab(name){
  if(!panels[name]) return;
  if(name === currentTab){ panels[name].scrollTop = 0; return; }
  scrollMem[currentTab] = panels[currentTab].scrollTop;
  panels[currentTab].classList.remove('live');
  tabBtns[currentTab].classList.remove('on');
  currentTab = name;
  panels[name].classList.add('live');
  tabBtns[name].classList.add('on');
  panels[name].scrollTop = scrollMem[name] || 0;
  history.replaceState(null,'','#'+name);
}
document.addEventListener('click', function(e){
  var g = e.target.closest('[data-goto]');
  if(g) goTab(g.getAttribute('data-goto'));
});

/* ═══ HOME ═══════════════════════════════════════════════════════════ */
var fanEvents = [], fanOrder = [0,1,2], countdownTarget = null;

var posters = {};

/* Event posters are already rendered for the broadcast and live in
   graphic_assets under card-<event_id>-<variant>. faceoff is the landscape
   one, so it crops best into the card's art strip. */
var faceoffs = {};

/* For an event with no rendered poster, compose one from the main event's two
   corners. event_matches is card-gated, so an unannounced card returns
   nothing and the event simply keeps the name block — which is correct: there
   is no bout to draw yet. */
async function loadFaceoffs(ids){
  if(!ids.length) return;
  var bouts = await q("event_matches?select=event_id,bout_number,fighter_a_name,fighter_a_slug,"
    + "fighter_b_name,fighter_b_slug&event_id=in.(" + ids.join(',') + ")&order=bout_number.asc");
  if(!bouts || !bouts.length) return;
  var main = {};
  bouts.forEach(function(b){ if(!main[b.event_id]) main[b.event_id] = b; });
  var slugs = [];
  Object.keys(main).forEach(function(k){
    [main[k].fighter_a_slug, main[k].fighter_b_slug].forEach(function(sl){
      if(sl && slugs.indexOf(sl) === -1) slugs.push(sl);
    });
  });
  if(!slugs.length) return;
  var ph = await q("fighter_cards?select=slug,photo_url&slug=in.(" + slugs.join(',') + ")");
  if(!ph) return;
  var byslug = {};
  ph.forEach(function(f){ if(f.photo_url) byslug[f.slug] = f.photo_url; });
  Object.keys(main).forEach(function(k){
    var m = main[k];
    // A missing photo gets a silhouette rather than killing the faceoff.
    // Only 90 of 445 fighters have a cut-out, so "both corners or nothing"
    // would mean almost no built posters at all.
    faceoffs[k] = {
      a: byslug[m.fighter_a_slug] || null,
      b: byslug[m.fighter_b_slug] || null,
      an: m.fighter_a_name, bn: m.fighter_b_name
    };
  });
}

async function loadPosters(ids){
  if(!ids.length) return;
  var rows = await q("graphic_assets?select=key,url&key=like.card-*");
  if(!rows) return;
  var rank = { faceoff:0, 'faceoff-0':1, 'faceoff-1':2, stack:3, reel:4 };
  rows.forEach(function(r){
    var m = /^card-([0-9a-f-]{36})-(.+)$/.exec(r.key);
    if(!m) return;
    var id = m[1], variant = m[2];
    if(ids.indexOf(id) === -1) return;
    var score = rank[variant] != null ? rank[variant] : 9;
    if(!posters[id] || score < posters[id].score) posters[id] = { url: r.url, score: score };
  });
}

async function loadHome(){
  var evs = await q("events_public?select=id,name,type,status,event_date,stream_platform&status=eq.scheduled&order=event_date.asc&limit=3");
  if(evs && evs.length < 3){
    // One scheduled event leaves a hand of one. Backfill with what just
    // happened so the fan is always three deep and the past stays reachable.
    var past = await q("events_public?select=id,name,type,status,event_date,stream_platform"
      + "&status=eq.completed&order=event_date.desc&limit=" + (3 - evs.length));
    if(past) evs = evs.concat(past);
  }
  if(!evs){
    retryHandlers['home'] = loadHome;
    document.getElementById('fan').innerHTML = failHTML("Couldn't load what's next.", 'home');
    document.getElementById('cds').style.display = 'none';
  } else {
    fanEvents = evs;
    renderFan();
    var ids = evs.map(function(e){ return e.id; });
    loadPosters(ids).then(renderFan);
    loadFaceoffs(ids).then(renderFan);
  }
  await Promise.all([loadLive(), loadResults(), loadChamps(), loadHomeNews()]);
}


/* A faceoff built from the main event's two corners. A corner with no
   cut-out gets a silhouette rather than killing the whole graphic — only 90
   of 445 fighters have a photo, so "both or nothing" would mean almost no
   built posters at all. Falls back to the event's initials when there is no
   published card to draw from. */
var SILHOUETTE = "<svg class=\"sil\" viewBox=\"0 0 60 100\" preserveAspectRatio=\"xMidYMax meet\"><circle cx=\"30\" cy=\"21\" r=\"14\"/><path d=\"M30 38c-14 0-24 9-26 22l-4 40h60l-4-40c-2-13-12-22-26-22z\"/></svg>";
function faceoffCorner(url, side){
  if(!url) return SILHOUETTE.replace('class="sil"', 'class="sil ' + side + '"');
  return '<img class="' + side + '" src="' + esc(url) + '" alt="" '
       + 'data-side="' + side + '" onerror="silhouetteSwap(this)">';
}
function silhouetteSwap(img){
  var side = img.getAttribute('data-side') || 'l';
  img.outerHTML = SILHOUETTE.replace('class="sil"', 'class="sil ' + side + '"');
}
function faceoffHTML(eventId, eventName){
  var f = faceoffs[eventId];
  if(!f) return '<b>' + esc((eventName || '?').slice(0, 3).toUpperCase()) + '</b>';
  return '<div class="fo">'
    + faceoffCorner(f.a, 'l')
    + faceoffCorner(f.b, 'r')
    + '<span class="vs">VS</span>'
    + '<span class="nmr l">' + esc(f.an || '') + '</span>'
    + '<span class="nmr r">' + esc(f.bn || '') + '</span>'
    + '</div>';
}

function renderFan(){
  var fan = document.getElementById('fan'), dots = document.getElementById('dots');
  if(!fanEvents.length){
    fan.innerHTML = '<div class="empty" style="margin:10px 18px">No events scheduled yet.<br>Check back soon.</div>';
    dots.innerHTML = '';
    document.getElementById('cds').style.display = 'none';
    return;
  }
  fanOrder = fanEvents.map(function(_,i){ return i; });
  fan.innerHTML = fanEvents.map(function(e,i){
    var when = new Date(e.event_date).toLocaleString('en-US',{ timeZone:'America/New_York',
      month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }).toUpperCase();
    var done = e.status === 'completed';
    var tag = done ? 'Result' : (i === 0 ? 'Next event' : (e.type === 'fight_night' ? 'Fight night' : 'Event'));
    var poster = posters[e.id];
    return '<div class="fc" data-i="'+i+'" data-pos="'+i+'" data-ev-id="'+esc(e.id)+'">'
      + (poster
          ? '<img class="poster" src="'+esc(poster.url)+'" alt="" '
            + 'onerror="this.className=\'noposter\';this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'noposter\'}))">'
          : '<div class="noposter">' + faceoffHTML(e.id, e.name) + '</div>')
      + (done ? '<span class="past">Final</span>' : '')
      + '<div class="foil"></div><div class="in">'
      + '<span class="rar">'+esc(tag)+'</span>'
      + '<div class="nm">'+esc(e.name)+'</div>'
      + '<div class="mt">'+esc(when)+' ET</div>'
      + '</div></div>';
  }).join('');
  dots.innerHTML = fanEvents.length > 1
    ? fanEvents.map(function(_,i){ return '<i class="'+(i===0?'on':'')+'"></i>'; }).join('')
    : '';
  setCountdown(fanEvents[0]);
}

document.getElementById('fan').addEventListener('click', function(e){
  var card = e.target.closest('.fc'); if(!card) return;
  var pos = parseInt(card.getAttribute('data-pos'),10);
  // Tapping a card behind the front one brings it forward; tapping the FRONT
  // card opens that event's fight card.
  if(pos === 0){ openSheet({ kind:'event', id: card.getAttribute('data-ev-id') }); return; }
  for(var i=0;i<pos;i++) fanOrder.push(fanOrder.shift());
  document.querySelectorAll('#fan .fc').forEach(function(c){
    c.setAttribute('data-pos', String(fanOrder.indexOf(parseInt(c.getAttribute('data-i'),10))));
  });
  var lead = fanOrder[0];
  document.querySelectorAll('#dots i').forEach(function(d,i){ d.classList.toggle('on', i === lead); });
  setCountdown(fanEvents[lead]);
});

function setCountdown(ev){
  // A past event has nothing to count down to; showing 00:00:00:00 under a
  // finished card reads like a bug.
  countdownTarget = (ev && ev.status !== 'completed') ? new Date(ev.event_date).getTime() : null;
  tickCountdown();
}
function tickCountdown(){
  var box = document.getElementById('cds');
  if(!countdownTarget){ box.style.display='none'; return; }
  box.style.display='flex';
  var diff = countdownTarget - Date.now();
  if(diff < 0) diff = 0;
  var s = Math.floor(diff/1000);
  var d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), sec = s%60;
  function p(n){ return String(n).padStart(2,'0'); }
  document.getElementById('cd-d').textContent = p(d);
  document.getElementById('cd-h').textContent = p(h);
  document.getElementById('cd-m').textContent = p(m);
  document.getElementById('cd-s').textContent = p(sec);
}
setInterval(tickCountdown, 1000);

/* the live bar — derived from time, because events have no 'live' status.
   An event counts as live from its start until LIVE_WINDOW_MS after it. */
async function loadLive(){
  var now = Date.now();
  var since = new Date(now - LIVE_WINDOW_MS).toISOString();
  var rows = await q("events_public?select=name,event_date,status,stream_platform"
    + "&event_date=gte." + since + "&order=event_date.desc&limit=5");
  if(!rows) return;
  var live = rows.filter(function(e){
    var t = new Date(e.event_date).getTime();
    return e.status !== 'completed' && t <= now && now - t < LIVE_WINDOW_MS;
  })[0];
  var bar = document.getElementById('livebar');
  if(!live){ bar.classList.remove('on'); return; }
  document.getElementById('live-name').textContent = live.name;
  bar.classList.add('on');
}
setInterval(loadLive, 5 * 60 * 1000);

async function loadResults(){
  var el = document.getElementById('results');
  var ev = await q("events_public?select=id,name,event_date&status=eq.completed&order=event_date.desc&limit=1");
  if(!ev){ retryHandlers['results'] = loadResults;
    el.innerHTML = failHTML("Couldn't load the last results.", 'results'); return; }
  if(!ev.length){ el.innerHTML = '<div class="empty">No results yet.</div>'; return; }
  var e = ev[0];
  var bouts = await q("event_matches?select=bout_number,method,fighter_a_name,fighter_b_name,winner_corner,status"
    + "&event_id=eq." + e.id + "&status=eq.completed&order=bout_number.asc&limit=4");
  if(!bouts || !bouts.length){ el.innerHTML = '<div class="empty">Results for '+esc(e.name)+' aren\'t posted yet.</div>'; return; }
  el.innerHTML = '<div class="res" data-event="'+esc(e.id)+'"><div class="ev">'+esc(e.name)+' &middot; '+esc(dstr(e.event_date))+'</div>'
    + bouts.map(function(b){
        var aWon = b.winner_corner === 'a';
        var w = aWon ? b.fighter_a_name : b.fighter_b_name;
        var l = aWon ? b.fighter_b_name : b.fighter_a_name;
        var via = (b.method || '').toUpperCase().slice(0,3) || '—';
        return '<div class="rr"><span class="w">'+esc(w)+'</span><span class="via">'+esc(via)
             + '</span><span class="l">'+esc(l)+'</span></div>';
      }).join('') + '</div>';
}

async function loadChamps(){
  var el = document.getElementById('champs');
  // level=pro only. The four GFL amateur belts are all vacant and share
  // weight-class names with the real ones, so they read as duplicates.
  var t = await q("titles_public?select=name,weight_class,kind,holder_name,holder_slug,held_since,is_interim,sort,league,level"
    + "&league=eq.UBA&level=eq.pro&is_interim=eq.false&order=sort.asc");
  if(!t){ retryHandlers['champs'] = loadChamps;
    el.innerHTML = failHTML("Couldn't load the champions.", 'champs'); return; }
  if(!t.length){ el.innerHTML = '<div class="empty">No titles yet.</div>'; return; }
  var doubles = {};
  t.forEach(function(x){ if(x.holder_name) doubles[x.holder_name] = (doubles[x.holder_name]||0)+1; });
  el.innerHTML = t.map(function(x){
    var div = x.weight_class ? wc(x.weight_class) : x.name.replace(/ Title$/,'');
    if(!x.holder_name){
      return '<div class="ch vac"><span class="belt"><svg><use href="#i-belt"/></svg></span>'
        + '<div class="mid"><div class="dv">'+esc(div)+'</div><div class="n">Vacant</div></div></div>';
    }
    var dbl = doubles[x.holder_name] > 1 ? '<em>'+doubles[x.holder_name]+'× CHAMP</em>' : '';
    return '<a class="ch" data-slug="'+esc(x.holder_slug||'')+'"'
      + ' href="./f/'+encodeURIComponent(x.holder_slug||'')+'.html">'
      + '<span class="belt"><svg><use href="#i-belt"/></svg></span>'
      + '<div class="mid"><div class="dv">'+esc(div)+'</div>'
      + '<div class="n">'+esc(x.holder_name)+dbl+'</div></div>'
      + '<span class="since">Since '+esc(dstr(x.held_since))+'</span></a>';
  }).join('');
}

/* ═══ NEWS ═══════════════════════════════════════════════════════════
   Reads news_public, a view that does not exist yet. Until it is created
   both of these render an honest empty state rather than a blank space. */
var newsCache = null, newsFailWasMissing = false;
async function getNews(){
  if(newsCache !== null) return newsCache;
  newsCache = await q("news_public?select=id,kicker,headline,body,reporter,posted_at,graphic_url&order=posted_at.desc&limit=25");
  // 404 means the view genuinely is not there; anything else means the
  // database was unreachable. Showing "not wired up yet" for an outage sends
  // whoever reads it to build something that already exists.
  newsFailWasMissing = (q.lastStatus === 404);
  return newsCache;
}
function newsFailure(retryId){
  if(newsFailWasMissing){
    return '<div class="empty"><b>News isn\'t wired up yet.</b><br>'
      + 'It needs a <code>news_public</code> view over posts with status = posted.</div>';
  }
  return failHTML("Couldn't load the news.", retryId);
}
async function loadHomeNews(){
  var el = document.getElementById('home-news');
  var rows = await getNews();
  if(!rows){ retryHandlers['homenews'] = function(){ newsCache = null; loadHomeNews(); };
    el.innerHTML = newsFailure('homenews'); return; }
  if(!rows.length){ el.innerHTML = '<div class="empty">No news posted yet.</div>'; return; }
  el.innerHTML = rows.slice(0,3).map(function(n){
    return '<div class="nw" data-news="'+esc(n.id)+'"><span class="th"></span><div>'
      + (n.kicker ? '<div class="k">'+esc(n.kicker)+'</div>' : '')
      + '<div class="h">'+esc(n.headline)+'</div>'
      + '<div class="d">'+esc(dstr(n.posted_at))+'</div></div></div>';
  }).join('');
}
async function loadNews(){
  var el = document.getElementById('news-body');
  var rows = await getNews();
  if(!rows){ retryHandlers['news'] = function(){ newsCache = null; loadNews(); };
    el.innerHTML = newsFailure('news'); return; }
  if(!rows.length){ el.innerHTML = '<div class="empty">No news posted yet.</div>'; return; }
  document.getElementById('news-count').textContent = rows.length + ' posts';
  var lead = rows[0], rest = rows.slice(1);
  var html = '<div class="lead" data-news="'+esc(lead.id)+'"><div class="gfx">'
    + (lead.graphic_url ? '<img src="'+esc(lead.graphic_url)+'" alt="'+esc(lead.headline)+'">'
        : '<span class="bar"></span>'
          + (lead.kicker ? '<span class="k">'+esc(lead.kicker)+'</span>' : '')
          + '<span class="h">'+esc(lead.headline)+'</span>')
    + '</div><div class="under"><div class="ld">'+esc(lead.reporter||'UBA')+' &middot; '
    + esc(dstr(lead.posted_at))+'</div><div class="rd">Read</div></div></div>'
    + '<div class="lab"><b>The wire</b><i></i></div>';
  html += rest.map(function(n){
    var first = (n.body||'').split('\n').filter(Boolean)[0] || '';
    if(first.length > 130) first = first.slice(0,130).replace(/\s+\S*$/,'') + '…';
    return '<div class="wrow" data-news="'+esc(n.id)+'">'
      + (n.kicker ? '<div class="k">'+esc(n.kicker)+'</div>' : '')
      + '<div class="h">'+esc(n.headline)+'</div>'
      + (first ? '<div class="b">'+esc(first)+'</div>' : '')
      + '<div class="d">'+esc(n.reporter||'UBA')+' &middot; '+esc(dstr(n.posted_at))+'</div></div>';
  }).join('');
  html += '<div class="foot">End of the wire &middot; '+rows.length+' posts</div>';
  el.innerHTML = html;
}

/* ═══ FIGHTERS ═══════════════════════════════════════════════════════ */
var allFighters = null, fFilter = 'all', fQuery = '', fShown = 40;

async function loadFighters(){
  if(allFighters) return;
  var rows = await q("fighter_cards?select=id,display_name,slug,weight_class,headline_wins,headline_losses,"
    + "headline_draws,rank,is_champion,profile_photo_url,team,nickname,status"
    + "&status=eq.active&order=rank.asc.nullslast&limit=600");
  if(!rows){
    retryHandlers['fighters'] = function(){ allFighters = null; loadFighters(); };
    document.getElementById('f-grid').innerHTML =
      '<div style="grid-column:span 2">' + failHTML("Couldn't reach the league database.", 'fighters') + '</div>';
    return;
  }
  allFighters = rows;
  document.getElementById('f-count').textContent = rows.length + ' active';
  renderFighters();
}
function filteredFighters(){
  var list = allFighters || [];
  if(fFilter === 'p4p')        list = list.filter(function(f){ return f.rank != null; });
  else if(fFilter === 'champ') list = list.filter(function(f){ return f.is_champion; });
  else if(fFilter !== 'all')   list = list.filter(function(f){ return f.weight_class === fFilter; });
  if(fQuery){
    var s = fQuery.toLowerCase();
    list = list.filter(function(f){
      return (f.display_name||'').toLowerCase().indexOf(s) > -1
          || (f.nickname||'').toLowerCase().indexOf(s) > -1
          || (f.team||'').toLowerCase().indexOf(s) > -1;
    });
  }
  return list.slice().sort(function(a,b){
    if(a.rank != null && b.rank != null) return a.rank - b.rank;
    if(a.rank != null) return -1;
    if(b.rank != null) return 1;
    return (b.headline_wins||0) - (a.headline_wins||0);
  });
}
function renderFighters(){
  var list = filteredFighters();
  var grid = document.getElementById('f-grid');
  if(!list.length){
    grid.innerHTML = '<div class="empty" style="grid-column:span 2">No fighters match that.</div>';
    document.getElementById('f-more').style.display = 'none';
    document.getElementById('f-foot').textContent = '';
    return;
  }
  grid.innerHTML = list.slice(0, fShown).map(function(f){
    // The initials sit underneath the photo rather than instead of it, so a
    // photo that 404s falls back to something instead of a blank card.
    var ini = '<span class="init">'+esc(initials(f.display_name))+'</span>';
    var art = f.profile_photo_url
      ? ini + '<img src="'+esc(f.profile_photo_url)+'" alt="" loading="lazy" '
            + 'onerror="this.remove()">'
      : ini;
    var belt = f.is_champion ? '<span class="bt">Champ</span>' : '';
    var rk = f.rank != null ? '<em>&middot; P4P '+f.rank+'</em>' : '<em>&middot; Unranked</em>';
    return '<a class="fcard'+(f.is_champion?' champ':'')+'" data-slug="'+esc(f.slug||'')+'"'
      + ' href="./f/'+encodeURIComponent(f.slug||'')+'.html">'
      + '<div class="foil"></div><div class="art">'+belt+art+'</div>'
      + '<div class="in"><div class="n">'+esc(f.display_name)+'</div>'
      + '<div class="w">'+esc(wc(f.weight_class))+'</div>'
      + '<div class="r">'+esc(recordOf(f))+' '+rk+'</div></div></a>';
  }).join('');
  var more = document.getElementById('f-more');
  more.style.display = list.length > fShown ? 'block' : 'none';
  document.getElementById('f-foot').textContent = 'Showing ' + Math.min(fShown, list.length) + ' of ' + list.length;
}
document.getElementById('f-chips').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  this.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
  b.classList.add('on');
  fFilter = b.getAttribute('data-f'); fShown = 40;
  document.getElementById('f-lab').textContent =
    fFilter === 'p4p' ? 'Pound for pound' : fFilter === 'champ' ? 'Champions'
    : fFilter === 'all' ? 'All fighters' : wc(fFilter);
  document.getElementById('f-sub').textContent = fFilter === 'all' ? 'Ranked first' : '';
  renderFighters();
  panels.fighters.scrollTop = 0;
});
document.getElementById('f-search').addEventListener('input', function(){
  fQuery = this.value.trim(); fShown = 40; renderFighters();
});
document.getElementById('f-more').addEventListener('click', function(){ fShown += 40; renderFighters(); });

/* ═══ SHEETS ═════════════════════════════════════════════════════════
   One element, a stack of entries. A fighter can be opened from inside an
   event, and the phone's back gesture unwinds one layer at a time instead
   of dumping you out of the app — which is what a single-entry sheet did.
   ═══════════════════════════════════════════════════════════════════════ */
var sheetStack = [];

function sheetEl(){ return document.getElementById('sheet'); }

function hashFor(entry){
  return entry.kind === 'fighter' ? '#f/' + entry.id
       : entry.kind === 'news'    ? '#n/' + entry.id
       : entry.kind === 'event'   ? '#e/' + entry.id : '';
}

function openSheet(entry){
  var el = sheetEl();
  sheetStack.push(entry);
  history.pushState({ depth: sheetStack.length }, '', hashFor(entry));
  el.classList.add('live');
  el.scrollTop = 0;
  el.setAttribute('aria-hidden','false');
  void el.offsetHeight;
  el.classList.add('shown');
  renderSheet(entry);
}

function closeSheet(){
  var el = sheetEl();
  sheetStack = [];
  el.classList.remove('shown');
  el.setAttribute('aria-hidden','true');
  setTimeout(function(){ if(!sheetStack.length) el.classList.remove('live'); }, 220);
}

window.addEventListener('popstate', function(){
  if(!sheetStack.length) return;
  sheetStack.pop();
  if(sheetStack.length){ sheetEl().scrollTop = 0; renderSheet(sheetStack[sheetStack.length - 1]); }
  else closeSheet();
});

function backButton(){
  return '<button class="back" data-sheet-back aria-label="Back"><svg><use href="#i-back"/></svg></button>';
}
document.addEventListener('click', function(e){
  if(e.target.closest('[data-sheet-back]')) history.back();
});

/* a failure that says so, and offers a way out */
function failHTML(msg, retryId){
  return '<div class="fail"><p>'+esc(msg)+'</p>'
    + '<button data-retry="'+esc(retryId)+'">Try again</button></div>';
}
var retryHandlers = {};
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-retry]');
  if(!b) return;
  var fn = retryHandlers[b.getAttribute('data-retry')];
  if(fn) fn();
});

function renderSheet(entry){
  if(entry.kind === 'fighter') return renderFighter(entry.id);
  if(entry.kind === 'news')    return renderArticle(entry.id);
  if(entry.kind === 'event')   return renderEvent(entry.id);
}

/* what opens a sheet */
document.addEventListener('click', function(e){
  if(e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  var f = e.target.closest('[data-slug]');
  if(f && f.getAttribute('data-slug')){ e.preventDefault(); openSheet({kind:'fighter', id:f.getAttribute('data-slug')}); return; }
  var n = e.target.closest('[data-news]');
  if(n){ e.preventDefault(); openSheet({kind:'news', id:n.getAttribute('data-news')}); return; }
  var ev = e.target.closest('[data-event]');
  if(ev){ e.preventDefault(); openSheet({kind:'event', id:ev.getAttribute('data-event')}); return; }
});

/* ── fighter ── */

    + '<div><b>'+(f.headline_losses||0)+'</b><s>losses</s></div>'
    + '<div><b>'+(f.headline_draws||0)+'</b><s>draws</s></div>'
    + '<div><b>'+(f.rank != null ? f.rank : '—')+'</b><s>p4p</s></div>'
    + '</div>'
    + '<dl class="meta">'
    + '<dt>Division</dt><dd>'+esc(wc(f.weight_class))+'</dd>'
    + '<dt>Team</dt><dd>'+esc(f.team || 'Free agent')+'</dd>'
    + (f.country ? '<dt>From</dt><dd>'+esc(f.country)+'</dd>' : '')
    + (f.gym ? '<dt>Gym</dt><dd>'+esc(f.gym)+'</dd>' : '')
    + '</dl>'
    + '<div class="lab"><b>Fights</b><i></i></div>'

async function loadBouts(f){
  var el = document.getElementById('sheet-bouts');
  if(!el || !f.id){ if(el) el.innerHTML = '<div class="empty">No fight history.</div>'; return; }
  var rows = await q("fighter_matches?select=won,method,opponent_name,opponent_slug,event_name,"
    + "event_date,status,is_title_fight&fighter_id=eq." + f.id

      + '<div class="ev">'+esc(b.event_name || '')+(b.event_date ? ' · '+esc(dstr(b.event_date)) : '')
      + (b.is_title_fight ? ' · title' : '')+'</div></div>'
      + '<span class="via">'+esc((b.method||'').toUpperCase())+'</span></div>';

/* ── news article ── */
async function renderArticle(id){

/* ── the fight card for one event ── */
var SEGS = { main_card:'Main card', undercard:'Undercard', prelim:'Prelims', prelims:'Prelims',
  featured:'Featured', early_prelims:'Early prelims' };
async function renderEvent(id){
  var body = document.getElementById('sheet-body');
  var evs = await q("events_public?select=id,name,type,status,event_date,stream_platform&id=eq."
    + encodeURIComponent(id) + "&limit=1");
  if(!evs){
    retryHandlers['event'] = function(){ renderEvent(id); };
    body.innerHTML = '<div class="evhead">'+backButton()+'</div>' + failHTML("Couldn't load that event.", 'event');
    return;
  }
  var e = evs[0];
  if(!e){ body.innerHTML = '<div class="evhead">'+backButton()+'</div>'
    + '<div class="empty">That event is gone.</div>'; return; }

  var when = new Date(e.event_date).toLocaleString('en-US',{ timeZone:'America/New_York',
    weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });

  body.innerHTML = '<div class="evhead">' + backButton()
    + '<div style="height:34px"></div>'
    + '<div class="kick">'+esc(e.status === 'completed' ? 'Result' : 'Fight card')+'</div>'
    + '<h3>'+esc(e.name)+'</h3>'
    + '<div class="when">'+esc(when)+' ET'+(e.stream_platform ? ' · '+esc(e.stream_platform) : '')+'</div>'
    + '</div><div id="ev-bouts"><div class="skel"></div><div class="skel" style="width:70%"></div></div>';

  loadCard(e);
}

async function loadCard(e){
  var el = document.getElementById('ev-bouts');
  if(!el) return;
  // event_matches is card-gated: an unpublished card returns nothing at all,
  // which is the point — so an empty result is "not announced", not an error.
  var rows = await q("event_matches?select=bout_number,card_segment,weight_class,bout_level,"
    + "is_title_fight,title_name,status,method,fighter_a_name,fighter_a_slug,fighter_b_name,"
    + "fighter_b_slug,winner_corner&event_id=eq." + e.id + "&order=bout_number.asc");
  if(!el.isConnected) return;
  if(!rows){
    retryHandlers['card'] = function(){ loadCard(e); };
    el.innerHTML = failHTML("Couldn't load the card.", 'card'); return;
  }
  if(!rows.length){
    el.innerHTML = '<div class="empty"><b>The card isn\'t announced yet.</b><br>'
      + 'Bouts appear here the moment it is published.</div>'; return;
  }
  // Pools come from bet_pools_public, which only carries OPEN and LOCKED
  // markets — locked on purpose, because a market locks when the bout starts
  // and that is exactly when the pool is most worth showing. Settled markets
  // drop out, so this is empty except around a live card. That is correct,
  // not a failure, so nothing is rendered when there is nothing.
  var pools = {};
  var poolRows = await q("bet_pools_public?select=match_id,side_a,side_b,total_a,total_b,pool,bets"
    + "&event_id=eq." + e.id);
  if(poolRows) poolRows.forEach(function(r){ pools[r.match_id] = r; });

  var order = ['main_card','featured','undercard','prelims'];
  var groups = {};
  rows.forEach(function(b){ (groups[b.card_segment || 'undercard'] = groups[b.card_segment || 'undercard'] || []).push(b); });
  var keys = order.filter(function(k){ return groups[k]; })
    .concat(Object.keys(groups).filter(function(k){ return order.indexOf(k) === -1; }));

  el.innerHTML = keys.map(function(k){
    return '<div class="seg">'+esc(SEGS[k] || k.replace(/_/g,' '))+'</div>'
      + groups[k].map(function(b){
          var mine = myFighter && (b.fighter_a_slug === myFighter.fighter_slug
                                || b.fighter_b_slug === myFighter.fighter_slug);
          var done = b.status === 'completed' && b.winner_corner;
          var aLost = done && b.winner_corner === 'b';
          var bLost = done && b.winner_corner === 'a';
          var midTxt = done ? (b.method || 'result').toUpperCase() : 'vs';
          return '<div class="bout2'+(b.is_title_fight?' title':'')+(mine?' you':'')+'">'
            + (b.is_title_fight ? '<span class="tag">'+esc(b.title_name || 'Title fight')+'</span>' : '')
            + (mine ? '<span class="youtag">Your bout</span>' : '')
            + '<div class="vs">'
            + '<span class="side'+(aLost?' lost':'')+'"'+(b.fighter_a_slug?' data-slug="'+esc(b.fighter_a_slug)+'"':'')+'>'+esc(b.fighter_a_name || 'TBA')+'</span>'
            + '<span class="mid2'+(done?' done':'')+'">'+esc(midTxt)+'</span>'
            + '<span class="side b'+(bLost?' lost':'')+'"'+(b.fighter_b_slug?' data-slug="'+esc(b.fighter_b_slug)+'"':'')+'>'+esc(b.fighter_b_name || 'TBA')+'</span>'
            + '</div>'
            + '<div class="wcl">'+esc(wc(b.weight_class) || 'Catch weight')
            + (b.bout_level && b.bout_level !== 'pro' ? ' · '+esc(b.bout_level) : '')+'</div>'
            + poolHTML(pools[b.match_id])
            + '</div>';
        }).join('');
  }).join('') + '<div class="foot">'+rows.length+' bouts</div>';
}

/* Pari-mutuel with no rake: back a side and you take a share of the WHOLE
   pot, so the multiplier is pool / that side's total. It moves as people
   bet, which is why it is drawn as a split bar rather than fixed odds. */
function poolHTML(p){
  if(!p) return '';
  var a = Number(p.total_a || 0), b = Number(p.total_b || 0), tot = a + b;
  if(!tot){
    return '<div class="pool"><div class="none">Betting open · no bets yet</div></div>';
  }
  var pa = Math.round(a / tot * 100);
  var mult = function(side){ return side > 0 ? '×' + (tot / side).toFixed(2) : '—'; };
  return '<div class="pool">'
    + '<div class="bar2"><i class="a" style="width:'+pa+'%"></i><i class="b" style="width:'+(100-pa)+'%"></i></div>'
    + '<div class="nums">'
    + '<span class="la">'+a.toLocaleString()+' · '+mult(a)+'</span>'
    + '<span class="mid3">'+Number(p.bets||0)+' bets · '+tot.toLocaleString()+' VC</span>'
    + '<span class="lb">'+mult(b)+' · '+b.toLocaleString()+'</span>'
    + '</div></div>';
}

/* ═══ AUTH — Discord, via Supabase ═══════════════════════════════════
   Raw endpoints rather than supabase-js, matching how every other page
   in this repo talks to Supabase. */
var session = null;

function readHashSession(){
  if(!location.hash || location.hash.indexOf('access_token') === -1) return null;
  var p = new URLSearchParams(location.hash.slice(1));
  var tok = p.get('access_token');
  if(!tok) return null;
  var s = {
    access_token: tok,
    refresh_token: p.get('refresh_token'),
    expires_at: Date.now() + (parseInt(p.get('expires_in'),10) || 3600) * 1000
  };
  history.replaceState(null, '', location.pathname + location.search);
  return s;
}
function saveSession(s){
  session = s;
  try{ s ? localStorage.setItem('uba.session', JSON.stringify(s)) : localStorage.removeItem('uba.session'); }catch(e){}
}
function loadSession(){
  var s = readHashSession();
  if(s){ saveSession(s); return s; }
  try{
    var raw = localStorage.getItem('uba.session');
    if(!raw) return null;
    var p = JSON.parse(raw);
    if(p && p.expires_at && p.expires_at > Date.now()) { session = p; return p; }
    localStorage.removeItem('uba.session');
  }catch(e){}
  return null;
}
function signIn(){
  var back = location.origin + location.pathname;
  location.href = SB + '/auth/v1/authorize?provider=discord&redirect_to=' + encodeURIComponent(back);
}
function signOut(){
  saveSession(null); me = null; myFighter = null; myBout = null;
  renderYou(); renderCards(); paintAvatar(); renderJoinSlot();
}

/* Who is looking, resolved once at boot and after sign-in. Every screen that
   changes per person reads these two rather than querying again. */
async function loadWhoAmI(){
  myFighter = null; myBout = null;
  if(!me) return;
  var prof = await qMe("my_profile?select=fighter_slug,fighter_name&limit=1");
  if(prof && prof.length && prof[0].fighter_slug) myFighter = prof[0];
  if(!myFighter) return;
  var bout = await qMe("my_next_bout?select=*&order=event_date.asc&limit=1");
  if(bout && bout.length) myBout = bout[0];
}
async function fetchMe(){
  if(!session) return null;
  try{
    var r = await fetch(SB + '/auth/v1/user', {
      headers:{ apikey: KEY, Authorization: 'Bearer ' + session.access_token }
    });
    if(!r.ok){ saveSession(null); return null; }
    return await r.json();
  }catch(e){ return null; }
}

async function loadMe(){
  var el = document.getElementById('me-body');
  if(!el) return;
  var rows = await qMe("my_profile?select=*&limit=1");
  if(!el.isConnected) return;
  if(!rows){
    retryHandlers['me'] = loadMe;
    el.innerHTML = failHTML("Couldn't load your profile.", 'me'); return;
  }
  if(!rows.length){
    el.innerHTML = '<div class="empty"><b>No league account matched.</b><br>'
      + 'This Discord account has never used the bot, so there is nothing to show yet. '
      + 'Run any command in the server and it will appear here.</div>';
    return;
  }
  var p = rows[0];
  var sub = document.getElementById('me-sub');
  if(sub) sub.textContent = p.display_name ? 'Connected · ' + p.display_name : 'Connected';

  var html = '<div class="bal"><div class="k">Your balance</div>'
    + '<div class="v">'+Number(p.vc_balance||0).toLocaleString()+'<em>VC</em></div></div>';

  if(p.fighter_slug){
    html += '<div class="lab"><b>Your fighter</b><i></i></div>'
      + '<div class="myrow" data-slug="'+esc(p.fighter_slug)+'">'
      + '<span class="av3">'+(p.photo_thumb_url || p.photo_url
          ? '<img src="'+esc(p.photo_thumb_url || p.photo_url)+'" alt="" onerror="this.remove()">' : '')+'</span>'
      + '<div style="flex:1"><div class="t">'+esc(p.fighter_name)+'</div>'
      + '<div class="s">'+esc(wc(p.weight_class))+(p.is_champion ? ' · Champion' : '')+'</div></div>'
      + '<span class="go2">View</span></div>';
  } else {
    html += '<div class="lab"><b>Your fighter</b><i></i></div>'
      + '<div class="empty">You don\'t have a fighter yet. Run <b>/register</b> in the server.</div>';
  }

  html += '<div class="lab"><b>Recent VC</b><i></i></div><div id="me-vc"><div class="skel"></div></div>';
  el.innerHTML = html;
  loadVC();
}

async function loadVC(){
  var el = document.getElementById('me-vc');
  if(!el) return;
  var rows = await qMe("my_vc_history?select=*&limit=12");

var binderCards = null, binderSet = 'all';

async function loadBinder(){
  var el = document.getElementById('binder');
  if(!el) return;
  var rows = await qMe("my_cards?select=*&order=qty.desc");
  if(!el.isConnected) return;
  if(!rows){ retryHandlers['binder'] = loadBinder; el.innerHTML = failHTML("Couldn't open your binder.", 'binder'); return; }
  binderCards = rows;

  var prof = await qMe("my_profile?select=vc_balance&limit=1");
  var chip = document.getElementById('cards-vc');
  if(chip && prof && prof.length) chip.textContent = Number(prof[0].vc_balance||0).toLocaleString() + ' VC';

  if(!rows.length){
    el.innerHTML = '<div class="empty"><b>Your binder is empty.</b><br>'
      + 'Open a pack in the server and your cards land here.</div>';
    return;
  }
  renderBinder();
}

function renderBinder(){
  var el = document.getElementById('binder');
  if(!el || !binderCards) return;
  var prints = binderCards.reduce(function(n,c){ return n + Number(c.qty||0); }, 0);
  var rare = binderCards.filter(function(c){
    return ['legendary','prismatic','mystic'].indexOf(c.rarity) > -1; }).length;
  var sets = [];
  binderCards.forEach(function(c){ if(c.set_name && sets.indexOf(c.set_name) === -1) sets.push(c.set_name); });

  var list = binderSet === 'all' ? binderCards
    : binderCards.filter(function(c){ return c.set_name === binderSet; });

  el.innerHTML = '<div class="bstat">'
      + '<div><b>'+prints+'</b><s>prints</s></div>'
      + '<div><b>'+binderCards.length+'</b><s>unique</s></div>'
      + '<div><b>'+rare+'</b><s>rare+</s></div></div>'
    + '<div class="lab"><b>My binder</b><i></i><s>'+list.length+' shown</s></div>'
    + '<div class="chips" id="binder-chips"><span class="'+(binderSet==='all'?'on':'')+'" data-set="all">All</span>'
      + sets.map(function(x){ return '<span class="'+(binderSet===x?'on':'')+'" data-set="'+esc(x)+'">'+esc(x)+'</span>'; }).join('')
      + '</div>'
    + '<div class="bgrid">' + list.map(function(c){
        var art = c.photo_url
          ? '<span class="init">'+esc(initials(c.display_name))+'</span>'
            + '<img src="'+esc(c.photo_url)+'" alt="" loading="lazy" onerror="this.remove()">'
          : '<span class="init">'+esc(initials(c.display_name))+'</span>';
        var isMe = myFighter && c.fighter_slug === myFighter.fighter_slug;
        return '<div class="mini'+(isMe?' mine':'')+'"'+(c.fighter_slug?' data-slug="'+esc(c.fighter_slug)+'"':'')+'>'
          + (isMe ? '<span class="mineTag">You</span>' : '')
          + (Number(c.qty) > 1 ? '<span class="qty">&times;'+c.qty+'</span>' : '')
          + '<div class="foil"></div><div class="art">'+art+'</div>'
          + '<div class="in"><div class="n">'+esc(c.display_name)+'</div>'
          + '<div class="m2"><span class="rar2 r-'+esc(c.rarity||'common')+'">'+esc(c.rarity||'')+'</span>'
          + '<span class="gr">'+(c.best_grade != null ? c.best_grade : '')+'</span></div></div></div>';
      }).join('') + '</div>';

  var chips = document.getElementById('binder-chips');
  if(chips) chips.addEventListener('click', function(e){
    var c = e.target.closest('span'); if(!c) return;
    binderSet = c.getAttribute('data-set'); renderBinder();
    panels.cards.scrollTop = 0;
  });
}

async function loadSets(){
  var el = document.getElementById('setlist'); if(!el) return;
  var rows = await q("card_sets_public?select=name,code,status,set_size");
  if(!rows || !rows.length){ el.innerHTML = '<div class="empty">No sets yet.</div>'; return; }

      + '<div><div class="t">'+esc(s.name)+'</div>'
      + '<div class="s">'+esc(s.code)+' &middot; '+(s.set_size||'?')+' cards &middot; '+esc(s.status)+'</div></div></div>';
  }).join('');
}

document.addEventListener('click', function(e){

});

/* ═══ install hint — iOS gets no prompt, so it gets a sentence ═══ */
function installHint(){
  var el = document.getElementById('install');
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if(standalone) return;
  var iOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if(!iOS) return;
  try{ if(localStorage.getItem('uba.install.dismissed')) return; }catch(e){}
  el.innerHTML = '<b>Add UBA to your home screen.</b><br>Tap the share button, then "Add to Home Screen".';
  el.classList.add('on');
  el.addEventListener('click', function(){
    el.classList.remove('on');
    try{ localStorage.setItem('uba.install.dismissed','1'); }catch(e){}
  });
}

/* TEMPORARY — open the app with ?diag to print what the device actually
   reports. The tab bar has been "not at the bottom" through three fixes and
   every one of them was a guess; this replaces guessing with numbers.
   Delete this block once the bar is right. */
function showDiag(){
  if(location.search.indexOf('diag') === -1) return;
  var probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;bottom:0;height:0;padding-bottom:env(safe-area-inset-bottom)';
  document.body.appendChild(probe);
  var inset = probe.getBoundingClientRect().height;
  probe.remove();
  var bar = document.querySelector('.bar').getBoundingClientRect();
  var standalone = window.matchMedia('(display-mode: standalone)').matches || !!navigator.standalone;
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:70px;z-index:99;'
    + 'background:#000;color:#0f0;font:11px/1.5 monospace;padding:10px;border-radius:8px;'
    + 'white-space:pre;border:1px solid #0f0';
  d.textContent =
      'standalone   ' + standalone + '\n'
    + 'innerHeight  ' + window.innerHeight + '\n'
    + 'screen.h     ' + screen.height + '\n'
    + 'visualVP.h   ' + (window.visualViewport ? Math.round(window.visualViewport.height) : 'n/a') + '\n'
    + 'safe-bottom  ' + inset + '\n'
    + 'bar.top      ' + Math.round(bar.top) + '\n'
    + 'bar.bottom   ' + Math.round(bar.bottom) + '\n'
    + 'bar.height   ' + Math.round(bar.height) + '\n'
    + 'GAP BELOW    ' + Math.round(window.innerHeight - bar.bottom) + '\n'
    + 'dpr          ' + window.devicePixelRatio;
  d.addEventListener('click', function(){ d.remove(); });
  document.body.appendChild(d);
}

/* ═══ boot ═══════════════════════════════════════════════════════════ */
(async function(){
  loadSession();
  if(session) me = await fetchMe();
  await loadWhoAmI();
  paintAvatar();
  renderYou();
  renderCards();
  renderJoinSlot();
  installHint();
  showDiag();

  var hash = (location.hash || '').replace('#','');
  if(hash.indexOf('f/') === 0){ goTab('fighters'); openSheet({kind:'fighter', id:hash.slice(2)}); }
  else if(hash.indexOf('n/') === 0){ goTab('news'); openSheet({kind:'news', id:hash.slice(2)}); }
  else if(hash.indexOf('e/') === 0){ openSheet({kind:'event', id:hash.slice(2)}); }
  else if(panels[hash] && hash !== 'home') goTab(hash);

  await loadHome();
  loadNews();
  loadFighters();

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(function(e){ console.warn('[uba] sw', e); });
  }
})();
