<style>
/* ═══════════════════════════════════════════════════════════════════════
   VGA Esports app shell — Twilight ground, the Fan hero, five-slot bar with
   You raised in the centre. Design locked with founder 2026-08-30.

   NAMING: VGA Esports is the ORGANISATION and is what the header says. UBA
   (Unified Boxing Association) and UBAe are LEAGUES inside it, alongside GFL.
   So "Fight in the UBA" is correct on the register card — that is a league —
   while the shell, the manifest and the unfurls are all VGA.
   ═══════════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* The ground lives on html, not body, for two reasons. Safari paints the
   strip past the body — the home-indicator area and any rubber-band
   overscroll — from html, and an unpainted html shows there as a WHITE BAR.
   And because the tab panels are the things that scroll, html never moves,
   so the gradient stays put without background-attachment:fixed, which is
   unreliable on iOS. Body stays transparent so this shows through. */
/* THE CANVAS IS THE BAR'S COLOUR, and that is the point.

   Measured off a real iPhone screenshot: the bar renders exactly as coded —
   88pt, being 54pt of content plus the 34pt home-indicator inset, in #1A1533 —
   and then there are 47pt of #0C0916 beneath it, one flat colour with nothing
   drawn in it. That band is HTML's background propagated to the canvas, in
   space the layout viewport does not cover, so `position:fixed;bottom:0` can
   never reach it and no amount of padding on the bar will fill it. Five passes
   spent changing the bar's height were all chasing the wrong thing.

   The cause is upstream — most likely the app being launched somewhere that
   reserves toolbar space, or a home-screen copy installed before
   viewport-fit=cover was in this file, which iOS caches at install time. Both
   are fixed by re-adding the icon, not by CSS.

   But whatever is short-changing the viewport, the canvas underneath it is
   paintable, and painting it the BAR's colour makes that band read as the bar
   rather than as a gap beneath it. #ground covers the whole viewport from
   top:0, so this colour can only ever show in the strip below. */
/* TWO DOCUMENTED iOS WORKAROUNDS, both about position:fixed resolving against
   the wrong box in a standalone PWA.

   min-height: calc(100% + env(safe-area-inset-top)) on HTML is the known fix
   for fixed elements sitting shifted in an installed iOS web app — the
   initial containing block is derived from a layout viewport that does not
   include the inset, and this forces it to.

   height: -webkit-fill-available on BODY is the other half, and is what
   Tailwind adopted for the same family of bugs: 100% and 100vh both resolve
   to a height that is not what is on screen in iOS, while fill-available asks
   the browser for the box it actually has. The plain 100% stays first as the
   fallback for anything that does not know the keyword. */
html{height:100%;min-height:calc(100% + env(safe-area-inset-top));background:#1A1533}
body{height:100%;height:-webkit-fill-available;overflow:hidden;background:#1A1533;
  color:#EDEAF6;font-family:'Barlow',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
}
/* The gradient is a REAL ELEMENT, not a background on html or body.
   Relying on background propagation is what put a white strip under the tab
   bar on a standalone iPhone: the propagated canvas background is sized to
   the layout viewport, which excludes the home-indicator safe area, and iOS
   paints whatever is left over white. An element pinned with 100dvh has no
   such gap. Both html and body also carry the solid ground as a floor, so
   even if this element fails to paint, nothing is ever white. */
#ground{position:fixed;left:0;right:0;top:0;height:100dvh;min-height:100%;z-index:0;
  pointer-events:none;opacity:.995;   /* same Safari 26 workaround — see .bar */
  background:linear-gradient(180deg,#3B3568 0%,#2A2450 26%,#191434 55%,#0C0916 100%)}
.panel{z-index:1}
a{color:inherit;text-decoration:none}
button{font:inherit;background:none;border:none;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #C3A6FF;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* panels */
.panel{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;display:none}
.panel::-webkit-scrollbar{display:none}
.panel.live{display:block}
/* Just clears the bar. This used to be much larger, which put a field of
   nothing under the last row when you scrolled to the end. */
.pad{padding-bottom:calc(62px + env(safe-area-inset-bottom,0px))}
.wrapmax{max-width:520px;margin:0 auto}

/* shared furniture */
.top{padding:calc(18px + env(safe-area-inset-top)) 18px 11px;display:flex;justify-content:space-between;align-items:center}
.brand{font-family:'Bebas Neue',sans-serif;font-size:23px;letter-spacing:.11em}
.brand span{color:#C3A6FF}
.ttl{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.08em}
/* "Season 2" said nothing — season 2 of what. It names the LEAGUES instead,
   and turns between them so both get said without needing two chips. */
.szn{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:#CFC8F0;border:1px solid rgba(255,255,255,.22);border-radius:3px;padding:4px 9px;
  min-width:52px;text-align:center;overflow:hidden}
.szn span{display:inline-block;transition:transform .34s cubic-bezier(.4,0,.2,1),opacity .34s}
.szn span.out{transform:translateY(-110%);opacity:0}
.szn span.in{transform:translateY(110%);opacity:0;transition:none}
@media (prefers-reduced-motion:reduce){.szn span{transition:none}}
/* The whole recruiting ask is now this one pill. It routes to You, which is
   where signing in and registering already live — rather than a strip on Home
   repeating a pitch the You tab makes properly. */
.signin{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:#1A1430;background:linear-gradient(100deg,#C3A6FF,#A78BFA);
  border-radius:20px;padding:6px 13px;box-shadow:0 3px 12px rgba(139,92,246,.4)}
.vcchip{display:flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;font-size:11px;
  font-weight:700;color:#F5C842;border:1px solid rgba(245,200,66,.3);border-radius:20px;padding:5px 12px}
.lab{display:flex;align-items:center;gap:9px;margin:20px 18px 11px}
.lab b{font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:#ADA4D6;white-space:nowrap}
.lab b::before{content:'// ';color:#A78BFA}
.lab i{flex:1;height:1px;background:rgba(255,255,255,.1);display:block}
.lab s,.lab a{text-decoration:none;font-family:'Space Mono',monospace;font-size:8.5px;
  letter-spacing:.11em;text-transform:uppercase;color:#7E7699;white-space:nowrap}
.lab a{color:#C3A6FF}
.foot{text-align:center;padding:22px 18px 10px;font-family:'Space Mono',monospace;font-size:8px;
  letter-spacing:.15em;text-transform:uppercase;color:#5E5878}
.empty{margin:0 18px;padding:22px 16px;text-align:center;border:1px dashed rgba(255,255,255,.16);
  border-radius:13px;font-size:14px;color:#8F86AF;line-height:1.5}

/* ── the live bar ── */
/* The safe-area padding has to come AFTER the shorthand, or the shorthand
   resets it — which is how the red bar ended up under the clock and the 5G
   icon on a notched phone. */
.livebar{display:none;align-items:center;gap:10px;margin:0 0 2px;padding:11px 18px;
  padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:7px;
  background:linear-gradient(90deg,#C22B22,#E8362B);color:#fff}
.livebar.on{display:flex}
.livebar .dot{width:8px;height:8px;border-radius:50%;background:#fff;flex-shrink:0;
  animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
.livebar .txt{flex:1;min-width:0}
.livebar .k{font-family:'Space Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;opacity:.9}
.livebar .n{font-size:15px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.livebar .go{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;border:1px solid rgba(255,255,255,.5);border-radius:7px;padding:7px 11px;flex-shrink:0}

/* ── the fan ─────────────────────────────────────────────────────────
   The card is the WHITE PANEL and nothing else. Above it is TRANSPARENT —
   no box, no gradient, no renderer graphic behind anything. Whatever stands
   up there is a printed thing on its own, carried by a drop shadow.

   Two things can stand there, in this order:
     1. the event's POSTERS, up to three, stacked and leaning like the
        poster fan on the standby screen
     2. failing that, the main event's two fighters as CUT-OUTS, left and
        right, with their names — the fighters are transparent PNGs, so this
        composes with no plate behind it either

   If neither exists the space is simply empty, because an empty space reads
   better than a filled rectangle apologising for itself. */
.fanw{position:relative;margin:4px 0 0;display:flow-root;--peek:150px;padding-top:var(--peek)}
.fc{position:absolute;top:0;left:50%;width:216px;margin-left:-108px;
  border-radius:0 0 14px 14px;color:#16131F;cursor:pointer;
  transition:transform .34s cubic-bezier(.34,1.3,.5,1),opacity .34s}

/* Each card carries its OWN art, tucked BEHIND it and peeking above the top
   edge — z-index:-1 puts it under the card's own background, and the stage's
   bottom sits 26px INSIDE the card so the card cleanly cuts it off. Only
   --peek shows. This is per-card: the second and third cards in the fan each
   peek their own posters, they do not share one stage. */
.fc .stage{position:absolute;left:0;right:0;bottom:calc(100% - 26px);
  height:calc(var(--peek) + 26px);z-index:-1;pointer-events:none}

/* THE CARD'S SURFACE IS A PSEUDO-ELEMENT, and it has to be.

   CSS paints, inside a stacking context: (1) the element's own background,
   (2) its negative z-index children, ... so a `z-index:-1` child lands ON TOP
   of its parent's background, not under it. `.fc` makes a stacking context, so
   the art was painting over the white card. Moving the surface to ::before
   puts it in the "positioned descendants" pass, which runs AFTER negative
   children: stage, then card, then card content. Do not put a background back
   on .fc itself. */
.fc::before{content:'';position:absolute;inset:0;z-index:0;
  border-radius:0 0 14px 14px;background:linear-gradient(168deg,#F8F6FC 0%,#E5E0F2 100%)}
.fc > .foil,.fc > .in,.fc > .past{position:relative;z-index:1}

/* THE FAN, the same one the standby scene runs. Every poster is visible at
   once, laid out flat as a hand rather than a row, and WHICH ONE IS IN FRONT
   ROTATES — a stack with a permanent front poster shows the other two as edges
   all night and nobody ever reads them. The positions are fixed and the
   posters move BETWEEN them, which is what makes it read as a shuffle rather
   than graphics being swapped.

   The stage is a zero-size point at the card's top-centre; every item hangs
   its BOTTOM on that point and rotates about it, so the fan opens upward out
   of the card the way a hand of cards opens out of a fist. */
.fc .stage{position:absolute;left:50%;bottom:calc(100% - 30px);width:0;height:0;
  z-index:-1;pointer-events:none}

/* ONLY THE FRONT CARD SHOWS ITS FACEOFF. The faceoff is card-WIDTH by
   definition, so on a card scaled to .86, rotated seven degrees and shoved
   sideways, its two fighters sit at the edges of a box wider than the card
   still looks — and they hang off the side of the stack looking detached from
   everything. Posters do not do this: they are narrow and centred, so they
   stay. A hand of cards shows the top card's face and the others' edges. */
.fc:not([data-pos="0"]) .stage .fo{display:none}

/* max-width:none is LOAD-BEARING. The stage is a zero-WIDTH point, so any
   stylesheet carrying `img{max-width:100%}` resolves that to max-width:0 and
   collapses every poster to nothing. It cost an evening to find once. */
.fc .stage .pz{position:absolute;left:0;bottom:0;height:150px;width:auto;max-width:none;
  transform-origin:50% 100%;border-radius:4px;box-shadow:0 8px 20px rgba(4,2,14,.7);
  transition:transform .5s cubic-bezier(.32,.9,.35,1),opacity .45s}
.fc .stage .pz.gone{opacity:0}

/* a night nothing is known about yet — no poster, no bouts */
.fc .stage .soon{position:absolute;left:0;bottom:0;width:112px;height:150px;
  transform:translate(-50%,0);border-radius:4px;overflow:hidden;
  background:linear-gradient(168deg,#3A2F72 0%,#1B1440 62%,#120E2C 100%);
  border:1px solid rgba(167,139,250,.42);box-shadow:0 8px 20px rgba(4,2,14,.7);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:12px 10px}
.fc .stage .soon .sm{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.16em;color:#C3A6FF;line-height:1}
.fc .stage .soon .sb{font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:.98;letter-spacing:.03em;
  color:#F2EEFF;text-align:center}
.fc .stage .soon .se{font-family:'Space Mono',monospace;font-size:6.5px;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(190,178,232,.7);border-top:1px solid rgba(255,255,255,.16);
  padding-top:7px;width:100%;text-align:center}

/* THE FACEOFF — always the full width of the card, never in the stack */
.fc .stage .fo{position:absolute;left:0;bottom:0;width:216px;height:150px;
  transform:translate(-50%,0);transition:opacity .45s}
.fc .stage .fo.gone{opacity:0}
/* never a height AND a max-width on a photo — the browser honours both and
   squashes it between them. A box plus object-fit cannot distort. */
.fc .stage .fo .cut{position:absolute;bottom:0;height:96%;width:46%;
  object-fit:contain;object-position:bottom center;
  filter:drop-shadow(0 4px 14px rgba(4,2,14,.85))}
.fc .stage .fo .cut.l{left:0}
.fc .stage .fo .cut.r{right:0;transform:scaleX(-1)}
.fc .stage .fo .sil{position:absolute;bottom:0;height:84%;width:38%;fill:rgba(190,175,235,.34)}
.fc .stage .fo .sil.l{left:4%}
.fc .stage .fo .sil.r{right:4%}
.fc .stage .fo .vsx{position:absolute;left:50%;top:12%;transform:translateX(-50%);
  font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.09em;color:#F4F1FB;
  text-shadow:0 2px 14px rgba(0,0,0,.95)}
.fc .stage .fo .cn{position:absolute;bottom:3px;font-family:'Barlow',sans-serif;font-weight:700;
  font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:#F4F1FB;
  text-shadow:0 1px 8px rgba(0,0,0,.95);max-width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .stage .fo .cn.l{left:4px}
.fc .stage .fo .cn.r{right:4px;text-align:right}
.fc .past{position:absolute;right:8px;top:6px;z-index:5;font-family:'Space Mono',monospace;
  font-size:7px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#EDEAF6;
  background:rgba(10,8,20,.8);padding:3px 7px;border-radius:3px}
/* A LIGHT PASSES OVER THE CARD THAT IS ON RIGHT NOW. Only that one — a
   shimmer on every card is wallpaper, on one card it is a signal. It rides
   above the panel and below the text, and it is clipped to the card so it
   cannot streak across the posters behind. */
.fc .shine{position:absolute;inset:0;z-index:1;border-radius:0 0 14px 14px;overflow:hidden;
  pointer-events:none}
.fc .shine::after{content:'';position:absolute;top:-40%;bottom:-40%;width:38%;left:-45%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.72),transparent);
  transform:skewX(-16deg);animation:cardshine 3.6s ease-in-out infinite}
@keyframes cardshine{0%{left:-45%}55%,100%{left:118%}}
@media (prefers-reduced-motion:reduce){.fc .shine{display:none}}
.fc .foil{height:4px;background:linear-gradient(90deg,#F5C842,#EC4899,#7B2FFF,#22D3EE,#F5C842)}
.fc .in{padding:11px 13px 13px}
.fc .rar{font-family:'Space Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;padding:3px 7px;border-radius:3px;display:inline-block;
  color:#7A5A00;background:linear-gradient(90deg,#FBEFC2,#F3DE94);border:1px solid #E2C871}
.fc .nm{font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:.98;letter-spacing:.02em;margin-top:8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .mt{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.08em;color:#5C5670;margin-top:6px}
/* and the front card carries a deeper shadow so it sits ON the blur rather
   than in it — without it the blur just reads as a smudge round the edges. */
.fc[data-pos="0"]{position:relative;top:0;left:auto;margin:0 auto;z-index:3;transform:none;opacity:1;
  box-shadow:0 18px 40px rgba(6,4,20,.72),0 3px 10px rgba(6,4,20,.5)}
/* DEPTH OF FIELD on everything behind the front card. This is how a card
   stack is meant to separate — the app switcher, a wallet, a hand of cards.
   Opacity alone left three sets of fighters at equal focus fighting over the
   same space; the eye reads BLUR as distance and stops trying to parse what is
   behind. Blur and darkness both climb with depth. */
.fc[data-pos="1"]{top:calc(var(--peek) + 10px);z-index:2;transform:rotate(6.5deg) translateX(50px) scale(.9);
  opacity:.94;filter:brightness(.58) saturate(.8) blur(1.6px)}
.fc[data-pos="2"]{top:calc(var(--peek) + 16px);z-index:1;transform:rotate(-7deg) translateX(-52px) scale(.86);
  opacity:.9;filter:brightness(.38) saturate(.7) blur(3px)}
/* A hand is three cards deep however many are in the deck. Everything past
   the third is dealt but not shown, and swiping rotates it forward. */
.fc:not([data-pos="0"]):not([data-pos="1"]):not([data-pos="2"]){display:none}
.dotsn{display:flex;gap:6px;justify-content:center;margin:20px 0 16px;min-height:6px}
.dotsn i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.22);display:block;transition:background .2s}

.cds{display:flex;gap:7px;margin:0 18px}

}
@media (prefers-reduced-motion:reduce){

  .cds div.lit{animation:none}
}

.ch{display:flex;align-items:center;gap:12px;margin:0 18px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}

  justify-content:center;background:linear-gradient(150deg,#F5C842,#C8901A);color:#3A2A00}

/* ── THE STRIP ───────────────────────────────────────────────────────
   One slot under the countdown carrying whatever is most true for you, in
   priority order: your own fight, then the feed, then the top headline. The
   angled tab names which, and is the same shape every time so the eye learns
   one thing rather than three.

   It flips on a slow timer and STOPS the moment you touch it. A slot that
   changes while you are reading it is worse than one that picks. */
.strip{position:relative;margin:13px 16px 0;height:58px;border-radius:11px;overflow:hidden;
  display:flex;align-items:center;cursor:pointer;
  background:rgba(10,5,20,.55);border:1px solid rgba(168,85,247,.26);border-left:2px solid #A855F7}
.strip.mine{background:linear-gradient(90deg,rgba(245,200,66,.15),rgba(10,5,20,.55));
  border-color:rgba(245,200,66,.3);border-left-color:#F5C842}
.strip .face{position:absolute;inset:0;display:flex;align-items:center;
  transition:transform .42s cubic-bezier(.4,0,.2,1),opacity .3s ease}
.strip .face.out{transform:rotateX(-90deg);opacity:0}
.strip .face.in{transform:rotateX(0);opacity:1}
.strip .body{flex:1;min-width:0;padding:0 12px}
.strip .k{font-family:'Space Mono',monospace;font-size:7px;font-weight:700;letter-spacing:.19em;
  text-transform:uppercase;color:#C3A6FF}
.strip.mine .k{color:#F5C842}
.strip .v{font-size:14px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .v b{color:#C3A6FF;font-weight:700}
.strip .v .x{font-family:'Space Mono',monospace;font-size:9px;color:#F5C842;margin:0 6px}
.strip .tab{position:relative;flex-shrink:0;align-self:stretch;display:flex;align-items:center;
  padding:0 13px 0 21px;overflow:hidden;
  background:linear-gradient(135deg,rgba(167,139,250,.34),rgba(167,139,250,.14));
  clip-path:polygon(16px 0, 100% 0, 100% 100%, 0 100%)}
.strip.mine .tab{background:linear-gradient(135deg,rgba(245,200,66,.34),rgba(245,200,66,.12))}
.strip .tab span{font-family:'Space Mono',monospace;font-size:7.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:#EDEAF6;white-space:nowrap;position:relative;z-index:2}
.strip .tab::after{content:'';position:absolute;top:-60%;left:-140%;width:60%;height:220%;z-index:1;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);
  transform:rotate(18deg);animation:sweep 3.4s ease-in-out infinite}
@keyframes sweep{0%{left:-140%}55%{left:180%}100%{left:180%}}

/* ── the fighter sheet ──────────────────────────────────────────────────
   An in-app screen, not a link out. Tapping a card used to navigate to
   f/<slug>.html, which redirects to the old profile page — outside the
   app's scope, so iOS wrapped it in browser chrome with a URL bar and a
   Done button. The cards keep their href so long-press-to-share and the
   Discord unfurl still work; the tap is intercepted and lands here. */
.sheet{position:fixed;inset:0;z-index:30;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
  background:#151030;display:none;transform:translateY(14px);
  transition:transform .22s ease}
/* NOTE: opacity is deliberately not animated here. It used to fade in from 0
   on a class added inside requestAnimationFrame — and rAF does not fire while
   the page is backgrounded, so the sheet could open fully transparent with
   its class correctly applied and no way to tell. Only transform animates
   now, so a sheet that never gets a frame is simply visible and unslid. */
.sheet::-webkit-scrollbar{display:none}
.sheet.live{display:block}
.sheet.shown{transform:none}
.sheet .hero{position:relative;height:340px;overflow:hidden;

/* the bar */
/* THE BAR. Six passes. Five of them changed the HEIGHT, which was never the
   problem, and the sixth is the one that matters.

     78px + full inset  -> "a bar floating over a dead band"
     62px + 60% inset   -> still empty-looking
     58px + no inset    -> "something below the bar"
     52px + full inset  -> "worse, thicker empty space"
     50px + no inset    -> "even thicker empty space"

   Five different heights, one identical complaint. That rules the height out.

   The actual cause is COLOUR. The bar was rgba(10,8,20,.92) blurred over
   #ground, whose bottom stop is #0C0916. Composited, the bar reads as
   rgb(10,8,20) sitting on rgb(12,9,22) — a difference of two points per
   channel, invisible on any screen. So the bar had a bright 1px line at its
   TOP and no perceptible edge at its BOTTOM: the icons looked like they were
   floating on the page, and every pixel of bar beneath them read as a
   separate black strip under the nav. Changing the height just moved how
   much of that invisible strip there was.

   So: one SOLID colour, clearly lighter than the ground, no blur. The bar now
   has a visible bottom edge because the bar is visibly a different surface.
   The safe-area inset is padding on that same solid colour, which is why it
   is safe to keep this time — on a device with a home indicator the strip is
   visibly part of the bar instead of a gap beneath it. */
.bar{position:fixed;left:0;right:0;bottom:calc(-1 * var(--barpush, 0px));
  display:flex;align-items:stretch;
  background:#1A1533;border-top:1px solid rgba(255,255,255,.16);
  /* THE SAFE AREA, ONCE — NOT TWICE. Below this bar sits a dead strip the
     page cannot paint into but which is colour-matched to it, and on this
     phone that strip is 47pt: already more than the 34pt home-indicator inset.
     Padding the bar by the inset ON TOP of that made the dark band 135pt tall
     with the labels floating 92pt up, which is the "why is it so thick".
     So: pad by whatever the inset still needs AFTER the dead strip, and on a
     device with no dead strip (--deadstrip 0) this is the full inset exactly
     as before. */
  /* THE STANDARD iOS TAB BAR: the icons sit ABOVE the home-indicator inset
     and the bar's background carries on through it to the screen edge. That
     dark strip under the labels is the point, not a defect — it is what keeps
     a tappable row clear of the swipe-up gesture, and it is why every app
     with a bottom bar has one.
     The deadstrip subtraction is gone. It was correct while the bar could not
     reach the bottom and something else was already covering that band; now
     that it does reach, subtracting left the labels jammed against the edge. */
  padding-bottom:env(safe-area-inset-bottom,0px);
  z-index:20;
  /* THE SAFARI 26 FIXED-OVERLAY BUG, and the documented workaround for it.
     WebKit 26 composites a position:fixed element with a FULLY OPAQUE
     background down a different path from a transparent one, and that path
     leaves a gap at the bottom of the screen — the element reports the right
     box in Web Inspector and paints short. Opacity below 1 puts it back on the
     transparent path and it covers the screen. .995 is visually identical to
     1 and is the whole fix.
     Apple fixed this in Safari 26.1 ("Fixed a bottom gap appearing on layouts
     with viewport-sized fixed containers on iOS", 3 Nov 2025), so this line is
     only load-bearing on 26.0. It costs nothing to leave in. */
  opacity:.995}
.bar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:54px;color:#8B83AC}

<script>
/* ═══════════════════════════════════════════════════════════════════════
   Config. The publishable key is public by design — it is the same one
   every other page in this repo embeds, and it can only read the safe
   views. Never put a service key here.
   ═══════════════════════════════════════════════════════════════════════ */
var SB  = 'https://emzlivoykbhhjcugupit.supabase.co';
var KEY = 'sb_publishable_pqhH974E1q9YsFnrVH1UJQ_X3V-rRLF';
var H   = { headers: { apikey: KEY, Authorization: 'Bearer ' + KEY } };

/* The VGA feed is the ONE read still living in the old Supabase project —
   fighter_messages only ever existed there. It is deliberately isolated to
   this pair so the dependency is obvious, and every failure path falls
   through to news rather than showing an empty bar. */
var SB_OLD  = 'https://xwsbyxkjfqqrgbzxmmrn.supabase.co';
var KEY_OLD = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3c2J5eGtqZnFxcmdienhtbXJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzNjAyNDcsImV4cCI6MjA4NzkzNjI0N30.6amkt0zGMLT3_N3fKY6sMMTdaBr5eS7Ig-hAPvPCB4g';

/* an event counts as live from its start time for this long */
/* A9 — a fight night regularly runs past four hours, and the bar vanishing
   mid-broadcast is worse than it lingering after. Six. */
var LIVE_WINDOW_MS = 6 * 60 * 60 * 1000;
/* A1 — nothing in the data ages a scheduled event out. If nobody flips it to
   completed, it stays the "next event" for ever with a countdown clamped to
   00:00:00:00, which reads as a broken clock rather than as a past night.
   After this long past its start, the app treats it as done regardless of
   what the status column says. */
var STALE_EVENT_MS = 8 * 60 * 60 * 1000;
function eventIsOver(e){
  if(!e) return false;
  if(e.status === 'completed') return true;
  var t = new Date(e.event_date).getTime();
  return isFinite(t) && (Date.now() - t) > STALE_EVENT_MS;
}

function esc(s){ return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* Every read goes through here. supabase-js resolves rather than throws on a
   failed query, and the raw REST equivalent is a non-2xx with a JSON body —
   either way an unchecked call silently renders "nothing". */
/* Returns rows, or null on any failure. The HTTP status rides along on
   q.status — a per-call object, NOT a shared property, because three reads
   run concurrently at boot and a shared one gets overwritten before the
   caller reads it. That is how "News isn't wired up yet" could appear for a
   view that was fine. */
async function q(path){
  var st = { code: 0 };
  q.status = st;
  try{
    var r = await fetch(SB + '/rest/v1/' + path, H);
    st.code = r.status;
    if(!r.ok){ console.warn('[uba] query failed', path, r.status); return null; }
    var j = await r.json();
    return Array.isArray(j) ? Object.assign(j, { _status: st.code }) : null;
  }catch(e){ console.warn('[uba] query error', path, e); return null; }
}
/* Same shape, but reports the status of a call that returned nothing. */
async function qStatus(path){
  var code = 0;
  try{
    var r = await fetch(SB + '/rest/v1/' + path, H);
    code = r.status;
    if(!r.ok) return { rows: null, code: code };
    var j = await r.json();
    return { rows: Array.isArray(j) ? j : null, code: code };
  }catch(e){ return { rows: null, code: 0 }; }
}

/* The my_* views filter on the Discord ID inside the caller's JWT, so these
   reads must send the SESSION token, not the publishable key. Sending the
   anon key returns 401 — deliberately, since anon has no grant on them. */
async function qMe(path, isRetry){
  if(!session) return null;
  if(!isRetry) await ensureFreshSession();
  if(!session) return null;
  try{
    var r = await fetch(SB + '/rest/v1/' + path, {
      headers: { apikey: KEY, Authorization: 'Bearer ' + session.access_token }
    });
    if(r.status === 401){
      // One refresh, one retry. If that fails the session is genuinely gone.
      if(!isRetry && await refreshSession()) return qMe(path, true);
      signedOutUnexpectedly();
      return null;
    }
    if(!r.ok){ console.warn('[uba] me query failed', path, r.status); return null; }
    var j = await r.json();
    return Array.isArray(j) ? j : null;
  }catch(e){ console.warn('[uba] me query error', path, e); return null; }
}

/* A3 — clearing the session was not enough: You kept showing the name,
   "Connected" and a Sign out button above a failure, so the app looked signed
   in while nothing worked. Losing the session now takes the whole signed-in
   UI down with it. */
function signedOutUnexpectedly(){
  if(!session && !me) return;
  saveSession(null);
  me = null; myFighter = null; myBout = null;
  paintAvatar(); renderYou(); renderCards(); renderJoinSlot(); renderHomeHeader(); loadStrip();
}

var WC = { lightweight:'Lightweight', middleweight:'Middleweight',
  light_heavyweight:'Light heavy', heavyweight:'Heavyweight' };
function wc(k){ return WC[k] || (k ? String(k).replace(/_/g,' ') : ''); }
function initials(n){
  var parts = String(n||'?').trim().split(/\s+/);
  return ((parts[0]||'?')[0] + (parts[1] ? parts[1][0] : (parts[0]||'?')[1] || '')).toUpperCase();
}
function recordOf(f){
  var r = (f.headline_wins||0) + '-' + (f.headline_losses||0);
  if(f.headline_draws) r += '-' + f.headline_draws;
  return r;
}
function dstr(iso, opts){
  if(!iso) return '';
  return new Date(iso).toLocaleDateString('en-US',
    Object.assign({ timeZone:'America/New_York', month:'short', day:'numeric' }, opts||{}));
}

/* ── tabs, with per-tab scroll memory ── */
var panels = {}, tabBtns = {}, currentTab = 'home', scrollMem = {};
document.querySelectorAll('.panel').forEach(function(p){ panels[p.id.replace('p-','')] = p; });
document.querySelectorAll('.bar button').forEach(function(b){
  var n = b.getAttribute('data-tab');
  tabBtns[n] = b;
  b.addEventListener('click', function(){ goTab(n); });
});
function goTab(name){
  if(!panels[name]) return;
  if(name === currentTab){ panels[name].scrollTop = 0; return; }
  scrollMem[currentTab] = panels[currentTab].scrollTop;
  panels[currentTab].classList.remove('live');
  tabBtns[currentTab].classList.remove('on');
  currentTab = name;
  panels[name].classList.add('live');
  tabBtns[name].classList.add('on');
  panels[name].scrollTop = scrollMem[name] || 0;
  history.replaceState(null,'','#'+name);
}
document.addEventListener('click', function(e){
  var g = e.target.closest('[data-goto]');
  if(g) goTab(g.getAttribute('data-goto'));
});

/* ═══ HOME ═══════════════════════════════════════════════════════════ */
var fanEvents = [], fanOrder = [0,1,2], countdownTarget = null;

var posters = {};

/* Event posters are already rendered for the broadcast and live in
   graphic_assets under card-<event_id>-<variant>. faceoff is the landscape
   one, so it crops best into the card's art strip. */
var faceoffs = {};

/* For an event with no rendered poster, compose one from the main event's two
   corners. event_matches is card-gated, so an unannounced card returns
   nothing and the event simply keeps the name block — which is correct: there
   is no bout to draw yet. */
async function loadFaceoffs(ids){
  if(!ids.length) return;
  var bouts = await q("event_matches?select=event_id,bout_number,fighter_a_name,fighter_a_slug,"
    + "fighter_b_name,fighter_b_slug&event_id=in.(" + ids.join(',') + ")&order=bout_number.asc");
  if(!bouts || !bouts.length) return;
  var main = {};
  bouts.forEach(function(b){ if(!main[b.event_id]) main[b.event_id] = b; });
  var slugs = [];
  Object.keys(main).forEach(function(k){
    [main[k].fighter_a_slug, main[k].fighter_b_slug].forEach(function(sl){
      if(sl && slugs.indexOf(sl) === -1) slugs.push(sl);
    });
  });
  if(!slugs.length) return;
  var ph = await q("fighter_cards?select=slug,profile_photo_url&slug=in.(" + slugs.join(',') + ")");
  if(!ph) return;
  var byslug = {};
  ph.forEach(function(f){ if(f.profile_photo_url) byslug[f.slug] = f.profile_photo_url; });
  Object.keys(main).forEach(function(k){
    var m = main[k];
    // A missing photo gets a silhouette rather than killing the faceoff.
    // Only 90 of 445 fighters have a cut-out, so "both corners or nothing"
    // would mean almost no built posters at all.
    faceoffs[k] = {
      a: byslug[m.fighter_a_slug] || null,
      b: byslug[m.fighter_b_slug] || null,
      an: m.fighter_a_name, bn: m.fighter_b_name
    };
  });
}

async function loadPosters(ids){
  if(!ids.length) return;
  var rows = await q("graphic_assets?select=key,url&key=like.poster-*");
  if(!rows) return;
  // Every poster is stored TWICE: the animation under its own key, and a
  // still under `<key>-thumb`. Prefer the thumb — the animations are 4-11MB
  // each and the home screen drew three of them, which is 22MB to paint a
  // postage stamp and did not arrive before somebody had scrolled past. Fall
  // back to the full file when a thumb has not been rendered yet, so an event
  // from before thumbnails existed still shows its poster.
  // ONLY real posters — `poster-<event>-<n>`, the ones somebody designed.
  // The renderer's `card-<event>-<variant>` graphics are for the broadcast and
  // are deliberately not used here: in the app the live fighter-v-fighter is
  // better than a rendered faceoff, because it pulls each photo at load and
  // falls back to a silhouette per fighter with nothing to re-render.
  var found = {};
  rows.forEach(function(r){
    var m = /^poster-([0-9a-f-]{36})-(\d+)(-thumb)?$/.exec(r.key);
    if(!m) return;
    var id = m[1], n = parseInt(m[2], 10), isThumb = !!m[3];
    if(ids.indexOf(id) === -1) return;
    var bag = found[id] = found[id] || {};
    var slot = bag[n] = bag[n] || { score: n };
    if(isThumb) slot.thumb = r.url; else slot.full = r.url;
  });
  Object.keys(found).forEach(function(id){
    posters[id] = Object.keys(found[id])
      .map(function(v){ return found[id][v]; })
      .sort(function(x, y){ return x.score - y.score; })
      .slice(0, 3)
      .map(function(x){ return x.thumb || x.full; })
      .filter(Boolean);
  });
}

/* UBAe NIGHTS ARE NOT EVENTS, and deliberately so.

   They live in `team_matches`, not `events`. Putting them in `events` would
   break the project's own rule — a new league adds tables, it does not bend the
   core ones — and it would make rows that every other system misreads: `events`
   drives `event_matches`, the card_published gate, the bet markets and the
   renderers, and a UBAe row has none of those, so each of them would show an
   empty card. That failure is already sitting in the database: "UBAe Week 1"
   exists as an event, typed fight_night, with zero matches.

   So the app reads `team_matches_public`, which is already anon-readable and
   already carries both team names, the date, the stage and the round, and
   shapes it like an event only for the fan's benefit. Nothing is written. */
async function loadUbae(){
  var ms = await q("team_matches_public?select=id,match_date,status,team_a_name,team_b_name,stage,round_label"
    + "&status=eq.scheduled&order=match_date.asc&limit=3");
  if(!ms || !ms.length) return [];
  // ONE fighter per team, and it has to be the same rule every time: the best
  // UBAe record on the roster. Not "whoever has a photo" — picking a worse
  // fighter because a better one never uploaded one is the card telling a lie
  // about who the team's best is. A star with no photo gets a silhouette, the
  // same as anywhere else in the app.
  var recs = await queryStars();
  return ms.map(function(m){
    var a = recs[m.team_a_name] || null, b = recs[m.team_b_name] || null;
    var id = 'tm:' + m.id;
    if(a || b) faceoffs[id] = {
      a: a && a.photo_thumb_url, b: b && b.photo_thumb_url,
      an: a ? a.stage_name : m.team_a_name, bn: b ? b.stage_name : m.team_b_name
    };
    return { id: id, ubae: true, status: m.status, event_date: m.match_date,
             name: shortTeam(m.team_a_name) + ' v ' + shortTeam(m.team_b_name),
             type: m.stage === 'playoff' ? 'UBAe playoff' : 'UBAe',
             round: m.round_label || '' };
  });
}

/* Team names are typed for a standings table, not for a 216px card. "UKFC
   UNCS vs Ring Reapers" does not fit on one line at 24px and wrapping it makes
   the card taller than every other card in the hand. Drop the words that carry
   no information and keep the part people actually say. */
function shortTeam(n){
  return String(n || '')
    .replace(/^(Team|UKFC|The)\s+/i, '')
    .replace(/\s+(Esports|Club|Gym)$/i, '')
    .trim();
}

var ubaeStars = null;
async function queryStars(){
  if(ubaeStars) return ubaeStars;
  var rows = await q("ubae_fighter_records?select=stage_name,wins,losses,current_team,photo_thumb_url");
  // BEST RECORD AMONG THE FIGHTERS YOU CAN ACTUALLY SEE. Picking purely on
  // record put Gold-E-Lockz and Yiz on the card, and neither has uploaded a
  // photo — so UNCS v Reapers drew two grey silhouettes and told nobody
  // anything. A team's best photographed fighter is still one of its best
  // fighters; an empty faceoff is worth nothing at all. Only if NOBODY on the
  // roster has a photo does it fall back to the best record and a silhouette.
  var best = {}, bestAny = {};
  function better(a, b){
    return !b || a.wins > b.wins || (a.wins === b.wins && a.losses < b.losses);
  }
  (rows || []).forEach(function(r){
    if(!r.current_team) return;
    if(better(r, bestAny[r.current_team])) bestAny[r.current_team] = r;
    if(r.photo_thumb_url && better(r, best[r.current_team])) best[r.current_team] = r;
  });
  Object.keys(bestAny).forEach(function(t){ if(!best[t]) best[t] = bestAny[t]; });
  ubaeStars = best;
  return best;
}

async function loadHome(){
  // EVERY scheduled event, not the next three. The hand still shows three at
  // a time — swiping rotates the rest through it — so a fourth event widens
  // the deck rather than the screen.
  var evs = await q("events_public?select=id,name,type,status,event_date,stream_platform&status=eq.scheduled&order=event_date.asc&limit=40");
  // Drop anything that has plainly already happened, whatever its status says.
  if(evs) evs = evs.filter(function(e){ return !eventIsOver(e); });
  if(evs && evs.length < 3){
    // One scheduled event leaves a hand of one. Backfill with what just
    // happened so the fan is always three deep and the past stays reachable.
    var past = await q("events_public?select=id,name,type,status,event_date,stream_platform"
      + "&status=eq.completed&order=event_date.desc&limit=" + (3 - evs.length));
    if(past) evs = evs.concat(past);
  }
  // UBAe nights sit in the same hand, ordered with everything else by date —
  // a playoff night is a night the league is on, and hiding it because it
  // lives in a different table is a filing detail leaking onto the screen.
  var ub = await loadUbae();
  if(evs && ub.length){
    evs = evs.concat(ub).sort(function(x, y){
      var xo = eventIsOver(x), yo = eventIsOver(y);
      if(xo !== yo) return xo ? 1 : -1;            // still to come, first
      return xo ? new Date(y.event_date) - new Date(x.event_date)
                : new Date(x.event_date) - new Date(y.event_date);
    });
  }
  if(!evs){
    retryHandlers['home'] = loadHome;
    document.getElementById('fan').innerHTML = failHTML("Couldn't load what's next.", 'home');
    document.getElementById('cds').style.display = 'none';
  } else {
    fanEvents = evs;
    renderFan();
    // REAL event ids only. A UBAe night's id is `tm:<uuid>`, and one of those
    // inside `event_id=in.(...)` is not a uuid — PostgREST rejects the whole
    // query, so a single UBAe card in the hand silently stripped the faceoff
    // off every real event beside it. Their faceoffs are built in loadUbae().
    var ids = evs.filter(function(e){ return !e.ubae; }).map(function(e){ return e.id; });
    loadPosters(ids).then(function(){ renderFan(true); });
    loadFaceoffs(ids).then(function(){ renderFan(true); });
  }
  await Promise.all([loadLive(), loadRanks(), loadHomeNews(), loadStrip()]);
}


/* What stands on the stage above the card, in order of what exists:
   posters, then the main event's two cut-outs, then just the name. Nothing
   here draws a background — every branch is transparent with a shadow. */
var SILHOUETTE = '<svg class="sil" viewBox="0 0 60 100" preserveAspectRatio="xMidYMax meet">'
  + '<circle cx="30" cy="21" r="14"/>'
  + '<path d="M30 38c-14 0-24 9-26 22l-4 40h60l-4-40c-2-13-12-22-26-22z"/></svg>';

function cutCorner(url, side){
  if(!url) return SILHOUETTE.replace('class="sil"', 'class="sil ' + side + '"');
  return '<img class="cut ' + side + '" src="' + esc(url) + '" alt="" '
       + 'data-side="' + side + '" onerror="silhouetteSwap(this)">';
}
function silhouetteSwap(img){
  var side = img.getAttribute('data-side') || 'l';
  img.outerHTML = SILHOUETTE.replace('class="sil"', 'class="sil ' + side + '"');
}

function faceoffItem(eventId){
  var f = faceoffs[eventId];
  if(!f) return '';
  return '<div class="fo">'
    + cutCorner(f.a, 'l') + cutCorner(f.b, 'r')
    + '<span class="vsx">VS</span>'
    + '<span class="cn l">' + esc(f.an || '') + '</span>'
    + '<span class="cn r">' + esc(f.bn || '') + '</span>'
    + '</div>';
}

/* Everything the night has as a picture, fanned: its posters first, then the
   main event's two corners. A night with no poster is the corners alone.
   Card RENDERS are deliberately not here — the faceoff/stack/reel graphics are
   for the broadcast, and in the app the live fighter-v-fighter is better,
   because it is real HTML that pulls each photo at load and falls back to a
   silhouette per fighter. */
/* Nothing is known about this night — no poster, and no bouts published. */
function soonItem(name){
  return '<div class="soon"><div class="sm">VGA</div>'
       + '<div class="sb">Card<br>dropping<br>soon</div>'
       + '<div class="se">' + esc(name || '') + '</div></div>';
}

/* Posters fan; a poster that 404s removes itself and the rest fan, because
   there is no gap to fill. The faceoff is NOT one of them — it is the full
   width of the card and never joins the stack. */
function stageHTML(eventId, eventName){
  var art = (posters[eventId] || []).slice(0, 3).map(function(u){
    return '<img class="pz" src="' + esc(u) + '" alt="" onerror="this.remove()">';
  }).join('');
  var fo = faceoffItem(eventId);
  if(!art && !fo) return '<div class="stage">' + soonItem(eventName) + '</div>';
  return '<div class="stage">' + art + fo + '</div>';
}

/* THE SHUFFLE, ported from the standby scene so both read the same.
   depth 0 is the front; 1 and 2 sit right then left, leaning further and
   dropping lower the deeper they go. `bump` above 1 slides the ones behind
   further out — the stack OPENS, shows more of what is coming, then swaps. A
   cut with nothing before it reads as the graphic glitching. */
var fanTimer = null, fanAt = 0;
var FAN_STEP = 30, FAN_DROP = 3, FAN_TILT = 5.5, FAN_HOLD = 4200, FAN_PEEK = 900, FAN_OPEN = 1.3;
function depthOf(n){ return n === 0 ? 0 : Math.floor((n - 1) / 2) + 1; }

function cycleStage(){
  clearTimeout(fanTimer); fanTimer = null;
  // Only the FRONT card of the hand fans. The two behind are rotated away at
  // 46-66% opacity, and shuffling those is movement nobody asked for.
  var stage = document.querySelector('#fan .fc[data-pos="0"] .stage');
  if(!stage) return;
  var items = [].slice.call(stage.querySelectorAll('.pz'));
  if(!items.length) return;
  fanAt = 0;

  function lay(bump){
    items.forEach(function(el, n){
      var slot = (n - fanAt + items.length) % items.length;
      var depth = depthOf(slot);
      var side = slot === 0 ? 0 : ((slot - 1) % 2 ? -1 : 1);
      el.style.zIndex = String(20 - depth);
      el.style.transform = 'translate(-50%,0)'
        + ' translate(' + Math.round(side * depth * FAN_STEP * bump) + 'px,'
                        + Math.round(depth * FAN_DROP * bump) + 'px)'
        + ' rotate(' + (side * depth * FAN_TILT * bump).toFixed(2) + 'deg)';
    });
  }
  lay(1);
  if(items.length < 2) return;                 // one picture is not a shuffle

  (function step(){
    fanTimer = setTimeout(function(){
      if(!document.body.contains(stage)) return;
      lay(FAN_OPEN);                            // open …
      fanTimer = setTimeout(function(){
        if(!document.body.contains(stage)) return;
        fanAt = (fanAt + 1) % items.length;     // … swap …
        lay(1);                                 // … settle
        step();
      }, FAN_PEEK);
    }, FAN_HOLD - FAN_PEEK);
  })();
}

/* The soonest event that has NOT STARTED, whatever the hand is showing.
   "Not over" was the wrong test: a night that is on right now is not over, so
   the clock counted down to a moment already past and sat on 00:00:00:00 next
   to a LIVE banner — four zeros reading as a broken clock. A show in progress
   has no countdown; the banner is the thing saying it is on. */
function nextUpcoming(){
  var soon = null, now = Date.now();
  fanEvents.forEach(function(e){
    if(eventIsOver(e)) return;
    var t = new Date(e.event_date).getTime();
    if(!isFinite(t) || t <= now) return;            // already started
    if(!soon || t < new Date(soon.event_date).getTime()) soon = e;
  });
  return soon;
}

/* Is this event on right now? Same window the live banner uses. */
function eventIsLive(e){
  if(!e || e.status === 'completed') return false;
  var t = new Date(e.event_date).getTime();
  return isFinite(t) && t <= Date.now() && Date.now() - t < LIVE_WINDOW_MS;
}

function renderFan(keepOrder){
  var fan = document.getElementById('fan'), dots = document.getElementById('dots');
  // A4 — art loads after the first paint, and re-rendering used to reset the
  // hand. If the viewer has already rotated it, keep where they left it.
  var prevOrder = keepOrder && fanOrder.length === fanEvents.length ? fanOrder.slice() : null;
  if(!fanEvents.length){
    fan.innerHTML = '<div class="empty" style="margin:10px 18px">No events scheduled yet.<br>Check back soon.</div>';
    dots.innerHTML = '';
    document.getElementById('cds').style.display = 'none';
    return;
  }
  fanOrder = prevOrder || fanEvents.map(function(_,i){ return i; });
  fan.innerHTML = fanEvents.map(function(e,i){
    var pos = fanOrder.indexOf(i);
    var when = new Date(e.event_date).toLocaleString('en-US',{ timeZone:'America/New_York',
      month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }).toUpperCase();
    var done = eventIsOver(e);
    var tag = e.ubae ? (e.round || e.type)
            : done ? 'Result'
            : (i === 0 ? 'Next event' : (e.type === 'fight_night' ? 'Fight night' : 'Event'));
    return '<div class="fc" data-i="'+i+'" data-pos="'+pos+'" data-ev-id="'+esc(e.id)+'">'
      + stageHTML(e.id, e.name)
      + (done ? '<span class="past">Final</span>' : '')
      + (eventIsLive(e) ? '<span class="shine"></span>' : '')
      + '<div class="foil"></div><div class="in">'
      + '<span class="rar">'+esc(tag)+'</span>'
      + '<div class="nm">'+esc(e.name)+'</div>'
      + '<div class="mt">'+esc(when)+' ET</div>'
      + '</div></div>';
  }).join('');
  dots.innerHTML = fanEvents.length > 1
    ? fanEvents.map(function(_,i){ return '<i class="'+(i===fanOrder[0]?'on':'')+'"></i>'; }).join('')
    : '';
  // THE COUNTDOWN FOLLOWS THE HAND. Turn to a card and the clock is that
  // event's. setCountdown hides the block entirely for anything already
  // started or finished, which is what stops it reading 00:00:00:00 under a
  // card that is over — the reason it was pinned to the next event before.
  setCountdown(fanEvents[fanOrder[0]]);
  cycleStage();
  teaseFan();
}

/* NOBODY KNOWS THE HAND MOVES. Three seconds after it settles, it turns
   itself once and comes back — long enough that the app has finished loading
   and you are looking at it, short enough that you connect the movement to
   the cards. Once per session, never again, and never if you have already
   touched it: a fan that keeps twitching at somebody who knows how it works
   is just noise. */
var teased = false, teaseTimer = null;
function teaseFan(){
  if(teased || fanEvents.length < 2) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  clearTimeout(teaseTimer);
  teaseTimer = setTimeout(function(){
    if(teased || !document.querySelector('#fan .fc')) return;
    teased = true;
    fanTo(1);                                  // deal one forward …
    setTimeout(function(){ fanTo(fanEvents.length - 1); }, 900);   // … and back
  }, 3000);
}

/* Bring the card at `pos` to the front. Shared by the tap and the swipe so
   they cannot drift apart. */
function fanTo(pos){
  if(!fanEvents.length) return;
  pos = ((pos % fanEvents.length) + fanEvents.length) % fanEvents.length;
  for(var i = 0; i < pos; i++) fanOrder.push(fanOrder.shift());
  document.querySelectorAll('#fan .fc').forEach(function(c){
    c.setAttribute('data-pos', String(fanOrder.indexOf(parseInt(c.getAttribute('data-i'), 10))));
  });
  var lead = fanOrder[0];
  document.querySelectorAll('#dots i').forEach(function(d, i){ d.classList.toggle('on', i === lead); });
  setCountdown(fanEvents[lead]);   // the clock is the card you turned to
  cycleStage();                       // the new front card gets the shuffle
}

document.getElementById('fan').addEventListener('pointerdown', function(){
  teased = true; clearTimeout(teaseTimer);   // they found it themselves
}, true);

document.getElementById('fan').addEventListener('click', function(e){
  if(fanSwiped) return;               // a drag that ended on a card is not a tap
  var card = e.target.closest('.fc'); if(!card) return;
  var pos = parseInt(card.getAttribute('data-pos'), 10);
  // Tapping the card behind brings it forward; tapping the FRONT card opens
  // that event's fight card.
  if(pos === 0){ openSheet({ kind:'event', id: card.getAttribute('data-ev-id') }); return; }
  fanTo(pos);
});

/* SWIPE, because a fan of cards asks to be swiped and only answered to taps.
   Pointer events cover touch and mouse in one path. The gesture is claimed
   only once it is clearly horizontal — the panel behind this scrolls
   vertically, and a fan that eats an upward flick makes the whole page feel
   stuck. */
var fanSwiped = false;
(function(){
  var el = document.getElementById('fan');
  var x0 = 0, y0 = 0, down = false, decided = false;
  var THRESH = 42;                    // far enough not to fire on a sloppy tap

  el.addEventListener('pointerdown', function(e){
    down = true; decided = false; fanSwiped = false;
    x0 = e.clientX; y0 = e.clientY;
  });
  el.addEventListener('pointermove', function(e){
    if(!down || decided) return;
    var dx = e.clientX - x0, dy = e.clientY - y0;
    if(Math.abs(dx) < THRESH && Math.abs(dy) < THRESH) return;
    decided = true;
    if(Math.abs(dy) > Math.abs(dx)) return;         // vertical: leave it to the scroll
    fanSwiped = true;
    fanTo(dx < 0 ? 1 : fanEvents.length - 1);       // left = next, right = back
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(t){
    el.addEventListener(t, function(){ down = false; });
  });
  // The click that follows a drag has to be swallowed, or a swipe that lands on
  // the front card opens the event sheet on top of the card you just turned to.
  el.addEventListener('click', function(){ setTimeout(function(){ fanSwiped = false; }, 0); }, true);
})();

function setCountdown(ev){
  // A past event has nothing to count down to; showing 00:00:00:00 under a
  // finished card reads like a bug.
  // THE CLOCK IS ALWAYS THERE, and it reads 00:00:00:00 on a card whose event
  // has been and gone. Hiding it was the wrong call: the four boxes vanishing
  // as you swipe onto a past card is a bigger jolt than four zeros, and zeros
  // say the plain thing — this one has already happened.
  var t = ev ? new Date(ev.event_date).getTime() : NaN;
  countdownTarget = isFinite(t) ? t : null;
  tickCountdown();
}
/* THE BAR IS PUT WHERE THE SCREEN ACTUALLY ENDS.
   `position:fixed; bottom:0` resolves against the LAYOUT VIEWPORT, and on this
   phone that viewport is 797pt while the screen is 844 — so the bar's bottom
   edge lands 47pt up and no height, padding or safe-area inset can reach the
   rest. Five passes of arithmetic on the bar's height were all working on the
   wrong number, and painting the gap the bar's colour only hid the seam; the
   icons still floated 92pt off the bottom.
   screen.height is the one measure that knows how tall the screen is. The
   difference between it and innerHeight IS the shortfall, and the bar is
   pushed down by exactly that.
   ONLY WHEN INSTALLED. In a browser that difference is real chrome — a URL bar,
   a toolbar — and shoving the nav under it would hide it completely. */
function seatBar(){
  // OFF. This pushed the bar down by screen.height - innerHeight, which was
  // built on the theory that the viewport was short. It was not: the cause is
  // the Safari 26 fixed-overlay PAINT bug, handled by the opacity rule on
  // .bar. With that fix in, the background reaches the bottom of the screen —
  // and this push then carried the bar's CONTENTS past it, which is why the
  // five labels came back cut in half along one line.
  //
  // Two corrections for one fault is one correction too many. The measurement
  // is kept because it costs nothing and `?diag` prints it, but it no longer
  // moves anything.
  var standalone = matchMedia('(display-mode: standalone)').matches || !!navigator.standalone;
  // MEASURE THE DEAD STRIP TWO WAYS, because the whole fix rests on seeing it
  // and one source alone is a single point of failure. screen.height is the
  // physical display; 100lvh is the LARGE viewport, the page's height with all
  // chrome retracted. Either one being bigger than innerHeight reveals the
  // shortfall, so take whichever sees it.
  var lvh = 0;
  try{
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:100lvh;'
                        + 'visibility:hidden;pointer-events:none';
    document.body.appendChild(probe);
    lvh = Math.round(probe.getBoundingClientRect().height);
    probe.remove();
  }catch(e){}
  var dead = 0;
  if(standalone){
    dead = Math.max(
      screen && screen.height ? Math.round(screen.height - window.innerHeight) : 0,
      lvh ? lvh - window.innerHeight : 0
    );
  }
  if(!(dead > 0 && dead <= 120)) dead = 0;
  window.__barLvh = lvh;
  window.__barShortfall = dead;
  // The strip below the bar that the page cannot paint into. The bar stops
  // padding for a safe area this already covers.
  document.documentElement.style.setProperty('--deadstrip', dead + 'px');
  document.documentElement.style.setProperty('--barpush', '0px');
}
seatBar();
addEventListener('resize', seatBar);
addEventListener('orientationchange', function(){ setTimeout(seatBar, 250); });

function tickCountdown(){
  var box = document.getElementById('cds');
  if(!countdownTarget){ box.style.display='none'; return; }
  box.style.display='flex';
  var diff = countdownTarget - Date.now();
  if(diff < 0) diff = 0;
  var s = Math.floor(diff/1000);
  var d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), sec = s%60;
  function p(n){ return String(n).padStart(2,'0'); }
  // Only a digit that CHANGED flips. Re-running the animation on all four
  // every second would be a strobe, and the whole point is that the hour
  // turning over is worth noticing.
  flipTo('cd-d', p(d)); flipTo('cd-h', p(h));
  flipTo('cd-m', p(m)); flipTo('cd-s', p(sec));
}

/* An old split-flap board: the number drops out, the new one drops in, and
   the tile lights for a moment as it lands. */
function flipTo(id, val){
  var el = document.getElementById(id);
  if(!el || el.textContent === val) return;
  el.classList.remove('flip');
  void el.offsetWidth;                       // restart the animation
  el.textContent = val;
  el.classList.add('flip');
  var tile = el.parentNode;
  if(tile){
    tile.classList.remove('lit');
    void tile.offsetWidth;
    tile.classList.add('lit');
  }
}
/* A10 — these ran forever, including with the app in the background, where
   nobody can see the clock and the poll is pure battery. */
var tickTimer = setInterval(tickCountdown, 1000);
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden'){
    if(tickTimer){ clearInterval(tickTimer); tickTimer = null; }
    if(stripTimer){ clearInterval(stripTimer); stripTimer = null; }
  } else {
    if(!tickTimer){ tickTimer = setInterval(tickCountdown, 1000); tickCountdown(); }
    if(!stripTimer && !stripHeld && stripFaces.length > 1) stripTimer = setInterval(flipStrip, 7000);
    loadLive();
  }
});

/* the live bar — derived from time, because events have no 'live' status.
   An event counts as live from its start until LIVE_WINDOW_MS after it. */
async function loadLive(){
  var now = Date.now();
  var since = new Date(now - LIVE_WINDOW_MS).toISOString();
  var rows = await q("events_public?select=name,event_date,status,stream_platform"
    + "&event_date=gte." + since + "&order=event_date.desc&limit=5");
  if(!rows) return;
  var live = rows.filter(function(e){
    var t = new Date(e.event_date).getTime();
    return e.status !== 'completed' && t <= now && now - t < LIVE_WINDOW_MS;
  })[0];
  var bar = document.getElementById('livebar');
  if(!live){ bar.classList.remove('on'); return; }
  document.getElementById('live-name').textContent = live.name;
  bar.classList.add('on');
}
setInterval(function(){ if(document.visibilityState === 'visible') loadLive(); }, 5 * 60 * 1000);

/* ── THE STRIP ───────────────────────────────────────────────────────
   Priority: your own fight, then the feed, then the top headline. Whatever
   is available becomes a face; the strip flips between them on a slow timer
   and stops permanently the first time you touch it. */
var stripFaces = [], stripAt = 0, stripTimer = null, stripHeld = false;

async function loadStrip(){
  var el = document.getElementById('strip');
  if(!el) return;
  stripFaces = [];

  if(myBout){
    var when = new Date(myBout.event_date).toLocaleString('en-US',{ timeZone:'America/New_York',
      weekday:'short', month:'short', day:'numeric' });
    stripFaces.push({ mine:true, tab:'Next card',
      k: (myBout.is_title_fight ? (myBout.title_name || 'Title fight') : 'Your next fight')
         + ' · ' + when + (myBout.card_published ? '' : ' · not announced'),
      v: esc(myBout.my_name) + '<span class="x">VS</span>' + esc(myBout.opponent_name || 'TBA'),
      go: function(){ openSheet({ kind:'event', id: myBout.event_id }); } });
  }

  var feed = await loadFeedMessages();
  if(feed && feed.length){
    feed.slice(0,3).forEach(function(m){
      stripFaces.push({ tab:'Feed', k:'VGA Feed',
        v: '<b>' + esc(m.who) + '</b> · ' + esc(m.msg) });
    });
  }

  var news = await getNews();
  if(news && news.length){
    stripFaces.push({ tab:'News', k:'Latest',
      v: esc(news[0].headline),
      go: function(){ openSheet({ kind:'news', id: news[0].id }); } });
  }

  if(!stripFaces.length){
    stripFaces.push({ tab:'VGA', k:'The league', v:'Fight cards, rankings and the collection.' });
  }
  stripAt = 0;
  paintStrip();
  if(stripFaces.length > 1 && !stripTimer) stripTimer = setInterval(flipStrip, 7000);
}

/* The feed is the only thing in the app reading the OLD project. Any failure
   at all is silent and simply contributes no faces. */
async function loadFeedMessages(){
  try{
    var r = await fetch(SB_OLD + '/rest/v1/fighter_messages?select=*&active=eq.true'
      + '&order=created_at.desc&limit=6',
      { headers: { apikey: KEY_OLD, Authorization: 'Bearer ' + KEY_OLD } });
    if(!r.ok) return null;
    var d = await r.json();
    if(!Array.isArray(d)) return null;
    return d.map(function(m){
      return { who: m.fighter_name || m.name || 'VGA', msg: m.message || m.text || '' };
    }).filter(function(m){ return m.msg; });
  }catch(e){ return null; }
}

function paintStrip(){
  var el = document.getElementById('strip');
  if(!el || !stripFaces.length) return;
  var f = stripFaces[stripAt];
  el.classList.toggle('mine', !!f.mine);
  el.innerHTML = '<div class="face in">'
    + '<div class="body"><div class="k">' + esc(f.k) + '</div><div class="v">' + f.v + '</div></div>'
    + '<div class="tab"><span>' + esc(f.tab) + '</span></div></div>';
}

function flipStrip(){
  if(stripHeld || stripFaces.length < 2) return;
  var el = document.getElementById('strip');
  var face = el && el.querySelector('.face');
  if(!face) return;
  face.classList.remove('in'); face.classList.add('out');
  setTimeout(function(){
    stripAt = (stripAt + 1) % stripFaces.length;
    paintStrip();
  }, 260);
}

document.addEventListener('click', function(e){
  var st = e.target.closest('#strip');
  if(!st) return;
  // Touching it stops the rotation for good — a slot that moves under your
  // finger is worse than one that picked.
  stripHeld = true;
  if(stripTimer){ clearInterval(stripTimer); stripTimer = null; }
  var f = stripFaces[stripAt];
  if(f && f.go) f.go();
});

/* The same slot, three different people:
     - not signed in, or signed in and not a fighter  -> come and fight
     - a fighter with a bout coming                   -> that bout
     - a fighter with nothing booked                  -> get on the next card */
/* Signed out shows the Sign in pill; signed in shows the season chip back. */
/* The chip turns UBA -> GFL -> UBA, slow enough to read and to ignore. */
var sznAt = 0, sznTimer = null;
var SZN = ['UBA','GFL'];
function startSznRotate(){
  clearInterval(sznTimer);
  var el = document.getElementById('szn-txt');
  if(!el) return;
  sznTimer = setInterval(function(){
    if(!document.body.contains(el)) return;
    el.classList.add('out');
    setTimeout(function(){
      sznAt = (sznAt + 1) % SZN.length;
      el.textContent = SZN[sznAt];
      el.classList.remove('out'); el.classList.add('in');
      requestAnimationFrame(function(){ el.classList.remove('in'); });
    }, 340);
  }, 4200);
}

function renderHomeHeader(){
  var pill = document.getElementById('home-signin');
  var szn  = document.getElementById('home-szn');
  if(!pill || !szn) return;
  pill.hidden = !!me;
  szn.hidden  = !me;
  if(!szn.hidden) startSznRotate(); else clearInterval(sznTimer);
}

function renderJoinSlot(){
  var el = document.getElementById('join-slot');
  if(!el) return;

  // Your bout lives in the strip now, so this slot is only ever the
  // recruiting ask — and it disappears entirely for somebody already booked.
  if(myBout){ el.innerHTML = ''; return; }
  if(false){
    el.innerHTML = '<div class="mybout">'
      + '<div class="top2"><span class="k">'
      + esc(myBout.is_title_fight ? (myBout.title_name || 'Title fight') : 'Your next fight')
      + '</span>'
      // The card being unpublished is WHY this row exists, so it says so
      // rather than looking like the app is ahead of the announcement.
      + (myBout.card_published ? '' : '<span class="locked">Card not announced</span>')
      + '</div>'
      + '<div class="vs2">'
      + '<div class="who2"><div class="lbl2">You</div><div class="nm2">'+esc(myBout.my_name)+'</div></div>'
      + '<span class="x">VS</span>'
      + '<div class="who2 opp"><div class="lbl2">Opponent</div><div class="nm2">'
      + esc(myBout.opponent_name || 'TBA')+'</div></div>'
      + '</div>'
      + '<div class="when2"><span class="d2">'+esc(myBout.event_name)+' · '+esc(when)+' ET</span>'
      + '<span class="go3">Details</span></div></div>';
    return;
  }

  // NO STRIP, EVER. Telling a registered fighter to "sign up to be matched"
  // every single time they open the app is nagging, not information — they
  // already did the thing it is asking for. Signing in lives in the header
  // pill; signing up for a card lives in You, next to their own record where
  // it means something.
  el.innerHTML = '';
}

/* ── RANKINGS, the body of home ──────────────────────────────────────
   Two tabs off one section: the pound-for-pound order with records, and the
   UBAe standings. Champions carry a gold rule and a c, which is what let the
   separate champions rail go — the mark says it in place. */
var rankTab = 'p4p', rankLeague = 'pro', rankCache = {};

/* UBA is the pro league, GFL the amateur one — that is the only thing
   separating them in the data, and rankings_public carries both. GFL has
   divisional rankings but NO pound-for-pound list, so P4P is hidden rather
   than offered and empty; switching to GFL on P4P drops you into lightweight.
   Teams are gone: UBAe finishes after next week. */
document.getElementById('rtabs').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  this.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
  b.classList.add('on');
  rankTab = b.getAttribute('data-r');
  loadRanks();
});

document.getElementById('rleague').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  this.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
  b.classList.add('on');
  rankLeague = b.getAttribute('data-l');
  applyLeague();
  loadRanks();
});

function applyLeague(){
  var p4p = document.querySelector('.rtabs button[data-r="p4p"]');
  var gfl = rankLeague === 'amateur';
  p4p.classList.toggle('hide', gfl);
  if(gfl && rankTab === 'p4p'){
    rankTab = 'lightweight';
    document.querySelectorAll('.rtabs button').forEach(function(x){
      x.classList.toggle('on', x.getAttribute('data-r') === rankTab);
    });
  }
}

async function loadRanks(){
  var el = document.getElementById('ranks');
  if(!el) return;
  var key = rankLeague + ':' + rankTab;
  el.dataset.tab = key;                 // A6 — the guard below reads this
  if(rankCache[key]){ paintRanks(el, rankCache[key]); return; }
  el.innerHTML = '<div class="skel"></div><div class="skel" style="width:70%"></div>';

  var qs = "rankings_public?select=rank,fighter_name,fighter_slug,weight_class"
    + "&level=eq." + rankLeague + "&order=rank.asc&limit=15"
    + (rankTab === 'p4p' ? "&scope=eq.overall"
                         : "&scope=eq.weight_class&weight_class=eq." + rankTab);
  var rows = await q(qs);
  if(el.dataset.tab !== key) return;   // a newer tab won while this was in flight
  if(!rows){
    retryHandlers['ranks'] = loadRanks;
    el.innerHTML = failHTML("Couldn't load the rankings.", 'ranks'); return;
  }
  rankCache[key] = rows;
  paintRanks(el, rows);
}

function paintRanks(el, rows){
  if(!rows.length){ el.innerHTML = '<div class="empty">Nothing ranked here yet.</div>'; return; }
  el.innerHTML = rows.map(function(f){
    return '<a class="rrow" data-slug="'+esc(f.fighter_slug||'')+'"'
      + ' href="./f/'+encodeURIComponent(f.fighter_slug||'')+'.html">'
      + '<span class="no">#'+f.rank+'</span>'
      + '<span class="n">'+esc(f.fighter_name)+'</span></a>';
  }).join('');
}

/* ═══ NEWS ═══════════════════════════════════════════════════════════
   Reads news_public, a view that does not exist yet. Until it is created
   both of these render an honest empty state rather than a blank space. */
var newsCache = null, newsFailWasMissing = false, newsInFlight = null;
/* A8 — loadHomeNews, loadStrip and loadNews all want this at boot and none
   of them has resolved yet, so a plain cache check fired three identical
   requests. The promise itself is the cache. */
async function getNews(){
  if(newsCache !== null) return newsCache;
  if(newsInFlight) return newsInFlight;
  newsInFlight = (async function(){
    var res = await qStatus("news_public?select=id,kicker,headline,body,reporter,posted_at,graphic_url"
      + "&order=posted_at.desc&limit=25");
    // 404 means the view genuinely is not there; anything else means the
    // database was unreachable. Saying "not wired up yet" for an outage sends
    // whoever reads it off to build something that already exists.
    newsFailWasMissing = (res.code === 404);
    newsCache = res.rows;
    newsInFlight = null;
    return newsCache;
  })();
  return newsInFlight;
}
function newsFailure(retryId){
  if(newsFailWasMissing){
    return '<div class="empty"><b>News isn\'t wired up yet.</b><br>'
      + 'It needs a <code>news_public</code> view over posts with status = posted.</div>';
  }
  return failHTML("Couldn't load the news.", retryId);
}
async function loadHomeNews(){
  var el = document.getElementById('home-news');
  var rows = await getNews();
  if(!rows){ retryHandlers['homenews'] = function(){ newsCache = null; loadHomeNews(); };
    el.innerHTML = newsFailure('homenews'); return; }
  if(!rows.length){ el.innerHTML = '<div class="empty">No news posted yet.</div>'; return; }
  el.innerHTML = rows.slice(0,3).map(function(n){
    return '<div class="nw" data-news="'+esc(n.id)+'"><span class="th"></span><div>'
      + (n.kicker ? '<div class="k">'+esc(n.kicker)+'</div>' : '')
      + '<div class="h">'+esc(n.headline)+'</div>'
      + '<div class="d">'+esc(dstr(n.posted_at))+'</div></div></div>';
  }).join('');
}
async function loadNews(){
  var el = document.getElementById('news-body');
  var rows = await getNews();
  if(!rows){ retryHandlers['news'] = function(){ newsCache = null; loadNews(); };
    el.innerHTML = newsFailure('news'); return; }
  if(!rows.length){ el.innerHTML = '<div class="empty">No news posted yet.</div>'; return; }
  document.getElementById('news-count').textContent = rows.length + ' posts';
  var lead = rows[0], rest = rows.slice(1);
  var html = '<div class="lead" data-news="'+esc(lead.id)+'"><div class="gfx">'
    + (lead.graphic_url ? '<img src="'+esc(lead.graphic_url)+'" alt="'+esc(lead.headline)+'">'
        : '<span class="bar"></span>'
          + (lead.kicker ? '<span class="k">'+esc(lead.kicker)+'</span>' : '')
          + '<span class="h">'+esc(lead.headline)+'</span>')
    + '</div><div class="under"><div class="ld">'+esc(lead.reporter||'UBA')+' &middot; '
    + esc(dstr(lead.posted_at))+'</div><div class="rd">Read</div></div></div>'
    + '<div class="lab"><b>The wire</b><i></i></div>';
  html += rest.map(function(n){
    var first = (n.body||'').split('\n').filter(Boolean)[0] || '';
    if(first.length > 130) first = first.slice(0,130).replace(/\s+\S*$/,'') + '…';
    return '<div class="wrow" data-news="'+esc(n.id)+'">'
      + (n.kicker ? '<div class="k">'+esc(n.kicker)+'</div>' : '')
      + '<div class="h">'+esc(n.headline)+'</div>'
      + (first ? '<div class="b">'+esc(first)+'</div>' : '')
      + '<div class="d">'+esc(n.reporter||'UBA')+' &middot; '+esc(dstr(n.posted_at))+'</div></div>';
  }).join('');
  html += '<div class="foot">End of the wire &middot; '+rows.length+' posts</div>';
  el.innerHTML = html;
}

/* ═══ FIGHTERS ═══════════════════════════════════════════════════════ */
var allFighters = null, fFilter = 'all', fQuery = '', fShown = 40;

async function loadFighters(){
  if(allFighters) return;
  var rows = await q("fighter_cards?select=id,display_name,slug,weight_class,headline_wins,headline_losses,"
    + "headline_draws,rank,is_champion,profile_photo_url,team,nickname,status"
    + "&status=eq.active&order=rank.asc.nullslast&limit=600");
  if(!rows){
    retryHandlers['fighters'] = function(){ allFighters = null; loadFighters(); };
    document.getElementById('f-grid').innerHTML =
      '<div style="grid-column:span 2">' + failHTML("Couldn't reach the league database.", 'fighters') + '</div>';
    return;
  }
  allFighters = rows;
  document.getElementById('f-count').textContent = rows.length + ' active';
  renderFighters();
}
function filteredFighters(){
  var list = allFighters || [];
  if(fFilter === 'p4p')        list = list.filter(function(f){ return f.rank != null; });
  else if(fFilter === 'champ') list = list.filter(function(f){ return f.is_champion; });
  else if(fFilter !== 'all')   list = list.filter(function(f){ return f.weight_class === fFilter; });
  if(fQuery){
    var s = fQuery.toLowerCase();
    list = list.filter(function(f){
      return (f.display_name||'').toLowerCase().indexOf(s) > -1
          || (f.nickname||'').toLowerCase().indexOf(s) > -1
          || (f.team||'').toLowerCase().indexOf(s) > -1;
    });
  }
  return list.slice().sort(function(a,b){
    if(a.rank != null && b.rank != null) return a.rank - b.rank;
    if(a.rank != null) return -1;
    if(b.rank != null) return 1;
    return (b.headline_wins||0) - (a.headline_wins||0);
  });
}
function renderFighters(){
  var list = filteredFighters();
  var grid = document.getElementById('f-grid');
  if(!list.length){
    grid.innerHTML = '<div class="empty" style="grid-column:span 2">No fighters match that.</div>';
    document.getElementById('f-more').style.display = 'none';
    document.getElementById('f-foot').textContent = '';
    return;
  }
  grid.innerHTML = list.slice(0, fShown).map(function(f){
    // The initials sit underneath the photo rather than instead of it, so a
    // photo that 404s falls back to something instead of a blank card.
    var ini = '<span class="init">'+esc(initials(f.display_name))+'</span>';
    var art = f.profile_photo_url
      ? ini + '<img src="'+esc(f.profile_photo_url)+'" alt="" loading="lazy" '
            + 'onerror="this.remove()">'
      : ini;
    var belt = f.is_champion ? '<span class="bt">Champ</span>' : '';
    var rk = f.rank != null ? '<em>&middot; P4P '+f.rank+'</em>' : '<em>&middot; Unranked</em>';
    return '<a class="fcard'+(f.is_champion?' champ':'')+'" data-slug="'+esc(f.slug||'')+'"'
      + ' href="./f/'+encodeURIComponent(f.slug||'')+'.html">'
      + '<div class="foil"></div><div class="art">'+belt+art+'</div>'
      + '<div class="in"><div class="n">'+esc(f.display_name)+'</div>'
      + '<div class="w">'+esc(wc(f.weight_class))+'</div>'
      + '<div class="r">'+esc(recordOf(f))+' '+rk+'</div></div></a>';
  }).join('');
  var more = document.getElementById('f-more');
  more.style.display = list.length > fShown ? 'block' : 'none';
  document.getElementById('f-foot').textContent = 'Showing ' + Math.min(fShown, list.length) + ' of ' + list.length;
}
document.getElementById('f-chips').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  this.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
  b.classList.add('on');
  fFilter = b.getAttribute('data-f'); fShown = 40;
  document.getElementById('f-lab').textContent =
    fFilter === 'p4p' ? 'Pound for pound' : fFilter === 'champ' ? 'Champions'
    : fFilter === 'all' ? 'All fighters' : wc(fFilter);

  renderFighters();

});
document.getElementById('f-search').addEventListener('input', function(){

});
document.getElementById('f-more').addEventListener('click', function(){ fShown += 40; renderFighters(); });

/* ═══ SHEETS ═════════════════════════════════════════════════════════
   One element, a stack of entries. A fighter can be opened from inside an
   event, and the phone's back gesture unwinds one layer at a time instead
   of dumping you out of the app — which is what a single-entry sheet did.
   ═══════════════════════════════════════════════════════════════════════ */
var sheetStack = [];

function sheetEl(){ return document.getElementById('sheet'); }

function hashFor(entry){
  return entry.kind === 'fighter' ? '#f/' + entry.id
       : entry.kind === 'news'    ? '#n/' + entry.id
       : entry.kind === 'event'   ? '#e/' + entry.id : '';
}

function openSheet(entry){
  var el = sheetEl();
  sheetStack.push(entry);
  history.pushState({ depth: sheetStack.length }, '', hashFor(entry));
  el.classList.add('live');
  el.scrollTop = 0;
  el.setAttribute('aria-hidden','false');
  void el.offsetHeight;
  el.classList.add('shown');
  renderSheet(entry);
}

function closeSheet(){
  var el = sheetEl();
  sheetStack = [];
  el.classList.remove('shown');
  el.setAttribute('aria-hidden','true');
  setTimeout(function(){ if(!sheetStack.length) el.classList.remove('live'); }, 220);
}

window.addEventListener('popstate', function(){
  if(!sheetStack.length) return;
  sheetStack.pop();
  if(sheetStack.length){ sheetEl().scrollTop = 0; renderSheet(sheetStack[sheetStack.length - 1]); }
  else closeSheet();
});

function backButton(){
  return '<button class="back" data-sheet-back aria-label="Back"><svg><use href="#i-back"/></svg></button>';
}
document.addEventListener('click', function(e){
  if(e.target.closest('[data-sheet-back]')) history.back();
});

/* a failure that says so, and offers a way out */
function failHTML(msg, retryId){
  return '<div class="fail"><p>'+esc(msg)+'</p>'
    + '<button data-retry="'+esc(retryId)+'">Try again</button></div>';
}
var retryHandlers = {};
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-retry]');
  if(!b) return;
  var fn = retryHandlers[b.getAttribute('data-retry')];
  if(fn) fn();
});

function renderSheet(entry){
  if(entry.kind === 'fighter') return renderFighter(entry.id);
  if(entry.kind === 'news')    return renderArticle(entry.id);
  if(entry.kind === 'event')   return renderEvent(entry.id);
}

/* what opens a sheet */
document.addEventListener('click', function(e){
  if(e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  var f = e.target.closest('[data-slug]');
  if(f && f.getAttribute('data-slug')){ e.preventDefault(); openSheet({kind:'fighter', id:f.getAttribute('data-slug')}); return; }
  var n = e.target.closest('[data-news]');
  if(n){ e.preventDefault(); openSheet({kind:'news', id:n.getAttribute('data-news')}); return; }
  var ev = e.target.closest('[data-event]');
  if(ev){ e.preventDefault(); openSheet({kind:'event', id:ev.getAttribute('data-event')}); return; }
  var bt = e.target.closest('[data-bout]');
  if(bt && !e.target.closest('[data-slug]') && !e.target.closest('a')){
    bt.classList.toggle('open'); return;
  }
});
