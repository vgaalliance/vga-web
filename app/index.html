/* ── MY CAREER ────────────────────────────────────────────────────────
   The tab is a hub, not a profile. One career block that says who you are
   in the league, one strip for anything unanswered, then a list of rooms —
   each carrying its own live number on the right, so the whole screen can be
   read without tapping anything.

   Every value here comes from a table that already exists. There is no
   overall rating, no attributes and no skill points: those would have to be
   invented, and an invented number on a career screen is a number nobody can
   argue with or improve. Rank, record, purse, counts — all real.

   Seven reads go out together and each is unpacked on its own, because a dead
   shop must not cost somebody their record. */
var myContract = null, myOffers = null, myGame = null;

async function loadMe(){
  var el = document.getElementById('me-body');
  if(!el) return;
  var got = await Promise.all([
    qMe("my_profile?select=*&limit=1"),
    qMe("my_offers?select=*&order=event_date.asc"),
    qMe("my_contract?select=*"),
    qMe("my_game?select=*&limit=1"),
    qMe("my_cards?select=qty"),
    q("bet_pools_public?select=match_id"),
    q("shop_public?select=id")
  ]);
  if(!el.isConnected) return;
  var rows = got[0];
  myOffers   = got[1] || [];
  myContract = (got[2] || []).filter(function(c){ return c.status === 'active'; })[0] || null;
  var offered = (got[2] || []).filter(function(c){ return c.status === 'offered'; })[0] || null;
  myGame     = (got[3] || [])[0] || null;
  var cardQty = (got[4] || []).reduce(function(a, r){ return a + Number(r.qty || 0); }, 0);
  var pools   = (got[5] || []).length;
  var shopN   = (got[6] || []).length;

  if(!rows){
    retryHandlers['me'] = loadMe;
    el.innerHTML = failHTML("Couldn't load your career.", 'me'); return;
  }
  if(!rows.length){
    el.innerHTML = '<div class="empty"><b>No league account matched.</b><br>'
      + 'This Discord account has never used the bot, so there is nothing to show yet. '
      + 'Run any command in the server and it will appear here.</div>';
    return;
  }
  var p = rows[0];
  var szn = document.getElementById('me-szn');
  if(szn) szn.textContent = Number(p.vc_balance || 0).toLocaleString() + ' VC';

  /* THE CAREER BLOCK. A fan has no fighter, so the same block carries a
     different left-hand column rather than an empty ring where a rank goes. */
  var html = '<div class="crd"><span class="glow"></span><div class="cin"><div class="crt">';
  if(p.fighter_slug){
    html += '<div class="rnk" id="me-rank"><div class="h">RANKED</div>'
      + '<div class="num">&mdash;</div><div class="of">&nbsp;</div></div>';
  } else {
    html += '<div class="rnk fan"><div class="h">MEMBER</div>'
      + '<div class="ava">' + (window.__meAvatar
          ? '<img src="'+esc(window.__meAvatar)+'" alt="">' : '') + '</div></div>';
  }
  html += '<div class="who"><div class="nm4">'
    + esc(p.fighter_name || p.display_name || window.__meName || 'Signed in') + '</div>'
    + '<div class="sub4" id="me-sub4">'
    + esc(p.fighter_slug ? wc(p.weight_class) : 'Fan account')
    + '</div><div class="chips" id="me-chips"></div></div></div>'
    + '<div id="me-form"></div></div></div>';

  /* THE TWO STRIPS ARE PERMANENT. They were conditional at first — the idea
     being that a panel saying "you're all caught up" is furniture. That was
     wrong for this screen: the top of My Career has to be the SAME SHAPE every
     time you open it, or you cannot learn where anything is. A card that moves
     depending on your week is a card you re-read every week.

     What changes is the state, not the presence: a red count when something
     needs an answer, a muted strip when it does not. */
  var pending = myOffers.length, hasOffer = !!offered;
  html += '<div class="lab"><b>'
    + (pending || hasOffer ? 'Needs you now' : 'Your fights and deal')
    + '</b><i></i></div><div class="twin">';

  var evs = myOffers.map(function(o){ return o.event_name; })
    .filter(function(v,i,a){ return a.indexOf(v) === i; }).slice(0, 2).join(' \u00b7 ');
  html += '<div class="tw g' + (pending ? '' : ' quiet') + '" data-hub="offers"><div class="core">'
    + '<span class="tic">\u270D\uFE0F' + (pending ? '<b class="dot">' + pending + '</b>' : '') + '</span>'
    + '<div class="bd"><div class="t">' + (pending === 1 ? 'Offer' : 'Offers') + '</div>'
    + '<div class="s">' + (pending ? esc(evs) : 'Nothing waiting') + '</div></div></div></div>';

  html += '<div class="tw p' + (hasOffer ? '' : ' quiet') + '" data-hub="contract"><div class="core">'
    + '<span class="tic">\uD83D\uDCDC' + (hasOffer ? '<b class="dot">1</b>' : '') + '</span>'
    + '<div class="bd"><div class="t">Contract</div><div class="s">'
    + (hasOffer ? esc(String(offered.tier || 'New terms')) + ' offered'
       : myContract ? esc(String(myContract.tier || 'Signed')) + ' \u00b7 active'
       : 'None on file')
    + '</div></div></div></div></div>';

  /* THE ROOMS. Each carries its live number, so the list is a dashboard. */
  /* Offers and Contract are NOT repeated here — they are the two strips above,
     always present, so a row for each would be the same door twice. */
  html += '<div class="lab"><b>Everything else</b><i></i></div>'
    + mrow('\uD83C\uDCCF','cards','Your cards',
        cardQty ? cardQty + ' owned' : 'Nothing yet',
        cardQty ? String(cardQty) : '0', '', true)
    + mrow('\uD83D\uDED2','shop','Shop',
        shopN + (shopN === 1 ? ' item' : ' items') + ' for sale',
        Number(p.vc_balance||0).toLocaleString(), 'g')
    + mrow('\uD83C\uDFB2','betting','Betting',
        pools ? pools + (pools === 1 ? ' pool open' : ' pools open') : 'No market open',
        pools ? String(pools) : '\u2014', '', true)
    + mrow('\uD83D\uDCB0','wallet','Wallet','Purses, bonuses, every move',
        Number(p.vc_balance||0).toLocaleString() + ' VC', 'q')
    + mrow('\uD83C\uDFAE','game','Training',
        myGame ? 'Level ' + Number(myGame.level||1)
                 + (myGame.streak ? ' \u00b7 ' + myGame.streak + '-day streak' : '')
               : 'Tap in daily, earn VC',
        myGame ? 'LVL ' + Number(myGame.level||1) : 'NEW', 'q');

  html += '<div id="me-media"></div>';
  el.innerHTML = html;
  if(p.fighter_slug) loadCareer(p.fighter_slug);
}

/* One room. Tabs go to a tab, everything else opens a sheet, and the game is
   a different app on the same site. */
function mrow(icon, target, title, sub, val, cls, isTab){
  var attr = target === 'game' ? 'data-game="1"'
           : isTab ? 'data-goto="'+esc(target)+'"'
           : 'data-hub="'+esc(target)+'"';
  return '<div class="mrow" '+attr+'>'
    + '<span class="mic">'+icon+'</span>'
    + '<div style="flex:1;min-width:0"><div class="t">'+esc(title)+'</div>'
    + '<div class="s">'+esc(sub)+'</div></div>'
    + '<span class="rr"><span class="v '+(cls||'')+'">'+esc(val)+'</span>'
    + '<span class="c">&rsaquo;</span></span></div>';
}
document.addEventListener('click', function(e){
  if(e.target.closest('[data-game]')) location.href = '../game/index.html';
});

/* EVERY WRITE IN ONE PLACE. Each one disables its own button first, shows what
   the server actually said, and re-reads the screen it changed — never guesses
   the new state, because a screen that assumes it worked is how somebody ends
   up believing they accepted a fight they did not. */
document.addEventListener('click', async function(e){
  var b;

  if((b = e.target.closest('[data-answer]'))){
    /* Accept and tentative are freely changeable, so they go straight through.
       Declining takes you OFF a built card and the matchmakers act on it, so it
       gets the one confirm in the app. */
    if(b.getAttribute('data-answer') === 'declined'
       && !confirm('Decline this fight? The matchmakers will replace you on the card.')) return;
    busy(b, true, 'Saving…');
    var r = await rpc('app_answer_offer',
      { p_offer_id: b.getAttribute('data-offer'), p_answer: b.getAttribute('data-answer') });
    busy(b, false);
    var ans = b.getAttribute('data-answer');
    toast(r.ok ? (ans === 'accepted' ? 'Accepted. The league office can see it.'
                : ans === 'declined' ? 'Declined. You are off this card.'
                : 'Marked tentative.')
               : r.message, !r.ok);
    if(r.ok){ renderOffers(); loadMe(); }
    return;
  }

  if((b = e.target.closest('[data-decline]'))){
    if(!confirm('Turn down this contract? It cannot be re-opened from the app.')) return;
    busy(b, true, '…');
    var r0 = await rpc('app_decline_contract', { p_contract_id: b.getAttribute('data-decline') });
    busy(b, false);
    toast(r0.ok ? 'Turned down. You keep your current deal.' : r0.message, !r0.ok);
    if(r0.ok){ renderMyContract(); loadMe(); }
    return;
  }

  if((b = e.target.closest('[data-sign]'))){
    busy(b, true, 'Signing…');
    var r2 = await rpc('app_accept_contract', { p_contract_id: b.getAttribute('data-sign') });
    busy(b, false);
    toast(r2.ok ? 'Signed. ' + String(r2.tier || '').toUpperCase() + ' is your deal now.' : r2.message, !r2.ok);
    if(r2.ok){ renderMyContract(); loadMe(); }
    return;
  }

  if((b = e.target.closest('[data-buy]'))){
    busy(b, true, '…');
    var r3 = await rpc('app_buy_shop_item', { p_item_id: b.getAttribute('data-buy') });
    busy(b, false);
    toast(r3.ok ? (r3.message || 'Bought.') + ' Balance ' + Number(r3.new_balance||0).toLocaleString() + ' VC'
                : r3.message, !r3.ok);
    if(r3.ok){ renderShop(); loadMe(); }
    return;
  }

  /* Picking a corner does NOT place anything — it opens the stake row. Two
     taps to spend VC is deliberate; one tap is how a scroll becomes a bet. */
  if((b = e.target.closest('[data-bet]'))){
    var mid = b.getAttribute('data-bet'), side = b.getAttribute('data-side');
    var box = document.getElementById('stake-' + mid);
    if(!box) return;
    var same = box.getAttribute('data-side') === side && !box.hidden;
    box.parentNode.querySelectorAll('.pick').forEach(function(x){ x.classList.remove('on'); });
    if(same){ box.hidden = true; box.removeAttribute('data-side'); return; }
    b.classList.add('on');
    box.setAttribute('data-side', side);
    box.hidden = false;
    box.innerHTML = '<div class="chipsr">'
      + [100,500,1000,5000].map(function(v){
          return '<button class="chipb" data-stake="'+v+'">'+v.toLocaleString()+'</button>'; }).join('')
      + '</div>'
      + '<div class="stakerow">'
      + '<input class="amt" type="number" inputmode="numeric" min="1" step="1" placeholder="VC" '
      + 'aria-label="Amount in VC">'
      + '<button class="act place" data-place="'+esc(mid)+'">On ' + esc(b.textContent) + '</button>'
      + '</div>';
    return;
  }

  if((b = e.target.closest('[data-stake]'))){
    var inp = b.closest('.stake').querySelector('.amt');
    if(inp) inp.value = b.getAttribute('data-stake');
    return;
  }

  if((b = e.target.closest('[data-place]'))){
    var box2 = b.closest('.stake');
    var amt = Math.floor(Number(box2.querySelector('.amt').value || 0));
    if(!(amt > 0)){ toast('Enter an amount first.', true); return; }
    busy(b, true, 'Placing…');
    var r4 = await rpc('app_place_bet',
      { p_match_id: b.getAttribute('data-place'), p_side: box2.getAttribute('data-side'), p_amount: amt });
    busy(b, false);
    toast(r4.ok ? 'Bet placed. Balance ' + Number(r4.new_balance||0).toLocaleString() + ' VC' : r4.message, !r4.ok);
    if(r4.ok){
      var back = betEvent;
      await loadBetting();
      if(back) renderBetEvent(back);
      loadMe();
    }
    return;
  }
});

/* THE CAREER NUMBERS. Rank, record and the form bar are public — they come
   from fighter_cards and fighter_matches, not from a my_* view — so this is
   the same data anybody could read about you, arranged for you. */
async function loadCareer(slug){
  var card = await q("fighter_cards?select=id,wins,losses,draws,ko_wins,weight_class,rank,scope,"
    + "contract_tier,is_champion&slug=eq." + encodeURIComponent(slug) + "&limit=1");
  if(!card || !card.length) return;
  var f = card[0];

  var sub4 = document.getElementById('me-sub4');
  if(sub4) sub4.textContent = wc(f.weight_class) + (f.is_champion ? ' \u00b7 CHAMPION' : '');

  var chips = document.getElementById('me-chips');
  if(chips){
    chips.innerHTML =
      (f.contract_tier ? '<span class="chip">'+esc(String(f.contract_tier))+'</span>' : '')
      + '<span class="chip p">' + Number(f.wins||0) + '-' + Number(f.losses||0)
        + '-' + Number(f.draws||0) + '</span>'
      + (f.ko_wins ? '<span class="chip g">' + f.ko_wins + ' KO</span>' : '');
  }

  /* The rank needs a denominator or it means nothing — #12 of 41 is a
     position, #12 on its own is a number. */
  var rk = document.getElementById('me-rank');
  if(rk){
    if(f.rank){
      rk.querySelector('.num').textContent = f.rank;
      var peers = await q("rankings_public?select=rank&level=eq.pro&scope=eq.weight_class"
        + "&weight_class=eq." + encodeURIComponent(f.weight_class));
      var of = rk.querySelector('.of');
      if(of) of.textContent = peers && peers.length ? 'OF ' + peers.length : '\u00a0';
    } else {
      rk.classList.add('unranked');
      rk.querySelector('.h').textContent = 'RECORD';
      rk.querySelector('.num').textContent = Number(f.wins||0) + '-' + Number(f.losses||0);
      rk.querySelector('.of').textContent = 'UNRANKED';
    }
  }

  var hist = await q("fighter_matches?select=won,method,event_name,event_date,vod_link,status"
    + "&fighter_id=eq." + encodeURIComponent(f.id) + "&order=event_date.desc&limit=40");
  if(!hist) return;
  var done = hist.filter(function(m){ return m.status === 'completed'; });

  /* The form bar reads left-to-right in time order, which is the opposite of
     the query, so it is reversed once here rather than sorted twice. */
  var form = document.getElementById('me-form');
  if(form && done.length){
    var last = done.slice(0, 9).reverse();
    form.innerHTML = '<div class="fbar">' + last.map(function(m){
        return '<i class="' + (m.won === true ? 'w' : m.won === false ? 'l' : 'd') + '"></i>';
      }).join('') + '</div>'
      + '<div class="fbl"><span>Last ' + last.length
        + (last.length === 1 ? ' fight' : ' fights') + '</span>'
      + '<span>' + done.length + ' career</span></div>';
  }
  loadMyMedia(done);
}

/* WHAT YOU ARE IN. A poster or a VOD only counts if you were on that card,
   so this is driven by your own fight history rather than by the calendar. */
async function loadMyMedia(fights){
  var el = document.getElementById('me-media');
  if(!el || !fights.length) return;
  var names = fights.map(function(m){ return m.event_name; })
    .filter(function(v,i,a){ return v && a.indexOf(v) === i; }).slice(0, 12);
  if(!names.length) return;
  var inList = names.map(function(n){ return '"' + String(n).replace(/"/g,'') + '"'; }).join(',');
  var evs = await q("events_public?select=id,name,event_date,vod_link&name=in.(" + encodeURIComponent(inList) + ")");
  if(!el.isConnected || !evs || !evs.length) return;
  await loadPosters(evs.map(function(e){ return e.id; }));
  if(!el.isConnected) return;

  var byName = {};
  evs.forEach(function(e){ byName[e.name] = e; });
  var seen = {}, items = [];
  fights.forEach(function(m){
    var e = byName[m.event_name];
    if(!e || seen[e.id]) return;
    seen[e.id] = 1;
    var art = (posters[e.id] || [])[0];
    var vod = m.vod_link || e.vod_link;
    if(!art && !vod) return;
    items.push({ id: e.id, name: e.name, art: art, vod: vod,
      when: dstr(e.event_date, { year: 'numeric' }) });
  });
  if(!items.length) return;

  el.innerHTML = '<div class="lab"><b>You\'re in these</b><i></i><s>'
      + items.length + (items.length === 1 ? ' asset' : ' assets') + '</s></div>'
    + '<div class="mrail">' + items.slice(0, 8).map(function(it){
        return '<a class="mt"' + (it.vod
              ? ' href="' + esc(it.vod) + '" target="_blank" rel="noopener"' : '')
          + (it.vod ? '' : ' data-event="' + esc(it.id) + '"') + '>'
          + '<span class="th' + (it.art ? '' : ' noart') + '">'
          + (it.art ? '<img src="' + esc(it.art) + '" alt="" onerror="this.remove()">' : '')
          + (it.vod ? '<span class="pl">\u25B6</span>' : '')
          + '<span class="nm3">' + esc(it.name) + '</span></span>'
          + '<span class="cp">' + (it.vod ? 'VOD' : 'Poster') + ' \u00b7 ' + esc(it.when) + '</span>'
          + '</a>';
      }).join('') + '</div>';
}

/* ── ONE CARD, big ── the same slab at full size, plus what only matters
   when you are looking at a single print: every grade you hold, the lowest
   number, and how many exist at all. */
async function renderCard(cardId){
  var body = document.getElementById('sheet-body');
  var card = (binderAll || []).filter(function(c){ return c.card_id === cardId; })[0];
  var have = (binderCards || []).filter(function(c){ return c.card_id === cardId; })[0];
  if(!card){

/* ── TEARING A PACK ───────────────────────────────────────────────────
   The pack does not open when you tap it. It opens when you tear it, and the
   tear tracks your finger — that is the whole point of a sealed pack and the
   only moment in this app that is worth an animation.

   app_open_pack fires on COMPLETION, never on drag start: it marks the item
   used and mints prints, so a pack abandoned halfway has to stay sealed. The
   cost is a short wait after the tear, which the overlay says out loud. If the
   call fails the pack RESEALS rather than sitting torn open over nothing. */
function openTear(itemId, name){
  var el = document.getElementById('tear');
  if(!el){ el = document.createElement('div'); el.id = 'tear'; document.body.appendChild(el); }
  var colour = packColour(name), size = packSize(name);

  el.innerHTML = '<div class="tin">'
    + '<div class="tk" id="tk">' + esc(name) + '</div>'
    + '<div class="tpack" style="--pk:' + colour + '">'
      + '<div class="tguts">' + Array.from({length: Math.min(size,5)})
          .map(function(){ return '<i></i>'; }).join('') + '</div>'
      + '<div class="tbody" id="tb"><div class="tskin"></div>'
        + '<span class="tsz">' + size + '<em>cards</em></span></div>'
      + '<div class="ttop" id="tt"></div><span class="tnotch"></span>'
      + '<div class="tgrab" id="tg"></div>'
    + '</div>'
    + '<div class="thint" id="th">Drag the strip across &rarr;</div>'
    + '<button class="tclose" id="tx">Not now</button>'
    + '</div>';
  el.classList.add('live');
  void el.offsetWidth;
  el.classList.add('shown');
  wireTear(itemId);
  document.getElementById('tx').onclick = closeTear;
}
function closeTear(){
  var el = document.getElementById('tear');
  if(!el) return;
  el.classList.remove('shown');
  setTimeout(function(){ el.classList.remove('live'); el.innerHTML = ''; }, 240);
}

/* Z3: eased, and a flick finishes it. The tear is redrawn once per frame
   rather than once per pointer event — several of those fire between frames
   and repainting on each is what read as rough. */
function wireTear(itemId){
  var top = document.getElementById('tt'), body = document.getElementById('tb'),
      grab = document.getElementById('tg'), hint = document.getElementById('th'),
      kick = document.getElementById('tk');
  var DIST = 200, SNAP = 0.62;
  var target = 0, shown = 0, dragging = false, x0 = 0, raf = null, opened = false;
  var lastX = 0, lastT = 0, vel = 0;

  function paint(){
    var e = shown * shown * (3 - 2 * shown);
    top.style.transform = 'translate3d(' + (shown * 240) + 'px,' + (-e * 34) + 'px,0) rotate('
      + (e * 18) + 'deg)';
    top.style.opacity = String(1 - shown * 0.5);
    body.style.setProperty('--cut', (e * 32) + 'px');
  }
  function loop(){
    shown += (target - shown) * 0.18;
    if(Math.abs(target - shown) < 0.001) shown = target;
    paint();
    raf = (dragging || Math.abs(target - shown) > 0.001) ? requestAnimationFrame(loop) : null;
  }
  function kickRaf(){ if(!raf) raf = requestAnimationFrame(loop); }

  grab.addEventListener('pointerdown', function(ev){
    if(opened) return;
    dragging = true; x0 = ev.clientX; lastX = ev.clientX; lastT = performance.now(); vel = 0;
    try{ grab.setPointerCapture(ev.pointerId); }catch(e){}
    hint.style.opacity = '.2'; kickRaf();
  });
  grab.addEventListener('pointermove', function(ev){
    if(!dragging) return;
    var now = performance.now(), dt = now - lastT;
    if(dt > 0){ vel = (ev.clientX - lastX) / dt; lastX = ev.clientX; lastT = now; }
    target = Math.max(0, Math.min(1, (ev.clientX - x0) / DIST));
    kickRaf();
    if(target >= 1) finish();
  });
  function up(){
    if(!dragging) return;
    dragging = false;
    if(target >= SNAP || (vel > 0.9 && target > 0.12)) finish();
    else { target = 0; kickRaf(); }
  }
  grab.addEventListener('pointerup', up);
  grab.addEventListener('pointercancel', up);

  /* Undiscoverable gesture, so it offers a way through after a few seconds. */
  setTimeout(function(){
    if(opened || !document.getElementById('th')) return;
    hint.innerHTML = 'Drag the strip across &rarr; <button class="tapopen">or tap to open</button>';
    var t = hint.querySelector('.tapopen');
    if(t){ hint.style.pointerEvents = 'auto'; t.onclick = finish; }
  }, 3200);

  async function finish(){
    if(opened) return;
    opened = true; dragging = false;
    if(raf){ cancelAnimationFrame(raf); raf = null; }
    top.style.transition = 'transform .42s cubic-bezier(.3,0,.2,1),opacity .42s';
    top.style.transform = 'translate3d(320px,-96px,0) rotate(42deg)';
    top.style.opacity = '0';
    body.style.setProperty('--cut', '32px');
    hint.textContent = 'Opening\u2026';
    var r = await rpc('app_open_pack', { p_player_item_id: itemId });
    if(!r.ok){
      /* Reseal. A torn pack that never opened is worse than an error. */
      opened = false;
      top.style.transition = 'transform .3s,opacity .3s';
      top.style.transform = ''; top.style.opacity = '1';
      body.style.setProperty('--cut', '0px');
      shown = 0; target = 0;
      hint.textContent = 'Drag the strip across \u2192';
      toast(r.message || 'That pack could not be opened.', true);
      return;
    }
    kick.textContent = r.message === 'god' ? 'God pack' : 'Opened';
    setTimeout(function(){ showSpread(r.pulls, r.pity_hit); }, 240);
    loadBinder();
  }
}

/* ── THE SPREAD ── every card lands at once, the best pull comes forward,
   and the hand stays put while you go through it. An earlier cut re-laid the
   fan around whichever card was active, which threw the others off to one
   side; a real hand does not rearrange when you pull a card out of it. */
var RSORT = ['common','uncommon','rare','mystic','legendary','prismatic'];
function showSpread(pulls, pity){
  var list = (Array.isArray(pulls) ? pulls : []).map(function(c){
    return { n: c.fighter || c.name || c.display_name || 'Card',
             r: String(c.rarity || 'common'),
             p: c.print != null ? '#' + c.print : '',
             g: c.grade };
  });
  var el = document.getElementById('tear');
  if(!list.length){ toast('The pack came back empty. The league office has a bug.', true);
    closeTear(); return; }

  var active = 0;
  list.forEach(function(c, i){
    if(RSORT.indexOf(c.r) > RSORT.indexOf(list[active].r)) active = i; });
  var bestIdx = active;

  el.innerHTML = '<div class="sin">'
    + '<div class="skick" id="sk">' + list.length + (list.length === 1 ? ' card' : ' cards')
      + (pity ? ' \u00b7 pity pull' : '') + '</div>'
    + '<div class="sfan" id="sf">' + list.map(function(c){
        var holo = RSORT.indexOf(c.r) >= 3;
        return '<div class="scard r-' + esc(c.r) + (holo ? ' holo' : '') + '">'
          + (holo ? '<span class="shit">' + esc(c.r) + '</span>' : '')
          + '<div class="snm">' + esc(c.n) + '</div>'
          + '<div class="sft">' + esc(c.p) + (c.g != null ? ' \u00b7 PSA ' + c.g : '') + '</div></div>';
      }).join('') + '</div>'
    + '<div class="sdock"><div><div class="sdn" id="sdn"></div>'
      + '<div class="sdm" id="sdm"></div>'
      + '<div class="sdots" id="sdots">' + list.map(function(){ return '<i></i>'; }).join('') + '</div></div>'
      + '<button class="act yes sdone" id="sdone">Into the binder</button></div>'
    + '</div>';

  var cards = [].slice.call(el.querySelectorAll('.scard'));
  function slot(i){
    var pos = i - (list.length - 1) / 2;
    return { x: pos * 48, y: Math.abs(pos) * 11, rot: pos * 7.5 };
  }
  function layout(){
    cards.forEach(function(c, i){
      var sl = slot(i);
      if(i === active){
        c.classList.add('up');
        c.style.transform = 'translate(' + (sl.x * 0.18) + 'px,-74px) rotate(0deg) scale(1.4)';
        c.style.opacity = '1'; c.style.zIndex = 20;
      } else {
        c.classList.remove('up');
        c.style.transform = 'translate(' + sl.x + 'px,' + sl.y + 'px) rotate(' + sl.rot + 'deg) scale(.92)';
        c.style.opacity = String(0.82 - Math.abs(i - active) * 0.07);
        c.style.zIndex = 10 - Math.abs(i - active);
      }
    });
    var c = list[active];
    document.getElementById('sdn').textContent = c.n;
    document.getElementById('sdm').textContent = c.r + (c.p ? ' \u00b7 ' + c.p : '')
      + (c.g != null ? ' \u00b7 PSA ' + c.g : '');
    [].slice.call(el.querySelectorAll('.sdots i')).forEach(function(d, i){
      d.classList.toggle('on', i === active); });
  }
  function setActive(i){ active = Math.max(0, Math.min(list.length - 1, i)); layout(); }

  cards.forEach(function(c, i){
    c.style.transform = 'translate(0,120px) rotate(0deg) scale(.55)';
    c.style.opacity = '0';
    c.addEventListener('click', function(){ setActive(i); });
    setTimeout(function(){
      var sl = slot(i);
      c.style.opacity = '1';
      c.style.transform = 'translate(' + sl.x + 'px,' + sl.y + 'px) rotate(' + sl.rot + 'deg) scale(.92)';
    }, 70 + i * 85);
  });
  setTimeout(function(){
    document.getElementById('sk').textContent = list.length === 1 ? 'Your card' : 'Best pull';
    setActive(bestIdx);
  }, 70 + list.length * 85 + 240);

  /* swipe the hand */
  var fan = document.getElementById('sf'), x0 = null;
  fan.addEventListener('pointerdown', function(e){ x0 = e.clientX; });
  fan.addEventListener('pointermove', function(e){
    if(x0 === null) return;
    var dx = e.clientX - x0;
    if(Math.abs(dx) > 46){ setActive(active + (dx < 0 ? 1 : -1)); x0 = e.clientX; }
  });
  function end(){ x0 = null; }
  fan.addEventListener('pointerup', end);
  fan.addEventListener('pointercancel', end);

  document.getElementById('sdone').onclick = function(){ closeTear(); loadBinder(); };
}

    me ? qMe("my_bets?select=*&order=placed_at.desc") : Promise.resolve([]),
    me ? qMe("my_profile?select=vc_balance&limit=1") : Promise.resolve([]),
    q("events_public?select=id,name,event_date,status&order=event_date.asc&limit=30")
  ]);
  if(!el.isConnected) return;
  if(!got[0]){
    retryHandlers['bet'] = loadBetting;
    el.innerHTML = failHTML("Couldn't load the pools.", 'bet'); return;
  }
  betPools = got[0];
  myBets   = got[1] || [];
  var chip = document.getElementById('bet-vc');
  if(chip && got[2] && got[2].length)
    chip.textContent = Number(got[2][0].vc_balance||0).toLocaleString() + ' VC';

  /* An event with no pool yet is still worth listing — "opens when the card is
     published" is a better empty state than "no market is open", because there
     is always a next card. */
  var upcoming = (got[3] || []).filter(function(e){
    return !eventIsOver(e) && new Date(e.event_date).getTime() > Date.now() - 6*3600*1000; });

  betEvent = null;
  renderBetLevel(upcoming);
}

function poolsFor(eventId){
  return (betPools || []).filter(function(p){ return p.event_id === eventId; });
}

/* ── level one: your money, then the cards ── */
function renderBetLevel(upcoming){
  var el = document.getElementById('bet-list');
  if(!el) return;

  var open   = (myBets || []).filter(function(b){ return b.state === 'open'; });
  var locked = (myBets || []).filter(function(b){ return b.state === 'locked'; });
  var live   = open.concat(locked);
  var riding = live.reduce(function(n,b){ return n + Number(b.amount||0); }, 0);

  var evIds = [];
  (betPools || []).forEach(function(p){ if(evIds.indexOf(p.event_id) === -1) evIds.push(p.event_id); });

  var html = '', heroEv = null;
  if(me && riding){ html += heroHTML(riding, live); }
  else {
    var nx = nextHTML(evIds, upcoming);
    html += nx.html; heroEv = nx.eventId;
  }

  /* Locked first — that is the money you cannot touch, on a fight happening
     right now. Then what is still open and still moveable. */
  html += stripsHTML(locked, false) + stripsHTML(open, true);

  if(evIds.length){
    html += '<div class="lab"><b>Place your bets</b><i></i><s>'
      + evIds.length + (evIds.length === 1 ? ' card' : ' cards') + '</s></div>';
  } else if(!upcoming.length){
    html += '<div class="empty"><b>Nothing is scheduled.</b><br>'
      + 'Pools open the moment a card is published.</div>';
  }

  evIds.forEach(function(id){
    var ps = poolsFor(id);
    var pool = ps.reduce(function(n,p){ return n + Number(p.pool||0); }, 0);
    var bets = ps.reduce(function(n,p){ return n + Number(p.bets||0); }, 0);
    var mine = (myBets || []).filter(function(b){
      return b.event_id === id && b.state !== 'settled'; }).length;
    html += '<div class="evbet" data-bevent="'+esc(id)+'">'
      + '<div class="eb1"><div class="en2">'+esc(ps[0].event_name || 'Event')+'</div>'
      + '<div class="es2">'+ps.length+(ps.length===1?' market':' markets')+' \u00b7 '
      + pool.toLocaleString()+' VC in the pools \u00b7 '+bets+(bets===1?' bet':' bets')+'</div></div>'
      + (mine ? '<span class="minetag">'+mine+' yours</span>' : '')
      + '<span class="chev">&rsaquo;</span></div>';
  });

  /* cards with no market yet */
  var waiting = upcoming.filter(function(e){
    return evIds.indexOf(e.id) === -1 && e.id !== heroEv; }).slice(0, 4);
  if(waiting.length){
    html += '<div class="lab"><b>Not open yet</b><i></i></div>'
      + waiting.map(function(e){
          var when = new Date(e.event_date).toLocaleString('en-US',{ timeZone:'America/New_York',
            weekday:'short', month:'short', day:'numeric' });
          return '<div class="evbet dim"><div class="eb1"><div class="en2">'+esc(e.name)+'</div>'
            + '<div class="es2">'+esc(when)
            + ' \u00b7 opens when the card is published</div></div></div>';
        }).join('');
  }

  /* The record only earns its space when there is nothing riding. With live
     bets on screen, all-time numbers are the least interesting thing here. */
  if(me && !riding) html += recordHTML();

  html += '<div class="foot">Pari-mutuel &middot; no rake &middot; the price moves until the bell</div>';
  el.innerHTML = html;
}

/* The rolling number. Both figures are padded to the same width with figure
   spaces so the columns line up — otherwise 800 rolling into 1,240 shifts every
   digit sideways mid-roll. */
function odoHTML(a, b){
  var w = Math.max(a.length, b.length), i;
  while(a.length < w) a = '\u2007' + a;
  while(b.length < w) b = '\u2007' + b;
  var out = '';
  for(i = 0; i < w; i++){
    out += '<span class="dig"><u style="animation-delay:'+(i*55)+'ms">'
      + '<i class="a">'+esc(a[i])+'</i><i class="b">'+esc(b[i])+'</i></u></span>';
  }
  return out;
}

function heroHTML(riding, live){
  var ret = live.reduce(function(n,b){
    var p = (betPools || []).filter(function(x){ return x.match_id === b.match_id; })[0];
    return n + Math.round(Number(b.amount||0) * livePays(p, b));
  }, 0);
  var nOpen = live.filter(function(b){ return b.state === 'open'; }).length;
  return '<div class="bhero" data-hub="mybets">'
    + '<div class="lin"><span class="a">Riding right now</span><span class="b">Pays out</span></div>'
    + '<div class="num">' + odoHTML(riding.toLocaleString(), ret.toLocaleString())
    + '<span class="vcx">VC</span></div>'
    + '<div class="lin two"><span class="a">'+live.length+(live.length===1?' bet':' bets')
    + ' \u00b7 '+(live.length - nOpen)+' locked</span>'
    + '<span class="b">If they all land</span></div>'
    + '<span class="chev">&rsaquo;</span></div>';
}

/* Nothing riding. The block points at the next card instead, and holds still. */
function nextHTML(evIds, upcoming){
  var first = evIds.length ? poolsFor(evIds[0]) : null;
  if(first && first.length){
    var pot = first.reduce(function(n,p){ return n + Number(p.pool||0); }, 0);
    return { eventId: evIds[0], html: '<div class="bhero still" data-bevent="'+esc(evIds[0])+'">'
      + '<div class="lin"><span>Open now</span></div>'
      + '<div class="nx">'+esc(first[0].event_name || 'Next card')+'</div>'
      + '<div class="lin two"><span>'+first.length+(first.length===1?' market':' markets')
      + ' \u00b7 '+pot.toLocaleString()+' VC in the pools</span></div>'
      + '<span class="chev">&rsaquo;</span></div>' };
  }
  var nx = (upcoming || [])[0];
  if(!nx) return { eventId: null, html: '' };
  return { eventId: nx.id, html: '<div class="bhero still">'
    + '<div class="lin"><span>Next card</span></div>'
    + '<div class="nx">'+esc(nx.name)+'</div>'
    + '<div class="lin two"><span>'+esc(dstr(nx.event_date, { weekday:'short' }))
    + ' \u00b7 pools open when the card is published</span></div></div>' };
}

/* One strip per event. Tapping a pill goes to that card's board, which is the
   only place the bet can be read in full. */
function stripsHTML(bets, isOpen){
  if(!bets.length) return '';
  var order = [], byEv = {};
  bets.forEach(function(b){
    var k = b.event_id || 'x';
    if(!byEv[k]){ byEv[k] = []; order.push(k); }
    byEv[k].push(b);
  });
  return order.map(function(k){
    var rows = byEv[k];
    var sum  = rows.reduce(function(n,b){ return n + Number(b.amount||0); }, 0);
    var name = rows[0].event_name || 'Event';
    return '<div class="bstrip'+(isOpen ? ' live2' : '')+'">'
      + '<div class="eh"><span class="dot"></span>'
      + esc(name) + (isOpen ? ' \u2014 still open' : ' \u2014 on now')
      + '<s>'+rows.length+(rows.length===1?' bet':' bets')+' \u00b7 '+sum.toLocaleString()+'</s></div>'
      + '<div class="row">' + rows.map(function(b){
          var p = (betPools || []).filter(function(x){ return x.match_id === b.match_id; })[0];
          var pays = isOpen ? Math.round(Number(b.amount||0) * livePays(p, b))
                            : Math.round(Number(b.amount||0) * Number(b.odds||1));
          return '<div class="bpill'+(isOpen ? ' open2' : '')+'" data-bevent="'+esc(b.event_id||'')+'">'
            + '<div class="l"><b>'+esc(b.pick_name || 'Your pick')+'</b>'
            + '<s>'+(b.bout_number ? 'BOUT '+b.bout_number : (isOpen ? 'OPEN' : 'LOCKED'))+'</s></div>'
            + '<div class="r"><b>'+Number(b.amount||0).toLocaleString()+'</b>'
            + '<s>\u2192 '+pays.toLocaleString()+'</s></div></div>';
        }).join('') + '</div></div>';
  }).join('');
}

function recordHTML(){
  var done = (myBets || []).filter(function(b){ return b.bet_status !== 'placed'; });
  if(!done.length) return '';
  var won = done.filter(function(b){ return b.bet_status === 'won'; }).length;
  var net = done.reduce(function(n,b){
    return n + Number(b.payout_amount||0) - Number(b.amount||0); }, 0);
  var hit = Math.round(won / done.length * 100);
  return '<div class="lab"><b>Your record</b><i></i><s>all time</s></div>'
    + '<div class="brec" data-hub="mybets">'
    + '<div><b>'+done.length.toLocaleString()+'</b><s>Settled</s></div>'
    + '<div><b>'+hit+'%</b><s>Hit rate</s></div>'
    + '<div><b style="color:'+(net >= 0 ? '#6EE7B7' : '#FF8A80')+'">'
    + (net >= 0 ? '+' : '') + net.toLocaleString()+'</b><s>Net VC</s></div></div>';
}

/* What a stake pays AT THE CURRENT POOL. Pari-mutuel: your side's share of the
   whole pool. The stored `odds` is a snapshot from placement and settlement
   overwrites it, so showing that number would be showing history. */
function livePays(pool, bet){
  if(!pool) return Number(bet.odds || 1);
  var a = Number(pool.total_a||0), b = Number(pool.total_b||0), tot = a + b;
  var side = bet.pick_name === pool.side_a ? a : b;
  return side > 0 ? tot / side : 1;
}

/* ── level two: one card's markets ── */
function renderBetEvent(eventId){
  var el = document.getElementById('bet-list');
  if(!el) return;
  betEvent = eventId;
  var ps = poolsFor(eventId).sort(function(a,b){
    return (b.bout_number||0) - (a.bout_number||0); });
  if(!ps.length){ renderBetLevel([]); return; }

  el.innerHTML = '<button class="betback" data-bback>&lsaquo; All cards</button>'
    + '<div class="lab"><b>'+esc(ps[0].event_name)+'</b><i></i><s>'
    + ps.length+(ps.length===1?' market':' markets')+'</s></div>'
    + ps.map(function(r){ return boardHTML(r); }).join('')
    + '<div class="foot">Your stake shows on the side you backed &middot; prices move until the bell</div>';
  var bk = el.querySelector('[data-bback]');
  if(bk) bk.onclick = function(){ loadBetting(); };
}

function boardHTML(r){
  var a = Number(r.total_a||0), b = Number(r.total_b||0), tot = a + b;
  var pa = tot ? Math.round(a/tot*100) : 50;
  var pays = function(x){ return x > 0 ? (tot/x).toFixed(2) : '\u2014'; };
  var mine = (myBets || []).filter(function(x){
    return x.match_id === r.match_id && x.state !== 'settled'; });
  var onA = mine.filter(function(x){ return x.pick_name === r.side_a; })
    .reduce(function(n,x){ return n + Number(x.amount||0); }, 0);
  var onB = mine.filter(function(x){ return x.pick_name === r.side_b; })
    .reduce(function(n,x){ return n + Number(x.amount||0); }, 0);

  function row(name, amt, pct, total, side){
    return '<div class="brow'+(amt ? ' yours' : '')+'">'
      + '<span class="who">'+esc(name || side.toUpperCase())+'</span>'
      + '<span class="pcts"><span class="pb"><i style="width:'+pct+'%"></i></span>'
      + '<span class="pn">'+pct+'%</span></span>'
      + '<span class="odd">'+pays(total)+'<em>pays now</em></span></div>'
      + (amt ? '<div class="stakeline">you have <b>'+amt.toLocaleString()+'</b> here'
          + '<s>&rarr; '+Math.round(amt * (total > 0 ? tot/total : 1)).toLocaleString()+'</s></div>' : '');
  }

  return '<div class="board'+(mine.length ? ' mine' : '')+'">'
    + '<div class="bh"><span>Bout '+(r.bout_number || '\u2014')+'</span>'
    + '<s>'+Number(r.pool||0).toLocaleString()+' VC \u00b7 '+Number(r.bets||0)+' bets</s></div>'
    + row(r.side_a, onA, pa, a, 'a')
    + row(r.side_b, onB, 100 - pa, b, 'b')
    + (me ? '<div class="picks">'
        + '<button class="act pick" data-bet="'+esc(r.match_id)+'" data-side="a">'
        + esc(r.side_a||'A')+'</button>'
        + '<button class="act pick" data-bet="'+esc(r.match_id)+'" data-side="b">'
        + esc(r.side_b||'B')+'</button></div>'
        + '<div class="stake" id="stake-'+esc(r.match_id)+'" hidden></div>'
      : '<div class="picks off">Sign in on the You tab to bet</div>')
    + '</div>';
}

/* ── the My bets sheet ── */

            : b.bet_status === 'void' ? 'refund'
            : Number(b.amount||0).toLocaleString();
          var under = b.bet_status === 'won' ? 'from ' + Number(b.amount||0).toLocaleString()
            : b.bet_status === 'lost' ? 'lost'
            : b.bet_status === 'void' ? Number(b.amount||0).toLocaleString() + ' back'
            : 'pays ' + Math.round(Number(b.amount||0) * Number(b.odds||1)).toLocaleString();
          return '<div class="mbet'+cls+'"><span class="st2"></span>'

            + ' \u00b7 ' + esc(dstr(b.placed_at)) + '</div></div>'

  el.innerHTML = '<div class="summ">'

      + '<div><b class="'+(settled && won.length/settled >= .5 ? 'g' : '')+'">'
        + (settled ? Math.round(won.length/settled*100) + '%' : '\u2014') + '</b><s>hit rate</s></div>'
      + '<div><b class="'+(net >= 0 ? 'g' : 'r')+'">'+(net >= 0 ? '+' : '')
        + net.toLocaleString()+'</b><s>net VC</s></div></div>'
    + group('Open', rows.filter(function(b){ return b.state === 'open'; }))
    + group('Locked', rows.filter(function(b){ return b.state === 'locked'; }), 'settling at the bell')
    + group('Settled', rows.filter(function(b){ return b.state === 'settled'; }).slice(0, 40),
        settled + ' resolved')
    + '<div class="foot">Pari-mutuel &middot; no rake &middot; a price is only final once it settles</div>';
}

/* ── THE BINDER ───────────────────────────────────────────────────────
   Every card is a graded slab: a purple-stroked label carrying set, name,
   serial and barcode, with the grade in its own stroked column — the shape a
   PSA label has, because the league already grades every print 1-10 and
   nothing was showing it.

   Three things this screen has to get right that a plain grid does not:

   1. THE CHECKLIST. cards_public lists all 107 cards; my_cards lists the ones
      you hold. What you are MISSING is the whole point of a binder, so the
      two are merged and the gaps render dark-but-named rather than absent.
   2. DUPLICATES ARE A FAN, CAPPED AT THREE. Somebody in this league owns 44
      copies of one card. A fan of 44 is not a fan, it is a stack — three
      visible, the rest a count on the back one.
   3. NOTHING ANIMATES OFF SCREEN. The prism grating is a running animation on
      every card; a hundred of them is a warm phone for no reason. An observer
      turns the foil on as a card scrolls in and off as it leaves. */
var binderCards = null, binderAll = null, binderSet = 'all', binderPacks = null, binderShop = null;
var foilWatcher = null;

function renderCards(){
  var el = document.getElementById('cards-body');
  if(!me){
    el.innerHTML = '<div class="top"><div class="ttl">CARDS</div></div>'
      + gateHTML('OPEN YOUR BINDER', 'Your collection is already waiting — sign in to see it.')
      + '<div class="lab"><b>What\'s in there</b><i></i></div>'
      + perk('i-cards','107 cards across 4 sets','Every print graded 1 to 10')
      + perk('i-book','Six rarities','Common through prismatic — only 3 prismatics exist')
      + perk('i-game','Rip packs here','Tear the wrapper, see what fell out');
    return;
  }
  el.innerHTML = '<div class="top"><div class="ttl">CARDS</div>'
    + '<div class="vcchip" id="cards-vc">&nbsp;</div></div>'
    + '<div id="binder"><div class="skel" style="height:120px"></div>'
    + '<div class="skel" style="width:60%"></div></div>';
  loadBinder();
}

async function loadBinder(){
  var el = document.getElementById('binder');
  if(!el) return;
  var got = await Promise.all([
    qMe("my_cards?select=*"),
    q("cards_public?select=*"),
    qMe("my_items?select=*&order=acquired_at.desc"),
    qMe("my_profile?select=vc_balance&limit=1"),
    q("shop_public?select=id,name,vc_price,effect_kind")
  ]);
  if(!el.isConnected) return;
  if(!got[0] || !got[1]){
    retryHandlers['binder'] = loadBinder;
    el.innerHTML = failHTML("Couldn't open your binder.", 'binder'); return;
  }
  binderCards = got[0];
  binderAll   = got[1];
  binderPacks = (got[2] || []).filter(function(i){
    return i.effect_kind === 'pack' || i.effect_kind === 'crate'; });
  binderShop = (got[4] || []).filter(function(i){
    return i.effect_kind === 'pack' || i.effect_kind === 'crate'; });

  var chip = document.getElementById('cards-vc');
  if(chip && got[3] && got[3].length)
    chip.textContent = Number(got[3][0].vc_balance||0).toLocaleString() + ' VC';

  renderBinder();
}

var RAR = ['common','uncommon','rare','mystic','legendary','prismatic'];

function renderBinder(){
  var el = document.getElementById('binder');
  if(!el || !binderAll) return;

  var mine = {};
  (binderCards || []).forEach(function(c){ mine[c.card_id] = c; });
  var prints = (binderCards || []).reduce(function(n,c){ return n + Number(c.qty||0); }, 0);
  var owned  = (binderCards || []).length;
  var pct    = binderAll.length ? Math.round(owned / binderAll.length * 100) : 0;

  /* Group by SET, because that is how a card collection is organised in every
     game that has ever done this well — and because it puts the pack you can
     buy next to the specific hole it fills. "Fills 13 gaps" is a reason to
     spend 2,500 VC; "First Edition Pack, 2,500 VC" is a price tag. */
  var sets = [];
  binderAll.forEach(function(c){
    var code = c.set_code || 'OTHER';
    var hit = sets.filter(function(x){ return x.code === code; })[0];
    if(!hit){ hit = { code:code, name:c.set_name || code, cards:[], have:0 }; sets.push(hit); }
    hit.cards.push(c);
    if(mine[c.card_id]) hit.have++;
  });
  sets.forEach(function(x){
    /* Yours first, then rarest, so a shelf opens on what you are proudest of
       and trails off into what you are missing. */
    x.cards.sort(function(a,b){
      var oa = mine[a.card_id] ? 0 : 1, ob = mine[b.card_id] ? 0 : 1;
      if(oa !== ob) return oa - ob;
      var ra = RAR.indexOf(b.rarity), rb = RAR.indexOf(a.rarity);
      if(ra !== rb) return ra - rb;
      return String(a.name||'').localeCompare(String(b.name||''));
    });
  });
  /* Closest to finished first — the shelf you are most likely to act on. */
  sets.sort(function(a,b){
    return (b.have / (b.cards.length||1)) - (a.have / (a.cards.length||1)); });
  var done = sets.filter(function(x){ return x.have === x.cards.length; }).length;

  /* Which set is the best next buy: most complete WITHOUT being finished. */
  var closest = sets.filter(function(x){ return x.have < x.cards.length; })[0];

  var html = ''
    + '<div class="chase">'
      + '<div class="cr">'
        + '<span class="ring" style="background:conic-gradient(#A78BFA 0 '+pct+'%,rgba(255,255,255,.1) '+pct+'% 100%)">'
        + '<i>'+pct+'%</i></span>'
        + '<div class="cn"><div class="big">'+owned+'<em>/'+binderAll.length+'</em></div>'
        + '<div class="s">'+(binderAll.length - owned)+' to go \u00b7 '
        + done+' of '+sets.length+' sets done \u00b7 '+prints+' prints</div></div>'
      + '</div>'
    + '</div>';
  /* The per-set bars are gone. They repeated what every shelf heading already
     says two inches below, and they said it in set CODES — "S2-TB", "UBAE26-SPR"
     — which are database keys, not names anybody reads. One number that goes
     up is the job; the shelves carry the detail. */

  if(binderPacks && binderPacks.length) html += packsHTML();

  /* One shelf per set: the cards, then the pack that fills them. */
  html += sets.map(function(x){
    var missing = x.cards.length - x.have;
    return '<div class="lab"><b>'+esc(x.name)+'</b><i></i><s>'+x.have+' / '+x.cards.length+'</s></div>'
      + '<div class="shelf">' + x.cards.map(function(c){
          return slabHTML(c, mine[c.card_id]); }).join('') + '</div>'
      + shelfBuy(x, missing);
  }).join('')
  + '<div class="foot">Tap a card to open it &middot; every print is graded 1 to 10</div>';

  el.innerHTML = html;
  /* A sideways scroll moves cards in and out of view without the panel
     scrolling at all, so the shelves have to say when they move. */
  el.querySelectorAll('.shelf').forEach(function(sh){
    var t = null;
    sh.addEventListener('scroll', function(){
      clearTimeout(t); t = setTimeout(watchFoil, 90);
    }, { passive: true });
  });
  watchFoil();
}

/* The pack that fills THIS shelf. It says how many holes it can close, which
   is the only number that makes a price mean anything. If you already hold
   one sealed, the row offers to rip instead of to buy — you do not need to be
   sold something you own. */
function shelfBuy(set, missing){
  var fits = setMatcher(set);
  var sealed = (binderPacks || []).filter(function(i){
    return fits(String(i.name || '').toLowerCase()); });
  var forSale = (binderShop || []).filter(function(i){
    var n = String(i.name || '').toLowerCase();
    return fits(n) && n.indexOf('single') === -1; })
    .sort(function(a,b){ return a.vc_price - b.vc_price; })[0];

  if(!missing) return '<div class="shelfbuy done">Set complete</div>';
  if(sealed.length){
    return '<div class="shelfbuy hot"><div class="nm">'+esc(sealed[0].name)
      + '<s>'+sealed.length+' sealed \u00b7 '+missing+' still missing</s></div>'
      + '<button class="act rip" data-rip="'+esc(sealed[0].player_item_id)+'">Rip it</button></div>';
  }
  if(!forSale) return '';
  return '<div class="shelfbuy"><div class="nm">'+esc(forSale.name)
    + '<s>'+missing+' of these you don\'t own yet</s></div>'
    + '<button class="act buy" data-buy="'+esc(forSale.id)+'">'
    + Number(forSale.vc_price||0).toLocaleString()+' VC</button></div>';
}

/* Shop items are named for their set in prose ("GFL Throwback 1 Pack"), not
   by set_code, so matching is on a word rather than a key. Crude, and it has
   to be: effect_data carries the real link and effect_data is deliberately not
   published. If a set is ever renamed this goes quiet rather than wrong. */
/* Two sets have "Throwback" in the name — "Throwback: The Ring Era" and "GFL
   Throwback 1" — so a substring test put the GFL pack on the Ring Era shelf
   and on its own. A match returns a test, not a word, and the plain Throwback
   one has to say what it is NOT. */
function setMatcher(set){
  var n = String(set.name || '').toLowerCase();
  if(n.indexOf('first edition') > -1)
    return function(x){ return x.indexOf('first edition') > -1; };
  if(n.indexOf('gfl') > -1)
    return function(x){ return x.indexOf('gfl') > -1; };
  if(n.indexOf('throwback') > -1)
    return function(x){ return x.indexOf('throwback') > -1 && x.indexOf('gfl') === -1; };
  if(n.indexOf('spring') > -1)
    return function(x){ return x.indexOf('spring') > -1; };
  return function(){ return false; };
}

/* One slab. `have` is the my_cards row when you own it, undefined when you do
   not — an unowned card keeps its name and its rarity colour and loses
   everything that would be a lie: no grade, no serial, no print number. */
function slabHTML(card, have, big){
  var r = card.rarity || 'common';
  var qty = have ? Number(have.qty||0) : 0;
  var grade = have && have.best_grade != null ? have.best_grade : null;
  var print = have && have.lowest_print != null ? have.lowest_print : null;
  var total = card.prints_made || card.max_prints || null;
  var serial = 'VGA-' + String(print != null ? print : 0).padStart(4,'0');

  /* The fan: two ghosts behind the slab, never more, and the count on top. */
  var fan = '';
  if(qty > 1){
    fan = '<span class="gh g2"></span>' + (qty > 2 ? '<span class="gh g3"></span>' : '');
  }

  var art = have && card.photo_url
    ? '<img src="'+esc(card.photo_url)+'" alt="" loading="lazy" onerror="this.remove()">'
    : '<div class="noart">'+esc(card.name || 'Card')+'</div>';

  return '<div class="slabw'+(have ? '' : ' unowned')+' r-'+esc(r)+'"'
      + ' data-card="'+esc(card.card_id)+'">'
    + fan
    + '<div class="slab">'
      + '<div class="plate">'
        + '<div class="txt">'
          + '<div class="l1">'+esc(card.set_code || '')+' &middot; '+esc(r)+'</div>'
          + '<div class="l2">'+esc(card.name || 'Card')+'</div>'
          + '<div class="l3">' + (have
              ? '<span class="bars">'+bars(card.card_id)+'</span><span>'+esc(serial)
                + (print != null && total ? ' &middot; #'+print+'/'+total : '') + '</span>'
              : '<span class="miss">Not in your binder</span>') + '</div>'
        + '</div>'
        + '<div class="side">' + (grade != null
            ? '<b>'+grade+'</b><i>PSA</i>' : '<b class="dash">&ndash;</b><i>&nbsp;</i>') + '</div>'
      + '</div>'
      + '<div class="well"><div class="inner">' + art
        + '<span class="scrim"></span><span class="fx"></span>'
        + '<div class="cfoot"><div class="n">'+esc(card.name || 'Card')+'</div>'
        + '<div class="p">' + (have
            ? (print != null ? '#'+print+(total ? ' / '+total : '') : 'Owned')
            : (total ? total + ' in circulation' : 'Unreleased')) + '</div></div>'
      + '</div></div>'
    + '</div>'
    + (qty > 1 ? '<span class="qty">&times;'+qty+'</span>' : '')
    + '</div>';
}

/* A barcode that is the same every time for a given card and different between
   cards — a random one would re-roll on every render and flicker. */
function bars(seed){
  var h = 0, str = String(seed);
  for(var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) & 0xffff;
  var out = '';
  for(var j = 0; j < 12; j++){
    h = (h * 1103515245 + 12345) & 0x7fffffff;
    out += '<i style="height:'+(3 + (h % 6))+'px"></i>';
  }
  return out;
}

/* A SEALED PACK SHOULD LOOK SEALED. A row of text with a button is a to-do
   item; the whole reason a pack is worth anything is that it is closed. The
   wrapper is drawn — foil sheen, a tear strip, the set's colour and how many
   cards are inside — because there is no pack art in the database either.

   The newest one leads at full size. Any others sit beside it as a rail,
   small, because a shelf of sealed packs is a thing people like looking at
   and a list of them is not. */
function packsHTML(){
  var by = {};
  binderPacks.forEach(function(i){ (by[i.name] = by[i.name] || []).push(i); });
  var names = Object.keys(by).sort(function(a,b){
    return String(by[b][0].acquired_at || '').localeCompare(String(by[a][0].acquired_at || '')); });
  /* ONE ROW. A lead pack with a rail underneath split the same thing in two
     and made the newest look like a different kind of object. They are all
     sealed packs; they line up. Newest first, and the whole wrapper is the
     button — a pack you tap to open needs no button beside it saying so. */
  return '<div class="lab"><b>Unopened</b><i></i><s>tap to rip</s></div>'
    + '<div class="sealrail">' + names.map(function(n){
        return '<div class="sw" data-rip="'+esc(by[n][0].player_item_id)+'">'
          + wrapperHTML(by[n][0], by[n].length)
          + '<span class="cap">'+esc(shortPack(n))+'</span></div>';
      }).join('') + '</div>';
}

/* The wrapper itself. Colour comes from the set the pack belongs to, so two
   sealed packs from different sets never look the same in a stack. */
var SETC = { 'first edition':'#4FB8F0', 'gfl':'#FF6EC7', 'throwback':'#F5C842',
             'spring':'#5FD98A', 'mystery':'#B08BFA' };
function packColour(name){
  var n = String(name || '').toLowerCase();
  if(n.indexOf('first edition') > -1) return SETC['first edition'];
  if(n.indexOf('gfl') > -1)           return SETC['gfl'];
  if(n.indexOf('spring') > -1)        return SETC.spring;
  if(n.indexOf('throwback') > -1)     return SETC.throwback;
  return SETC.mystery;
}
function packSize(name){
  var n = String(name || '').toLowerCase();
  return n.indexOf('box') > -1 ? 15 : n.indexOf('single') > -1 ? 1 : 5;
}
function shortPack(name){
  return String(name || '').replace(/ (Pack|Box|Single)$/i, '');
}
function wrapperHTML(item, count){
  return '<div class="wrapper" style="--pk:'+packColour(item.name)+'">'
    + '<span class="foil"></span><span class="tear"></span>'
    + '<span class="sz">'+packSize(item.name)+'<em>cards</em></span>'
    + (count > 1 ? '<span class="cnt">&times;'+count+'</span>' : '')
    + '</div>';
}

/* Foil costs nothing when it is not on screen. */
function watchFoil(){
  if(foilWatcher) foilWatcher.disconnect();
  var all = document.querySelectorAll('.fx');
  if(!all.length) return;

  /* Light what is on screen RIGHT NOW, synchronously. An IntersectionObserver
     reports on a later frame, so the first cards would otherwise render with
     dead foil for a beat — and in a backgrounded tab it never reports at all,
     which is exactly how this looked broken under test. The observer keeps it
     right from here; this is only the opening state. */
  var h = window.innerHeight || 900, w = window.innerWidth || 400;
  all.forEach(function(f){
    var r = f.getBoundingClientRect();
    /* BOTH axes. The grid only ever scrolled vertically, so a vertical-only
       test was right by accident; the shelves scroll sideways, and a card
       parked off the right edge still has a perfectly normal `top`. That lit
       98 foils out of 107 — the exact thing the observer exists to prevent. */
    f.classList.toggle('lit',
      r.bottom > -140 && r.top < h + 140 && r.right > -60 && r.left < w + 60);
  });

  if(!('IntersectionObserver' in window)) return;
  /* No `root`: the shelves are their own horizontal scrollers inside the
     panel, and pinning the root to the panel measures only the vertical one.
     The viewport is the thing that actually decides whether somebody can see
     a card. */
  foilWatcher = new IntersectionObserver(function(rows){
    rows.forEach(function(r){ r.target.classList.toggle('lit', r.isIntersecting); });
  }, { rootMargin: '140px 60px' });
  all.forEach(function(f){ foilWatcher.observe(f); });
}

async function loadSets(){
  var el = document.getElementById('setlist'); if(!el) return;
  var rows = await q("card_sets_public?select=name,code,status,set_size");
  if(!rows || !rows.length){ el.innerHTML = '<div class="empty">No sets yet.</div>'; return; }
  el.innerHTML = rows.map(function(s){
    return '<div class="perk"><span class="ico"><svg><use href="#i-cards"/></svg></span>'
      + '<div><div class="t">'+esc(s.name)+'</div>'
      + '<div class="s">'+esc(s.code)+' &middot; '+(s.set_size||'?')+' cards &middot; '+esc(s.status)+'</div></div></div>';
  }).join('');
}

document.addEventListener('click', function(e){
  if(e.target.closest('#btn-signin'))  signIn();
  if(e.target.closest('#btn-signout')) signOut();
});

/* ═══ install hint — iOS gets no prompt, so it gets a sentence ═══ */
function installHint(){
  var el = document.getElementById('install');
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if(standalone) return;
  var iOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if(!iOS) return;
  try{ if(localStorage.getItem('uba.install.dismissed')) return; }catch(e){}
  el.innerHTML = '<b>Add UBA to your home screen.</b><br>Tap the share button, then "Add to Home Screen".';
  el.classList.add('on');
  el.addEventListener('click', function(){
    el.classList.remove('on');
    try{ localStorage.setItem('uba.install.dismissed','1'); }catch(e){}
  });
}

/* TEMPORARY — open the app with ?diag to print what the device actually
   reports. The tab bar has been "not at the bottom" through three fixes and
   every one of them was a guess; this replaces guessing with numbers.
   Delete this block once the bar is right. */
function showDiag(){
  if(location.search.indexOf('diag') === -1) return;
  var probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;bottom:0;height:0;padding-bottom:env(safe-area-inset-bottom)';
  document.body.appendChild(probe);
  var inset = probe.getBoundingClientRect().height;
  probe.remove();
  var bar = document.querySelector('.bar').getBoundingClientRect();
  var standalone = window.matchMedia('(display-mode: standalone)').matches || !!navigator.standalone;
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:70px;z-index:99;'
    + 'background:#000;color:#0f0;font:11px/1.5 monospace;padding:10px;border-radius:8px;'
    + 'white-space:pre;border:1px solid #0f0';
  d.textContent =
      'standalone   ' + standalone + '\n'
    + 'lvh          ' + (window.__barLvh || 0) + '\n'
    + 'DEAD STRIP   ' + (window.__barShortfall || 0) + '\n'
    + 'innerHeight  ' + window.innerHeight + '\n'
    + 'screen.h     ' + screen.height + '\n'
    + 'visualVP.h   ' + (window.visualViewport ? Math.round(window.visualViewport.height) : 'n/a') + '\n'
    + 'safe-bottom  ' + inset + '\n'
    + 'bar.top      ' + Math.round(bar.top) + '\n'
    + 'bar.bottom   ' + Math.round(bar.bottom) + '\n'
    + 'bar.height   ' + Math.round(bar.height) + '\n'
    + 'GAP BELOW    ' + Math.round(window.innerHeight - bar.bottom) + '\n'
    + 'dpr          ' + window.devicePixelRatio;
  d.addEventListener('click', function(){ d.remove(); });
  document.body.appendChild(d);
}

/* ═══ boot ═══════════════════════════════════════════════════════════ */
(async function(){
  /* iOS fires :active only if SOMETHING is listening for touch. Without this
     one empty listener every pressed state above is dead on iPhone and works
     fine on Android, which is the worst version of the bug: it looks fixed on
     the machine you tested it on. */
  document.addEventListener('touchstart', function(){}, { passive: true });
  loadSession();
  if(session) me = await fetchMe();   /* renews the token itself — see fetchMe */
  await loadWhoAmI();
  paintAvatar();
  renderYou();
  renderCards();
  renderJoinSlot();
  renderHomeHeader();   // <- boot is where `me` gets set; without this the
                        //    Sign in pill stayed up for signed-in people
  installHint();
  showDiag();

  /* Seat a state object on the entry the app opened with. Without it the first
     goTab has no history.state to recognise and would replace the very entry
     that back needs to return to. */
  history.replaceState({ tab: currentTab }, '', location.hash || '#home');

  var hash = (location.hash || '').replace('#','');
  if(hash.indexOf('f/') === 0){ goTab('fighters'); openSheet({kind:'fighter', id:hash.slice(2)}); }
  else if(hash.indexOf('n/') === 0){ goTab('news'); openSheet({kind:'news', id:hash.slice(2)}); }
  else if(hash.indexOf('e/') === 0){ openSheet({kind:'event', id:hash.slice(2)}); }
  else if(panels[hash] && hash !== 'home') goTab(hash);

  await loadHome();
  loadNews();
  loadFighters();

  if('serviceWorker' in navigator){
    /* The shell is cache-first, so a visit shows the version that was stored
       LAST time — you always see one build behind, and closing the app once
       is not enough because the new worker only takes over after that load.
       skipWaiting + claim in sw.js hand control over immediately; this
       reloads the page the moment that happens so what is on screen is what
       was just deployed. Guarded so it can only ever fire once per load. */
    var swReloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(swReloaded) return;
      swReloaded = true;
      location.reload();
    });
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      // and check for a new build every time the app is brought forward
      document.addEventListener('visibilitychange', function(){
        if(document.visibilityState === 'visible') reg.update().catch(function(){});
      });
    }).catch(function(e){ console.warn('[uba] sw', e); });
  }
})();
</script>
