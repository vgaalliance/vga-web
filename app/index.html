/* ── PULL TO REFRESH ───────────────────────────────────────────────────
   One entry per tab: forget what is held in memory, then load it again. The
   localStorage cache is deliberately NOT cleared -- q() always goes to the
   network anyway, so a refresh is already a real refetch, and clearing it
   would only mean the next cold open has nothing to paint. */
var REFRESH = {
  home: function(){ return Promise.all([loadHome(), loadLive(), loadStrip(),
                                        loadRanks()]).then(renderNextEvent); },
  news: function(){ newsCache = null; newsInFlight = null; return loadNews(); },
  you:  function(){ return loadMe().then(function(){ renderYou(); }); },
  fighters: function(){ allFighters = null; return loadFighters(); },
  betting:  function(){ betPools = null; myBets = null; return renderBetting(); },
  cards:    function(){ binderCards = null; binderAll = null; return renderCards(); }
};

/* ── THE HALO ───────────────────────────────────────────────────────────
   N3, CHROMA SPLIT. One ring, drawn three times and pulled apart -- the
   misregistered-tube look, where the aberration IS the design rather than a
   garnish on top of something else. Nothing petal-shaped: at 48px the button
   eats the middle of any flower, so all that ever showed was the ring anyway.

   THE SPLIT GROWS WITH THE PULL, and that is what keeps it usable. Pure R/G/B
   at rest, screen-blended, converges to WHITE wherever the three overlap --
   which is the whole ring -- so a permanently-split halo is a permanently
   grey one. At rest this is a violet ring with a hairline of colour on each
   edge; the channels separate as you drag and fly apart on the refresh. Brand
   colour when it is furniture, full CRT when it is an event.

   A ring is rotationally symmetric, so spinning it is invisible. The sweep --
   one brighter arc travelling round -- is what makes it alive at rest. */
var discPull = function(){}, discBloom = function(){}, discHold = function(){};

function startDiscBloom(){
  var cv = document.getElementById('disc-bloom');
  if(!cv || !cv.getContext) return;
  var S = 112, C = S/2, BTN = 27;      /* the You button's radius */
  var ctx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = S*dpr; cv.height = S*dpr; ctx.scale(dpr, dpr);

  var IDLE = 0.16;
  var si = IDLE, target = IDLE, vel = 0, sweep = 0, bloom = 0, t = 0, held = false;
  var TAU = Math.PI*2;

  discPull  = function(f){ if(!held) target = IDLE + Math.max(0, Math.min(1, f)) * (0.74 - IDLE); };
  discBloom = function(){ target = 1; bloom = 1; };
  /* Press and hold the button and the ring winds open and STAYS open; let go
     and it fires. Charge and release, so a long press is rewarded rather than
     being the same as a tap -- and a tap is just a very short charge, which is
     why one gesture covers both. */
  discHold  = function(on){
    held = !!on;
    if(on){ target = 1; }
    else  { discBloom(); }
  };

  /* A soft neon ring: the same circle stroked three times, widest and faintest
     first, so no edge is ever hard. */
  function ring(r, ox, oy, w, col, a){
    var pass = [[w*2.8, 0.10], [w*1.7, 0.22], [w, 0.46]];
    for(var k = 0; k < 3; k++){
      ctx.beginPath();
      ctx.arc(C + ox, C + oy, r, 0, TAU);
      ctx.lineWidth = pass[k][0];
      ctx.strokeStyle = col(a * pass[k][1]);
      ctx.stroke();
    }
  }
  var violet = function(a){ return 'hsla(272,100%,72%,' + a.toFixed(3) + ')'; };
  var red    = function(a){ return 'rgba(255,45,45,'   + a.toFixed(3) + ')'; };
  var green  = function(a){ return 'rgba(45,255,150,'  + a.toFixed(3) + ')'; };
  var blue   = function(a){ return 'rgba(70,110,255,'  + a.toFixed(3) + ')'; };

  (function loop(){
    requestAnimationFrame(loop);
    /* An animation nobody is looking at is a battery bill. */
    if(document.hidden) return;
    t++;

    if(bloom > 0){ bloom = Math.max(0, bloom - 0.014); if(bloom === 0 && !held) target = IDLE; }
    /* Spring, not a lerp: stiffer going up than coming down, so it opens with
       intent and closes lazily. The asymmetry is the broadcast clock's. */
    var stiff = si < target ? 0.020 : 0.006, damp = si < target ? 0.68 : 0.60;
    vel = (vel + (target - si) * stiff) * damp;
    si = Math.max(0, Math.min(1, si + vel));
    sweep += 0.010 + si*0.030 + bloom*0.05;

    /* The trail, and the only way to fade a TRANSPARENT canvas: destination-out
       lowers the alpha of what is there. A dark fill paints a box. */
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.fillRect(0, 0, S, S);
    ctx.globalCompositeOperation = 'source-over';

    /* ON the button's edge, not around it. At 1.12x the ring floated 6px clear
       and read as a second, larger object; the button is drawn over the top of
       this canvas, so a ring INSIDE its radius is mostly hidden and what shows
       is the soft outer half bleeding past the edge -- the button glowing
       rather than wearing something. 0.94x with a fatter stroke: tucked
       further under, and heavier so the part that does show still reads. It
       only leaves the edge on a pull. */
    var r  = BTN*0.94 + si*6;
    var w  = 3.2 + si*6;
    var a  = 0.34 + si*0.42 + bloom*0.24;
    var dx = 0.9 + si*3.4 + bloom*6.5;      /* how far the channels are pulled apart */

    /* The body of the ring, in the brand's violet. */
    ring(r, 0, 0, w, violet, a);

    /* The fringes. They are faint until the pull separates them, so at rest
       this is a violet ring with coloured edges rather than a grey one. */
    var f = (0.16 + si*0.5 + bloom*0.34) * a;
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    ring(r, -dx, 0,        w*0.85, red,   f);
    ring(r,  0,  -dx*0.42, w*0.85, green, f*0.72);
    ring(r,  dx, 0,        w*0.85, blue,  f);
    ctx.restore();

    /* The sweep -- one brighter arc travelling round. A ring is rotationally
       symmetric, so without this nothing would read as moving. */
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    ctx.beginPath();
    ctx.arc(C, C, r, sweep, sweep + 0.85);
    ctx.lineWidth = w*1.5; ctx.lineCap = 'round';
    ctx.strokeStyle = 'hsla(' + (272 + Math.sin(t*0.01)*40) + ',100%,84%,'
      + (0.16 + si*0.30 + bloom*0.3).toFixed(3) + ')';
    ctx.stroke();
    ctx.restore();

    /* Scanlines ERASE, for the same reason the trail does -- a dark fill would
       draw a box on a transparent canvas. Always on, faintly; the refresh just
       turns them up. */
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.globalAlpha = 0.10 + si*0.12 + bloom*0.16;
    ctx.fillStyle = '#000';
    for(var y = 0; y < S; y += 3) ctx.fillRect(0, y, S, 1.2);
    ctx.restore();
  })();
}

function wirePullToRefresh(){
  /* TRIGGER is where the flower is wound fully up. MAX is as far as the page
     can be dragged. There is deliberately no HOLD -- see the note in the CSS. */
  var TRIGGER = 72, MAX = 108;
  var startY = 0, pulling = false, dist = 0, busy = false;
  var panel = null, frame = 0, pending = 0;

  /* Asymptotic resistance: the first pixels track the finger almost 1:1 and it
     stiffens toward MAX, so the pull has a felt end instead of running away. */
  function resist(dy){ return MAX * (1 - Math.exp(-dy / (MAX * 0.85))); }

  /* ONE write per frame, and only a transform -- which never touches layout.
     touchmove fires faster than the screen paints, so writing straight from
     the handler queues work the compositor then throws away. */
  function schedule(d){
    pending = d;
    if(frame) return;
    frame = requestAnimationFrame(function(){
      frame = 0;
      panel.style.transform = 'translateY(' + pending.toFixed(1) + 'px)';
      discPull(pending / TRIGGER);
    });
  }
  function retract(){
    if(frame){ cancelAnimationFrame(frame); frame = 0; }
    panel.classList.add('ptrback');
    panel.style.transform = '';
    discPull(0);
    var p = panel;
    setTimeout(function(){
      p.classList.remove('ptrback');
      p.style.transform = ''; p.style.willChange = '';
    }, 380);
  }
  function letGo(){ pulling = false; dist = 0; }

  document.addEventListener('touchstart', function(e){
    if(busy || e.touches.length !== 1) return;
    /* A sheet has its own scroller on top of the panel; pulling there should
       do nothing rather than refresh whatever is behind it. */
    var sheet = document.getElementById('sheet');
    if(sheet && sheet.classList.contains('live')) return;
    var p = document.querySelector('.panel.live');
    if(!p || p.scrollTop > 0) return;
    if(!REFRESH[currentTab]) return;
    panel = p;
    /* Promote the layer BEFORE the first move; promoting mid-gesture is its
       own stutter. Easing off so the page tracks the finger with no lag. */
    panel.style.willChange = 'transform';
    panel.classList.remove('ptrback');
    startY = e.touches[0].clientY; pulling = true; dist = 0;
  }, { passive: true });

  document.addEventListener('touchmove', function(e){
    if(!pulling || busy) return;
    var dy = e.touches[0].clientY - startY;
    /* Dragging back UP is a normal scroll, so hand it back rather than fight it. */
    if(dy <= 0 || panel.scrollTop > 0){ retract(); letGo(); return; }
    e.preventDefault();                       /* needs passive:false */
    dist = resist(dy);
    schedule(dist);
  }, { passive: false });

  document.addEventListener('touchend', function(){
    if(!pulling || busy) return;
    if(dist < TRIGGER){ retract(); letGo(); return; }
    busy = true; letGo();
    var tab = currentTab;
    discBloom();      /* the flower in the bar fires */
    retract();        /* and the page is already going back */
    /* The refresh runs against a page at REST, so whatever it re-renders
       cannot be seen moving. A refresher that throws still has to release the
       gesture -- the failure is already reported by the loader's own retry box. */
    var out;
    try{ out = REFRESH[tab](); }catch(e){ out = null; }
    Promise.resolve(out).then(function(){ busy = false; }, function(){ busy = false; });
  }, { passive: true });
}

/* ═══ boot ═══════════════════════════════════════════════════════════ */
(async function(){
  /* iOS fires :active only if SOMETHING is listening for touch. Without this
     one empty listener every pressed state above is dead on iPhone and works
     fine on Android, which is the worst version of the bug: it looks fixed on
     the machine you tested it on. */
  document.addEventListener('touchstart', function(){}, { passive: true });
  wirePullToRefresh();
  startDiscBloom();
  /* Hold the You button to charge the halo, release to fire it. Pointer events
     cover mouse and touch in one path, and `pointercancel` matters: a press
     that turns into a scroll never gets pointerup, and without it the ring
     would stay wound open forever. */
  (function(){
    var b = document.querySelector('.bar .midbtn');
    if(!b || !window.PointerEvent) return;
    b.addEventListener('pointerdown', function(){ discHold(true); }, { passive: true });
    ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
      b.addEventListener(ev, function(){ discHold(false); }, { passive: true });
    });
  })();
  loadSession();
  if(session) me = await fetchMe();   /* renews the token itself — see fetchMe */
  await loadWhoAmI();
  paintAvatar();
  renderYou();
  renderCards();
  renderJoinSlot();
  renderHomeHeader();   // <- boot is where `me` gets set; without this the
                        //    Sign in pill stayed up for signed-in people
  installHint();
  showDiag();

  /* Seat a state object on the entry the app opened with. Without it the first
     goTab has no history.state to recognise and would replace the very entry
     that back needs to return to. */
  history.replaceState({ tab: currentTab }, '', location.hash || '#home');

  var hash = (location.hash || '').replace('#','');
  if(hash.indexOf('f/') === 0){ goTab('fighters'); openSheet({kind:'fighter', id:hash.slice(2)}); }
  else if(hash.indexOf('n/') === 0){ goTab('news'); openSheet({kind:'news', id:hash.slice(2)}); }
  else if(hash.indexOf('e/') === 0){ openSheet({kind:'event', id:hash.slice(2)}); }
  else if(panels[hash] && hash !== 'home') goTab(hash);

  await loadHome();
  loadNews();
  loadFighters();

  if('serviceWorker' in navigator){
    /* The shell is cache-first, so a visit shows the version that was stored
       LAST time — you always see one build behind, and closing the app once
       is not enough because the new worker only takes over after that load.
       skipWaiting + claim in sw.js hand control over immediately; this
       reloads the page the moment that happens so what is on screen is what
       was just deployed. Guarded so it can only ever fire once per load. */
    var swReloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(swReloaded) return;
      swReloaded = true;
      location.reload();
    });
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      // and check for a new build every time the app is brought forward
      document.addEventListener('visibilitychange', function(){
        if(document.visibilityState === 'visible') reg.update().catch(function(){});
      });
    }).catch(function(e){ console.warn('[uba] sw', e); });
  }
})();
</script>
