/* ── RANKINGS, the body of home ────────────────────────
   All four divisions at once, fifteen deep, champion on top of each. One
   toggle, and it is the only one: UBA is the pro league and GFL the amateur
   one, which is the ONLY thing separating them in the data -- `league` reads
   'UBA' on both, `level` is what differs, and a filter on league would return
   the two leagues stacked together.

   P4P IS NOT HERE ANY MORE. Pound-for-pound is one list, not four, so it has
   no column to sit in; it lives on the fighters tab behind its own chip, which
   is also where it belongs when GFL is selected -- GFL is ranked by division
   and has no pound-for-pound list at all. */
var rankLeague = 'pro', rankCache = {};
var RANK_FOLD = 6;      // rows shown per division before the tab is pressed
var RANK_DIVS = [
  { k: 'lightweight',       s: 'LW'  },
  { k: 'middleweight',      s: 'MW'  },
  { k: 'light_heavyweight', s: 'LHW' },
  { k: 'heavyweight',       s: 'HW'  }
];

document.getElementById('rleague').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  this.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
  b.classList.add('on');
  rankLeague = b.getAttribute('data-l');
  loadRanks();
});

/* The skeleton is the SHAPE of the board, not a token that says "loading".
   Same grid, same row count, so the news block below does not move when the
   names land -- the 274px shove measured on 2026-09-01 was exactly this. */
function rankSkeleton(){
  var rows = '';
  for(var i = 0; i < RANK_FOLD; i++){
    rows += '<div class="rkrow'+(i % 2 ? ' z' : '')+'"><span class="rnm"><b class="rsk"></b></span>'
          + '<i class="rmv"></i></div>';
  }
  var col = '<div class="rcol"><div class="rdh">&nbsp;</div>'
          + '<div class="rch"><span class="rnm"><b class="rsk"></b></span><i class="rmv"></i></div>'
          + rows + '</div>';
  return '<div class="rgrid">' + col + col + col + col + '</div>'
       + '<div class="rtabwrap"><button class="rtab" disabled>&nbsp;<i>&#9662;</i></button></div>';
}

async function loadRanks(){
  var el = document.getElementById('ranks');
  if(!el) return;
  var key = rankLeague;
  el.dataset.tab = key;                 // A6 — the guard below reads this
  if(rankCache[key]){ paintRanks(el, rankCache[key]); return; }
  el.innerHTML = rankSkeleton();

  /* Two reads, one await. The board is useless without the rankings and only
     poorer without the belts, so they are weighted differently below. */
  var res = await Promise.all([
    q("rankings_public?select=rank,prev_rank,fighter_name,fighter_slug,weight_class"
      + "&level=eq." + rankLeague + "&scope=eq.weight_class&order=rank.asc&limit=200"),
    q("titles_public?select=weight_class,kind,holder_name,holder_slug,is_interim"
      + "&level=eq." + rankLeague + "&kind=neq.team")
  ]);
  if(el.dataset.tab !== key) return;    // a newer league won while this was in flight
  if(!res[0]){
    retryHandlers['ranks'] = loadRanks;
    el.innerHTML = failHTML("Couldn't load the rankings.", 'ranks'); return;
  }
  /* A FAILED TITLES READ MUST NOT INVENT A VACANCY. q() returns null for a
     4xx and [] for "no belts", and those mean opposite things here: null
     draws no champion row at all, [] draws four Vacant rows. Treating the
     first as the second would tell the server the belts had been stripped. */
  var data = { rows: res[0], titles: res[1] };
  rankCache[key] = data;
  paintRanks(el, data);
}

/* The label says how many are hidden, but only when that number is the SAME
   in every division — GFL's boards are not all fifteen deep, and "+9 each" on
   a board where one division hides four is a small lie told four times. */
function rankTabHTML(byWc){
  var hidden = RANK_DIVS.map(function(d){
    return Math.max(0, (byWc[d.k] || []).length - RANK_FOLD);
  });
  var most = Math.max.apply(null, hidden);
  if(!most) return '';                       // nothing folded, no tab
  var same = hidden.every(function(n){ return n === hidden[0]; });
  var shut = same ? '+' + most + ' each' : 'Show all';
  return '<div class="rtabwrap"><button class="rtab" id="rtab" aria-expanded="false"'
       + ' aria-controls="ranks" data-shut="' + shut + '">' + shut
       + ' <i>&#9662;</i></button></div>';
}

document.getElementById('ranks').addEventListener('click', function(e){
  var b = e.target.closest('#rtab'); if(!b) return;
  var grid = this.querySelector('.rgrid'); if(!grid) return;
  var open = grid.classList.toggle('rfold') === false;
  b.setAttribute('aria-expanded', open ? 'true' : 'false');
  b.innerHTML = (open ? 'Show less' : b.dataset.shut) + ' <i>&#9662;</i>';
  /* The folded rows were display:none, so they were never measured — a name
     that needs squeezing gets its scale the first time it is actually on
     screen, not before. */
  if(open) fitRankNames(this);
});

function rankMoveHTML(f){
  if(f.prev_rank == null) return '<i class="rmv rnew" title="New this week"></i>';
  if(f.prev_rank > f.rank) return '<i class="rmv rup" title="Up from #'+f.prev_rank+'"></i>';
  if(f.prev_rank < f.rank) return '<i class="rmv rdn" title="Down from #'+f.prev_rank+'"></i>';
  return '<i class="rmv rsm" title="Unchanged"></i>';
}

function rankRowHTML(slug, cls, name, extraNameCls, move){
  var inner = '<span class="rnm '+(extraNameCls||'')+'"><b class="rft">'+esc(name)+'</b></span>' + move;
  if(!slug) return '<div class="'+cls+'">'+inner+'</div>';
  return '<a class="'+cls+'" data-slug="'+esc(slug)+'" href="./f/'
       + encodeURIComponent(slug)+'.html">'+inner+'</a>';
}

function paintRanks(el, data){
  var rows = data.rows, titles = data.titles;
  if(!rows.length){ el.innerHTML = '<div class="empty">Nothing ranked here yet.</div>'; return; }

  var byWc = {};
  rows.forEach(function(r){ (byWc[r.weight_class] = byWc[r.weight_class] || []).push(r); });

  /* The BMF belt has no weight class on purpose, so its holder is marked
     WHERE THEY ALREADY ARE rather than given a row of their own -- Adonnis is
     #2 at middleweight and stays there, in gold. */
  var bmf = null, champ = {};
  (titles || []).forEach(function(t){
    if(t.kind === 'special' && t.holder_slug) bmf = t.holder_slug;
    else if(t.weight_class) champ[t.weight_class] = t;
  });

  el.innerHTML = '<div class="rgrid rfold">' + RANK_DIVS.map(function(d){
    var list = (byWc[d.k] || []).slice().sort(function(a, b){ return a.rank - b.rank; });
    var h = '<div class="rcol" style="--rkd:'+(RANK_DIVS.indexOf(d) * 500)+'ms">'
          + '<div class="rdh">'+d.s+'</div>';
    if(titles){
      var t = champ[d.k];
      h += t && t.holder_name
        ? rankRowHTML(t.holder_slug, 'rch', t.holder_name + (t.is_interim ? ' (int)' : ''),
                      '', '<i class="rmv"></i>')
        : rankRowHTML(null, 'rch', 'Vacant', 'rvac', '<i class="rmv"></i>');
    }
    h += list.map(function(f, i){
      var gold = bmf && f.fighter_slug === bmf;
      var cls = 'rkrow' + (i % 2 ? ' z' : '') + (gold ? ' bmf' : '')
              + (i >= RANK_FOLD ? ' rkx' : '');
      return rankRowHTML(f.fighter_slug, cls, f.fighter_name, '', rankMoveHTML(f));
    }).join('');
    return h + '</div>';
  }).join('') + '</div>' + rankTabHTML(byWc);

  var asof = document.getElementById('r-asof');
  if(asof) asof.textContent = rows.length + ' ranked';
  requestAnimationFrame(function(){ fitRankNames(el); });
}

/* SHRINK-TO-FIT, WITH A FLOOR. The name slot is ~50px, about eight
   characters, and 5 of the 60 ranked names are longer: DirtiestJordan,
   AngelicMessenger and TonyHungLow94 all fit once squeezed, and reading as
   condensed type rather than being cut is worth the wobble.

   THE SQUEEZE IS HORIZONTAL ONLY, which is what makes the floor as low as it
   is. scaleX narrows the glyphs and leaves the cap height at 11px, so 0.6
   reads as condensed type rather than as small type -- the first version set
   the floor at 0.75 on the assumption that it shrank both, and ellipsed three
   names that fit perfectly well once squeezed.

   The floor still exists, because past a point condensed becomes illegible
   rather than tight. At 0.6 exactly one of the 60 ranked names is still too
   long -- `Xi "The Fat Dragon" Lee`, 23 characters -- and it takes the
   ellipsis. */
var RANK_FIT_FLOOR = 0.6;
function fitRankNames(el){
  var items = [];
  /* Four passes, and the split is deliberate: every read happens before every
     write, so 60 names cost two layouts instead of 60. */
  el.querySelectorAll('.rnm').forEach(function(slot){
    var t = slot.querySelector('.rft'); if(!t) return;
    t.style.transform = ''; t.style.width = '';
    items.push({ slot: slot, t: t, box: slot.clientWidth });
  });
  /* MEASURE WITH max-content, NOT scrollWidth. A block that is ALREADY
     ellipsizing reports scrollWidth == clientWidth -- the text was cut before
     anything measured it -- so the natural width has to be asked for outright.
     Using scrollWidth made this a silent no-op at 430px wide while working at
     375px, which is the worst shape a bug can take: correct on the phone it
     was built on and cut on everybody else's. */
  items.forEach(function(o){ o.t.style.width = 'max-content'; });
  items.forEach(function(o){ o.need = o.t.getBoundingClientRect().width; });
  items.forEach(function(o){
    o.t.style.width = '';
    if(!o.box || o.need <= o.box + 0.5) return;
    var s = Math.max(RANK_FIT_FLOOR, (o.box / o.need) - 0.01);
    o.t.style.width = (100 / s) + '%';
    o.t.style.transform = 'scaleX(' + s.toFixed(3) + ')';
  });
}

/* Barlow is a web font, and a name measured in the fallback is measured at the
   wrong width -- usually narrower, so the squeeze that was needed never
   happens. Re-run once the real face is in. */
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(function(){
    var el = document.getElementById('ranks');
    if(el && el.querySelector('.rgrid')) fitRankNames(el);
  });
}

/* Widths change with the device and with a rotation, and a scale measured at
   375px is wrong at 430px in both directions. Debounced because resize fires
   continuously through an orientation change. */
var rankFitTimer = null;
window.addEventListener('resize', function(){
  clearTimeout(rankFitTimer);
  rankFitTimer = setTimeout(function(){
    var el = document.getElementById('ranks');
    if(el && el.querySelector('.rgrid')) fitRankNames(el);
  }, 150);
});

/* ═══ NEWS ═══════════════════════════════════════════════════════════
   Reads news_public, a view that does not exist yet. Until it is created
   both of these render an honest empty state rather than a blank space. */
var newsCache = null, newsFailWasMissing = false, newsInFlight = null;
/* A8 — loadHomeNews, loadStrip and loadNews all want this at boot and none
   of them has resolved yet, so a plain cache check fired three identical
   requests. The promise itself is the cache. */
var NEWS_PATH = "news_public?select=id,kicker,headline,body,reporter,posted_at,graphic_url"
  + "&order=posted_at.desc&limit=25";
async function getNews(){
  if(newsCache !== null) return newsCache;
  if(newsInFlight) return newsInFlight;
  newsInFlight = (async function(){
    var res = await qStatus(NEWS_PATH);
    // 404 means the view genuinely is not there; anything else means the
    // database was unreachable. Saying "not wired up yet" for an outage sends
    // whoever reads it off to build something that already exists.
    newsFailWasMissing = (res.code === 404);
    newsCache = res.rows;
    newsInFlight = null;
    return newsCache;
  })();
  return newsInFlight;
}
function newsFailure(retryId){
  if(newsFailWasMissing){
    return '<div class="empty"><b>News isn\'t wired up yet.</b><br>'
      + 'It needs a <code>news_public</code> view over posts with status = posted.</div>';
  }
  return failHTML("Couldn't load the news.", retryId);
}
/* ── THE NEXT CARD ────────────────────────────────────────────────────
   Reads what home already has: fanEvents (every scheduled event, plus a past
   backfill when the schedule is thin) and faceoffs (bout 1 of each published
   card, which IS the main event — the card counts down from the top). No
   request of its own.

   THE ORDER OF THE THREE STATES IS THE WHOLE RULE:
     1. anything still to come  -> the soonest, and you can flip to the rest
     2. nothing to come         -> the last card that happened, labelled as such
     3. nothing at all          -> a placeholder that says where the next one
                                   gets announced
   A past event may never appear above an upcoming one. The block's claim is
   "this is next"; showing a finished card under that heading is the same lie
   as an out-of-date scoreboard. */
var nextIdx = 0;

function nextEventList(){
  var evs = fanEvents || [];
  var soon = evs.filter(function(e){ return !eventIsOver(e); });
  if(soon.length) return { rows: soon, past: false };
  /* Newest-first for the past, because "last time out" means the most recent
     one, not the oldest one still in the hand. */
  var done = evs.slice().filter(eventIsOver).sort(function(x, y){
    return new Date(y.event_date) - new Date(x.event_date); });
  return { rows: done, past: true };
}

function posterHTML(e, past, i, n){
  var f = faceoffs[e.id];
  /* Everything on this app states event times in ET, because the league runs
     to one clock and a local-time render makes two people disagree about when
     the card starts. */
  var when = new Date(e.event_date).toLocaleString('en-US', { timeZone: 'America/New_York',
    month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + ' ET';
  var body = f
    ? '<div class="duo">'
      + '<span class="pw">' + cutout(f.a) + '</span>'
      + '<span class="vs">VS</span>'
      + '<span class="pw">' + cutout(f.b, 'flip') + '</span></div>'
      + '<div class="nms"><b>' + esc(f.an || 'TBA') + '</b><b>' + esc(f.bn || 'TBA') + '</b></div>'
      /* A UBAe night's faceoff is built by loadUbae() and carries neither a
         record nor a weight class, because a team match has neither. Two
         em-dashes under two names reads as data that failed to load; the row
         is simply not drawn. */
      + (f.ar || f.br
          ? '<div class="recs"><s>' + (f.ar || '') + '</s><s>' + (f.br || '') + '</s></div>' : '')
      + (f.forWhat ? '<div class="wcl">' + esc(f.forWhat) + '</div>' : '')
    : '<div class="tba">Card not announced yet</div>';
  var dots = n > 1
    ? '<div class="pvdots">' + Array.apply(null, Array(n)).map(function(_, k){
        return '<s class="' + (k === i ? 'on' : '') + '" data-nxi="' + k + '"></s>'; }).join('')
      + '</div>'
    : '<div class="pvdots"></div>';
  return '<div class="pv" data-event="' + esc(e.id) + '"><div class="glow"></div>'
    + '<div class="eyeb">' + (past ? 'Last time out' : 'Next event') + '</div>'
    + '<div class="ttl">' + esc(e.name) + '</div>'
    + '<div class="meta">' + esc(when) + '</div>'
    + body + dots + '</div>';
}

/* A missing cut-out is the NORM, not a failure — see the CSS note. */
function cutout(url, flip){
  return url
    ? '<img class="cut ' + (flip || '') + '" src="' + esc(url) + '" alt="">'
    : '<svg class="sil" viewBox="0 0 60 100" preserveAspectRatio="xMidYMax meet">'
      + '<circle cx="30" cy="21" r="14"/>'
      + '<path d="M30 38c-14 0-24 9-26 22l-4 40h60l-4-40c-2-13-12-22-26-22z"/></svg>';
}

function renderNextEvent(){
  var el = document.getElementById('home-next');
  if(!el) return;
  var lab = document.getElementById('nx-lab');
  var list = nextEventList();
  if(!list.rows.length){
    if(lab) lab.textContent = 'Next card';
    el.innerHTML = '<div class="pvnone"><div class="ring">&#9675;</div>'
      + '<div class="eyeb">Nothing on the schedule</div>'
      + '<div class="ss">The next card lands here the moment it is announced.'
      + '<br>Signups open in Discord first.</div></div>';
    return;
  }
  if(nextIdx >= list.rows.length) nextIdx = 0;
  if(lab) lab.textContent = list.past ? 'Last time out' : 'Next card';
  el.innerHTML = posterHTML(list.rows[nextIdx], list.past, nextIdx, list.rows.length);
}

/* Dots and a swipe, on the block itself. The tap-through to the event is the
   `[data-event]` handler that every other event row already uses, so a dot has
   to stop the event reaching it. */
document.getElementById('home-next').addEventListener('click', function(e){
  var d = e.target.closest('[data-nxi]'); if(!d) return;
  e.stopPropagation();
  nextIdx = +d.getAttribute('data-nxi');
  renderNextEvent();
});
(function(){
  var el = document.getElementById('home-next'), x0 = null, y0 = null;
  if(!el) return;
  el.addEventListener('touchstart', function(e){
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  el.addEventListener('touchend', function(e){
    if(x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    /* Vertical wins ties: this block sits in a scrolling column and stealing a
       scroll to flip a poster is worse than missing a flip. */
    if(Math.abs(dx) < 42 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    var n = nextEventList().rows.length;
    if(n < 2) return;
    nextIdx = (nextIdx + (dx < 0 ? 1 : n - 1)) % n;
    renderNextEvent();
  }, { passive: true });
})();

var VIDEOS_PATH = 'videos_public?select=video_id,title,thumb_url,published_at,seen_at,event_name&limit=8';
var newsVideos = null;

async function loadNews(){
  var el = document.getElementById('news-body');
  /* Yesterday's wire, instantly, then today's over the top of it. */
  var seed = cached(NEWS_PATH);
  newsVideos = cached(VIDEOS_PATH) || newsVideos;
  var painted = false;
  if(seed && seed.length){ paintNews(seed); painted = true; }
  var both = await Promise.all([getNews(), q(VIDEOS_PATH)]);
  var rows = both[0];
  /* A failed video read must not blank the deck or the wire -- q() returns
     null on a 4xx and (null || []) is indistinguishable from "no videos". */
  if(both[1]) newsVideos = both[1];
  if(!rows){
    retryHandlers['news'] = function(){ newsCache = null; loadNews(); };
    /* Do not replace a painted wire with a failure box. Old news beats no
       news, and the retry is still there the next time the tab is opened. */
    if(!painted) el.innerHTML = newsFailure('news');
    return;
  }
  if(!rows.length){ el.innerHTML = '<div class="empty">No news posted yet.</div>'; return; }
  paintNews(rows);
}
function paintNews(rows){
  var el = document.getElementById('news-body');
  if(!el) return;
  document.getElementById('news-count').textContent = rows.length + ' posts';
  var vids = newsVideos || [];

  /* THE DECK. Every video, swipeable, above everything. Video always has this,
     which is what lets the wire below stay mostly writing. */
  var html = '';
  if(vids.length){
    html += '<div class="vdeck">' + vids.map(function(v){
      return '<a class="vslide" href="https://youtu.be/' + esc(v.video_id) + '"'
        + ' target="_blank" rel="noopener">'
        + (v.thumb_url ? '<img src="'+esc(v.thumb_url)+'" alt="" loading="lazy" decoding="async">' : '')
        + '<span class="vplay"></span><span class="vgrad"></span>'
        + '<span class="vmeta"><b>' + (v.event_name ? 'Watch \u00b7 ' + esc(v.event_name) : 'Watch')
        + '</b><i>' + esc(v.title) + '</i></span></a>';
    }).join('') + '</div>';
    if(vids.length > 1){
      html += '<div class="vdots">'
        + vids.map(function(_, k){ return '<i class="' + (k ? '' : 'on') + '"></i>'; }).join('')
        + '</div>';
    }
  }

  /* THE LEAD STORY KEEPS ITS CARD. The deck taking the top of the tab is not a
     reason to demote the writing to a row -- 21 of 22 posts carry a graphic,
     and dropping the lead treatment threw every one of them away. Deck, then
     the newest story at full size, then the mixed wire from the second story
     down. */
  var lead = rows[0];
  if(lead){
    html += '<div class="lab"><b>Latest</b><i></i></div>'
      + '<div class="lead" data-news="'+esc(lead.id)+'"><div class="gfx">'
      + (lead.graphic_url ? '<img src="'+esc(lead.graphic_url)+'" alt="'+esc(lead.headline)+'">'
          : '<span class="bar"></span>'
            + (lead.kicker ? '<span class="k">'+esc(lead.kicker)+'</span>' : '')
            + '<span class="h">'+esc(lead.headline)+'</span>')
      + '</div><div class="under"><div class="ld">'+esc(lead.reporter||'UBA')+' \u00b7 '
      + esc(dstr(lead.posted_at))+'</div><div class="rd">Read</div></div></div>';
  }

  html += '<div class="lab"><b>The wire</b><i></i>'
    + (vids.length ? '<s>newest first</s>' : '') + '</div>';

  /* THE MIX, AND ITS CAP. Sorted purely by date the wire becomes mostly video:
     the channel uploads weekly and the last article was 2026-08-22, so on the
     numbers alone the writing would be buried under podcasts. NEVER MORE THAN
     ONE VIDEO BETWEEN ARTICLES -- videos already own the deck above, so the
     wire does not owe them the space. Any videos left over are simply not
     shown here; they are one swipe away. */
  var arts = rows.slice(1), vq = vids.slice(), feed = [], v;   /* the lead is above */
  while(arts.length){
    feed.push({ kind: 'a', it: arts.shift() });
    if(vq.length){ v = vq.shift(); feed.push({ kind: 'v', it: v }); }
  }
  /* Nothing written yet? Then the wire is the videos rather than empty. */
  if(!rows.length) feed = vq.map(function(x){ return { kind: 'v', it: x }; });

  html += feed.map(function(f){
    if(f.kind === 'v'){
      var n = f.it;
      return '<a class="wrow vid" href="https://youtu.be/' + esc(n.video_id) + '"'
        + ' target="_blank" rel="noopener">'
        + '<span class="wth">'
        + (n.thumb_url ? '<img src="'+esc(n.thumb_url)+'" alt="" loading="lazy" decoding="async">' : '')
        + '<span class="vplay sm"></span></span>'
        + '<span class="wb"><span class="k vk">Watch'
        + (n.event_name ? ' \u00b7 ' + esc(n.event_name) : '') + '</span>'
        + '<span class="h">' + esc(n.title) + '</span></span></a>';
    }
    var a = f.it;
    var first = (a.body || '').split('\n').filter(Boolean)[0] || '';
    if(first.length > 130) first = first.slice(0, 130).replace(/\s+\S*$/, '') + '\u2026';
    return '<div class="wrow" data-news="' + esc(a.id) + '">'
      + (a.kicker ? '<div class="k">' + esc(a.kicker) + '</div>' : '')
      + '<div class="h">' + esc(a.headline) + '</div>'
      + (first ? '<div class="b">' + esc(first) + '</div>' : '')
      + '<div class="d">' + esc(a.reporter || 'UBA') + ' \u00b7 ' + esc(dstr(a.posted_at)) + '</div></div>';
  }).join('');

  html += '<div class="foot">End of the wire &middot; ' + rows.length + ' posts'
    + (vids.length ? ' &middot; ' + vids.length + ' videos' : '') + '</div>';
  el.innerHTML = html;
}

/* ═══ FIGHTERS ═══════════════════════════════════════════════════════ */
/* UBA and GFL are the same table: every fighter row is league 'UBA', and what
   separates the two leagues is `level` — pro is UBA, amateur is GFL. 87 active
   pros against 360 amateurs, which is why an unfiltered list read as mostly
   strangers to anybody who follows the pro league. */
var allFighters = null, fFilter = 'all', fQuery = '', fShown = 40, fLevel = 'pro';

async function loadFighters(){
  if(allFighters) return;
  var path = "fighter_cards?select=id,display_name,slug,weight_class,headline_wins,headline_losses,"
    + "headline_draws,rank,is_champion,profile_photo_url,profile_photo_thumb_url,"
    + "team,nickname,status,level"
    + "&status=eq.active&order=rank.asc.nullslast&limit=600";
  /* Paint yesterday's roster before asking for today's. 445 tiles is the
     longest wait in the app and the list barely moves week to week. */
  var seed = cached(path);
  if(seed && seed.length){ allFighters = seed; fLabel(); renderFighters(); }
  var rows = await q(path);
  if(!rows && allFighters) return;   /* offline, and the cached grid is up */
  if(!rows){
    retryHandlers['fighters'] = function(){ allFighters = null; loadFighters(); };
    document.getElementById('f-grid').innerHTML =
      '<div style="grid-column:span 2">' + failHTML("Couldn't reach the league database.", 'fighters') + '</div>';
    return;
  }
  allFighters = rows;
  fLabel();
  renderFighters();
}
function filteredFighters(){
  var list = (allFighters || []).filter(function(f){ return f.level === fLevel; });
  if(fFilter === 'p4p')        list = list.filter(function(f){ return f.rank != null; });
  else if(fFilter === 'champ') list = list.filter(function(f){ return f.is_champion; });
  else if(fFilter !== 'all')   list = list.filter(function(f){ return f.weight_class === fFilter; });
  if(fQuery){
    var s = fQuery.toLowerCase();
    list = list.filter(function(f){
      return (f.display_name||'').toLowerCase().indexOf(s) > -1
          || (f.nickname||'').toLowerCase().indexOf(s) > -1
          || (f.team||'').toLowerCase().indexOf(s) > -1;
    });
  }
  return list.slice().sort(function(a,b){
    if(a.rank != null && b.rank != null) return a.rank - b.rank;
    if(a.rank != null) return -1;
    if(b.rank != null) return 1;
    return (b.headline_wins||0) - (a.headline_wins||0);
  });
}
function renderFighters(){
  var list = filteredFighters();
  var grid = document.getElementById('f-grid');
  if(!list.length){
    grid.innerHTML = '<div class="empty" style="grid-column:span 2">No fighters match that.</div>';
    document.getElementById('f-more').style.display = 'none';
    document.getElementById('f-foot').textContent = '';
    return;
  }
  grid.innerHTML = list.slice(0, fShown).map(function(f){
    // The initials sit underneath the photo rather than instead of it, so a
    // photo that 404s falls back to something instead of a blank card.
    var ini = '<span class="init">'+esc(initials(f.display_name))+'</span>';
    /* THE THUMBNAIL, not the photo. These tiles are 98px tall and the full
       images are ~2MB each against ~176KB for the thumb -- 11x. Ninety-two of
       them is roughly 190MB of photographs to fill one screen of 98px boxes,
       which is why the grid crawled. The thumbs have existed the whole time
       and `fighter_cards` simply did not select the column.
       `decoding="async"` keeps a big decode off the main thread, and the
       explicit width/height means the browser reserves the box before the
       bytes arrive rather than after. */
    var src = f.profile_photo_thumb_url || f.profile_photo_url;
    var art = src
      ? ini + '<img src="'+esc(src)+'" alt="" loading="lazy" decoding="async" '
            + 'width="180" height="98" onerror="this.remove()">'
      : ini;
    var belt = f.is_champion ? '<span class="bt">Champ</span>' : '';
    var rk = f.rank != null ? '<em>&middot; P4P '+f.rank+'</em>' : '<em>&middot; Unranked</em>';
    return '<a class="fcard'+(f.is_champion?' champ':'')+'" data-slug="'+esc(f.slug||'')+'"'
      + ' href="./f/'+encodeURIComponent(f.slug||'')+'.html">'
      + '<div class="foil"></div><div class="art">'+belt+art+'</div>'
      + '<div class="in"><div class="n">'+esc(f.display_name)+'</div>'
      + '<div class="w">'+esc(wc(f.weight_class))+'</div>'
      + '<div class="r">'+esc(recordOf(f))+' '+rk+'</div></div></a>';
  }).join('');
  var more = document.getElementById('f-more');
  more.style.display = list.length > fShown ? 'block' : 'none';
  document.getElementById('f-foot').textContent = 'Showing ' + Math.min(fShown, list.length) + ' of ' + list.length;
}
/* Two groups of buttons live in the same sticky row, so the handler has to
   clear only the group that was clicked. Clearing every button in the bar —
   which is what the single-group version did — would drop the league toggle's
   own highlight the moment somebody picked a weight class, and the bar would
   stop saying which league you are looking at. */
function fLabel(){
  document.getElementById('f-lab').textContent =
    (fLevel === 'amateur' ? 'GFL · ' : '')
    + (fFilter === 'p4p' ? 'Pound for pound' : fFilter === 'champ' ? 'Champions'
       : fFilter === 'all' ? 'All fighters' : wc(fFilter));
  document.getElementById('f-sub').textContent = fFilter === 'all' ? 'Ranked first' : '';
  var n = (allFighters || []).filter(function(f){ return f.level === fLevel; }).length;
  document.getElementById('f-count').textContent =
    n + ' ' + (fLevel === 'amateur' ? 'GFL' : 'UBA');
}
document.getElementById('f-chips').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;

  if(b.hasAttribute('data-l')){
    if(fLevel === b.getAttribute('data-l')) return;
    fLevel = b.getAttribute('data-l');
    document.getElementById('f-league').querySelectorAll('button')
      .forEach(function(x){ x.classList.toggle('on', x === b); });
    /* GFL is ranked by division and has no pound-for-pound list, so the chip
       is hidden there rather than offered and empty — and a filter that just
       became impossible falls back to All rather than showing nothing. */
    var p4p = this.querySelector('button[data-f="p4p"]');
    var gfl = fLevel === 'amateur';
    if(p4p) p4p.hidden = gfl;
    if(gfl && fFilter === 'p4p'){
      fFilter = 'all';
      this.querySelectorAll('button[data-f]').forEach(function(x){
        x.classList.toggle('on', x.getAttribute('data-f') === 'all'); });
    }
  } else {
    this.querySelectorAll('button[data-f]').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    fFilter = b.getAttribute('data-f');
  }

  fShown = 40;
  fLabel();
  renderFighters();
  panels.fighters.scrollTop = 0;
});
document.getElementById('f-search').addEventListener('input', function(){
  fQuery = this.value.trim(); fShown = 40; renderFighters();
});
document.getElementById('f-more').addEventListener('click', function(){ fShown += 40; renderFighters(); });

/* ═══ SHEETS ═════════════════════════════════════════════════════════
   One element, a stack of entries. A fighter can be opened from inside an
   event, and the phone's back gesture unwinds one layer at a time instead
   of dumping you out of the app — which is what a single-entry sheet did.
   ═══════════════════════════════════════════════════════════════════════ */
var sheetStack = [];

function sheetEl(){ return document.getElementById('sheet'); }

function hashFor(entry){
  return entry.kind === 'fighter' ? '#f/' + entry.id
       : entry.kind === 'news'    ? '#n/' + entry.id
       : entry.kind === 'event'   ? '#e/' + entry.id
       : entry.kind === 'events'  ? '#events'
       : entry.kind === 'wallet'   ? '#wallet'
       : entry.kind === 'contract' ? '#contract'
       : entry.kind === 'offers'   ? '#offers'
       : entry.kind === 'shop'     ? '#shop'
       : entry.kind === 'card'     ? '#c/' + entry.id
       : entry.kind === 'mybets'   ? '#mybets' : '';
}

function openSheet(entry){
  var el = sheetEl();
  sheetStack.push(entry);
  history.pushState({ depth: sheetStack.length }, '', hashFor(entry));
  el.classList.add('live');
  el.scrollTop = 0;
  el.setAttribute('aria-hidden','false');
  void el.offsetHeight;
  el.classList.add('shown');
  renderSheet(entry);
}

function closeSheet(){
  var el = sheetEl();
  sheetStack = [];
  el.classList.remove('shown');
  el.setAttribute('aria-hidden','true');
  setTimeout(function(){ if(!sheetStack.length) el.classList.remove('live'); }, 220);
}

/* Back unwinds ONE layer at a time: the top sheet first, then the tab you came
   from. Sheets are checked first because a sheet is always on top of a tab. */
window.addEventListener('popstate', function(){
  if(sheetStack.length){
    sheetStack.pop();
    if(sheetStack.length){ sheetEl().scrollTop = 0; renderSheet(sheetStack[sheetStack.length - 1]); }
    else closeSheet();
    return;
  }
  /* No sheet open, so this is a tab move. Read where we landed rather than
     assuming — the entry may be several steps back after a fast swipe. */
  var h = (location.hash || '').replace('#','');
  if(panels[h]) goTab(h, true);
  else if(currentTab !== 'home') goTab('home', true);
});

function backButton(){
  return '<button class="back" data-sheet-back aria-label="Back"><svg><use href="#i-back"/></svg></button>';
}
document.addEventListener('click', function(e){
  if(e.target.closest('[data-sheet-back]')) history.back();
});

/* a failure that says so, and offers a way out */
function failHTML(msg, retryId){
  return '<div class="fail"><p>'+esc(msg)+'</p>'
    + '<button data-retry="'+esc(retryId)+'">Try again</button></div>';
}
var retryHandlers = {};
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-retry]');
  if(!b) return;
  var fn = retryHandlers[b.getAttribute('data-retry')];
  if(fn) fn();
});

function renderSheet(entry){
  if(entry.kind === 'fighter') return renderFighter(entry.id);
  if(entry.kind === 'news')    return renderArticle(entry.id);
  if(entry.kind === 'event')   return renderEvent(entry.id);
  if(entry.kind === 'events')  return renderEvents();
  if(entry.kind === 'wallet')   return renderWallet();
  if(entry.kind === 'contract') return renderMyContract();
  if(entry.kind === 'offers')   return renderOffers();
  if(entry.kind === 'shop')     return renderShop();
  if(entry.kind === 'card')     return renderCard(entry.id);
  if(entry.kind === 'mybets')   return renderMyBets();
}

/* what opens a sheet */
document.addEventListener('click', function(e){
  if(e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  var f = e.target.closest('[data-slug]');
  if(f && f.getAttribute('data-slug')){ e.preventDefault(); openSheet({kind:'fighter', id:f.getAttribute('data-slug')}); return; }
  var n = e.target.closest('[data-news]');
  if(n){ e.preventDefault(); openSheet({kind:'news', id:n.getAttribute('data-news')}); return; }
  var ev = e.target.closest('[data-event]');
  if(ev){ e.preventDefault(); openSheet({kind:'event', id:ev.getAttribute('data-event')}); return; }
  if(e.target.closest('[data-all-events]')){ openSheet({kind:'events'}); return; }
  var be = e.target.closest('[data-bevent]');
  if(be){ e.preventDefault(); renderBetEvent(be.getAttribute('data-bevent')); return; }
  var cd = e.target.closest('[data-card]');
  if(cd && !e.target.closest('[data-rip]')){
    e.preventDefault(); openSheet({kind:'card', id: cd.getAttribute('data-card')}); return;
  }
  var hb = e.target.closest('[data-hub]');
  if(hb){ e.preventDefault(); openSheet({kind: hb.getAttribute('data-hub')}); return; }
  var bt = e.target.closest('[data-bout]');
  if(bt && !e.target.closest('[data-slug]') && !e.target.closest('a')){
    bt.classList.toggle('open'); return;
  }
});

/* ── fighter ── */
async function renderFighter(slug){
  var body = document.getElementById('sheet-body');
  var f = (allFighters || []).filter(function(x){ return x.slug === slug; })[0];
  if(!f){
    var got = await q("fighter_cards?select=id,display_name,slug,weight_class,headline_wins,"
      + "headline_losses,headline_draws,rank,is_champion,profile_photo_url,team,"
      + "nickname,country,gym&slug=eq." + encodeURIComponent(slug) + "&limit=1");
    if(!got){
      retryHandlers['fighter'] = function(){ renderFighter(slug); };
      body.innerHTML = '<div class="evhead">'+backButton()+'</div>' + failHTML("Couldn't load that fighter.", 'fighter');
      return;
    }
    f = got[0];
  }
  if(!f){ body.innerHTML = '<div class="evhead">'+backButton()+'</div>'
    + '<div class="empty">That fighter no longer exists.</div>'; return; }

  var art = f.profile_photo_url
    ? '<span class="init">'+esc(initials(f.display_name))+'</span>'
      + '<img src="'+esc(f.profile_photo_url)+'" alt="" onerror="this.remove()">'
    : '<span class="init">'+esc(initials(f.display_name))+'</span>';

  body.innerHTML =
      '<div class="hero">' + art + backButton()
    + '<div class="name">'
    + (f.is_champion ? '<span class="bt">Champion</span>' : '')
    + '<h2>'+esc(f.display_name)+'</h2>'
    + (f.nickname ? '<div class="nick">"'+esc(f.nickname)+'"</div>' : '')
    + '</div></div>'
    + '<div class="stats">'
    + '<div><b>'+(f.headline_wins||0)+'</b><s>wins</s></div>'
    + '<div><b>'+(f.headline_losses||0)+'</b><s>losses</s></div>'
    + '<div><b>'+(f.headline_draws||0)+'</b><s>draws</s></div>'
    + '<div><b>'+(f.rank != null ? f.rank : '—')+'</b><s>p4p</s></div>'
    + '</div>'
    + '<dl class="meta">'
    + '<dt>Division</dt><dd>'+esc(wc(f.weight_class))+'</dd>'
    + '<dt>Team</dt><dd>'+esc(f.team || 'Free agent')+'</dd>'
    + (f.country ? '<dt>From</dt><dd>'+esc(f.country)+'</dd>' : '')
    + (f.gym ? '<dt>Gym</dt><dd>'+esc(f.gym)+'</dd>' : '')
    + '</dl>'
    + '<div class="lab"><b>Fights</b><i></i></div>'
    + '<div id="sheet-bouts"><div class="skel"></div><div class="skel" style="width:70%"></div></div>';

  loadBouts(f);
}

async function loadBouts(f){
  var el = document.getElementById('sheet-bouts');
  if(!el || !f.id){ if(el) el.innerHTML = '<div class="empty">No fight history.</div>'; return; }
  var rows = await q("fighter_matches?select=won,method,opponent_name,opponent_slug,event_name,"
    + "event_date,status,is_title_fight&fighter_id=eq." + f.id
    + "&status=eq.completed&order=event_date.desc.nullslast&limit=15");
  if(!el.isConnected) return;
  if(!rows){
    retryHandlers['bouts'] = function(){ loadBouts(f); };
    el.innerHTML = failHTML("Couldn't load the fight history.", 'bouts'); return;
  }
  if(!rows.length){ el.innerHTML = '<div class="empty">No fights recorded yet.</div>'; return; }
  el.innerHTML = rows.map(function(b){
    return '<div class="bout"'+(b.opponent_slug ? ' data-slug="'+esc(b.opponent_slug)+'"' : '')+'>'
      + '<span class="wl '+(b.won?'w':'l')+'">'+(b.won?'W':'L')+'</span>'
      + '<div class="mid"><div class="op">'+esc(b.opponent_name || 'Unknown')+'</div>'
      + '<div class="ev">'+esc(b.event_name || '')+(b.event_date ? ' · '+esc(dstr(b.event_date)) : '')
      + (b.is_title_fight ? ' · title' : '')+'</div></div>'
      + '<span class="via">'+esc((b.method||'').toUpperCase())+'</span></div>';
  }).join('');
}

/* ── news article ── */
async function renderArticle(id){
  var body = document.getElementById('sheet-body');
  var got = (newsCache || []).filter(function(n){ return String(n.id) === String(id); });
  var n = got[0];
  if(!n){

async function renderEvents(){

async function loadCard(e){
  var el = document.getElementById('ev-bouts');
  if(!el) return;
  // event_matches is card-gated: an unpublished card returns nothing at all,
  // which is the point — so an empty result is "not announced", not an error.
  var rows = await q("event_matches?select=bout_number,card_segment,weight_class,bout_level,"
    + "is_title_fight,title_name,status,method,fighter_a_name,fighter_a_slug,fighter_b_name,"
    + "fighter_b_slug,winner_corner&event_id=eq." + e.id + "&order=bout_number.asc");
  if(!el.isConnected) return;
  if(!rows){
    retryHandlers['card'] = function(){ loadCard(e); };
    el.innerHTML = failHTML("Couldn't load the card.", 'card'); return;
  }
  if(!rows.length){
    el.innerHTML = '<div class="empty"><b>The card isn\'t announced yet.</b><br>'
      + 'Bouts appear here the moment it is published.</div>'; return;
  }
  // Pools come from bet_pools_public, which only carries OPEN and LOCKED
  // markets — locked on purpose, because a market locks when the bout starts
  // and that is exactly when the pool is most worth showing. Settled markets
  // drop out, so this is empty except around a live card. That is correct,
  // not a failure, so nothing is rendered when there is nothing.
  var pools = {};
  var poolRows = await q("bet_pools_public?select=match_id,side_a,side_b,total_a,total_b,pool,bets"
    + "&event_id=eq." + e.id);
  if(poolRows) poolRows.forEach(function(r){ pools[r.match_id] = r; });

  // EVERY fighter on the card, once. The tape needs their record, reach and
  // stance, and the bout needs their cut-out; one query covers both rather
  // than one per bout.
  var slugs = [];
  rows.forEach(function(b){
    [b.fighter_a_slug, b.fighter_b_slug].forEach(function(sl){
      if(sl && slugs.indexOf(sl) === -1) slugs.push(sl);
    });
  });
  var tape = {};
  if(slugs.length){
    var fs = await q("fighter_cards?select=slug,profile_photo_url,headline_wins,headline_losses,"
      + "headline_draws,height,reach,stance,country,headline_ko_wins&slug=in.(" + slugs.join(',') + ")");
    if(fs) fs.forEach(function(f){ tape[f.slug] = f; });
  }
  if(!el.isConnected) return;

  var order = ['main_card','featured','undercard','prelims'];
  var groups = {};
  rows.forEach(function(b){ (groups[b.card_segment || 'undercard'] = groups[b.card_segment || 'undercard'] || []).push(b); });
  var keys = order.filter(function(k){ return groups[k]; })
    .concat(Object.keys(groups).filter(function(k){ return order.indexOf(k) === -1; }));

  // DESIGN B: the UFC bout with the tale of the tape folded away behind it.
  //
  // NOTHING IS OPEN ON ARRIVAL. The first bout used to open itself, on the
  // theory that one worked example teaches the pattern without a caption. It
  // does not read that way: the card opens with ONE bout twice the height of
  // every other, which looks like a layout bug rather than an invitation, and
  // the row it pushes down is the rest of the card. The chevron plus the
  // words "Tale of the tape" are the affordance; they do not need a
  // demonstration.
  el.innerHTML = keys.map(function(k){
    return '<div class="seg">'+esc(SEGS[k] || k.replace(/_/g,' '))+'</div>'
      + groups[k].map(function(b){
          var mine = myFighter && (b.fighter_a_slug === myFighter.fighter_slug
                                || b.fighter_b_slug === myFighter.fighter_slug);
          var done = b.status === 'completed' && b.winner_corner;
          var A = tape[b.fighter_a_slug] || {}, Bf = tape[b.fighter_b_slug] || {};
          return '<div class="bout3'+(mine?' you':'')+'" data-bout>'
            + (mine ? '<span class="youtag">Your bout</span>' : '')
            + '<div class="wc4">'
            + esc(b.is_title_fight ? (b.title_name || 'Title fight')
                                   : (wc(b.weight_class) || 'Catch weight')) + '</div>'
            + '<div class="duo2">'
            + corner(A, b.fighter_a_slug, done && b.winner_corner === 'a', '')
            + '<span class="vsx2">' + (done ? esc((b.method||'').toUpperCase() || 'RESULT') : 'VS') + '</span>'
            + corner(Bf, b.fighter_b_slug, done && b.winner_corner === 'b', 'flip')
            + '</div>'
            + '<div class="nms2">'
            + '<b class="' + (done && b.winner_corner === 'a' ? 'win' : '') + '"'
            + (b.fighter_a_slug ? ' data-slug="'+esc(b.fighter_a_slug)+'"' : '') + '>'
            + esc(b.fighter_a_name || 'TBA') + '</b>'
            + '<b class="' + (done && b.winner_corner === 'b' ? 'win' : '') + '"'
            + (b.fighter_b_slug ? ' data-slug="'+esc(b.fighter_b_slug)+'"' : '') + '>'
            + esc(b.fighter_b_name || 'TBA') + '</b></div>'
            + '<div class="recs2"><s>'+rec(A)+'</s><s>'+rec(Bf)+'</s></div>'
            + poolHTML(pools[b.match_id])
            + '<div class="tape2">' + tapeRows(A, Bf) + '</div>'
            + '<div class="more2"><span>Tale of the tape</span><i>&#9662;</i></div>'
            + '</div>';
        }).join('');
  }).join('') + '<div class="foot">'+rows.length+' bouts</div>';
}

function rec(f){
  if(f.headline_wins == null) return '&mdash;';
  return (f.headline_wins||0) + '-' + (f.headline_losses||0)
       + (f.headline_draws ? '-' + f.headline_draws : '');
}
function corner(f, slug, won, flip){
  var inner = f.profile_photo_url
    ? '<img class="cut2 ' + flip + '" src="' + esc(f.profile_photo_url) + '" alt="">'
    : '<svg class="sil2" viewBox="0 0 60 100" preserveAspectRatio="xMidYMax meet">'
      + '<circle cx="30" cy="21" r="14"/>'
      + '<path d="M30 38c-14 0-24 9-26 22l-4 40h60l-4-40c-2-13-12-22-26-22z"/></svg>';
  return '<span class="pw2' + (won ? ' win' : '') + '"'
       + (slug ? ' data-slug="' + esc(slug) + '"' : '') + '>' + inner + '</span>';
}
/* Height comes back in inches. A row where NEITHER fighter has the value is
   left out entirely rather than printed as two dashes — most of the roster
   has no reach or stance, and six empty rows is not a tale of the tape. */
function inches(v){
  var n = Number(v); if(!isFinite(n) || !n) return null;
  return Math.floor(n/12) + "' " + (n%12) + '"';
}
function tapeRows(A, B){
  var rows = [
    ['Record', rec(A) === '&mdash;' ? null : rec(A), rec(B) === '&mdash;' ? null : rec(B)],
    ['Height', inches(A.height), inches(B.height)],
    ['Reach',  A.reach ? Math.round(A.reach)+'"' : null, B.reach ? Math.round(B.reach)+'"' : null],
    ['Stance', A.stance, B.stance],
    ['By KO',  A.headline_ko_wins != null ? String(A.headline_ko_wins) : null,
               B.headline_ko_wins != null ? String(B.headline_ko_wins) : null],
    ['From',   A.country, B.country]
  ].filter(function(r){ return r[1] || r[2]; });
  if(!rows.length) return '<div class="notape">No tape on either corner yet.</div>';
  return rows.map(function(r){
    return '<div class="tr2"><b class="l">'+esc(r[1] || '—')+'</b>'
         + '<s>'+esc(r[0])+'</s>'
         + '<b class="r">'+esc(r[2] || '—')+'</b></div>';
  }).join('');
}

/* Pari-mutuel with no rake: back a side and you take a share of the WHOLE
   pot, so the multiplier is pool / that side's total. It moves as people
   bet, which is why it is drawn as a split bar rather than fixed odds. */
function poolHTML(p){
  if(!p) return '';
  var a = Number(p.total_a || 0), b = Number(p.total_b || 0), tot = a + b;
  if(!tot){
    return '<div class="pool"><div class="none">Betting open · no bets yet</div></div>';
  }
  var pa = Math.round(a / tot * 100);
  var mult = function(side){ return side > 0 ? '×' + (tot / side).toFixed(2) : '—'; };
  return '<div class="pool">'
    + '<div class="bar2"><i class="a" style="width:'+pa+'%"></i><i class="b" style="width:'+(100-pa)+'%"></i></div>'
    + '<div class="nums">'
    + '<span class="la">'+a.toLocaleString()+' · '+mult(a)+'</span>'
    + '<span class="mid3">'+Number(p.bets||0)+' bets · '+tot.toLocaleString()+' VC</span>'
    + '<span class="lb">'+mult(b)+' · '+b.toLocaleString()+'</span>'
    + '</div></div>';
}

/* ═══ AUTH — Discord, via Supabase ═══════════════════════════════════
   Raw endpoints rather than supabase-js, matching how every other page
   in this repo talks to Supabase. */
var session = null;

function readHashSession(){
  if(!location.hash || location.hash.indexOf('access_token') === -1) return null;
  var p = new URLSearchParams(location.hash.slice(1));
  var tok = p.get('access_token');
  if(!tok) return null;
  var s = {
    access_token: tok,
    refresh_token: p.get('refresh_token'),
    expires_at: Date.now() + (parseInt(p.get('expires_in'),10) || 3600) * 1000
  };
  history.replaceState(null, '', location.pathname + location.search);
  return s;
}
function saveSession(s){
  session = s;
  try{ s ? localStorage.setItem('uba.session', JSON.stringify(s)) : localStorage.removeItem('uba.session'); }catch(e){}
}
/* A2 — Supabase's JWT lasts 3600s. The refresh token was being STORED and
   never spent, so everybody was signed out after an hour with no explanation
   and no way to tell from the UI. Refreshed ahead of expiry and again on any
   401, with a single in-flight guard so a burst of parallel reads cannot
   trigger a burst of refreshes. */
var refreshInFlight = null;
async function refreshSession(){
  if(!session || !session.refresh_token) return false;
  if(refreshInFlight) return refreshInFlight;
  refreshInFlight = (async function(){
    try{
      var r = await fetch(SB + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST',
        headers: { apikey: KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: session.refresh_token })
      });
      if(!r.ok){ refreshInFlight = null; return false; }
      var d = await r.json();
      if(!d || !d.access_token){ refreshInFlight = null; return false; }
      saveSession({
        access_token: d.access_token,
        refresh_token: d.refresh_token || session.refresh_token,
        expires_at: Date.now() + ((d.expires_in || 3600) * 1000)
      });
      refreshInFlight = null;
      return true;
    }catch(e){ refreshInFlight = null; return false; }
  })();
  return refreshInFlight;
}

/* Renew before it bites rather than after. */
async function ensureFreshSession(){
  if(!session) return false;
  if(session.expires_at && session.expires_at - Date.now() > 5 * 60 * 1000) return true;
  return refreshSession();
}

function loadSession(){
  var s = readHashSession();
  if(s){ saveSession(s); return s; }
  try{
    var raw = localStorage.getItem('uba.session');
    if(!raw) return null;
    var p = JSON.parse(raw);
    // Keep an EXPIRED session if it still carries a refresh token — throwing
    // it away is what made people sign in again every hour.
    if(p && (p.expires_at > Date.now() || p.refresh_token)) { session = p; return p; }
    localStorage.removeItem('uba.session');
  }catch(e){}
  return null;
}
function signIn(){
  var back = location.origin + location.pathname;
  location.href = SB + '/auth/v1/authorize?provider=discord&redirect_to=' + encodeURIComponent(back);
}
function signOut(){
  saveSession(null); me = null; myFighter = null; myBout = null;
  renderYou(); renderCards(); paintAvatar(); renderJoinSlot(); renderHomeHeader();
}

/* Who is looking, resolved once at boot and after sign-in. Every screen that
   changes per person reads these two rather than querying again. */
async function loadWhoAmI(){
  myFighter = null; myBout = null;
  if(!me) return;
  var prof = await qMe("my_profile?select=fighter_slug,fighter_name&limit=1");
  if(prof && prof.length && prof[0].fighter_slug) myFighter = prof[0];
  if(!myFighter) return;
  var bout = await qMe("my_next_bout?select=*&order=event_date.asc&limit=1");
  if(bout && bout.length) myBout = bout[0];
}
/* This is the only call that DELETES a session, and it was the only one that
   never renewed one first. loadSession() keeps an expired session on purpose
   when it still carries a refresh token — then this ran two lines later at
   boot, sent the dead JWT to /auth/v1/user, got a 401 and wiped localStorage,
   spending nothing. Every reload an hour after signing in was a sign-in. Same
   root cause as A2; that fix reached q() and rpc() and never reached boot.
   Renew first, and treat a 401 as "try the refresh token" rather than as
   proof the session is gone — the tokens rotate, and a stale access token is
   the expected state on a cold load, not a failure. */
async function fetchMe(isRetry){
  if(!session) return null;
  if(!isRetry && !(await ensureFreshSession())) { saveSession(null); return null; }
  try{
    var r = await fetch(SB + '/auth/v1/user', {
      headers:{ apikey: KEY, Authorization: 'Bearer ' + session.access_token }
    });
    if(r.status === 401 && !isRetry){
      if(await refreshSession()) return fetchMe(true);
      saveSession(null); return null;
    }
    /* Anything that is not a 401 is the SERVER having a bad day, not you being
       signed out. Wiping the session on a 500 or an offline fetch is how a
       thirty-second outage becomes a sign-in for everybody who reloaded. */
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}
