.tr2 b{font-size:14px;font-weight:600}
.tr2 b.l{text-align:right;padding-right:12px;color:#F19C96}
.tr2 b.r{text-align:left;padding-left:12px;color:#8FC6FF}
.tr2 s{text-decoration:none;text-align:center;font-family:'Space Mono',monospace;font-size:7.5px;
  font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6E6688}
.notape{padding:10px 0;text-align:center;font-family:'Space Mono',monospace;font-size:8px;
  letter-spacing:.08em;color:#6E6688}
.more2{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 0 11px;
  font-family:'Space Mono',monospace;font-size:7.5px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:#7E7699;cursor:pointer}
.more2 i{font-style:normal;transition:transform .3s}
.bout3.open .more2 i{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.tape2{transition:none}.more2 i{transition:none}}

.allev{display:block;width:100%;margin:9px 0 0;text-align:center;border:1px solid rgba(255,255,255,.2);
  border-radius:7px;padding:10px 0;font-family:'Space Mono',monospace;font-size:9px;font-weight:700;
  letter-spacing:.15em;text-transform:uppercase;color:#C3A6FF}
.evrow{margin:0 14px 8px;padding:12px 13px;border-radius:11px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);position:relative;cursor:pointer}
.evrow.live{border-color:rgba(232,54,43,.5);background:linear-gradient(90deg,rgba(232,54,43,.14),transparent)}
.evrow.past{opacity:.72}
.evrow .en{font-family:'Bebas Neue',sans-serif;font-size:21px;line-height:1;letter-spacing:.02em}
.evrow .ew{font-family:'Space Mono',monospace;font-size:8px;color:#8B83AC;margin-top:5px}
.evrow .est{position:absolute;right:12px;top:12px;font-family:'Space Mono',monospace;font-size:6.5px;
  font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#9990B4}
.evrow.live .est{color:#FFB4AE}

/* ── MY CAREER ────────────────────────────────────────────────────────
   One block that says who you are in the league, then rooms. The rank gets
   the biggest type on the screen because it is the number a fighter actually
   chases; the name sits beside it rather than above it, so the two read as
   one identity instead of a heading and a stat. */
.crd{margin:4px 14px 0;border-radius:16px;position:relative;overflow:hidden;
  background:linear-gradient(155deg,#4C3F8A 0%,#2A2150 46%,#171130 100%);
  border:1px solid rgba(245,200,66,.38)}
.crd:before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.03) 22px 24px)}
.crd .glow{position:absolute;right:-46px;top:-46px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,200,66,.3),transparent 68%)}
.crd .cin{position:relative;padding:15px}
/* CENTRED, not top-aligned. The rank column is a 60px numeral and everything
   beside it -- the name, the portrait -- is half that, so flex-start pinned
   them to the top and left a void along the bottom edge of the pill under the
   name and the face. Centring spends that space instead of leaving it. */
.crd .crt{display:flex;align-items:center;gap:13px}
.crd .rnk{text-align:center;flex-shrink:0;min-width:52px}
.crd .rnk .h{font-family:'Space Mono',monospace;font-size:6.5px;letter-spacing:.2em;color:#C0A85E}
.crd .rnk .num{font-family:'Bebas Neue',sans-serif;font-size:60px;line-height:.8;color:#F5C842;
  text-shadow:0 0 24px rgba(245,200,66,.4)}
.crd .rnk .of{font-family:'Space Mono',monospace;font-size:6.5px;letter-spacing:.14em;
  color:#C0A85E;margin-top:4px}
/* An unranked fighter still has a record, so the column changes what it shows
   rather than going blank — a blank slot reads as a bug. */
.crd .rnk.unranked .num{font-size:34px;line-height:1.4}
.crd .rnk.fan .ava{width:52px;height:52px;border-radius:50%;overflow:hidden;margin-top:6px;
  background:linear-gradient(150deg,#7B6AA8,#3A2E63)}
.crd .rnk.fan .ava img{width:100%;height:100%;object-fit:cover;display:block}
/* THE PORTRAIT, on the right, AS A CUT-OUT -- no circle. These are full
   figures on transparent backgrounds, the same renders the home fan and the
   fighter cards use, so cropping one to a 62px disc threw away the whole
   picture to show a head. It stands on the pill's bottom edge instead and is
   clipped by the pill itself (.crd is overflow:hidden), so it reads as the
   fighter standing in the card rather than a passport photo pasted on it.

   The silhouette fallback keeps its disc, because a lone icon floating with
   no frame reads as a missing image rather than a placeholder -- and 356 of
   448 fighters have no photo, so the fallback is the common case. */
/* The bleed is DOWNWARD only. A negative top margin pushed this box above the
   pill, and `contain` then fitted the figure into a box whose top was outside
   the card -- so the head was cut even though nothing was asking it to be. */
.crd .pfp{width:86px;flex-shrink:0;align-self:stretch;position:relative;
  margin:0 -8px -15px 0;min-height:96px}
.crd .pfp img{position:absolute;right:0;bottom:0;width:100%;height:100%;
  object-fit:contain;object-position:bottom center;display:block;
  filter:drop-shadow(0 6px 14px rgba(6,4,20,.6))}
.crd .pfp.none{width:62px;height:62px;align-self:center;min-height:0;
  margin:0;border-radius:50%;overflow:hidden;
  background:linear-gradient(150deg,#7B6AA8,#3A2E63);
  border:2px solid rgba(245,200,66,.45)}
.crd .pfp svg{position:absolute;left:50%;top:52%;width:30px;height:30px;
  margin:-15px 0 0 -15px;stroke:rgba(233,226,255,.55);fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.crd .pfp img + svg{display:none}
.crd.tap{cursor:pointer}
.crd .who{flex:1;min-width:0}
.crd .nm4{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;
  text-transform:uppercase;letter-spacing:.02em;line-height:.98;
  overflow-wrap:anywhere}
.crd .sub4{font-family:'Space Mono',monospace;font-size:7.5px;letter-spacing:.12em;
  text-transform:uppercase;color:#B7AEDC;margin-top:6px}
.crd .chips{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.crd .chip{font-family:'Space Mono',monospace;font-size:6.5px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;border-radius:20px;padding:4px 8px;color:#2A1F00;
  background:linear-gradient(90deg,#F5C842,#D6A81F)}
.crd .chip.p{background:none;color:#C3A6FF;border:1px solid rgba(167,139,250,.5)}
.crd .chip.g{background:none;color:#6EE7B7;border:1px solid rgba(110,231,183,.45)}
.crd .fbar{display:flex;gap:3px;margin-top:12px}
.crd .fbar i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.14)}
.crd .fbar i.w{background:#6EE7B7}
.crd .fbar i.l{background:#F19C96}
.crd .fbar i.d{background:#8B83AC}
.crd .fbl{display:flex;justify-content:space-between;margin-top:6px;
  font-family:'Space Mono',monospace;font-size:6.5px;letter-spacing:.12em;
  text-transform:uppercase;color:#B7AEDC}

/* THE TWIN STRIPS — dark glass with one lit edge, and the count as the red
   dot everybody's phone already trained them to look for. 44px, because the
   first version was 104px tall to say two words. */
.twin{display:flex;gap:8px;margin:0 14px}
.twin .tw{flex:1;min-width:0;border-radius:11px;overflow:hidden;position:relative;
  background:rgba(12,8,25,.8);border:1px solid rgba(255,255,255,.1);cursor:pointer}
.twin .tw:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;z-index:3}
.twin .tw.g:before{background:#F5C842;box-shadow:0 0 16px 2px rgba(245,200,66,.7)}
.twin .tw.p:before{background:#A78BFA;box-shadow:0 0 16px 2px rgba(167,139,250,.65)}
/* Nothing waiting: same strip, same place, lit edge dimmed and no red count.
   It reads as a door that happens to be quiet, not as an error. */
.twin .tw.quiet{opacity:.62}
.twin .tw.quiet:before{box-shadow:none;opacity:.5}
.twin .core{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 13px}
.twin .tic{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:14px;position:relative}
.twin .tw.g .tic{background:rgba(245,200,66,.18)}
.twin .tw.p .tic{background:rgba(167,139,250,.18)}
.twin .tic .dot{position:absolute;right:-5px;top:-5px;min-width:16px;height:16px;border-radius:8px;
  background:#E8362B;color:#fff;font-family:'Space Mono',monospace;font-size:8px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
  box-shadow:0 0 0 2.5px rgba(12,8,25,.98)}
.twin .bd{min-width:0}
.twin .t{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;
  text-transform:uppercase;letter-spacing:.04em;line-height:1}
.twin .s{font-family:'Space Mono',monospace;font-size:6.5px;color:#8B83AC;margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* THE ROOMS. The number on the right is the point: it turns a menu into a
   dashboard, so the screen can be read without opening anything. */
.mrow{display:flex;align-items:center;gap:12px;margin:0 14px 7px;padding:12px 14px;border-radius:12px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.11);cursor:pointer}
.mrow .mic{width:32px;height:32px;border-radius:9px;flex-shrink:0;background:rgba(167,139,250,.2);
  display:flex;align-items:center;justify-content:center;font-size:15px}
.mrow .t{font-size:14.5px;font-weight:600}
.mrow .s{font-family:'Space Mono',monospace;font-size:7.5px;color:#7E7699;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .rr{margin-left:auto;display:flex;align-items:center;gap:9px;flex-shrink:0}
.mrow .rr .v{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:#F5C842;
  font-variant-numeric:tabular-nums}
.mrow .rr .v.g{color:#6EE7B7}
.mrow .rr .v.q{color:#8B83AC;font-size:9px}
.mrow .rr .c{color:#6E6688;font-size:19px}

/* WHAT YOU ARE IN — real posters, and a play badge when there is a VOD. */
.mrail{display:flex;gap:8px;margin:0 14px;overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch}
.mrail::-webkit-scrollbar{display:none}
.mrail .mt{width:96px;flex-shrink:0;display:block;color:inherit;text-decoration:none}
.mrail .th{display:block;height:128px;border-radius:9px;position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.14);background:#221B3F}
.mrail .th.noart{background:linear-gradient(160deg,#4C3F8A,#221C44)}
.mrail .th img{width:100%;height:100%;object-fit:cover;display:block}
.mrail .th:after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 46%,rgba(8,5,18,.9))}
.mrail .nm3{position:absolute;left:7px;right:7px;bottom:7px;z-index:2;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;line-height:1;
  text-transform:uppercase;letter-spacing:.02em}
.mrail .pl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);
  border:1.5px solid rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;
  font-size:10px;padding-left:2px}
.mrail .cp{display:block;font-family:'Space Mono',monospace;font-size:6.5px;letter-spacing:.1em;
  text-transform:uppercase;color:#7E7699;margin-top:6px;line-height:1.4}

/* ── BETTING ──────────────────────────────────────────────────────────
   Two levels: what is open, then one card. A card is five to fifteen bouts,
   so a flat board is forty rows of scroll. */
/* The hero. One number at a time — what you staked, then what it pays — because
   two big numbers side by side read as a table and this block is a headline.
   The digits ROLL rather than the block turning over: a card flip hides the
   number for a quarter of a second, and that number is why the tab was opened. */
.bhero{margin:2px 16px 10px;padding:16px 34px 16px 16px;border-radius:16px;position:relative;
  cursor:pointer;border:1px solid rgba(110,231,183,.34);
  background:linear-gradient(155deg,rgba(110,231,183,.18),rgba(20,14,38,.9));
  animation:btint 8s infinite}
.bhero .chev{position:absolute;right:13px;top:50%;transform:translateY(-50%);
  color:#6EE7B7;font-size:26px;line-height:0;animation:barw 8s infinite}
@keyframes btint{
  0%,40%  {border-color:rgba(110,231,183,.34);
           background:linear-gradient(155deg,rgba(110,231,183,.18),rgba(20,14,38,.9))}
  52%,88% {border-color:rgba(245,200,66,.36);
           background:linear-gradient(155deg,rgba(245,200,66,.16),rgba(20,14,38,.9))}
  100%    {border-color:rgba(110,231,183,.34);
           background:linear-gradient(155deg,rgba(110,231,183,.18),rgba(20,14,38,.9))}
}
@keyframes barw{0%,40%{color:#6EE7B7}52%,88%{color:#F5C842}100%{color:#6EE7B7}}
.bhero .lin{position:relative;height:9px}
.bhero .lin span{position:absolute;left:0;top:0;white-space:nowrap;
  font-family:'Space Mono',monospace;font-size:7.5px;letter-spacing:.2em;
  text-transform:uppercase;color:#8FD9BE}
.bhero .lin.two span{font-size:7px;letter-spacing:.13em;color:#5C8874}
.bhero .lin span.a{animation:bfa 8s infinite}
.bhero .lin span.b{animation:bfb 8s infinite;color:#D6B463}
.bhero .lin.two span.b{color:#8A7546}
@keyframes bfa{0%,40%{opacity:1}48%,88%{opacity:0}96%,100%{opacity:1}}
@keyframes bfb{0%,40%{opacity:0}48%,88%{opacity:1}96%,100%{opacity:0}}
.bhero .num{display:flex;align-items:baseline;margin:5px 0 9px;height:44px}
.bhero .dig{display:block;height:44px;overflow:hidden}
.bhero .dig u{display:block;text-decoration:none;font-family:'Bebas Neue',sans-serif;
  font-size:50px;line-height:44px;animation:broll 8s infinite}
.bhero .dig i{display:block;font-style:normal;height:44px}
.bhero .dig i.a{color:#6EE7B7}
.bhero .dig i.b{color:#F5C842}
@keyframes broll{0%,40%{transform:translateY(0)}50%,88%{transform:translateY(-44px)}
  98%,100%{transform:translateY(0)}}
.bhero .vcx{font-family:'Space Mono',monospace;font-size:12px;color:#4E9B80;margin-left:6px;
  animation:bvc 8s infinite}
@keyframes bvc{0%,40%{color:#4E9B80}52%,88%{color:#8A7546}100%{color:#4E9B80}}

/* Nothing riding, so nothing to flip. The block stops being money and becomes
   the next card — motion only ever means you have something on the line. */
.bhero.still{animation:none;cursor:pointer;border-color:rgba(167,139,250,.34);
  background:linear-gradient(155deg,rgba(167,139,250,.16),rgba(20,14,38,.9))}
.bhero.still .chev{animation:none;color:#C3A6FF}
.bhero.still .lin span{color:#C3A6FF}
.bhero.still .lin.two span{color:#8B83AC}
.bhero .nx{font-family:'Bebas Neue',sans-serif;font-size:42px;line-height:.88;
  margin:6px 0 10px;color:#EFEAFF}

/* Your money, one strip per event, a pill per bet, scrolled sideways. A single
   block listing fifteen bets is a page of scroll before the markets; a strip is
   44px whether you have two bets or twenty, and every one stays reachable. */
.bstrip{margin:0 0 10px}
.bstrip .eh{display:flex;align-items:center;gap:7px;margin:0 16px 7px;
  font-family:'Space Mono',monospace;font-size:6.5px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:#FFB4AE}
.bstrip .eh .dot{width:6px;height:6px;border-radius:50%;background:#E8362B;flex-shrink:0}
.bstrip .eh s{margin-left:auto;text-decoration:none;color:#FFD9D5;letter-spacing:.1em}
.bstrip.live2 .eh{color:#C9BCF5}
.bstrip.live2 .eh .dot{background:#A78BFA}
.bstrip.live2 .eh s{color:#B8AEDA}
.bstrip .row{display:flex;gap:6px;margin:0 16px;overflow-x:auto;scrollbar-width:none;
  padding-bottom:2px}
.bstrip .row::-webkit-scrollbar{display:none}
.bpill{flex-shrink:0;display:flex;align-items:stretch;border-radius:9px;overflow:hidden;
  cursor:pointer;white-space:nowrap;border:1px solid rgba(232,54,43,.45)}
.bpill .l{padding:8px 10px;background:rgba(232,54,43,.16);display:flex;flex-direction:column;
  justify-content:center}
.bpill .l b{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13.5px;
  text-transform:uppercase;letter-spacing:.02em;line-height:1}
.bpill .l s{text-decoration:none;font-family:'Space Mono',monospace;font-size:5.5px;
  color:#D2A8A4;letter-spacing:.08em;margin-top:2px}
.bpill .r{padding:8px 10px;background:rgba(20,14,38,.7);text-align:right;display:flex;
  flex-direction:column;justify-content:center;border-left:1px solid rgba(232,54,43,.32)}
.bpill .r b{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:#F5C842;
  line-height:1}
.bpill .r s{text-decoration:none;font-family:'Space Mono',monospace;font-size:5.5px;
  color:#D2A8A4;margin-top:3px}
.bpill.open2{border-color:rgba(167,139,250,.45)}
.bpill.open2 .l{background:rgba(167,139,250,.16)}
.bpill.open2 .r{border-left-color:rgba(167,139,250,.32)}
.bpill.open2 .l s,.bpill.open2 .r s{color:#B8AEDA}

/* Shown only when nothing is riding — otherwise the strips are the story. */
.brec{display:flex;margin:0 16px 8px;padding:12px 14px;border-radius:12px;cursor:pointer;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12)}
.brec div{flex:1;text-align:center}
.brec b{display:block;font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1}
.brec s{display:block;text-decoration:none;font-family:'Space Mono',monospace;font-size:7.5px;
  color:#8B83AC;margin-top:5px}

/* level one — a card per row */
.evbet{display:flex;align-items:center;gap:11px;margin:0 16px 8px;padding:12px 14px;
  border-radius:12px;cursor:pointer;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12)}
.evbet.dim{opacity:.5;cursor:default}
.evbet .eb1{flex:1;min-width:0}
.evbet .en2{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.02em;line-height:1}
.evbet .es2{font-family:'Space Mono',monospace;font-size:7.5px;color:#8B83AC;margin-top:5px}
.evbet .minetag{flex-shrink:0;font-family:'Space Mono',monospace;font-size:6.5px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:#06281D;background:#6EE7B7;
  border-radius:20px;padding:3px 8px}
.evbet .chev{color:#6E6688;font-size:20px}
.betback{display:block;margin:2px 16px 4px;font-family:'Space Mono',monospace;font-size:8px;
  font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#C3A6FF;background:none;
  border:1px solid rgba(167,139,250,.35);border-radius:20px;padding:7px 13px;cursor:pointer}

/* level two — one bout's board */
.board{margin:0 16px 10px;border-radius:12px;overflow:hidden;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
.board.mine{border-color:rgba(110,231,183,.4)}
.board .bh{display:flex;align-items:center;gap:7px;padding:8px 12px;background:rgba(0,0,0,.25);
  font-family:'Space Mono',monospace;font-size:6.5px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;color:#8B83AC}
.board .bh s{margin-left:auto;text-decoration:none}
.brow{display:flex;align-items:center;gap:9px;padding:9px 12px;position:relative;
  border-top:1px solid rgba(255,255,255,.07)}
.brow.yours{background:linear-gradient(90deg,rgba(110,231,183,.14),transparent)}
.brow.yours:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#6EE7B7}
.brow .who{flex:1;min-width:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:17px;text-transform:uppercase;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .pcts{width:64px;flex-shrink:0}
.brow .pb{height:4px;border-radius:2px;background:rgba(0,0,0,.45);overflow:hidden}
.brow .pb i{display:block;height:100%;background:#A78BFA;border-radius:2px}
.brow .pn{font-family:'Space Mono',monospace;font-size:6px;color:#8B83AC;margin-top:3px;text-align:right}
.brow .odd{width:62px;flex-shrink:0;text-align:right;font-family:'Space Mono',monospace;
  font-size:13px;font-weight:700;color:#6EE7B7;font-variant-numeric:tabular-nums}
.brow .odd em{font-style:normal;display:block;font-size:5.5px;letter-spacing:.1em;color:#5F5880}
.board .stakeline{padding:7px 12px 9px;border-top:1px solid rgba(110,231,183,.22);
  background:rgba(110,231,183,.07);display:flex;align-items:center;gap:9px;
  font-family:'Space Mono',monospace;font-size:7.5px;letter-spacing:.1em;
  text-transform:uppercase;color:#8FD9BE}
.board .stakeline b{color:#6EE7B7;font-size:10px}
.board .stakeline s{margin-left:auto;text-decoration:none;color:#6EE7B7;font-size:10px}
.board .picks{padding:9px 12px 11px;border-top:1px dashed rgba(255,255,255,.1)}
.board .stake{padding:0 12px 11px}

/* the sheet */
.summ{display:flex;gap:8px;margin:16px 16px 4px}
.summ div{flex:1;padding:11px 6px;border-radius:11px;text-align:center;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.summ b{display:block;font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1}
.summ b.g{color:#6EE7B7}.summ b.r{color:#F19C96}
.summ s{display:block;text-decoration:none;font-family:'Space Mono',monospace;font-size:6px;
  letter-spacing:.12em;text-transform:uppercase;color:#8B83AC;margin-top:5px}
.mbet{display:flex;align-items:center;gap:10px;margin:0 16px 7px;padding:10px 12px;
  border-radius:11px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12)}
.mbet .st2{width:5px;align-self:stretch;border-radius:3px;background:#A78BFA;flex-shrink:0}
.mbet.lock .st2{background:#E8362B}
.mbet.won .st2{background:#6EE7B7}
.mbet.lost .st2{background:#F19C96}
.mbet .t{font-size:14px;font-weight:600}
.mbet .s{font-family:'Space Mono',monospace;font-size:7px;color:#7E7699;margin-top:3px}
.mbet .amt{margin-left:auto;text-align:right;flex-shrink:0}
.mbet .amt b{display:block;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:#F5C842}
.mbet .amt s{display:block;text-decoration:none;font-family:'Space Mono',monospace;
  font-size:6.5px;color:#7E7699;margin-top:2px}
.mbet.won .amt b{color:#6EE7B7}
.mbet.lost .amt b{color:#F19C96}

/* ── THINGS THAT WRITE ────────────────────────────────────────────────
   Every button here spends something or commits you to something, so they
   are the only filled buttons in the app. Everything else is a row or an
   outline; when a control is solid, it does something you cannot undo by
   pressing back. */
.acts{display:flex;gap:8px;margin:11px 0 0}
.acts.one{margin:10px 16px 0}
.act{flex:1;border-radius:9px;padding:11px 0;text-align:center;
  font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;cursor:pointer;border:1px solid transparent}
.act.yes{background:linear-gradient(90deg,#6EE7B7,#37B98C);color:#06281D}
.act.mid{background:none;border-color:rgba(245,200,66,.5);color:#F5C842}
/* Never filled. Decline is the one button here that takes something away, so
   it stays quieter than the two beside it rather than competing with them. */
.act.no{background:none;border-color:rgba(241,156,150,.45);color:#F19C96}
.act.buy{flex:none;margin-top:7px;padding:8px 16px;
  background:linear-gradient(90deg,#F5C842,#D6A81F);color:#2A1F00}
.act.pick{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:#EFEAFF;
  font-size:10px;letter-spacing:.06em;text-transform:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act.pick.on{background:linear-gradient(90deg,#A78BFA,#7C5CE0);border-color:transparent;color:#150F2E}
.act.place{flex:none;padding:11px 18px;background:linear-gradient(90deg,#F5C842,#D6A81F);color:#2A1F00;
  max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Combined 2026-09-01: the shared press block also targets .act:active with a
   scale, and this rule sits later at the same specificity, so it silently won
   and the scale never applied. Both live here now rather than in two places. */
.act:active{transform:translateY(1px) scale(.94);filter:brightness(1.28)}
/* The nav bar is <button>s, so anything that targets `button` would catch it.
   Nothing does any more -- this rule is the guard that keeps it that way. */
.bar button:active{transform:none;filter:none;box-shadow:none}
.act[disabled],.act.working{opacity:.55;pointer-events:none}

.picks{display:flex;gap:8px;margin-top:11px}
.picks.off{display:block;text-align:center;font-family:'Space Mono',monospace;font-size:8px;
  letter-spacing:.12em;text-transform:uppercase;color:#7E7699;padding:9px 0 2px}
.stake{margin-top:9px;padding-top:9px;border-top:1px solid rgba(255,255,255,.1)}
.chipsr{display:flex;gap:6px;margin-bottom:8px}
.chipb{flex:1;border-radius:7px;padding:7px 0;font-family:'Space Mono',monospace;font-size:9px;
  font-weight:700;color:#C3A6FF;background:rgba(167,139,250,.14);
  border:1px solid rgba(167,139,250,.3);cursor:pointer}
.stakerow{display:flex;gap:8px}
.stakerow .amt{flex:1;min-width:0;border-radius:9px;padding:10px 12px;
  background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.18);color:#EFEAFF;
  font-family:'Space Mono',monospace;font-size:14px;font-variant-numeric:tabular-nums}
.stakerow .amt::placeholder{color:#6E6688}

/* The server's own words, not a guess at them. A refusal ("betting is locked",
   "over the daily limit") is information, so it gets the same slot as a win. */
#toast{position:fixed;left:16px;right:16px;z-index:60;
  bottom:calc(74px + env(safe-area-inset-bottom,0px));
  padding:13px 15px;border-radius:12px;font-size:14px;font-weight:600;line-height:1.4;
  background:linear-gradient(150deg,#2F2A55,#1B1638);border:1px solid rgba(110,231,183,.45);
  color:#EFEAFF;box-shadow:0 12px 34px rgba(4,2,14,.6);
  opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .2s,transform .2s}
#toast.live{opacity:1;transform:none}
#toast.bad{border-color:rgba(241,156,150,.5)}

/* SHOP — a price list, not a checkout. */
.shp{display:flex;align-items:flex-start;gap:12px;margin:0 16px 8px;padding:12px 14px;
  border-radius:12px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.11)}
.shp.out{opacity:.5}
.shp .t{font-size:15px;font-weight:600}
.shp .s{font-size:13px;color:#8F86AF;margin-top:4px;line-height:1.45}
.shp .stk{font-family:'Space Mono',monospace;font-size:7.5px;letter-spacing:.12em;
  text-transform:uppercase;color:#C0A85E;margin-top:6px}
.shp .prw{flex-shrink:0;text-align:right}
.shp .pr{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;
  color:#F5C842;font-variant-numeric:tabular-nums}
.shp .pr em{font-style:normal;font-size:7.5px;letter-spacing:.1em;color:#B39B4E;margin-left:4px}

/* ── the sheets You opens: Wallet, Contract, Offers ───────────────────
   The S2 hub's own CSS used to sit here — .wait, .nxt, .hubrow, and a second
   `.fcard`. The MY CAREER rewrite replaced all of that markup and left the
   rules behind, where the orphaned `.fcard` quietly won every tile in the
   FIGHTERS grid: same class name, defined later, so `display:flex` and a dark
   background landed on 445 fighter cards and the photos stopped showing.
   Dead CSS is not free when the name is already taken. */
.ofr .vs3{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.02em;
  line-height:1.05;margin-top:6px}
.ofr .s{font-family:'Space Mono',monospace;font-size:8px;color:#8B83AC;margin-top:5px}

/* wallet */
.bigbal{margin:2px 16px 4px;padding:18px 16px;border-radius:15px;text-align:center;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.bigbal .k{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.16em;
  text-transform:uppercase;color:#8B83AC}
.bigbal .v{font-family:'Bebas Neue',sans-serif;font-size:52px;line-height:1;letter-spacing:.02em;
  color:#F5C842;margin-top:6px}
.bigbal .v em{font-style:normal;font-family:'Space Mono',monospace;font-size:12px;
  letter-spacing:.1em;color:#B39B4E;margin-left:6px}
.bigbal .io{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px;
  font-family:'Space Mono',monospace;font-size:10px;font-variant-numeric:tabular-nums}
.bigbal .io .up{color:#6EE7B7}
.bigbal .io .dn{color:#F19C96}
.bigbal .io .lbl{font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;color:#7E7699}

/* contract */
.deal{margin:0 16px 8px;padding:15px 16px;border-radius:14px;position:relative;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13)}
.deal.offer{border-color:rgba(245,200,66,.4);
  background:linear-gradient(150deg,rgba(245,200,66,.13),rgba(245,200,66,.02))}
.deal .tier{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.04em;line-height:1}
.deal.offer .tier{color:#F5C842}
.deal .tag{position:absolute;right:14px;top:15px;font-family:'Space Mono',monospace;font-size:7px;
  font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#F5C842;
  border:1px solid rgba(245,200,66,.45);border-radius:20px;padding:3px 8px}
.deal .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;margin-top:14px}
.deal .grid .k{display:block;font-family:'Space Mono',monospace;font-size:7.5px;letter-spacing:.14em;
  text-transform:uppercase;color:#8B83AC}
.deal .grid .v{display:block;font-family:'Space Mono',monospace;font-size:16px;margin-top:4px;
  font-variant-numeric:tabular-nums}
.deal .since{margin-top:13px;font-family:'Space Mono',monospace;font-size:7.5px;letter-spacing:.1em;
  text-transform:uppercase;color:#7E7699}

/* offers */
.ofr{margin:0 16px 8px;padding:13px 14px;border-radius:13px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13)}
.ofr.tent{border-color:rgba(167,139,250,.32)}
.ofr .hd2{display:flex;align-items:center;gap:8px;font-family:'Space Mono',monospace;font-size:8px;
  font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#C3A6FF}
.ofr .hd2 .st{margin-left:auto;font-size:6.5px;letter-spacing:.13em;color:#F5C842;
  border:1px solid rgba(245,200,66,.4);border-radius:20px;padding:3px 7px}
.ofr.tent .hd2 .st{color:#C3A6FF;border-color:rgba(167,139,250,.4)}
.ofrgo{display:block;width:100%;margin-top:11px;text-align:center;border:1px solid rgba(255,255,255,.2);
  border-radius:7px;padding:9px 0;font-family:'Space Mono',monospace;font-size:8.5px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:#C3A6FF}

/* where you actually answer. The app has no member write path yet, so this
   points at the one that exists rather than showing a button that lies. */
.doit{margin:10px 16px 0;padding:12px 14px;border-radius:11px;font-size:13px;line-height:1.5;
  color:#B7AEDC;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.24)}
.doit b{color:#E6DEFF;font-family:'Space Mono',monospace;font-size:11.5px}

/* ── THE NEXT CARD, where the news rows used to be ────────────────────
   The wire lives on the News tab and had no business being repeated here in
   three grey rows. What home owes somebody is the answer to "when is the next
   one and who is on it", and that is a POSTER, not a list.

   UPCOMING ONLY. A finished event never appears while anything is scheduled,
   because the block's whole claim is "this is next" — the past card is the
   fallback for an empty schedule, and it says so in its own label rather than
   quietly looking like an announcement.

   THE PHOTOS ARE OPTIONAL BY DESIGN. 355 of 448 fighters have none, so a
   missing cut-out draws a silhouette and the poster still reads. A poster
   that needs two photographs would almost never appear. */
/* A FLOOR, because the states are different heights and this block flips
   between them in place: an announced card is ~321px, a UBAe night ~288, and
   an event with no card yet is 158. Without the floor, moving from the poster
   to "card not announced" yanks 160px out from under the footer. */
.pv{position:relative;margin:0 15px;border-radius:14px;overflow:hidden;min-height:300px;
  display:flex;flex-direction:column;
  border:1px solid rgba(255,255,255,.11);padding:16px 14px 0;text-align:center;
  background:radial-gradient(120% 90% at 50% 0%,#3A2E6E 0%,#1A1436 52%,#0C0916 100%)}
.pvgh{height:321px;background:rgba(255,255,255,.035)}
.pv .glow{position:absolute;left:50%;top:-30%;width:160%;height:120%;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(167,139,250,.30),transparent 70%);pointer-events:none}
.pv .eyeb{font-family:'Space Mono',monospace;font-size:7px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:#C3A6FF;position:relative}
.pv .ttl{font-family:'Bebas Neue',sans-serif;font-size:44px;line-height:.94;letter-spacing:.01em;
  margin-top:5px;position:relative}
.pv .meta{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.13em;color:#B3A9D6;
  margin-top:5px;position:relative}
.pv .duo{display:grid;grid-template-columns:1fr 46px 1fr;align-items:end;margin-top:10px;position:relative}
.pv .pw{display:flex;align-items:flex-end;justify-content:center;height:132px;position:relative}
.pv .cut{height:100%;width:auto;max-width:none;object-fit:contain;object-position:bottom center}
.pv .cut.flip{transform:scaleX(-1)}
.pv .sil{height:84%;width:auto;fill:rgba(190,175,235,.26)}
.pv .vs{font-family:'Bebas Neue',sans-serif;font-size:19px;color:#8A81A8;padding-bottom:44px}
.pv .nms{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px;position:relative}
.pv .nms b{font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1.02;letter-spacing:.02em;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pv .recs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px;position:relative}
.pv .recs s{text-decoration:none;font-family:'Space Mono',monospace;font-size:9px;color:#6EE7B7}
.pv .wcl{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:.16em;text-transform:uppercase;
  color:#8A81A8;margin-top:8px;position:relative}
/* No card published yet is a REAL state, not a broken poster: GFL 7 is on the
   schedule with no bouts, and saying so beats an empty pair of silhouettes. */
.pv .tba{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:16px 0;font-family:'Space Mono',monospace;font-size:8px;
  letter-spacing:.13em;text-transform:uppercase;color:#8A81A8}
.pvdots{display:flex;gap:5px;justify-content:center;padding:9px 0 10px;position:relative;margin-top:auto}
.pvdots s{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.20);cursor:pointer}
.pvdots s.on{background:#A78BFA}
.pvnone{margin:0 15px;border-radius:14px;border:1px solid rgba(255,255,255,.11);
  background:rgba(255,255,255,.035);padding:26px 15px;text-align:center}
.pvnone .ring{width:34px;height:34px;border-radius:50%;border:1px dashed rgba(167,139,250,.5);
  margin:0 auto 11px;display:flex;align-items:center;justify-content:center;color:#A78BFA;font-size:14px}
.pvnone .ss{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.11em;color:#8A81A8;
  margin-top:7px;line-height:1.8}

/* ── THE RANKINGS BOARD, the body of home ────────────────────────────
   Four divisions side by side, all fifteen ranked in each, champion on top.
   This replaced four tabs showing one division at a time: the tabs meant three
   quarters of the league was always a tap away, and nobody taps.

   FIFTEEN FIT IN 4 COLUMNS, which is the whole reason this shape works. A
   column is ~83px, leaving a ~50px name slot -- about eight characters. Only
   5 of the 60 ranked names are longer than that, so the exception is handled
   (see fitRankNames) rather than the layout being widened for it.

   THE CHAMPION IS NOT RANKED. rankings_public never lists a belt holder among
   the contenders, so the gold row on top is titles_public and adds a
   sixteenth name rather than repeating the first. It comes from titles_public
   and NOT fighters.is_champion, because that flag is a single boolean and
   cannot say WHICH belt or that Killer Kam holds two -- he is the champion
   row of both middleweight and light heavyweight (audit F76). */
.rbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 16px 9px}
.rleague{display:flex;flex-shrink:0;border:1px solid rgba(255,255,255,.16);border-radius:20px;overflow:hidden}
.rleague button{font-family:'Space Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:#8B83AC;background:none;border:0;padding:5px 12px;cursor:pointer}
.rleague button.on{background:#A78BFA;color:#1A1430}
.rasof{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:.1em;
  text-transform:uppercase;color:#6E6688;text-decoration:none}

/* SIX DEEP, THEN A TAB. Fifteen fits, and fifteen was also 319px of ladder
   before the news block — the top six plus the champion is the part anybody
   reads standing up, and the rest is one tap away rather than a screen away.
   The rows past six are RENDERED and hidden, not withheld: expanding must not
   be able to fail, and a second request to open a list you are already looking
   at is a spinner where a disclosure should be. */
.rgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 15px}
.rgrid.rfold .rkx{display:none}
/* The tab hangs off the board's bottom-right corner like the dog-ear of a
   page — no border on top, because the board's own edge is that border. It
   costs no vertical band of its own and lands where a right thumb already is. */
.rtabwrap{display:flex;justify-content:flex-end;margin:0 15px;position:relative;top:-1px}
.rtab{font:inherit;cursor:pointer;border:1px solid rgba(167,139,250,.30);border-top:0;
  background:rgba(167,139,250,.10);border-radius:0 0 9px 9px;padding:6px 13px 7px;
  font-family:'Space Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:#C3A6FF}
.rtab i{font-style:normal;margin-left:3px;display:inline-block;transition:transform .25s}
.rtab[aria-expanded="true"] i{transform:rotate(180deg)}
.rcol{min-width:0;padding:0 1px}
.rdh{font-family:'Space Mono',monospace;font-size:6.5px;font-weight:700;letter-spacing:.14em;
  color:#A78BFA;text-align:center;padding-bottom:5px;border-bottom:1px solid rgba(167,139,250,.28)}
.rch{display:flex;align-items:center;gap:3px;padding:4px 3px 4px 8px;margin-bottom:2px;min-width:0;
  position:relative;background:rgba(245,200,66,.07);
  border-bottom:1px solid rgba(245,200,66,.22)}
.rch .rnm{font-size:11px;font-weight:700;color:#FFE8A0}
.rvac .rft{color:#8A7546;font-weight:600;font-style:italic}
.rkrow{display:flex;align-items:center;gap:3px;padding:3px 3px;min-width:0;position:relative}
.rkrow.z{background:rgba(255,255,255,.028)}
.rnm{flex:1;min-width:0;font-size:11px;font-weight:600;line-height:1.15}
/* The name is scaled, the SLOT is not. fitRankNames widens this inner block
   and scales it back down, so the ellipsis and the clip stay where the column
   put them -- scaling .rnm itself would scale its own overflow box with it and
   fit nothing extra, which is the bug this inner span exists to avoid. */
.rft{display:block;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transform-origin:left center}
.rkrow.bmf .rnm{color:#FFE8A0;font-weight:700}

/* THE CHAMPION'S MARK IS A STRAP, NOT A HIGHLIGHT — and the light runs DOWN
   it, not across the row.
 
   The first version washed the whole row in gold and swept a highlight across
   it. Two things were wrong with that. A row-wide wash reads as "this row is
   selected", which is a UI state, not a title; and all four columns swept in
   lockstep, because they share one animation and all start at page load, so
   the board pulsed like a progress bar. A belt is a physical object hanging
   at the left of the name, so the strap is the object and the light is a
   reflection travelling down it — and each column is delayed by its index, so
   they catch the light in sequence.
 
   The BMF strap does NOT move. There is one animated thing per board and the
   champion has it; a second sweeping strap halfway down the middleweight
   column competes with it and neither reads as special. */
@keyframes rkSheen{0%{background-position:0 -160%}60%,100%{background-position:0 260%}}
.rch::before{content:'';position:absolute;left:0;top:2px;bottom:2px;width:2.5px;border-radius:2px;
  background:linear-gradient(180deg,#8A6A20 0%,#8A6A20 30%,#FFF6D8 46%,#FFE9A8 54%,
    #8A6A20 70%,#8A6A20 100%);
  background-size:100% 300%;animation:rkSheen 4.4s ease-in-out infinite;
  animation-delay:var(--rkd,0ms)}
.rkrow.bmf{padding-left:8px}
.rkrow.bmf::before{content:'';position:absolute;left:0;top:2px;bottom:2px;width:2.5px;
  border-radius:2px;background:#C9A227}
/* Every one of these is r-prefixed for a reason: `.nw` is ALREADY the news
   row's class, a bare rule with its own padding, and `<i class="rmv nw">`
   picked it up -- one row of the heavyweight column grew to 31px and squeezed
   its own name slot from 63px to 27px. Nothing errored; it just looked wrong.
   Four states, and "new" is deliberately not an arrow: prev_rank NULL means
   the fighter was not on the previous board at all, so calling it a rise would
   invent a move that never happened. */
.rmv{display:inline-block;flex-shrink:0;width:6px;height:6px;position:relative}
.rmv::after{content:'';position:absolute;left:0;top:50%}
.rmv.rup::after{margin-top:-2px;border-left:3px solid transparent;border-right:3px solid transparent;
  border-bottom:4.5px solid #4ADE80}
.rmv.rdn::after{margin-top:-2px;border-left:3px solid transparent;border-right:3px solid transparent;
  border-top:4.5px solid #FF6B6B}
.rmv.rsm::after{margin-top:-1px;width:5px;height:1.5px;border-radius:2px;background:rgba(255,255,255,.16)}
.rmv.rnew::after{margin-top:-2px;left:1px;width:4px;height:4px;border-radius:50%;background:#4ADE80}
.rsk{display:block;height:9px;border-radius:3px;background:rgba(255,255,255,.07)}

/* A3 — the screens know who is looking.
   "Fight in the UBA" is right for a fan and slightly insulting to somebody
   who already fights, so the same slot carries different content per person. */
.mybout{margin:20px 18px 4px;border-radius:15px;overflow:hidden;
  border:1px solid rgba(245,200,66,.32);
  background:linear-gradient(150deg,rgba(245,200,66,.15),rgba(245,200,66,.04))}
.mybout .top2{display:flex;align-items:center;gap:9px;padding:12px 16px 0}
.mybout .k{font-family:'Space Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:#F5C842}
.mybout .locked{margin-left:auto;font-family:'Space Mono',monospace;font-size:7.5px;letter-spacing:.12em;
  text-transform:uppercase;color:#B7AEDC;border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:3px 8px}
.mybout .vs2{display:flex;align-items:center;gap:12px;padding:11px 16px 0}
.mybout .who2{flex:1;min-width:0}
.mybout .who2 .lbl2{font-family:'Space Mono',monospace;font-size:7.5px;letter-spacing:.14em;
  text-transform:uppercase;color:#9990B4}
.mybout .who2 .nm2{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.02em;line-height:1;margin-top:3px}
.mybout .who2.opp{text-align:right}
.mybout .x{font-family:'Space Mono',monospace;font-size:10px;color:#F5C842;flex-shrink:0}
.mybout .when2{padding:12px 16px 14px;margin-top:11px;border-top:1px solid rgba(255,255,255,.12);
  display:flex;align-items:baseline;gap:10px}
.mybout .when2 .d2{flex:1;font-size:14px;font-weight:600}
.mybout .when2 .go3{font-family:'Space Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:#F5C842}
.bout2.you{border-color:rgba(245,200,66,.5);box-shadow:0 0 0 1px rgba(245,200,66,.2)}
.bout2 .youtag{font-family:'Space Mono',monospace;font-size:7px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:#3A2A00;background:#F5C842;padding:2px 6px;border-radius:3px;margin-left:6px}

/* wallet + binder */
.bal{margin:14px 18px 0;padding:16px 17px;border-radius:15px;
  background:linear-gradient(150deg,rgba(245,200,66,.16),rgba(245,200,66,.05));
  border:1px solid rgba(245,200,66,.3)}
.bal .k{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.16em;
  text-transform:uppercase;color:#F5C842}
.bal .v{font-family:'Bebas Neue',sans-serif;font-size:40px;line-height:1;margin-top:6px;
  font-variant-numeric:tabular-nums}
.bal .v em{font-style:normal;font-size:17px;color:#C7BEE4;margin-left:7px}
.tx{display:flex;align-items:center;gap:12px;margin:0 18px;padding:11px 0;
  border-bottom:1px solid rgba(255,255,255,.08)}
.tx .amt{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;flex-shrink:0;
  font-variant-numeric:tabular-nums;width:76px}
.tx .amt.up{color:#6EE7B7}
.tx .amt.dn{color:#F19C96}
.tx .why{flex:1;font-size:14.5px;min-width:0}
.tx .when{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.09em;
  text-transform:uppercase;color:#7E7699;flex-shrink:0}
.myrow{display:flex;align-items:center;gap:13px;margin:0 18px;padding:13px 0;
  border-bottom:1px solid rgba(255,255,255,.08)}
.myrow .av3{width:42px;height:42px;border-radius:12px;flex-shrink:0;overflow:hidden;
  background:linear-gradient(150deg,#7B6AA8,#3A2E63)}
.myrow .av3 img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.myrow .t{font-size:16.5px;font-weight:600}
.myrow .s{font-size:13px;color:#8F86AF;margin-top:2px}
.myrow .go2{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.12em;
  text-transform:uppercase;color:#C3A6FF;flex-shrink:0}

.bstat{display:flex;gap:9px;margin:2px 17px 0}
.bstat div{flex:1;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);
  border-radius:11px;padding:11px 0;text-align:center}
.bstat b{display:block;font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.bstat s{display:block;text-decoration:none;font-family:'Space Mono',monospace;font-size:7px;
  letter-spacing:.11em;text-transform:uppercase;color:#9990B4;margin-top:4px}
/* ── THE BINDER ───────────────────────────────────────────────────────
   Two columns, not three. The slab's label carries a set line, a name, a
   barcode and a grade column; at a third of the screen none of that survives,
   and a slab you cannot read is just a rectangle. */
/* minmax(0,1fr), NOT 1fr. A grid track's default minimum is min-content, and
   the label's name line is `white-space:nowrap` — so a long card name pushes
   its own column wider and the two stop matching. Measured 239px against
   301px on a 363px grid before this: lopsided AND overflowing, while
   text-overflow:ellipsis quietly did nothing because the box never had to
   shrink. */
/* One shelf per set, scrolled sideways. A grid sorts by nothing a collector
   cares about; a shelf is the set, in order, ending in the pack that fills it. */
.shelf{display:flex;gap:11px;margin:0 15px;padding:2px 0 4px;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.shelf::-webkit-scrollbar{display:none}
.shelf .slabw{width:152px;flex-shrink:0}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 13px;margin:0 15px}

/* THE CHASE — one number that goes up, and the four bars under it. Without
   this the shelves are a gallery; with it they are a scoreboard. */
.chase{margin:4px 16px 2px;padding:15px 16px;border-radius:16px;
  background:linear-gradient(155deg,rgba(167,139,250,.2),rgba(20,14,38,.9));
  border:1px solid rgba(167,139,250,.35)}
.chase .cr{display:flex;align-items:center;gap:15px}
.chase .ring{width:62px;height:62px;border-radius:50%;flex-shrink:0;position:relative;display:block}
.chase .ring i{position:absolute;inset:6px;border-radius:50%;background:#211A3D;
  display:flex;align-items:center;justify-content:center;font-style:normal;
  font-family:'Bebas Neue',sans-serif;font-size:19px;color:#C3A6FF}
.chase .cn{flex:1;min-width:0}
.chase .big{font-family:'Bebas Neue',sans-serif;font-size:31px;line-height:1}
.chase .big em{font-style:normal;font-size:16px;color:#8B83AC}
.chase .cn .s{font-family:'Space Mono',monospace;font-size:7.5px;color:#B0A4D8;margin-top:5px;
  line-height:1.5}
.chase .brs{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.chase .bl{display:flex;justify-content:space-between;font-family:'Space Mono',monospace;
  font-size:6.5px;letter-spacing:.1em;text-transform:uppercase;color:#B0A4D8;margin-bottom:4px}
.chase .bt{height:5px;border-radius:3px;background:rgba(0,0,0,.4);overflow:hidden}
.chase .bt i{display:block;height:100%;background:#A78BFA;border-radius:3px}

/* the pack at the end of a shelf — it names the holes it can close */
.shelfbuy{display:flex;align-items:center;gap:11px;margin:9px 16px 4px;padding:10px 12px;
  border-radius:12px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12)}
.shelfbuy .nm{flex:1;min-width:0;font-size:14px;font-weight:600}
.shelfbuy .nm s{display:block;text-decoration:none;font-family:'Space Mono',monospace;
  font-size:7px;color:#7E7699;margin-top:3px}
.shelfbuy.hot{border-color:rgba(245,200,66,.4);background:rgba(245,200,66,.1)}
.shelfbuy.hot .nm s{color:#C0A85E}
.shelfbuy.done{display:block;text-align:center;font-family:'Space Mono',monospace;font-size:8px;
  font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#6EE7B7;
  border-color:rgba(110,231,183,.4);background:rgba(110,231,183,.08)}

.r-common   {--c:#8A82A6;--c2:#5C5578;--glow:rgba(138,130,166,.28)}
.r-uncommon {--c:#5FD98A;--c2:#2E8C55;--glow:rgba(95,217,138,.32)}
.r-rare     {--c:#4FB8F0;--c2:#1E6FA8;--glow:rgba(79,184,240,.38)}
.r-mystic   {--c:#B08BFA;--c2:#6B3FD0;--glow:rgba(176,139,250,.45)}
.r-legendary{--c:#F5C842;--c2:#B8860B;--glow:rgba(245,200,66,.5)}
.r-prismatic{--c:#FF6EC7;--c2:#4FE3D0;--glow:rgba(255,110,199,.45)}

.slabw{position:relative;cursor:pointer}
/* the fan — two ghosts, never more, however many you hold */
.slabw .gh{position:absolute;inset:0;border-radius:11px;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.16);z-index:0}
.slabw .gh.g2{transform:rotate(-3.5deg) translate(-4px,3px)}
.slabw .gh.g3{transform:rotate(3.5deg) translate(4px,5px);opacity:.7}
.slabw .qty{position:absolute;right:-5px;top:-5px;z-index:9;min-width:22px;height:22px;
  border-radius:11px;background:#1A1533;border:1px solid var(--c);color:var(--c);
  font-family:'Space Mono',monospace;font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 5px;
  box-shadow:0 2px 8px rgba(0,0,0,.6)}

.slab{position:relative;z-index:1;border-radius:11px;padding:7px 7px 10px;
  background:linear-gradient(158deg,rgba(230,238,255,.20),rgba(190,205,235,.07) 42%,rgba(255,255,255,.13));
  border:1px solid rgba(226,236,255,.34);
  box-shadow:0 12px 26px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.55),
             inset 1px 0 0 rgba(255,255,255,.2),inset -1px 0 0 rgba(255,255,255,.2)}
.slab:before{content:'';position:absolute;left:10px;right:10px;top:1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent)}

/* P2 — the label, with the purple stroke around it AND before the grade */
.slab .plate{display:flex;align-items:stretch;margin-bottom:7px;border-radius:3px;
  background:linear-gradient(180deg,#FCFBFF,#E7E5F1);border:2px solid #A78BFA;
  box-shadow:0 2px 7px rgba(0,0,0,.45),0 0 12px -3px rgba(167,139,250,.55)}
.slab .plate .txt{flex:1;min-width:0;padding:4px 6px 4px 7px}
.slab .plate .l1{font-family:'Space Mono',monospace;font-size:5px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:#6B4FC8;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slab .plate .l2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;
  line-height:1;text-transform:uppercase;letter-spacing:.02em;color:#12101C;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slab .plate .l3{display:flex;align-items:flex-end;gap:4px;margin-top:3px}
.slab .plate .l3 span{font-family:'Space Mono',monospace;font-size:4.5px;letter-spacing:.1em;
  color:#6B6580;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slab .plate .l3 .miss{color:#9A93B0;font-style:italic;letter-spacing:.08em}
.slab .plate .bars{display:flex;gap:1px;align-items:flex-end;height:8px;flex-shrink:0}
.slab .plate .bars i{display:block;width:1px;background:#12101C}
.slab .plate .side{width:34px;flex-shrink:0;border-left:2px solid #A78BFA;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 0;
  background:linear-gradient(180deg,#F4F1FF,#E2DDF4)}
.slab .plate .side b{font-family:'Bebas Neue',sans-serif;font-size:19px;line-height:.8;color:#12101C}
.slab .plate .side b.dash{color:#B0A9C4}
.slab .plate .side i{font-style:normal;font-family:'Space Mono',monospace;font-size:4px;
  font-weight:700;letter-spacing:.12em;color:#6B4FC8;margin-top:2px}

.slab .well{border-radius:6px;padding:2px;background:rgba(6,4,14,.5);
  box-shadow:inset 0 2px 7px rgba(0,0,0,.75)}
.slab .inner{position:relative;border-radius:4px;overflow:hidden;aspect-ratio:5/7;
  background:linear-gradient(165deg,var(--c2),#0B0818);
  border:2px solid var(--c);box-shadow:0 0 14px var(--glow)}
.slab .inner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:top center;display:block}
.slab .noart{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:10px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:17px;line-height:1;text-transform:uppercase;color:#fff;
  text-shadow:0 2px 12px rgba(0,0,0,.9)}
.slab .scrim{position:absolute;inset:0;z-index:2;
  background:linear-gradient(180deg,transparent 48%,rgba(6,4,14,.94))}
.slab .cfoot{position:absolute;left:7px;right:7px;bottom:6px;z-index:6}
.slab .cfoot .n{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;
  line-height:1;text-transform:uppercase;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slab .cfoot .p{font-family:'Space Mono',monospace;font-size:5.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--c);margin-top:3px}

/* THE PRISM GRATING. Real holo foil is a fine diagonal grating that splits
   light; the lines are always there and a moving band decides where they
   catch. It only runs while `.lit` is on, which an IntersectionObserver
   grants as a card scrolls in — a hundred running animations is a warm phone
   and nobody is looking at ninety of them. */
@keyframes drift{0%{background-position:0 0,0 0}100%{background-position:200px -280px,-120px 168px}}
@keyframes band{0%{-webkit-mask-position:120% 0;mask-position:120% 0}
                100%{-webkit-mask-position:-40% 0;mask-position:-40% 0}}
.fx{position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:2px;opacity:0;
  background-image:
    repeating-linear-gradient(112deg,rgba(255,110,199,.30) 0px,rgba(255,209,102,.30) 3px,
      rgba(126,231,135,.30) 6px,rgba(79,227,208,.30) 9px,rgba(123,140,255,.30) 12px,
      rgba(255,110,199,.30) 15px),
    repeating-linear-gradient(68deg,rgba(255,255,255,.10) 0px,rgba(255,255,255,0) 2px,
      rgba(255,255,255,.10) 4px);
  mix-blend-mode:color-dodge;
  -webkit-mask-image:linear-gradient(105deg,transparent 22%,#000 44%,#000 56%,transparent 78%);
  mask-image:linear-gradient(105deg,transparent 22%,#000 44%,#000 56%,transparent 78%);
  -webkit-mask-size:260% 100%;mask-size:260% 100%}
.fx.lit{animation:drift 9s linear infinite, band 4.6s ease-in-out infinite}
.r-common   .fx.lit{opacity:.16}
.r-uncommon .fx.lit{opacity:.26}
.r-rare     .fx.lit{opacity:.42}
.r-mystic   .fx.lit{opacity:.62}
.r-legendary .fx.lit{opacity:.8;filter:saturate(.4) sepia(.5) hue-rotate(-14deg) brightness(1.3)}
.r-prismatic .fx.lit{opacity:1;filter:saturate(1.5)}
@media (prefers-reduced-motion:reduce){
  /* the grating stays, the movement goes — it still looks like foil */
  .fx.lit{animation:none;opacity:.3}
}

/* A card you do not hold keeps its NAME and its rarity colour and loses
   everything that would be a lie — no grade, no serial, no print number. */
.slabw.unowned{opacity:.42;filter:saturate(.35)}
.slabw.unowned .slab{box-shadow:0 6px 14px rgba(0,0,0,.4)}
.slabw.unowned .fx{display:none}

/* A SEALED PACK, DRAWN. There is no pack art in the database, so the wrapper
   is CSS: a foil sheen across it, a tear strip near the top, the set's colour
   and the card count. The point of a pack is that it is closed — a row of
   text with a button beside it is a to-do item, not something to open. */
.wrapper{width:78px;height:104px;flex-shrink:0;border-radius:7px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,var(--pk),rgba(10,7,20,.92) 78%);
  border:1px solid rgba(255,255,255,.3);box-shadow:0 8px 20px rgba(0,0,0,.6);cursor:pointer;
  transition:transform .12s}
.wrapper .foil{position:absolute;inset:0;
  background:repeating-linear-gradient(118deg,rgba(255,255,255,.17) 0 2px,transparent 2px 7px)}
.wrapper .tear{position:absolute;left:0;right:0;top:14px;height:5px;
  background:repeating-linear-gradient(90deg,rgba(10,7,20,.85) 0 3px,transparent 3px 6px)}
.wrapper .sz{position:absolute;left:6px;bottom:6px;font-family:'Bebas Neue',sans-serif;
  font-size:21px;line-height:.9;text-shadow:0 1px 5px rgba(0,0,0,.85)}
.wrapper .sz em{font-style:normal;display:block;font-family:'Space Mono',monospace;font-size:5px;
  letter-spacing:.13em;color:rgba(255,255,255,.85);margin-top:2px}
.wrapper .cnt{position:absolute;right:-4px;top:-4px;min-width:19px;height:19px;border-radius:10px;
  background:#1A1533;border:1px solid var(--pk);color:var(--pk);font-family:'Space Mono',monospace;
  font-size:8.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.act.rip{flex:none;padding:9px 16px;background:linear-gradient(90deg,#F5C842,#D6A81F);color:#2A1F00}

/* every sealed pack, one row, newest first */
.sealrail{display:flex;gap:10px;margin:2px 16px 0;overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch}
.sealrail::-webkit-scrollbar{display:none}
.sealrail .sw{flex-shrink:0;width:78px;cursor:pointer}
.sealrail .cap{display:block;font-family:'Space Mono',monospace;font-size:6px;letter-spacing:.1em;
  text-transform:uppercase;color:#8B83AC;margin-top:6px;line-height:1.4}
.sealrail .sw:active .wrapper{transform:translateY(1px) scale(.98)}

.bstat em{font-style:normal;font-size:13px;color:#8B83AC}
/* The set chips. There was never a base rule for these — only `.chips
   span.full` existed, a state of something with no styling, so every chip ran
   into the next one as a single string of text. */
.chips{display:flex;gap:7px;margin:12px 15px 10px;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips span{flex-shrink:0;cursor:pointer;font-family:'Space Mono',monospace;font-size:8.5px;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#B7AEDC;
  border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:6px 11px;white-space:nowrap}
.chips span.on{background:#A78BFA;color:#1A1430;border-color:#A78BFA}
.chips span.full{border-color:rgba(110,231,183,.5);color:#6EE7B7}
.chips span.on.full{background:#6EE7B7;color:#06281D;border-color:#6EE7B7}
.cardbig{max-width:270px;margin:2px auto 4px}
.cardbig .slabw{cursor:default}
.cardbig .slab .plate .l2{font-size:16px}
.cardbig .slab .cfoot .n{font-size:18px}

/* ── TEARING, AND WHAT COMES OUT ──────────────────────────────────────
   Full screen, because this is the one moment in the app that deserves it. */
#tear{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  background:radial-gradient(120% 70% at 50% 18%,rgba(167,139,250,.16),transparent 62%),
             rgba(5,3,14,.96);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  opacity:0;transition:opacity .24s;touch-action:none}
#tear.live{display:flex}
#tear.shown{opacity:1}
#tear .tin,#tear .sin{width:min(360px,92vw);position:relative;display:flex;flex-direction:column;
  align-items:center}

/* the pack, big */
#tear .tk{font-family:'Space Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:#C3A6FF;margin-bottom:26px;text-align:center}
#tear .tpack{width:200px;height:266px;position:relative;perspective:820px}
#tear .tguts{position:absolute;left:14px;right:14px;top:24px;bottom:12px;z-index:0;display:flex;
  gap:4px;justify-content:center}
#tear .tguts i{display:block;flex:1;max-width:32px;height:184px;border-radius:3px;
  background:linear-gradient(180deg,#F4F1FF,#B9B2D6);box-shadow:0 2px 8px rgba(0,0,0,.5)}
/* the cards ride up when the pressure comes off the top of the pack */
#tear .tguts{transition:transform .52s cubic-bezier(.18,.9,.3,1)}
#tear .tguts.pop{transform:translateY(-7px)}
/* what comes off a torn edge. Eight of them, gone in half a second. */
#tear .fleck{position:absolute;width:3px;height:5px;z-index:8;pointer-events:none;
  border-radius:1px;background:var(--fc,#fff);opacity:.9;
  animation:flk .5s cubic-bezier(.2,.6,.35,1) forwards}
@keyframes flk{to{transform:translate(var(--fx),var(--fy)) rotate(var(--fr));opacity:0}}
/* THE TEAR IS ONE LINE, CUT TWICE. The pack keeps everything below it, the
   flap keeps everything above it and to the left of the tear front, and both
   clip-paths are generated from the same list of points every frame -- so the
   two edges MATE, tooth for tooth, the way a real tear does.

   Before this, the pack's edge was a fixed 18-tooth zigzag that slid straight
   down, and the lid was a different fixed zigzag that slid sideways. Nothing
   about the two shapes agreed, and the whole line arrived everywhere at once
   -- which is the thing that read as cardboard. Foil does not part along its
   whole length simultaneously; it gives at one point and the split RUNS. */
#tear .tbody{position:absolute;inset:0;z-index:3;border-radius:10px;overflow:hidden;
  clip-path:var(--body,none)}
/* THE LIT EDGE. Torn foil shows a bright raw edge where the coating has
   parted, and that single highlight is most of what says "metal" rather than
   "board". It is drawn by OFFSET, not by a second shape: this layer is
   clipped to the tear line itself and the pack above it is clipped to the
   same line pushed down a couple of pixels, so what shows through is exactly
   the cut -- every tooth, every fibre, with no second path to keep in sync. */
#tear .trim{position:absolute;inset:0;z-index:2;border-radius:10px;
  background:linear-gradient(94deg,#F6EFD6,#EFE7FF 22%,#B9A9E6 48%,#F3E4BE 74%,#EDE6FF);
  clip-path:var(--rim,polygon(0 0,0 0,0 0))}
/* and the dark the edge reads against. Without it the lit edge sat straight
   on the white card backs and the two whites merged into one shape. */
#tear .tshd{position:absolute;left:12px;right:12px;top:20px;height:62px;z-index:1;
  pointer-events:none;background:linear-gradient(180deg,rgba(4,2,10,.74),rgba(4,2,10,.26) 48%,transparent)}
#tear .tskin{position:absolute;inset:0;border-radius:10px;
  background:linear-gradient(150deg,var(--pk),rgba(10,7,20,.92) 78%);
  border:1px solid rgba(255,255,255,.3)}
#tear .tskin:after{content:'';position:absolute;inset:0;border-radius:10px;
  background:repeating-linear-gradient(118deg,rgba(255,255,255,.17) 0 2px,transparent 2px 7px)}
#tear .tsz{position:absolute;left:12px;bottom:12px;z-index:3;font-family:'Bebas Neue',sans-serif;
  font-size:34px;line-height:.9;text-shadow:0 2px 8px rgba(0,0,0,.85)}
#tear .tsz em{font-style:normal;display:block;font-family:'Space Mono',monospace;font-size:6.5px;
  letter-spacing:.14em;color:rgba(255,255,255,.85);margin-top:3px}
/* THE FLAP is the same skin as the pack, at the same size, in the same place
   -- so while it is still lying flat there is no seam to see. It only becomes
   a separate object once the tear front has run past a piece of it. */
#tear .tflap{position:absolute;inset:0;z-index:6;pointer-events:none;
  will-change:transform,clip-path;border-radius:10px 10px 0 0;
  background:linear-gradient(150deg,var(--pk),rgba(10,7,20,.92) 78%);
  border-top:1px solid rgba(255,255,255,.3);
  clip-path:var(--flap,polygon(0 0,0 0,0 0))}
#tear .tflap:after{content:'';position:absolute;inset:0;border-radius:10px 10px 0 0;
  background:repeating-linear-gradient(118deg,rgba(255,255,255,.17) 0 2px,transparent 2px 7px)}
/* the specular. A flat sheet turning in a light does not change brightness
   evenly -- a band travels across it as the angle passes the light. --lit and
   --sx are written every frame from the flap's own angle, so the highlight is
   a consequence of the movement rather than a loop running beside it. */
#tear .tflap:before{content:'';position:absolute;inset:0;z-index:2;border-radius:10px 10px 0 0;
  background:linear-gradient(100deg,transparent 26%,
    rgba(255,255,255,calc(.26 * var(--lit,0))) 43%,
    rgba(255,255,255,calc(.66 * var(--lit,0))) 50%,
    rgba(255,246,220,calc(.30 * var(--lit,0))) 57%,transparent 74%);
  background-size:280% 100%;background-repeat:no-repeat;
  background-position:calc(var(--sx,0) * 1%) 0}

/* install hint */

/* ── the fighter sheet ──────────────────────────────────────────────────
   An in-app screen, not a link out. Tapping a card used to navigate to
   f/<slug>.html, which redirects to the old profile page — outside the
   app's scope, so iOS wrapped it in browser chrome with a URL bar and a
   Done button. The cards keep their href so long-press-to-share and the
   Discord unfurl still work; the tap is intercepted and lands here. */
.sheet{position:fixed;inset:0;z-index:30;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
  background:#151030;display:none;transform:translateY(14px);

/* the bar */
/* THE BAR. Six passes. Five of them changed the HEIGHT, which was never the
   problem, and the sixth is the one that matters.

     78px + full inset  -> "a bar floating over a dead band"
     62px + 60% inset   -> still empty-looking
     58px + no inset    -> "something below the bar"
     52px + full inset  -> "worse, thicker empty space"
     50px + no inset    -> "even thicker empty space"

   Five different heights, one identical complaint. That rules the height out.

   The actual cause is COLOUR. The bar was rgba(10,8,20,.92) blurred over
   #ground, whose bottom stop is #0C0916. Composited, the bar reads as
   rgb(10,8,20) sitting on rgb(12,9,22) — a difference of two points per
   channel, invisible on any screen. So the bar had a bright 1px line at its
   TOP and no perceptible edge at its BOTTOM: the icons looked like they were
   floating on the page, and every pixel of bar beneath them read as a
   separate black strip under the nav. Changing the height just moved how
   much of that invisible strip there was.

   So: one SOLID colour, clearly lighter than the ground, no blur. The bar now
   has a visible bottom edge because the bar is visibly a different surface.
   The safe-area inset is padding on that same solid colour, which is why it
   is safe to keep this time — on a device with a home indicator the strip is
   visibly part of the bar instead of a gap beneath it. */
.bar{position:fixed;left:0;right:0;bottom:calc(-1 * var(--barpush, 0px));
  display:flex;align-items:stretch;
  background:#1A1533;border-top:1px solid rgba(255,255,255,.16);
  /* THE SAFE AREA, ONCE — NOT TWICE. Below this bar sits a dead strip the
     page cannot paint into but which is colour-matched to it, and on this
     phone that strip is 47pt: already more than the 34pt home-indicator inset.
     Padding the bar by the inset ON TOP of that made the dark band 135pt tall
     with the labels floating 92pt up, which is the "why is it so thick".
     So: pad by whatever the inset still needs AFTER the dead strip, and on a
     device with no dead strip (--deadstrip 0) this is the full inset exactly
     as before. */
  /* THE STANDARD iOS TAB BAR: the icons sit ABOVE the home-indicator inset
     and the bar's background carries on through it to the screen edge. That
     dark strip under the labels is the point, not a defect — it is what keeps
     a tappable row clear of the swipe-up gesture, and it is why every app
     with a bottom bar has one.
     The deadstrip subtraction is gone. It was correct while the bar could not
     reach the bottom and something else was already covering that band; now
     that it does reach, subtracting left the labels jammed against the edge. */
  padding-bottom:env(safe-area-inset-bottom,0px);
  z-index:20;
  /* THE SAFARI 26 FIXED-OVERLAY BUG, and the documented workaround for it.
     WebKit 26 composites a position:fixed element with a FULLY OPAQUE
     background down a different path from a transparent one, and that path
     leaves a gap at the bottom of the screen — the element reports the right
     box in Web Inspector and paints short. Opacity below 1 puts it back on the
     transparent path and it covers the screen. .995 is visually identical to
     1 and is the whole fix.
     Apple fixed this in Safari 26.1 ("Fixed a bottom gap appearing on layouts
     with viewport-sized fixed containers on iOS", 3 Nov 2025), so this line is
     only load-bearing on 26.0. It costs nothing to leave in. */
  opacity:.995}
.bar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:54px;color:#8B83AC}
.bar button.on{color:#EDEAF6}
.bar em{font-style:normal;font-family:'Space Mono',monospace;font-size:8px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase}
.bar .midbtn{justify-content:flex-start}
.bar .midbtn .disc{width:48px;height:48px;border-radius:50%;margin-top:-20px;display:flex;align-items:center;

.bar .midbtn.on .disc{transform:scale(1.06)}
/* THE FLOWER FIELD, behind the You button. Same petal engine as the broadcast
   tale-of-the-tape and the website's ambient field, so the app is not a
   different-looking product from the thing on the stream. It sits BEHIND the
   disc and outside it, which is why the disc keeps its own overflow:hidden and
   this does not. */
.bar .midbtn{position:relative}
/* Sized for the BLOOM, not the resting flower. At rest it uses the middle of
   this box; on a refresh it opens most of the way to the edges. */
.bar .midbtn .discbloom{position:absolute;left:50%;top:-49px;width:112px;height:112px;
  margin-left:-56px;pointer-events:none;z-index:0;opacity:.95}
/* The disc rides ON TOP of its own flower. z-index:-1 put the canvas behind
   the bar's solid background, which is a perfectly good way to draw something
   nobody can see. */
.bar .midbtn .disc{position:relative;z-index:1}
.bar .midbtn .disc img{width:100%;height:100%;object-fit:cover}
/* Lower than the other labels: the You button hangs above the bar, so a
   label level with the rest sits too close under it. */
.bar .midbtn em{margin-top:9px;color:#C3A6FF}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic.big{width:26px;height:26px;stroke-width:1.9}
.skel{background:rgba(255,255,255,.07);border-radius:10px;height:14px;margin:8px 18px}
</style>

<script>
/* ═══════════════════════════════════════════════════════════════════════
