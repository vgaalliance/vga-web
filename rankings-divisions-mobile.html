<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --p: #7B2FFF; --pl: #A855F7; --pc: #C084FC;
  --pg: rgba(123,47,255,0.18); --pb: rgba(123,47,255,0.35);
  --gold: #F5C842; --bg: #06060A; --surf: #0B0B12;
  --border: #181824; --text: #DDD8F0; --muted: #4A4A68; --dim: #131320;
  --glow-sm: 0 0 8px rgba(123,47,255,0.7),0 0 20px rgba(123,47,255,0.3);
  --glow-md: 0 0 12px rgba(123,47,255,0.9),0 0 30px rgba(123,47,255,0.4),0 0 60px rgba(123,47,255,0.15);
  --glow-gold: 0 0 10px rgba(245,200,66,0.6),0 0 25px rgba(245,200,66,0.2);
}
* { margin:0; padding:0; box-sizing:border-box; }
html { background:#000; }
body {
  background:var(--bg); color:var(--text); font-family:'Barlow Condensed',sans-serif;
  min-height:100vh; max-width:320px; margin:0 auto; overflow-x:hidden; position:relative;
  animation:flicker 10s infinite, crt-wave 7s ease-in-out infinite;
}
body::before {
  content:''; position:fixed; inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.13) 2px,rgba(0,0,0,0.13) 4px);
  pointer-events:none; z-index:9999;
}
body::after {
  content:''; position:fixed; inset:0;
  background:radial-gradient(ellipse 80% 90% at 50% 50%,transparent 45%,rgba(0,0,0,0.75) 100%);
  pointer-events:none; z-index:9998;
}
@keyframes flicker{0%,89%,100%{opacity:1}90%{opacity:.98}91%{opacity:1}92%{opacity:.96}93%{opacity:1}}
@keyframes crt-wave{0%,100%{transform:perspective(1200px) rotateX(0.15deg)}50%{transform:perspective(1200px) rotateX(0deg)}}
@keyframes phosphor-glitch{0%,85%,100%{text-shadow:var(--glow-md);filter:blur(0)}87%{text-shadow:-2px 0 rgba(255,30,100,.65),2px 0 rgba(0,220,255,.65),0 0 20px rgba(123,47,255,.9);filter:blur(.3px)}89%{text-shadow:1px 0 rgba(255,30,100,.4),-1px 0 rgba(0,220,255,.4),0 0 30px rgba(168,85,247,1)}91%{text-shadow:var(--glow-md);filter:blur(0)}}
@keyframes holo{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes row-in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* ── Header ── */
.page-header {
  padding:8px 14px 7px; border-bottom:1px solid var(--border);
  position:relative; overflow:hidden;
  display:flex; align-items:baseline; gap:8px;
}
.page-header::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(115deg,transparent 20%,rgba(168,85,247,.07) 48%,transparent 72%);
  background-size:200% 100%; animation:holo 4s ease-in-out infinite; pointer-events:none;
}
.page-title {
  font-family:'Bebas Neue',sans-serif; font-size:20px;
  letter-spacing:.06em; animation:phosphor-glitch 11s infinite; position:relative; z-index:1;
}
.page-sub {
  font-family:'Space Mono',monospace; font-size:7px;
  letter-spacing:.18em; color:var(--muted); text-transform:uppercase; position:relative; z-index:1;
}

/* ── Search + sort controls ── */
.m-controls {
  display:flex; align-items:center; gap:10px;
  padding:7px 14px; border-bottom:1px solid var(--border); background:var(--dim);
}
.m-search-wrap { position:relative; flex:1; }
.m-search {
  width:100%; height:26px; background:transparent; border:none;
  border-bottom:1px solid var(--border); padding:0 6px 0 22px;
  font-family:'Barlow Condensed',sans-serif; font-size:13px;
  letter-spacing:.05em; color:var(--text); outline:none;
  transition:border-color .2s;
}
.m-search::placeholder { color:var(--muted); }
.m-search:focus { border-bottom-color:var(--pl); }
.m-search-ico { position:absolute; left:4px; top:50%; transform:translateY(-50%); width:11px; height:11px; opacity:.25; pointer-events:none; }
.m-sorts { display:flex; gap:10px; flex-shrink:0; }
.m-sort-btn {
  font-family:'Space Mono',monospace; font-size:7px; letter-spacing:.1em;
  text-transform:uppercase; background:transparent; border:none;
  color:var(--muted); cursor:pointer; padding-bottom:2px; position:relative;
  -webkit-tap-highlight-color:transparent;
}
.m-sort-btn::after {
  content:''; position:absolute; bottom:0; left:0; width:100%; height:1px;
  background:var(--pl); transform:scaleX(0); transition:transform .15s;
}
.m-sort-btn.active { color:var(--pl); text-shadow:var(--glow-sm); }
.m-sort-btn.active::after { transform:scaleX(1); }

/* ── Search results (cross-division) ── */
#search-panel { display:none; }
.res-div-tag {
  font-family:'Space Mono',monospace; font-size:6px; letter-spacing:.08em;
  color:var(--muted); border:1px solid var(--border); padding:1px 4px;
  flex-shrink:0; text-transform:uppercase;
}

/* ── Division tabs ── */
.div-tabs {
  display:flex; border-bottom:1px solid var(--border);
  background:var(--dim);
}
.div-tab {
  flex:1; padding:7px 4px 6px; text-align:center;
  font-family:'Space Mono',monospace; font-size:6.5px;
  letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); cursor:pointer; border-bottom:2px solid transparent;
  margin-bottom:-1px; transition:color .15s, border-color .15s;
  -webkit-tap-highlight-color:transparent; user-select:none;
}
.div-tab.active { color:var(--pl); border-bottom-color:var(--p); text-shadow:var(--glow-sm); }

/* ── Division panel ── */
.div-panel { display:none; }
.div-panel.active { display:block; }

/* ── Division label bar ── */
.div-label-bar {
  padding:7px 14px 6px; border-bottom:1px solid var(--border);
  background:var(--surf); border-left:3px solid var(--p);
  position:relative; overflow:hidden;
}
.div-label-bar::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg,var(--pg) 0%,transparent 60%);
  pointer-events:none;
}
.div-label-name {
  font-family:'Bebas Neue',sans-serif; font-size:18px;
  letter-spacing:.08em; color:var(--pc); text-shadow:var(--glow-sm);
  position:relative; z-index:1;
}
.div-label-weight {
  font-family:'Space Mono',monospace; font-size:7px;
  color:var(--muted); letter-spacing:.1em; position:relative; z-index:1;
}

/* ── Fighter rows ── */
.fighter-row {
  display:flex; align-items:center; gap:8px;
  padding:7px 12px 7px 14px; border-bottom:1px solid rgba(123,47,255,.07);
  text-decoration:none; color:inherit;
  transition:background .12s;
  animation:row-in .3s ease both;
}
.fighter-row:nth-child(even) { background:rgba(123,47,255,.03); }
.fighter-row:hover { background:rgba(123,47,255,.1); }
.fighter-row:last-child { border-bottom:none; }

.fighter-row.champ {
  background:rgba(245,200,66,.05);
  border-left:2px solid rgba(245,200,66,.45);
  padding-left:12px;
  border-bottom-color:rgba(245,200,66,.14);
}
.fighter-row.champ:nth-child(even) { background:rgba(245,200,66,.06); }
.fighter-row.champ:hover { background:rgba(245,200,66,.09); }

.row-rank {
  font-family:'Space Mono',monospace; font-size:9px;
  min-width:20px; text-align:right; flex-shrink:0; color:var(--muted);
}
.row-rank.top  { color:var(--pc); text-shadow:var(--glow-sm); }
.row-rank.gold { color:var(--gold); text-shadow:var(--glow-gold); font-size:11px; }

.row-name {
  font-family:'Barlow Condensed',sans-serif; font-size:16px;
  font-weight:700; flex:1; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; letter-spacing:.02em;
}
.champ .row-name { color:var(--gold); }

.row-record {
  font-family:'Space Mono',monospace; font-size:9px;
  flex-shrink:0; white-space:nowrap; color:var(--muted);
}
.row-record .rw { color:#7ee87e; }
.row-record .rl { color:rgba(255,80,80,.6); }

.div-empty {
  padding:24px 16px; text-align:center;
  font-family:'Space Mono',monospace; font-size:7px;
  color:var(--muted); letter-spacing:.12em; text-transform:uppercase;
}
.dot{display:inline-block;width:3px;height:3px;background:var(--p);border-radius:50%;animation:blink 1s ease-in-out infinite;margin:0 1px;vertical-align:middle;}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
</style>
</head>
<body>

<div class="page-header">
  <div class="page-title">Rankings</div>
  <div class="page-sub">UBA · S1 2026</div>
</div>

<div class="m-controls">
  <div class="m-search-wrap">
    <svg class="m-search-ico" viewBox="0 0 16 16" fill="none">
      <circle cx="6.5" cy="6.5" r="5" stroke="white" stroke-width="1.5"/>
      <line x1="10.5" y1="10.5" x2="14" y2="14" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <input class="m-search" id="m-search" type="text" placeholder="Search fighter...">
  </div>
  <div class="m-sorts">
    <button class="m-sort-btn active" data-s="rank">Rank</button>
    <button class="m-sort-btn" data-s="wins">Wins</button>
  </div>
</div>

<div class="div-tabs" id="tabs">
  <div class="div-tab active" data-div="0">LW</div>
  <div class="div-tab" data-div="1">MW</div>
  <div class="div-tab" data-div="2">LHW</div>
  <div class="div-tab" data-div="3">HW</div>
</div>

<div id="panels"></div>
<div id="search-panel"></div>

<script>
const SB  = 'https://emzlivoykbhhjcugupit.supabase.co';
const KEY = 'sb_publishable_pqhH974E1q9YsFnrVH1UJQ_X3V-rRLF';
const H   = { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY };
const FIGHTER_URL = 'https://www.ubaesports.com/fighter?f=';

const DIVS = [
  { key:'lightweight',       label:'LIGHTWEIGHT',     weight:'170 lbs & under' },
  { key:'middleweight',      label:'MIDDLEWEIGHT',    weight:'171–185 lbs' },
  { key:'light_heavyweight', label:'LT. HEAVYWEIGHT', weight:'186–205 lbs' },
  { key:'heavyweight',       label:'HEAVYWEIGHT',     weight:'205+ lbs' },
];

const divRows = {};        // idx -> [{f, disp, champ, top}] in rank order
let q = '', sortMode = 'rank', activeTab = 0;

function rowHTML(row, i) {
  const { f, disp, champ, top } = row;
  const rankCls = champ ? 'gold' : (top ? 'top' : '');
  const url = f.slug ? FIGHTER_URL + encodeURIComponent(f.slug) : '#';
  const delay = `animation-delay:${i * 0.045}s`;
  return `<a class="fighter-row${champ ? ' champ' : ''}" href="${url}" target="_parent" style="${delay}">
    <div class="row-rank ${rankCls}">${disp}</div>
    <div class="row-name">${f.display_name || '—'}</div>
    <div class="row-record"><span class="rw">${f.wins ?? 0}</span><span>-</span><span class="rl">${f.losses ?? 0}</span></div>
  </a>`;
}

// Champion = is_champion flag (belt holder above the list, shown as C).
// Contenders = division-scope rankings with their stored numbers (#1 = first
// contender, NOT the champ). Unranked fighters fill remaining rows as NR.
async function loadDiv(idx) {
  const div = DIVS[idx];
  const [rankRes, cardRes] = await Promise.all([
    fetch(`${SB}/rest/v1/rankings_public?scope=eq.weight_class&level=eq.pro&weight_class=eq.${div.key}&select=rank,fighter_slug&order=rank.asc`, { headers: H }),
    fetch(`${SB}/rest/v1/fighter_cards?weight_class=eq.${div.key}&select=slug,display_name,wins,losses,contract_tier,level,is_champion`, { headers: H }),
  ]);
  const rankArr = await rankRes.json().then(d => Array.isArray(d) ? d : []);
  const cardArr = await cardRes.json().then(d => Array.isArray(d) ? d : []);

  const bySlug = {};
  cardArr.forEach(c => { bySlug[c.slug] = c; });

  const rows = [];
  const used = new Set();

  const champ = cardArr.find(c => c.is_champion);
  if (champ) { rows.push({ f: champ, disp: 'C', champ: true }); used.add(champ.slug); }

  rankArr.forEach(r => {
    const f = bySlug[r.fighter_slug];
    if (!f || used.has(f.slug)) return;
    rows.push({ f, disp: `#${r.rank}`, top: r.rank <= 3 });
    used.add(f.slug);
  });

  cardArr.filter(c => !used.has(c.slug))
    .sort((a, b) => (b.wins ?? 0) - (a.wins ?? 0))
    .forEach(f => rows.push({ f, disp: 'NR' }));

  divRows[idx] = rows;
}

// Wins sort keeps the belt holder pinned on top.
function orderedRows(idx) {
  const rows = divRows[idx] || [];
  if (sortMode === 'rank') return rows;
  const champ = rows.filter(r => r.champ);
  const rest  = rows.filter(r => !r.champ)
    .slice().sort((a, b) => (b.f.wins ?? 0) - (a.f.wins ?? 0));
  return [...champ, ...rest];
}

function renderTab(idx) {
  const listEl = document.querySelector(`#panel-${idx} .div-list`);
  if (!listEl) return;
  const rows = orderedRows(idx).slice(0, 16);
  listEl.innerHTML = rows.length
    ? rows.map((row, i) => rowHTML(row, i)).join('')
    : '<div class="div-empty">No fighters ranked yet</div>';
}

// Search spans ALL divisions — tabs hide, one combined results list shows.
function renderSearch() {
  const sp = document.getElementById('search-panel');
  const searching = q.length > 0;
  document.getElementById('tabs').style.display = searching ? 'none' : 'flex';
  document.getElementById('panels').style.display = searching ? 'none' : 'block';
  sp.style.display = searching ? 'block' : 'none';
  if (!searching) return;

  const TAGS = ['LW', 'MW', 'LHW', 'HW'];
  const matches = [];
  DIVS.forEach((div, idx) => {
    orderedRows(idx).forEach(row => {
      if ((row.f.display_name || '').toLowerCase().includes(q)) matches.push({ ...row, tag: TAGS[idx] });
    });
  });

  sp.innerHTML = matches.length
    ? matches.map((row, i) => {
        const { f, disp, champ, top, tag } = row;
        const rankCls = champ ? 'gold' : (top ? 'top' : '');
        const url = f.slug ? FIGHTER_URL + encodeURIComponent(f.slug) : '#';
        return `<a class="fighter-row${champ ? ' champ' : ''}" href="${url}" target="_parent" style="animation-delay:${i * 0.045}s">
          <div class="row-rank ${rankCls}">${disp}</div>
          <div class="row-name">${f.display_name || '—'}</div>
          <span class="res-div-tag">${tag}</span>
          <div class="row-record"><span class="rw">${f.wins ?? 0}</span><span>-</span><span class="rl">${f.losses ?? 0}</span></div>
        </a>`;
      }).join('')
    : '<div class="div-empty">No matches</div>';
}

function switchTab(idx) {
  activeTab = idx;
  document.querySelectorAll('.div-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.div-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
  renderTab(idx);
}

async function init() {
  const panels = document.getElementById('panels');
  DIVS.forEach((div, i) => {
    const panel = document.createElement('div');
    panel.className = `div-panel${i === 0 ? ' active' : ''}`;
    panel.id = `panel-${i}`;
    panel.innerHTML = `
      <div class="div-label-bar">
        <div class="div-label-name">${div.label}</div>
        <div class="div-label-weight">${div.weight}</div>
      </div>
      <div class="div-list"><div class="div-empty">Loading<span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>`;
    panels.appendChild(panel);
  });

  document.querySelectorAll('.div-tab').forEach(tab => {
    tab.addEventListener('click', () => switchTab(+tab.dataset.div));
  });
  document.getElementById('m-search').addEventListener('input', e => {
    q = e.target.value.toLowerCase().trim();
    renderSearch();
  });
  document.querySelectorAll('.m-sort-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.m-sort-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      sortMode = b.dataset.s;
      q.length ? renderSearch() : renderTab(activeTab);
    });
  });

  // Preload every division so search + tab switches are instant
  try {
    await Promise.all(DIVS.map((d, i) => loadDiv(i)));
    DIVS.forEach((d, i) => renderTab(i));
  } catch(e) {
    document.querySelectorAll('.div-list').forEach(el => el.innerHTML = '<div class="div-empty">Error loading</div>');
  }
}

init();
</script>
</body>
</html>
