<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VGA replay overlay</title>
<!--
  VGA replay overlay  (the OBS browser source)

  In OBS: add a Browser source, tick "Local file", point it at this file,
  set width 1920 height 1080, and leave "Shutdown source when not visible" OFF
  so it stays connected between scenes.

  Fill in the same two keys as the control page. Nothing else to configure.
  This page has no controls of its own; it only obeys the control page.

  Test without Supabase: open it in a browser and add ?test=1 to the address.
-->
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  #box{position:absolute;inset:0}
  #video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  /* No clip yet: see-through, not a black 1920x1080 box over the scene. */
  #video:not([src]){background:transparent}
  #ink{position:absolute;inset:0;width:100%;height:100%}
  #warn{position:absolute;left:16px;bottom:16px;font:13px system-ui;color:#fff;background:rgba(200,60,60,.85);
        padding:6px 10px;border-radius:4px;display:none}
</style>
</head>
<body>
<div id="box">
  <video id="video" playsinline preload="auto"></video>
  <canvas id="ink"></canvas>
</div>
<div id="warn"></div>

<script>
// ---------- config: same two values as the control page ----------
const SUPABASE_URL = "https://emzlivoykbhhjcugupit.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_pqhH974E1q9YsFnrVH1UJQ_X3V-rRLF";

const video = document.getElementById("video");
// 10% until the control page says otherwise -- a replay must never hit the air
// at full volume just because the overlay was refreshed before the analyst's
// page reconnected.
video.volume = 0.10;
const ink   = document.getElementById("ink");
const ctx   = ink.getContext("2d");
const warn  = document.getElementById("warn");

let strokes = [];   // finished strokes
let live    = null; // the stroke the analyst is drawing right now

// ---------- canvas ----------
function fit(){
  ink.width  = ink.clientWidth  * devicePixelRatio;
  ink.height = ink.clientHeight * devicePixelRatio;
  redraw();
}
addEventListener("resize", fit);

function redraw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,ink.width,ink.height);
  for (const s of strokes) draw(s);
  if (live) draw(live);
}

// Identical to the control page, so what the analyst sees is what goes on air.
function draw(s){
  const W = ink.width, H = ink.height, k = W/1920;
  ctx.lineCap = ctx.lineJoin = "round"; ctx.strokeStyle = s.color; ctx.lineWidth = s.width*k*1.6;
  ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 4*k;
  const P = s.pts.map(([x,y]) => [x*W, y*H]);
  ctx.beginPath();
  if (s.tool === "pen"){ ctx.moveTo(...P[0]); for (const p of P.slice(1)) ctx.lineTo(...p); ctx.stroke(); return; }
  if (P.length < 2) return;
  const [a,b] = P;
  if (s.tool === "line" || s.tool === "arrow"){
    ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
    if (s.tool === "arrow"){
      const ang = Math.atan2(b[1]-a[1], b[0]-a[0]), L = 18*k + s.width*k*2;
      ctx.beginPath(); ctx.moveTo(...b);
      ctx.lineTo(b[0]-L*Math.cos(ang-0.5), b[1]-L*Math.sin(ang-0.5));
      ctx.moveTo(...b);
      ctx.lineTo(b[0]-L*Math.cos(ang+0.5), b[1]-L*Math.sin(ang+0.5));
      ctx.stroke();
    }
  }
  if (s.tool === "circle"){
    const rx = Math.abs(b[0]-a[0])/2, ry = Math.abs(b[1]-a[1])/2;
    ctx.ellipse((a[0]+b[0])/2, (a[1]+b[1])/2, rx, ry, 0, 0, Math.PI*2); ctx.stroke();
  }
}

// ---------- loading a clip ----------
// The clip is pulled down in full and played from memory, not streamed while it
// plays. On a broadcast PC the upstream is already full of the stream itself, so
// a video fed a few hundred KB at a time stutters -- and it stutters ON AIR,
// where a buffering clip is worse than a clip that starts a second later.
// A blob also survives the connection dropping mid-replay: the bytes are already
// here. If the fetch fails at all, the plain URL still works the old way.
let clipUrl  = null;   // the blob we made, so it can be released
let loadedUrl = null;  // the clip this page is actually holding
let loadSeq  = 0;      // so a slow fetch that was abandoned can never win
let ready    = false;

// What the control page says is true RIGHT NOW. The overlay's whole job is to
// make itself match this -- it is not a list of orders to carry out, it is a
// description to converge on. That is the difference between missing a "play"
// forever and being a third of a second late to one.
const want = { url:null, t:0, rate:1, playing:false, vol:0.10, muted:false };

function loadClip(url){
  const mine = ++loadSeq;
  ready = false;
  if (clipUrl){ URL.revokeObjectURL(clipUrl); clipUrl = null; }
  // removeAttribute, NOT src="": an empty src still counts as having the
  // attribute, so the :not([src]) rule stops matching and OBS gets a black
  // 1920x1080 rectangle over the scene for the whole download.
  video.removeAttribute("src");
  video.load();
  loadedUrl = url;

  fetch(url)
    .then(r => r.ok ? r.blob() : Promise.reject(new Error(r.status)))
    .then(blob => {
      if (mine !== loadSeq) return;      // the analyst moved on; drop this one
      clipUrl = URL.createObjectURL(blob);
      video.src = clipUrl; video.load();
    })
    .catch(() => { if (mine === loadSeq){ video.src = url; video.load(); } });
}

video.addEventListener("canplay", () => { ready = true; converge(); });
video.addEventListener("loadedmetadata", () => { ready = true; converge(); });

// Bring the picture into line with `want`. Safe to call as often as you like.
function converge(){
  if (want.url && want.url !== loadedUrl) loadClip(want.url);
  if (!ready || !video.src) return;      // nothing to correct yet -- and nothing lost:
                                         // the next state message calls this again
  if (video.volume !== want.vol)   video.volume = Math.max(0, Math.min(1, want.vol));
  if (video.muted  !== want.muted) video.muted  = want.muted;

  const off = want.t - video.currentTime;
  if (Math.abs(off) > 0.35){
    video.currentTime = want.t;          // properly out -- jump
    video.playbackRate = want.rate;
  } else if (want.playing){
    // Close enough that a jump would read as a stutter on air. Ease into line by
    // running a touch fast or slow instead -- invisible, and it never overshoots.
    video.playbackRate = want.rate * (1 + Math.max(-0.06, Math.min(0.06, off * 0.4)));
  } else {
    video.playbackRate = want.rate;
  }

  if (want.playing && video.paused) video.play().catch(() => {
    // Autoplay refused because of the sound. Better muted on air than frozen.
    video.muted = true; video.play().catch(() => {});
  });
  if (!want.playing && !video.paused) video.pause();
}

// ---------- what the control page says ----------
function apply(m){
  switch (m.type){
    // the sign: everything about the transport, several times a second
    case "state":
      want.url = m.url; want.t = m.t; want.rate = m.rate; want.playing = m.playing;
      if (m.vol !== undefined)   want.vol = m.vol;
      if (m.muted !== undefined) want.muted = m.muted;
      converge();
      break;

    // Still sent so the overlay reacts at once rather than up to one sign later.
    // None of them can be lost any more: the sign puts it right regardless.
    case "load":   want.url = m.url; want.t = 0; strokes = []; live = null; redraw(); converge(); break;
    case "play":   want.playing = true;  converge(); break;
    case "pause":  want.playing = false; converge(); break;
    case "seek":   want.t = m.t;         converge(); break;
    case "rate":   want.rate = m.r;      converge(); break;
    case "volume": want.vol = +m.v || 0; want.muted = !!m.muted; converge(); break;

    // Drawings are events, not state -- each one is a thing that happened, and
    // the control page re-sends the lot when a page reconnects.
    case "live":   live = m.stroke; redraw(); break;
    case "stroke": live = null; strokes.push(m); redraw(); break;
    case "undo":   strokes.pop(); live = null; redraw(); break;
    case "clear":  strokes = []; live = null; redraw(); break;
  }
}

// ---------- connect ----------
async function connect(){
  if (new URLSearchParams(location.search).has("test")) return testMode();

  if (!SUPABASE_URL || !SUPABASE_ANON_KEY){
    warn.style.display = "block";
    warn.textContent = "Overlay: add your Supabase keys to this file";
    return;
  }
  await new Promise((ok,no)=>{ const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"; s.onload=ok; s.onerror=no;
    document.head.appendChild(s); });

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const ch = sb.channel("replay")
    .on("broadcast", { event:"replay" }, p => apply(p.payload))
    .subscribe(s => {
      const bad = s !== "SUBSCRIBED";
      // Ask the control page for whatever is on screen, so a refresh lands back
      // on the clip instead of sitting empty until the next click.
      if (!bad) ch.send({ type:"broadcast", event:"replay", payload:{ type:"hello" } });
      warn.style.display = bad ? "block" : "none";
      if (bad) warn.textContent = "Overlay: not connected to the control page";
    });
}

// ---------- test mode ----------
// ?test=1 draws a moving arrow and circle so you can check the source is
// keyed correctly in OBS without needing Supabase or a clip.
function testMode(){
  video.style.background = "transparent";
  let t = 0;
  setInterval(() => {
    t += 0.03;
    strokes = [
      { tool:"arrow",  color:"#ffd23f", width:6, pts:[[0.25,0.7],[0.45+0.05*Math.sin(t),0.4]] },
      { tool:"circle", color:"#3fd7ff", width:6, pts:[[0.55,0.25],[0.75,0.55]] }
    ];
    redraw();
  }, 33);
}

connect().catch(e => { warn.style.display="block"; warn.textContent="Overlay: couldn't reach Supabase"; console.error(e); });
fit();
</script>
</body>
</html>
