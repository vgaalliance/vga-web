<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VGA Nav Bar — mock</title>
<!-- ═══════════════════════════════════════════════════════════════════════
     NAV BAR MOCK v3 — clean/minimal, UFC-style. Flat black, bold links,
     one purple accent. Condenses on scroll. Design ref for the Wix header.
     ══════════════════════════════════════════════════════════════════════ -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --p:#7B2FFF; --pc:#B487FC;
    --bg:#08080C; --barbg:#0A0A10; --text:#F4F2FA; --muted:#6E6C82; --border:#1C1C28;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;}
  a{color:inherit;text-decoration:none;}

  /* ── the bar ── */
  .nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:70px;
    display:flex;align-items:center;gap:0;padding:0 34px;
    background:var(--barbg);border-bottom:1px solid var(--border);
    transition:height .28s cubic-bezier(.4,0,.2,1),box-shadow .28s ease,border-color .28s ease;}
  .nav.small{height:50px;border-bottom-color:#24243400;box-shadow:0 4px 20px rgba(0,0,0,.6);}

  .logo{font-family:'Bebas Neue',sans-serif;letter-spacing:1.5px;font-size:29px;line-height:1;
    white-space:nowrap;transition:font-size .28s ease;margin-right:44px;}
  .nav.small .logo{font-size:22px;}
  .logo .e{color:var(--pc);}

  .links{display:flex;align-items:stretch;height:100%;}
  .links a{display:flex;align-items:center;font-weight:700;font-size:16px;letter-spacing:1.2px;
    text-transform:uppercase;color:var(--text);padding:0 20px;position:relative;transition:color .15s;}
  .links a:not(.on){color:var(--muted);}
  .links a:hover{color:var(--text);}
  /* clean 3px accent bar, no glow — UFC-style */
  .links a::after{content:'';position:absolute;left:20px;right:20px;bottom:0;height:3px;
    background:var(--p);transform:scaleX(0);transform-origin:center;transition:transform .18s ease;}
  .links a.on::after,.links a:hover::after{transform:scaleX(1);}

  .join{margin-left:auto;font-weight:700;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--text);background:var(--p);border-radius:3px;padding:10px 20px;transition:padding .28s ease,background .15s;}
  .nav.small .join{padding:7px 18px;}
  .join:hover{background:#6a24e0;}

  @media(max-width:760px){ .links{display:none;} }

  /* ── demo body so the page scrolls ── */
  .spacer{height:70px;}
  .demo{max-width:1000px;margin:0 auto;padding:44px 20px 120px;}
  .demo h2{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:1.5px;color:var(--pc);margin:30px 0 10px;}
  .demo p{color:var(--muted);font-size:16px;max-width:640px;line-height:1.5;}
  .demo .hint{font-weight:600;font-size:13px;letter-spacing:1px;color:var(--pc);text-transform:uppercase;}
  .block{height:220px;border:1px solid var(--border);border-radius:8px;margin:22px 0;background:#0D0D14;
    display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--muted);font-size:13px;letter-spacing:2px;}
</style>
</head>
<body>

<div class="nav" id="nav">
  <a class="logo" href="#">VGA <span class="e">ESPORTS</span></a>
  <nav class="links">
    <a class="on" href="#">Home</a>
    <a href="#">Fighters</a>
    <a href="#">Rankings</a>
    <a href="#">Teams</a>
    <a href="#">News</a>
    <a href="#">Merch</a>
  </nav>
  <a class="join" href="#">Join Discord</a>
</div>

<div class="spacer"></div>
<div class="demo">
  <p class="hint">▼ Scroll down — the bar condenses. Scroll up — it expands.</p>
  <h2>The Bar</h2>
  <p>Flat black, bold white links, one clean purple accent bar on hover/active. No glow, no dots — the typography does the work.</p>
  <div class="block">PAGE CONTENT</div>
  <div class="block">PAGE CONTENT</div>
  <div class="block">PAGE CONTENT</div>
</div>

<script>
var nav=document.getElementById('nav');
function onScroll(){ if(window.scrollY>40) nav.classList.add('small'); else nav.classList.remove('small'); }
window.addEventListener('scroll',onScroll,{passive:true}); onScroll();
</script>
</body>
</html>
