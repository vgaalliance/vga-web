<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UBA Events</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Space+Mono:wght@400;700&display=swap');
  :root {
    --p: #7B2FFF; --pl: #A855F7; --pc: #C084FC;
    --pg: rgba(123,47,255,0.18); --pb: rgba(123,47,255,0.35);
    --gold: #F5C842; --bg: #06060A; --surf: #0B0B12;
    --border: #181824; --text: #DDD8F0; --muted: #4A4A68; --dim: #131320;
    --glow-sm: 0 0 8px rgba(123,47,255,0.7),0 0 20px rgba(123,47,255,0.3);
    --glow-gold: 0 0 10px rgba(245,200,66,0.6),0 0 25px rgba(245,200,66,0.2);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { scrollbar-width: none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
  body { background: transparent; color: var(--text); font-family: 'Barlow Condensed', sans-serif; padding: 0; }

  .wrap { width: 100%; max-width: 860px; }

  /* tabs */
  .tabs { display: flex; gap: 7px; margin-bottom: 14px; }
  .tab { padding: 7px 22px; font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: var(--muted);
         cursor: pointer; border: 1px solid var(--border); background: var(--surf);
         text-transform: uppercase; transition: color 0.15s, border-color 0.15s, background 0.15s;
         clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px)); }
  .tab:hover { color: var(--pc); border-color: var(--pb); }
  .tab.active { color: #fff; border-color: var(--p); background: var(--pg); box-shadow: var(--glow-sm); }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .day-group { border-left: 2px solid var(--border); padding-left: 10px; }
  .day-header { font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.16em; color: var(--pc); text-transform: uppercase; padding: 0 0 5px; }
  .day-group .row-wrapper + .row-wrapper { margin-top: 3px; }

  /* event row */
  .row-wrapper { position: relative; }
  .row-toggle { display: none; }
  .row-label { display: block; cursor: pointer; user-select: none; }
  .event-row { display: flex; align-items: center; background: var(--surf); border: 1px solid var(--border);
         border-left: 2px solid var(--p); padding: 8px 12px; gap: 10px; min-height: 44px; transition: background 0.15s; }
  .row-label:hover .event-row { background: #12101f; }

  .event-date { flex-shrink: 0; width: 34px; text-align: center; line-height: 1.05; }
  .ed-dow { font-family: 'Space Mono', monospace; font-size: 7px; color: var(--muted); letter-spacing: 0.06em; }
  .ed-num { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--pc); text-shadow: var(--glow-sm); }
  .ed-mon { font-family: 'Space Mono', monospace; font-size: 7px; color: var(--muted); letter-spacing: 0.06em; }
  .event-div { width: 1px; align-self: stretch; background: var(--border); flex-shrink: 0; margin: 2px 0; }

  .event-badges { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; align-items: flex-start; width: 58px; }
  .league-badge { font-family: 'Space Mono', monospace; font-size: 8px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
         padding: 1px 5px; white-space: nowrap; border: 1px solid currentColor;
         clip-path: polygon(0 0, calc(100% - 4px) 0, 100% 4px, 100% 100%, 4px 100%, 0 calc(100% - 4px)); }
  .league-badge.uba { color: var(--gold); background: rgba(245,200,66,0.08); }
  .league-badge.ubae { color: var(--pl); background: rgba(168,85,247,0.08); }
  .event-badge { font-family: 'Space Mono', monospace; font-size: 8px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
         padding: 1px 5px; white-space: nowrap;
         clip-path: polygon(0 0, calc(100% - 4px) 0, 100% 4px, 100% 100%, 4px 100%, 0 calc(100% - 4px)); }
  .event-badge.fight_night { color: var(--gold); background: rgba(245,200,66,0.1); }
  .event-badge.numbered { color: var(--pl); background: rgba(168,85,247,0.1); }
  .event-badge.ama { color: #38bdf8; background: rgba(56,189,248,0.1); }
  .event-badge.ubae { color: var(--pl); background: rgba(168,85,247,0.1); }
  .event-badge.draft { color: #22c55e; background: rgba(34,197,94,0.1); }

  .event-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .event-title { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: 0.02em;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .event-meta { flex-shrink: 0; display: flex; align-items: center; }
  .meta-pill { font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
         text-transform: uppercase; padding: 4px 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.02); }
  .meta-pill.done { color: #22c55e; border-color: rgba(34,197,94,0.25); background: rgba(34,197,94,0.05); }
  .meta-pill.soon { color: var(--pl); border-color: var(--pb); background: var(--pg); }

  .row-chevron { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--muted); flex-shrink: 0;
         transition: transform 0.2s, color 0.15s; width: 14px; text-align: center; }
  .row-toggle:checked ~ .row-label .row-chevron { transform: rotate(90deg); color: var(--pl); }

  /* expanded card */
  .row-dropdown { display: none; background: linear-gradient(180deg, var(--pg), var(--surf) 42%);
         border: 1px solid var(--border); border-top: none; border-left: 2px solid var(--p); padding: 6px 16px 12px; }
  .row-toggle:checked ~ .row-dropdown { display: block; }
  .card-head { font-family: 'Space Mono', monospace; font-size: 8px; letter-spacing: 0.2em; color: var(--pc);
         text-transform: uppercase; padding: 8px 0 6px; }
  .bout { display: grid; grid-template-columns: 26px 1fr 70px 1fr; align-items: center; gap: 0;
         padding: 7px 0; border-bottom: 1px solid rgba(123,47,255,0.08); }
  .bout:last-child { border-bottom: none; }
  .bout-num { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); }
  .bout-f { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bout-f.a { text-align: right; padding-right: 10px; }
  .bout-f.b { text-align: left; padding-left: 10px; }
  .bout-f.win { color: var(--text); }
  .bout-f.lose { color: var(--muted); }
  .bout-f.pending { color: #c8c8d8; }
  .bout-mid { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .bout-vs { font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; color: var(--pl); text-transform: uppercase; }
  .bout-method { font-family: 'Space Mono', monospace; font-size: 9px; color: #22c55e; letter-spacing: 0.04em; white-space: nowrap; }
  .bout-title { font-family: 'Space Mono', monospace; font-size: 8px; color: var(--gold); letter-spacing: 0.05em; white-space: nowrap; text-shadow: var(--glow-gold); }
  .bout-wc { font-family: 'Space Mono', monospace; font-size: 7px; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
  .no-card { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); padding: 10px 0; letter-spacing: 0.05em; }

  /* VOD embed — thumbnail only until tapped */
  .vod-box { margin: 4px 0 8px; position: relative; border: 1px solid var(--border); background: #000; }
  .vod-thumb { position: relative; cursor: pointer; padding-top: 56.25%; background-size: cover; background-position: center; }
  .vod-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(4,0,16,0.25); }
  .vod-play-btn { width: 46px; height: 32px; background: rgba(4,0,16,0.85); border: 1px solid var(--pb); display: flex; align-items: center; justify-content: center; box-shadow: var(--glow-sm); }
  .vod-play-tri { width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 11px solid var(--pc); margin-left: 3px; }
  .vod-link { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--pl); text-decoration: none; border: 1px solid var(--pb); padding: 4px 10px; display: inline-block; margin: 4px 0 8px; }

  .status-msg { color: var(--muted); font-family: 'Space Mono', monospace; font-size: 11px; padding: 48px 0; text-align: center; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="wrap">
  <!-- Featured video — pinned/auto latest fight, stacked above the schedule -->
  <div id="featured" style="display:none;margin-bottom:12px;">
    <div class="card-head" style="padding:0 0 5px;">Latest Fight</div>
    <div class="vod-box" style="margin:0;">
      <div class="vod-thumb" id="featured-thumb">
        <div class="vod-play"><div class="vod-play-btn"><div class="vod-play-tri"></div></div></div>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="upcoming">Upcoming</button>
    <button class="tab" data-tab="past">Past</button>
  </div>
  <div class="list" id="list"><div class="status-msg">Loading…</div></div>
</div>

<script>
const SB  = 'https://emzlivoykbhhjcugupit.supabase.co';
const KEY = 'sb_publishable_pqhH974E1q9YsFnrVH1UJQ_X3V-rRLF';
const H   = { apikey: KEY, Authorization: 'Bearer ' + KEY };
const DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const TYPE_LABEL = { fight_night:'Fight Night', numbered:'Numbered', ama:'AMA', ubae:'UBAe', draft:'Draft' };
const MAX_PER_TAB = 5;

// PLACEHOLDER EVENTS — hand-set rows shown alongside DB events. Delete each
// line as the real event gets created in the system (otherwise it'll show twice).
const PLACEHOLDER_EVENTS = [
  { id:'ph-fn28',  name:'Fight Night 28', league:'UBA',  type:'fight_night', status:'scheduled', event_date:'2026-07-11T17:00:00Z' },
  { id:'ph-draft', name:'UBAe S2 Draft',  league:'UBAe', type:'draft',       status:'scheduled', event_date:'2026-07-16T19:00:00Z' },
  { id:'ph-ubae1', name:'UBAe Season 2',  league:'UBAe', type:'ubae',        status:'scheduled', event_date:'2026-07-24T19:00:00Z' },
  { id:'ph-ama57', name:'AMA 57',         league:'UBA',  type:'ama',         status:'completed', event_date:'2026-07-02T18:00:00Z' },
  { id:'ph-ama56', name:'AMA 56',         league:'UBA',  type:'ama',         status:'completed', event_date:'2026-06-24T18:00:00Z' },
  { id:'ph-uba14', name:'UBA 14',         league:'UBA',  type:'numbered',    status:'completed', event_date:'2026-06-20T17:00:00Z' },
];

let events = [], cardsByEvent = {}, activeTab = 'upcoming';

// Hand-picked featured video for the top block. Auto-picking prefers the
// newest completed event's vod_link; this pin is the fallback when no event
// VODs exist yet. Set to '' to hide the block entirely when nothing matches.
const FEATURED_VOD = 'https://www.youtube.com/live/PsNLe-NNqk0?t=8975';

function setFeatured(url) {
  if (!url) return;
  const vid = (url.match(/(?:youtube\.com\/(?:watch\?v=|live\/|shorts\/)|youtu\.be\/)([\w-]{11})/) || [])[1];
  if (!vid) return;
  const ts = (url.match(/[?&]t=(\d+)/) || [])[1];
  const th = document.getElementById('featured-thumb');
  th.dataset.vid = vid;
  if (ts) th.dataset.start = ts;
  th.style.backgroundImage = `url(https://i.ytimg.com/vi/${vid}/hqdefault.jpg)`;
  document.getElementById('featured').style.display = 'block';
}

async function sb(table, params) {
  const r = await fetch(`${SB}/rest/v1/${table}?${params}`, { headers: H });
  return r.json();
}

function fmtDay(d) { return `${DAYS[d.getUTCDay()]}, ${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}`; }
function fmtTime(d) {
  let h = d.getUTCHours(), m = d.getUTCMinutes();
  const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return `${h}:${String(m).padStart(2,'0')} ${ap}`;
}

function boutHTML(b, i) {
  const done = b.status === 'completed';
  const aWin = b.winner_corner === 'a', bWin = b.winner_corner === 'b';
  const draw = done && !b.winner_corner;
  const ca = done ? (aWin ? 'win' : (draw ? 'pending' : 'lose')) : 'pending';
  const cb = done ? (bWin ? 'win' : (draw ? 'pending' : 'lose')) : 'pending';
  const num = b.bout_number || (i + 1);
  const mid = done
    ? `<span class="bout-method">${draw ? 'DRAW' : (b.method || 'WIN')}</span>`
    : `<span class="bout-vs">vs</span>`;
  const title = b.is_title_fight ? `<span class="bout-title">★ ${b.title_name || 'TITLE'}</span>` : '';
  const wc = b.weight_class ? `<span class="bout-wc">${(b.weight_class||'').replace(/_/g,' ')}</span>` : '';
  return `<div class="bout">
    <span class="bout-num">M${num}</span>
    <span class="bout-f a ${ca}">${b.fighter_a_name}</span>
    <div class="bout-mid">${mid}${title}${wc}</div>
    <span class="bout-f b ${cb}">${b.fighter_b_name}</span>
  </div>`;
}

function eventHTML(e) {
  const d = new Date(e.event_date);
  const done = e.status === 'completed';
  const uid = 'e-' + e.id.slice(0, 8);
  const type = e.type || 'general';
  const card = (cardsByEvent[e.id] || []).slice().sort((a,b)=>(a.bout_number||99)-(b.bout_number||99));
  const cardHTML = card.length
    ? `<div class="card-head">${done ? 'Results' : 'Fight Card'}</div>` + card.map(boutHTML).join('')
    : `<div class="no-card">No matches listed for this event.</div>`;

  // VOD: tap-to-play embed for completed events with a YouTube link
  // (thumbnail only until tapped — keeps the page light)
  let vodHTML = '';
  if (done && e.vod_link) {
    const vid = (e.vod_link.match(/(?:youtube\.com\/(?:watch\?v=|live\/|shorts\/)|youtu\.be\/)([\w-]{11})/) || [])[1];
    const ts  = (e.vod_link.match(/[?&]t=(\d+)/) || [])[1];
    vodHTML = vid
      ? `<div class="card-head">Watch</div><div class="vod-box"><div class="vod-thumb" data-vid="${vid}"${ts ? ` data-start="${ts}"` : ''} style="background-image:url(https://i.ytimg.com/vi/${vid}/hqdefault.jpg)"><div class="vod-play"><div class="vod-play-btn"><div class="vod-play-tri"></div></div></div></div></div>`
      : `<div class="card-head">Watch</div><a class="vod-link" href="${e.vod_link}" target="_blank">WATCH VOD ↗</a>`;
  }
  const meta = done
    ? `<span class="meta-pill done">Done</span>`
    : `<span class="meta-pill soon">${fmtTime(d)}</span>`;
  return `<div class="row-wrapper">
    <input type="checkbox" class="row-toggle" id="${uid}">
    <label class="row-label" for="${uid}">
      <div class="event-row">
        <div class="event-date">
          <div class="ed-dow">${DAYS[d.getUTCDay()]}</div>
          <div class="ed-num">${d.getUTCDate()}</div>
          <div class="ed-mon">${MONTHS[d.getUTCMonth()]}</div>
        </div>
        <div class="event-div"></div>
        <div class="event-badges">
          <span class="league-badge ${(e.league || 'UBA').toLowerCase()}">${e.league || 'UBA'}</span>
          <span class="event-badge ${type}">${TYPE_LABEL[type] || 'Event'}</span>
        </div>
        <div class="event-info">
          <div class="event-title">${e.name}</div>
        </div>
        <div class="event-meta">${meta}</div>
        <span class="row-chevron">▶</span>
      </div>
    </label>
    <div class="row-dropdown">${vodHTML}${cardHTML}</div>
  </div>`;
}

function render() {
  const list = document.getElementById('list');
  const now = Date.now();
  let rows = events.filter(e =>
    activeTab === 'upcoming' ? e.status !== 'completed' : e.status === 'completed'
  );
  rows.sort((a, b) => activeTab === 'upcoming'
    ? new Date(a.event_date) - new Date(b.event_date)
    : new Date(b.event_date) - new Date(a.event_date));
  rows = rows.slice(0, MAX_PER_TAB); // cap so the embed doesn't resize wildly

  if (!rows.length) {
    list.innerHTML = `<div class="status-msg">No ${activeTab} events.</div>`;
    return;
  }

  // flat list — each row carries its own date (no day-header lines)
  list.innerHTML = rows.map(eventHTML).join('');
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active'); activeTab = t.dataset.tab; render();
}));

// Tap a VOD thumbnail -> swap in the actual player (honors ?t= start time)
document.addEventListener('click', ev => {
  const th = ev.target.closest('.vod-thumb');
  if (!th) return;
  const vid = th.dataset.vid, start = th.dataset.start;
  th.parentElement.innerHTML = `<div style="position:relative;padding-top:56.25%;"><iframe src="https://www.youtube.com/embed/${vid}?autoplay=1&playsinline=1${start ? `&start=${start}` : ''}" style="position:absolute;inset:0;width:100%;height:100%;border:0;" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`;
});

(async () => {
  try {
    const [ev, cards] = await Promise.all([
      sb('events_public', 'select=id,name,type,status,event_date,vod_link&order=event_date.desc'),
      sb('event_matches', 'select=event_id,bout_number,fighter_a_name,fighter_b_name,status,method,winner_corner,is_title_fight,title_name,weight_class')
    ]);
    events = [...(Array.isArray(ev) ? ev : []), ...PLACEHOLDER_EVENTS];
    (Array.isArray(cards) ? cards : []).forEach(c => { (cardsByEvent[c.event_id] = cardsByEvent[c.event_id] || []).push(c); });
    render();

    // Featured block: newest completed event with a VOD wins; pin is fallback
    const latestVod = events
      .filter(e => e.status === 'completed' && e.vod_link)
      .sort((a, b) => new Date(b.event_date) - new Date(a.event_date))[0];
    setFeatured(latestVod ? latestVod.vod_link : FEATURED_VOD);
  } catch (e) {
    document.getElementById('list').innerHTML = '<div class="status-msg">Failed to load.</div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
